name: Backlot RX01 UX11 - isolated final integration QA NOT RELEASE

on:
  push:
    branches:
      - integration/backlot-rx01-ux11-all-done-qa-20261120
    paths:
      - ".github/workflows/backlot-rx01-ux11-all-done-integration-qa.yml"
      - "app/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rx01-ux11-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Founder-approved stable ancestry and UX09 exclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit authorized 12-stage change set
        shell: bash
        run: |
          set -euo pipefail
          base=abbe88984bac16cfafbd990d9cb00ed54cfdd07e
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          git diff --name-only "$base" HEAD > /tmp/rx01-ux11-diff.txt
          python3 - <<'PY'
          from pathlib import Path
          paths=Path('/tmp/rx01-ux11-diff.txt').read_text().splitlines()
          assert len(paths)>=40, f'Incomplete stack ({len(paths)} files)'
          allowed=['app/src/main/java/com/framebynavin/app/ui/',
                   'app/src/main/java/com/framebynavin/app/personal/',
                   'app/src/main/java/com/framebynavin/app/reminders/',
                   'docs/design/','docs/engineering/','docs/product/']
          exceptions={'app/src/main/AndroidManifest.xml'}
          bad=[p for p in paths if not (p in exceptions or
               any(p.startswith(prefix) for prefix in allowed))]
          assert not bad, f'Unapproved changed source: {bad}'
          assert not any('ux09' in p.lower() or 'cloud/' in p.lower()
              or 'supabase' in p.lower() for p in paths), 'UX09/cloud mutation'
          assert not any(p.startswith('app/src/test/') or p.startswith('app/src/androidTest/') for p in paths)
          assert Path('app/src/main/java/com/framebynavin/app/reminders/RX01ReminderExperienceGate.kt').is_file()
          assert Path('app/src/main/java/com/framebynavin/app/ui/UX11FPersonalComposerPresentation.kt').is_file()
          assert Path('app/src/main/java/com/framebynavin/app/personal/RX01ChallengeAlertActivity.kt').is_file()
          cloud=Path('app/src/main/java/com/framebynavin/app/cloud/CloudConfig.kt').read_text()
          assert 'vasleafrmsovdbdlrcsw.supabase.co' in cloud
          assert not Path('app/src/main/java/com/framebynavin/app/cloud/ux09rpc').exists()
          assert not Path('supabase/lab_migrations').exists()
          print('PASS: 12-stage cumulative diff, no UX09/Cloud/Gradle mutations:',len(paths),'files')
          PY
          git rev-parse HEAD
  compile-unit-lint:
    name: Compile, all JVM regressions, lint and Lab APK
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run complete independent build/test/lint failure inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/rx01-ux11
          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          org.gradle.workers.max=1
          org.gradle.parallel=false
          EOF
          rm -rf app/build
          timeout --signal=TERM --kill-after=20s 104m gradle \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            :app:testDebugUnitTest :app:lintDebug \
            --continue -PbacklotLab=true --no-daemon \
            --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
            --console=plain 2>&1 | tee output/rx01-ux11/all-gates-build.log
      - name: Verify compiled Lab APK package, signer and source SHA
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          signer_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$aapt_bin" dump badging "$apk" > output/rx01-ux11/apk-badging.txt
          grep -q "package: name='com.framebynavin.app.lab'" output/rx01-ux11/apk-badging.txt
          "$signer_bin" verify --verbose --print-certs "$apk" > output/rx01-ux11/apk-signer.txt
          grep -q f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0 output/rx01-ux11/apk-signer.txt
          sha256sum "$apk" > output/rx01-ux11/apk-sha256.txt
          git rev-parse HEAD > output/rx01-ux11/SOURCE-SHA.txt
          if [ -n "$(git status --porcelain -- app/src)" ]; then
            echo 'FAIL: source modified during QA build'
            git status --short -- app/src
            exit 1
          fi
          echo 'Lab APK compiled; NOT physical-device certified or a Play release.'
      - name: Upload QA APK and evidence only on complete green gates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-RX01-UX11-Integrated-Lab-QA-NOT-CERTIFIED
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            output/rx01-ux11/
          retention-days: 14
      - name: Upload complete failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-RX01-UX11-Integration-BLOCKERS
          path: |
            output/rx01-ux11/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  android-15-startup:
    name: Android API35 install, launch, no-crash smoke
    needs: compile-unit-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-RX01-UX11-Integrated-Lab-QA-NOT-CERTIFIED
          path: integrated-apk
      - name: Stage verified Lab QA APK and enable KVM
        run: |
          set -euo pipefail
          mkdir -p lab-candidate
          cp integrated-apk/app/build/outputs/apk/debug/app-debug.apk lab-candidate/app-debug.apk
          test -s lab-candidate/app-debug.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android 15 launch from existing safe Lab smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash .github/scripts/backlot-lab-startup-smoke.sh
      - name: Upload installation / launch / screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-RX01-UX11-Android15-Smoke
          path: startup-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14
