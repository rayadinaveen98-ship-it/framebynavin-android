name: Backlot V162 — Idea Vault Phase 3 safety

on:
  push:
    branches:
      - feature/backlot-v162-idea-vault-safe-workflow-p3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v162-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: V162 Idea Vault preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout V162
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Preserve previous Quick Actions phases and verify recoverable Idea Vault
        run: bash tools/check_v161_quick_actions_hub_capture.sh && bash tools/check_v162_idea_vault.sh
      - name: Unit tests — preservation and regression
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Compile Android device tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build V162 APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V162 Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v162-quick-actions-phase2-capture-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  android-emulator:
    name: Android 30 Idea Vault recovery behavior
    needs: android-apk
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - name: Checkout V162
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Exercise Idea Vault recovery flow on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.ui.V162IdeaVaultUiTest" --stacktrace
      - name: Keep device reports on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v162-idea-vault-ui-android30-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30
