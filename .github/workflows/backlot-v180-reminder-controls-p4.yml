name: Backlot V180 Reminder P4 — Creator Controls and Opt-Out

on:
  push:
    branches:
      - feature/backlot-v180-reminder-p4-controls-ux
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v180-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: V180 reminder controls regressions and APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Confirm V180 identity
        run: |
          grep -q 'versionCode = 180' app/build.gradle.kts
          grep -q '2.3.0-v180-reminder-controls-p4-preview' app/build.gradle.kts
      - name: Preserve V161–V179 and verify V180 reminder controls
        run: |
          for version in 161 162 163 164 165 166 167 168 169 170; do
            script=$(find tools -maxdepth 1 -name "check_v${version}_*.sh" | head -n 1)
            test -n "$script"
            bash "$script"
          done
          bash tools/check_v171_project_safety.sh
          bash tools/check_v172_new_project_draft_ux.sh
          bash tools/check_v173_new_project_visual_consistency.sh
          bash tools/check_v174_quick_create.sh
          bash tools/check_v175_project_details.sh
          bash tools/check_v176_release_acceptance.sh
          bash tools/check_v177_reminder_acknowledgements.sh
          bash tools/check_v178_reminder_playback_lifecycle.sh
          bash tools/check_v179_bounded_followups.sh
          bash tools/check_v180_reminder_controls.sh
      - name: JVM unit regression tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Android instrumentation-test compilation
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build debug preview APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V180 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v180-reminder-controls-p4-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  android-emulator:
    name: Android 11 creator timing and unanswered follow-up controls
    needs: android-apk
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run creator timing picker and no-response token safety on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            gradle :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.ui.V180ReminderTimingUiTest,com.framebynavin.app.reminders.V179FollowUpClaimInstrumentedTest,com.framebynavin.app.reminders.V178UnansweredHandoffInstrumentedTest,com.framebynavin.app.reminders.V177ReminderAcknowledgementInstrumentedTest,com.framebynavin.app.reminders.V159ReminderActionIsolationTest,com.framebynavin.app.reminders.V155ReminderRecoveryIsolationInstrumentedTest" "-Pandroid.testInstrumentationRunnerArguments.hardeningTestEnvironment=ci-emulator" --stacktrace
      - name: Upload Android 11 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v180-android11-reminder-controls-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30
