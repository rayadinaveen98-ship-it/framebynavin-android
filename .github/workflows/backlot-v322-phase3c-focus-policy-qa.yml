name: Backlot V322 Phase 3C - Focus Session Policy QA (no APK)
on:
  push:
    branches:
      - feature/backlot-v322-phase3c-focus-session-policy-review
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backlot-v322-phase3c-focus-policy
  cancel-in-progress: true

jobs:
  focus-domain-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify V322 schedule remains untouched and timer is data-only
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 322' app/build.gradle.kts
          test -f app/src/main/java/com/framebynavin/app/personal/PersonalRebuildSchedulePack.kt
          test -f app/src/test/java/com/framebynavin/app/personal/PersonalRebuildSchedulePackTest.kt
          test -f app/src/main/java/com/framebynavin/app/data/CreatorFocusSessionPolicy.kt
          grep -Fq 'recoveredAfterReboot = true' app/src/main/java/com/framebynavin/app/data/CreatorFocusSessionPolicy.kt
          ! grep -Eq 'advanceWorkflow|startTask|markPublished|publishTask|ReminderScheduler' app/src/main/java/com/framebynavin/app/data/CreatorFocusSessionPolicy.kt
      - name: Compile full app source and test bounded Focus domain and V322 schedule
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --tests 'com.framebynavin.app.data.CreatorFocusSessionPolicyTest' --tests 'com.framebynavin.app.personal.PersonalRebuildSchedulePackTest' --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Upload test results (not signed owner APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V322-Phase3C-Focus-Policy-Tests-NOT-RELEASE
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 21
          if-no-files-found: warn
