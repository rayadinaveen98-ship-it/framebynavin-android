name: Backlot V289 - Personal Spaces Domain Safety

on:
  push:
    branches: [feature/backlot-v289-personal-spaces-data-contract, feature/backlot-v289-personal-spaces-ui, feature/backlot-v289-compact-spaces-nav, feature/backlot-v289-spaces-metadata-recovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v289-spaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify isolation before running tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          model=Path('app/src/main/java/com/framebynavin/app/personal/spaces/V289PersonalSpacePolicy.kt').read_text()
          required=['V289PersonalSpace(', 'V289SpaceEntry(', 'V289SpaceReminderLink(', 'V289SpaceEntrySource', 'fun deleteSpace(', 'fun addEntry(']
          assert all(x in model for x in required), 'Space domain safety contract is incomplete'
          for forbidden in ['PersonalReminderStore(', 'PersonalDeliveryCoordinator(', 'TaskStore(', 'Firebase', 'android.content.']:
              assert forbidden not in model, 'Space policy has an unapproved storage or delivery dependency'
          assert 'import androidx.room' not in model, 'This phase must remain side-effect free'
          print('PASS: Space policy has no reminder, Creator, cloud or Android dependencies')
          PY
      - name: Compile full app and run V289 domain policy unit tests
        run: |
          timeout 65m gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Require all seven V289 tests green
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('app/build/test-results/testDebugUnitTest')
          files=list(root.glob('TEST-*V289PersonalSpacePolicyTest.xml'))
          assert len(files)==1, f'Expected one V289 test XML report, found {len(files)}'
          suite=ET.parse(files[0]).getroot()
          assert int(suite.attrib.get('tests','0'))>=7
          assert int(suite.attrib.get('errors','0'))==0
          assert int(suite.attrib.get('failures','0'))==0
          print('PASS: V289 Space domain tests')
          PY

      - name: Require seven metadata recovery unit tests green
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('app/build/test-results/testDebugUnitTest')
          files=list(root.glob('TEST-*V289SpacesMetadataCodecTest.xml'))
          assert len(files)==1, f'Expected one Spaces metadata codec report, got {len(files)}'
          suite=ET.parse(files[0]).getroot()
          assert int(suite.attrib.get('tests','0'))>=7
          assert int(suite.attrib.get('errors','0'))==0
          assert int(suite.attrib.get('failures','0'))==0
          print('PASS: V289 bounded, versioned metadata codec')
          PY

      - name: Enable KVM for reliable Android 15 emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android 15 Room persistence, isolation, cascade and dedupe tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c || true
            adb shell am instrument -w -e hardeningTestEnvironment ci-emulator -e class com.framebynavin.app.personal.spaces.V289SpacesDatabaseTest com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/backlot-v289-room.log
            grep -F 'OK (4 tests)' /tmp/backlot-v289-room.log || { echo 'Room test result missing: Android crash log follows'; adb logcat -d -v threadtime | tail -180; exit 1; }
            ! grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' /tmp/backlot-v289-room.log || { echo 'Room instrumentation error: Android crash log follows'; adb logcat -d -v threadtime | tail -180; exit 1; }
            adb logcat -c || true
            adb shell am instrument -w -e hardeningTestEnvironment ci-emulator -e class com.framebynavin.app.ui.V289PersonalSpacesUiTest com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/backlot-v289-spaces-ui.log
            grep -F 'OK (3 tests)' /tmp/backlot-v289-spaces-ui.log || { echo 'Spaces UI test result missing: Android crash log follows'; adb logcat -d -v threadtime | tail -180; exit 1; }
            ! grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' /tmp/backlot-v289-spaces-ui.log || { echo 'Spaces UI instrumentation error: Android crash log follows'; adb logcat -d -v threadtime | tail -180; exit 1; }
            adb logcat -c || true
            adb shell am instrument -w -e hardeningTestEnvironment ci-emulator -e class com.framebynavin.app.personal.spaces.V289SpacesMetadataRecoveryDeviceTest com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/backlot-v289-metadata-restore.log
            grep -F 'OK (3 tests)' /tmp/backlot-v289-metadata-restore.log || { echo 'Metadata recovery test result missing'; adb logcat -d -v threadtime | tail -180; exit 1; }
            ! grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' /tmp/backlot-v289-metadata-restore.log || { echo 'Metadata recovery instrumentation error'; adb logcat -d -v threadtime | tail -180; exit 1; }
