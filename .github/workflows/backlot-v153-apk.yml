name: Backlot V153 — Simple Creator Experience

on:
  push:
    branches:
      - feature/backlot-v153-simple-creator-experience
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backlot-v153-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V153
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Visible-language smoke checks
        run: bash tools/check_v153_copy.sh

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Assemble APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Backlot V152 APK
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v153-onboarding-stability-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
