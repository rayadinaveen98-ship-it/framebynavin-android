name: v2.0 Alpha 1.2C Creator Profile V2

on:
  push:
    branches:
      - "develop/v2.0-alpha1.2c-creator-profile-v2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha12c-creator-profile-v2
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize Creator Profile V2
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v20_alpha12c_creator_profile_v2.py
          git diff --check

      - name: Verify profile architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 90' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2c-creator-profile-v2"' app/build.gradle.kts
          grep -q 'primaryCreatorMode' app/src/main/java/com/framebynavin/app/data/CreatorProfile.kt
          grep -q 'secondaryCreatorModes' app/src/main/java/com/framebynavin/app/data/CreatorProfile.kt
          grep -q 'productionStyles' app/src/main/java/com/framebynavin/app/data/CreatorProfile.kt
          grep -q 'secondaryGoals' app/src/main/java/com/framebynavin/app/data/CreatorProfile.kt
          grep -q 'CURRENT_SCHEMA_VERSION = 2' app/src/main/java/com/framebynavin/app/data/CreatorProfile.kt
          grep -q 'primaryCreatorMode' app/src/main/java/com/framebynavin/app/data/CreatorOsSettings.kt
          grep -q 'secondaryGoals' app/src/main/java/com/framebynavin/app/data/CreatorOsSettings.kt
          grep -q 'What do you create most?' app/src/main/java/com/framebynavin/app/ui/V18CreatorOnboarding.kt
          grep -q 'How do you usually create?' app/src/main/java/com/framebynavin/app/ui/V18CreatorOnboarding.kt
          grep -q 'Choose up to 3 goals' app/src/main/java/com/framebynavin/app/ui/V18CreatorOnboarding.kt
          grep -q 'System setup' app/src/main/java/com/framebynavin/app/ui/V18CreatorOnboarding.kt
          grep -q 'PTab.TODAY -> PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          test ! -e app/src/main/java/com/framebynavin/app/cloud/CloudSyncWorker.kt

      - name: Pin exact app source before Gradle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c commit.gpgSign=false commit -m "feat(v2.0): ship Creator Profile V2"
          fi
          git rev-parse HEAD | tee /tmp/validated_commit

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.2c-creator-profile-v2.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.2c-creator-profile-v2.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.2c-creator-profile-v2"
            echo "versionCode=90"
            echo "commit=$(cat /tmp/validated_commit)"
            echo "legacyCreatorProfilesRemainComplete=true"
            echo "primaryAndSecondaryCreatorModes=true"
            echo "productionStyles=true"
            echo "maxThreeActiveGoals=true"
            echo "onePrimaryGoal=true"
            echo "settingsBackupSchemaV2=true"
            echo "driveVaultFoundationPreserved=true"
            echo "acceptedCinematicHomePreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2c-creator-profile-v2-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.2c-creator-profile-v2.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2c-creator-profile-v2-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.2c-creator-profile-v2-validated
