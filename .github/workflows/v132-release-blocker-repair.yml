name: Apply v1.3.2 Release Blocker Repair

on:
  workflow_dispatch:
  push:
    branches: [ "repair/v1.3.2-release-blockers" ]
    paths:
      - "tools/v132_release_blocker_repair.py"
      - ".github/workflows/v132-release-blocker-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: repair/v1.3.2-release-blockers

      - name: Apply UI repair
        run: python tools/v132_release_blocker_repair.py

      - name: Commit repaired UI source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/V131PolishUi.kt
          if git diff --cached --quiet; then
            echo "No repair needed"
          else
            git commit -m "fix: repair cinematic assets and selection interactions"
            git push origin HEAD:repair/v1.3.2-release-blockers
          fi
