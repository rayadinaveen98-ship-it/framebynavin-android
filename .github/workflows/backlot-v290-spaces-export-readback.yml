name: Backlot V290 - Spaces Export Read-Back Verification

on:
  push:
    branches: [feature/backlot-v290-spaces-export-readback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v290-spaces-export-readback
  cancel-in-progress: true

jobs:
  verified-file-export:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fail closed unless saved file is reopened and verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('app/src/main/java/com/framebynavin/app/personal/spaces/V289SpacesOwnerBackupFile.kt').read_text()
          ui=Path('app/src/main/java/com/framebynavin/app/ui/V289PersonalSpacesScreen.kt').read_text()
          assert 'context.contentResolver.openInputStream(uri)' in f
          assert 'verifyWrittenCopy(raw, saved)' in f
          assert 'require(actualRaw == expectedRaw)' in f
          assert 'V289SpacesMetadataCodec.decode(actualRaw)' in f
          assert 'Saved and verified Spaces metadata' in ui
          assert 'A partial file may exist' in ui
          print('PASS: export success is gated by exact read-back and checksum validation')
          PY
      - name: Compile full app and run all unit regression tests
        run: |
          timeout 70m gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Require seven file-export safety tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          matches=list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*V289SpacesOwnerBackupFileTest.xml'))
          assert len(matches)==1, f'Expected one export verification report, got {len(matches)}'
          root=ET.parse(matches[0]).getroot()
          assert int(root.attrib.get('tests','0'))==7
          assert int(root.attrib.get('failures','0'))==0
          assert int(root.attrib.get('errors','0'))==0
          print('PASS: 7 Spaces file verification tests')
          PY
