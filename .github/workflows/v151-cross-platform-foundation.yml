name: Backlot V151 Cross-Platform Foundation

on:
  push:
    branches:
      - feature/backlot-v151-cross-platform-foundation
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/v151-cross-platform-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-shared-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile shared Android target
        run: gradle :shared:compileDebugKotlinAndroid --stacktrace

      - name: Shared common tests on Android target
        run: gradle :shared:testDebugUnitTest --stacktrace

      - name: Android unit tests including shared parity
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Android installable APK regression build
        run: gradle :app:assembleDebug --stacktrace

  ios-shared-framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Link BacklotShared iOS Simulator framework
        run: gradle :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Verify framework exists
        shell: bash
        run: |
          set -euo pipefail
          test -d shared/build/bin/iosSimulatorArm64/debugFramework/BacklotShared.framework
          test -f shared/build/bin/iosSimulatorArm64/debugFramework/BacklotShared.framework/BacklotShared

      - name: Type-check native SwiftUI shell against BacklotShared
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc \
            -typecheck \
            -sdk "$SDK" \
            -target arm64-apple-ios17.0-simulator \
            -F shared/build/bin/iosSimulatorArm64/debugFramework \
            -framework BacklotShared \
            iosApp/BacklotApp.swift iosApp/BacklotSessionStore.swift iosApp/BacklotRootView.swift

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate iOS project
        run: xcodegen generate --spec iosApp/project.yml

      - name: Build Backlot iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/Backlot.xcodeproj \
            -scheme Backlot \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify iOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find ~/Library/Developer/Xcode/DerivedData -path '*Build/Products/Debug-iphonesimulator/Backlot.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          test -f "$APP/Backlot"
          echo "Built: $APP"
