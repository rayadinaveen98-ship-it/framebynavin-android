name: Fix v1.8 Copilot Import

on:
  push:
    branches:
      - "feature/v1.8-creator-copilot"
    paths:
      - "tools/v18_fix_copilot_import.py"
      - ".github/workflows/v18-fix-copilot-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.8-creator-copilot
      - name: Apply import fix
        run: python tools/v18_fix_copilot_import.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No import change needed"
            exit 0
          fi
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/CopilotActivity.kt
          git commit -m "fix(v1.8): import saveable state helper"
          git push origin HEAD:feature/v1.8-creator-copilot
