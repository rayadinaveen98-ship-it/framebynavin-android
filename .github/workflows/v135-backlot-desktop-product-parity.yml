name: V135 Backlot Desktop Product Parity

on:
  push:
    branches:
      - "feature/v135-backlot-desktop-product-parity"
    paths:
      - "desktop/**"
      - "docs/V135_BACKLOT_DESKTOP_PRODUCT_PARITY.md"
      - ".github/workflows/v135-backlot-desktop-product-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v135-backlot-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout V135 desktop branch
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop
            docs/V135_BACKLOT_DESKTOP_PRODUCT_PARITY.md
            .github/workflows/v135-backlot-desktop-product-parity.yml
          sparse-checkout-cone-mode: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Test, compile and build Windows packages
        working-directory: desktop
        run: gradle clean test compileKotlin createDistributable packageMsi packageExe --stacktrace

      - name: Validate native app image
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktop/build/compose/binaries/main/app -Recurse -Filter Backlot.exe -File | Select-Object -First 1
          if (-not $exe) { throw "Backlot.exe missing from native app image" }
          $runtime = Get-ChildItem -Path desktop/build/compose/binaries/main/app -Recurse -Directory | Where-Object { $_.Name -eq "runtime" } | Select-Object -First 1
          if (-not $runtime) { throw "Bundled runtime missing from native app image" }
          Write-Host "Validated $($exe.FullName)"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/build/portable | Out-Null
          Compress-Archive -Path desktop/build/compose/binaries/main/app/Backlot/* -DestinationPath desktop/build/portable/Backlot-0.2.0-Portable-Windows.zip -Force

      - name: Upload Backlot V135 Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-v135-Windows-Installers
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload Backlot V135 portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-v135-Windows-Portable
          path: desktop/build/portable/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-v135-Desktop-Test-Report
          path: desktop/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 30
