name: Apply v1.5 Context Wiring

on:
  push:
    branches: [ "feature/v1.5-context-creator-os" ]
    paths:
      - "tools/v15_wire_context.py"
      - ".github/workflows/v15-wire-context.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v1.5 wiring
        run: python tools/v15_wire_context.py

      - name: Commit wiring
        run: |
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          if git diff --cached --quiet; then
            echo "No wiring changes needed"
          else
            git commit -m "feat(v1.5): wire daily brief calendar and context nudges"
            git push
          fi
