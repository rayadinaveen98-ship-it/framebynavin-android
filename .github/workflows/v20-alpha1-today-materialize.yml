name: v2.0 Alpha 1 Today Materialize

on:
  push:
    branches:
      - "develop/v2.0-alpha1-today"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha1-today-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'feat(v2.0): wire Today command center alpha1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Wire Today Alpha 1 and bump identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path("app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt")
          text = app.read_text()
          old = '''                PTab.TODAY -> PTodayScreen(
                              creatorProfile = settings.creatorProfile,
                              tasks = vm.tasks,
                              onAdd = { openComposer() },
                              onStart = vm::startTask,
                              onAdvance = ::advanceWorkflowWithJourney,
                              onViewAllReminders = { showReminders = true },
                              onFocus = { focusTaskId = it },
                              onOpenProject = ::openProject,
                          )'''
          new = '''                PTab.TODAY -> V20TodayCommandCenter(
                              creatorProfile = settings.creatorProfile,
                              tasks = vm.tasks,
                              onAdd = { openComposer() },
                              onCapture = { showQuickCapture = true },
                              onStart = vm::startTask,
                              onViewAllReminders = { showReminders = true },
                              onFocus = { focusTaskId = it },
                              onOpenProject = ::openProject,
                          )'''
          if old not in text:
              raise SystemExit("Expected Today route block not found; refusing broad rewrite")
          app.write_text(text.replace(old, new, 1))

          gradle = Path("app/build.gradle.kts")
          build = gradle.read_text()
          build = build.replace('versionCode = 83', 'versionCode = 84', 1)
          build = build.replace('versionName = "1.9.0-content-project-rc3.1"', 'versionName = "2.0.0-today-alpha1"', 1)
          build = build.replace('// v1.9 RC3: Project Pulse stage-aware check-in candidate.', '// v2.0 Alpha 1: Today Command Center execution candidate.', 1)
          gradle.write_text(build)
          PY

          git diff --check
          grep -q 'PTab.TODAY -> V20TodayCommandCenter(' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'onCapture = { showQuickCapture = true }' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'versionCode = 84' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-today-alpha1"' app/build.gradle.kts
          test -s app/src/main/java/com/framebynavin/app/data/CreatorTodayCommandCenter.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V20TodayCommandCenter.kt
          test -s app/src/test/java/com/framebynavin/app/data/CreatorTodayCommandCenterTest.kt

      - name: Commit exact Alpha 1 source locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          git diff --cached --check
          git -c commit.gpgSign=false commit -m "feat(v2.0): wire Today command center alpha1"
          git rev-parse HEAD | tee /tmp/alpha1_commit

      - name: Verify Today architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CreatorTodayCommandCenterEngine' app/src/main/java/com/framebynavin/app/data/CreatorTodayCommandCenter.kt
          grep -q 'CreatorPriorityEngine.rankActive' app/src/main/java/com/framebynavin/app/data/CreatorTodayCommandCenter.kt
          grep -q 'drop(1)' app/src/main/java/com/framebynavin/app/data/CreatorTodayCommandCenter.kt
          grep -q 'take(3)' app/src/main/java/com/framebynavin/app/data/CreatorTodayCommandCenter.kt
          grep -q 'V20TodayCommandCenter' app/src/main/java/com/framebynavin/app/ui/V20TodayCommandCenter.kt
          grep -q 'CONTINUE' app/src/main/java/com/framebynavin/app/ui/V20TodayCommandCenter.kt
          grep -q 'UP NEXT' app/src/main/java/com/framebynavin/app/ui/V20TodayCommandCenter.kt
          grep -q 'COMMITMENTS' app/src/main/java/com/framebynavin/app/ui/V20TodayCommandCenter.kt
          grep -q 'CAPTURE' app/src/main/java/com/framebynavin/app/ui/V20TodayCommandCenter.kt
          ! grep -q 'onAdvance' app/src/main/java/com/framebynavin/app/ui/V20TodayCommandCenter.kt
          grep -q 'enum class ReminderDeliveryPreference' app/src/main/java/com/framebynavin/app/data/CreatorTask.kt
          grep -q 'publishedAtMillis' app/src/main/java/com/framebynavin/app/data/CreatorTask.kt
          grep -q 'completedAtMillis' app/src/main/java/com/framebynavin/app/data/CreatorTask.kt

      - name: Unit tests, lint and Android test compilation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Build installable Alpha 1 APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build verification manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-today-alpha1.apk
          sha256sum verification/FrameByNavin-v2.0.0-today-alpha1.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-today-alpha1"
            echo "versionCode=84"
            echo "commit=$(cat /tmp/alpha1_commit)"
            echo "todayCommandCenter=true"
            echo "priorityAuthority=CreatorPriorityEngine"
            echo "upNextLimit=3"
            echo "commandCenterMutatesLifecycle=false"
            echo "publicationAuthority=deliverable-publish-studio"
            echo "projectWorkflowAuthority=creator-workflow-engine"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload Alpha 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-today-alpha1-apk
          path: verification/FrameByNavin-v2.0.0-today-alpha1.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Alpha 1 verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-today-alpha1-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated Alpha 1 source
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:develop/v2.0-alpha1-today
