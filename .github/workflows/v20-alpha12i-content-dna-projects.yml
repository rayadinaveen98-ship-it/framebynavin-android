name: v2.0 Alpha 1.2I Content DNA Projects

on:
  push:
    branches:
      - "develop/v2.0-alpha1.2i-content-dna-projects"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha12i-content-dna-projects
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v96 project integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v20_alpha12i_runner.py
          git diff --check
          git status --short
          git config user.name "FrameByNavin CI"
          git config user.email "actions@users.noreply.github.com"
          git add app
          git commit -m "feat(v2.0): persist and edit project Content DNA"
          git rev-parse HEAD | tee /tmp/validated_commit

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v96 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 96' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2i-content-dna-projects"' app/build.gradle.kts
          grep -q 'val contentDna: CreatorContentDna = CreatorContentDna()' app/src/main/java/com/framebynavin/app/data/CreatorTask.kt
          grep -q 'fun effective(task: CreatorTask' app/src/main/java/com/framebynavin/app/data/CreatorContentDna.kt
          grep -q '.put("contentDna", encodeContentDna(task.contentDna))' app/src/main/java/com/framebynavin/app/data/TaskStore.kt
          grep -q 'contentDna = decodeContentDna(item.optJSONObject("contentDna"))' app/src/main/java/com/framebynavin/app/data/TaskStore.kt
          grep -q 'contentDna = draft.contentDna' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'Text("CONTENT DNA"' app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt
          grep -q 'PComposerLabel("CREATOR MODE")' app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt
          grep -q 'PComposerLabel("CONTENT TYPE")' app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt
          grep -q 'PComposerLabel("PRODUCTION STYLE' app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt
          grep -q 'PTab.TODAY -> PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          test ! -e app/src/main/java/com/framebynavin/app/cloud/CloudSyncWorker.kt
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.2i-content-dna-projects.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.2i-content-dna-projects.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.2i-content-dna-projects"
            echo "versionCode=96"
            echo "commit=$(cat /tmp/validated_commit)"
            echo "projectContentDnaPersistence=true"
            echo "projectContentDnaComposer=true"
            echo "explicitDnaWins=true"
            echo "legacyDnaFallback=true"
            echo "legacyProjectsNotBackgroundMigrated=true"
            echo "topLevelPlatformFormatCompatibility=true"
            echo "portableBackupIncludesContentDna=true"
            echo "acceptedCinematicHomePreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2i-content-dna-projects-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.2i-content-dna-projects.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2i-content-dna-projects-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:staging/v2.0-alpha1.2i-content-dna-projects-validated
