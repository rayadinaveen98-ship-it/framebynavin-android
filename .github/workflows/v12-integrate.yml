name: Integrate v1.2 Widget Capture

on:
  push:
    branches: [ "main" ]
    paths:
      - "tools/apply_v12_integration.py"
      - ".github/workflows/v12-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v1.2 integration
        run: python tools/apply_v12_integration.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/data/TaskStore.kt app/src/main/java/com/framebynavin/app/ui/V11YouTubeInsights.kt app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          git commit -m "feat: integrate v1.2 widget capture and snapshots" || exit 0
          git push
