name: Backlot V336 — Native Director Reminder Visual Fidelity

on:
  push:
    branches:
      - feature/backlot-v336-directors-reminder-cinematic-native-20261111
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enforce native visual-only boundary and preserved V335 reminder functions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 336' app/build.gradle.kts
          grep -q 'V336DirectorSignalArt' app/src/main/java/com/framebynavin/app/reminders/ReminderCheckInScreen.kt
          grep -q 'V336DirectorSignalArt' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
          grep -q 'V195ReminderParticleScene' app/src/main/java/com/framebynavin/app/reminders/ReminderCheckInScreen.kt
          grep -q 'onClick = onDone' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
          grep -q 'onClick = onSnooze' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
          grep -q 'onClick = onDismiss' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
          test ! -e app/src/main/assets/backlot_v330_motion.html
          test -f app/src/main/java/com/framebynavin/app/reminders/V336DirectorReminderVisuals.kt
          git fetch --depth=1 origin feature/backlot-v335-independent-activity-inbox-20261111
          for path in \
            app/src/main/java/com/framebynavin/app/reminders/ReminderScheduler.kt \
            app/src/main/java/com/framebynavin/app/reminders/ReminderActionReceiver.kt \
            app/src/main/java/com/framebynavin/app/personal/PersonalDeliveryCoordinator.kt \
            app/src/main/java/com/framebynavin/app/personal/PersonalReminderNotifications.kt \
            app/src/main/java/com/framebynavin/app/personal/PersonalPlaybackService.kt; do
            git diff --quiet FETCH_HEAD HEAD -- "$path"
          done
      - name: Compile signed owner APK and essential reminder unit regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 4100s \
            gradle :app:assemblePersonalStable \
              :app:testPersonalStableUnitTest \
              --tests 'com.framebynavin.app.reminders.V200ReminderLayoutPolicyTest' \
              -PbacklotSignedOwnerTest=true -x :app:lintVitalPersonalStable \
              --no-daemon --no-parallel --max-workers=1 \
              -Pkotlin.compiler.execution.strategy=in-process \
              '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' \
              --console=plain --stacktrace 2>&1 | tee v336-owner-build.log
      - name: Verify Android package, signer, version and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/v336-app
          src=app/build/outputs/apk/personalStable/app-personalStable.apk
          test -s "$src"
          cp "$src" output/v336-app/Backlot-V336-Director-Reminders.apk
          (cd output/v336-app && sha256sum Backlot-V336-Director-Reminders.apk > SHA256SUMS.txt)
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$src" | tee output/v336-app/SIGNING-VERIFY.txt
          "$aapt" dump badging "$src" | head -n 7 | tee output/v336-app/APK-IDENTITY.txt
          grep -q "package: name='com.framebynavin.app' versionCode='336'" output/v336-app/APK-IDENTITY.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' output/v336-app/SIGNING-VERIFY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V336-Director-Native-Signed-APK
          path: output/v336-app/
          retention-days: 30
          if-no-files-found: error
      - name: Save build diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V336-Compile-Diagnostics
          path: v336-owner-build.log
          if-no-files-found: warn
          retention-days: 5

  compile-visual-tests:
    needs: signed-owner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile matching signed owner Android tests WITHOUT running emulator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 4900s \
            gradle :app:assemblePersonalStableAndroidTest \
              -PbacklotSignedOwnerTest=true --no-daemon --no-parallel \
              --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process \
              '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' \
              --console=plain --stacktrace 2>&1 | tee v336-test-compile.log
      - name: Stage test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/v336-test
          apk=app/build/outputs/apk/androidTest/personalStable/app-personalStable-androidTest.apk
          test -s "$apk"
          cp "$apk" output/v336-test/Backlot-V336-Android-Tests.apk
          (cd output/v336-test && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V336-Android-Tests-APK
          path: output/v336-test/
          retention-days: 30
      - name: Save test compiler logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V336-Test-Compile-Diagnostics
          path: v336-test-compile.log
          retention-days: 7
          if-no-files-found: warn

  real-android-visual-review:
    needs: [signed-owner, compile-visual-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V336-Director-Native-Signed-APK
          path: output/v336-app/
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V336-Android-Tests-APK
          path: output/v336-test/
      - name: Verify both downloaded APK checksums
        run: |
          (cd output/v336-app && sha256sum -c SHA256SUMS.txt)
          (cd output/v336-test && sha256sum -c SHA256SUMS.txt)
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run four real reminder screens and existing action/privacy regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb install -r output/v336-app/Backlot-V336-Director-Reminders.apk
            adb install -r output/v336-test/Backlot-V336-Android-Tests.apk
            mkdir -p output/v336-screens
            for suite in \
              com.framebynavin.app.reminders.V336DirectorReminderVisualUiTest \
              com.framebynavin.app.reminders.V200ReminderUiTest \
              com.framebynavin.app.personal.V2233PersonalAlertUiTest \
              com.framebynavin.app.personal.V279LockedPersonalAlertUiTest; do
              short="${suite##*.}"
              adb shell am instrument -w -r \
                -e class "$suite" \
                -e hardeningTestEnvironment ci-emulator \
                com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner \
                  | tee "output/v336-screens/${short}.log"
              if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' "output/v336-screens/${short}.log"; then
                exit 1
              fi
              grep -Eq '^OK \([1-9][0-9]* tests?\)' "output/v336-screens/${short}.log"
            done
            for scene in creator_voice creator_alarm personal_voice personal_alarm; do
              adb pull "/sdcard/Android/data/com.framebynavin.app/files/v336_${scene}.png" \
                "output/v336-screens/v336_${scene}.png"
              test -s "output/v336-screens/v336_${scene}.png"
            done
      - name: Upload REAL Android UI captures, not generated mockups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V336-Real-Android-Reminder-Screens
          path: output/v336-screens/
          retention-days: 30
          if-no-files-found: warn
