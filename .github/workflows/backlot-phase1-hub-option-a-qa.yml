name: Backlot Phase 1 - Director's Cut Hub native Android review
on:
  push:
    branches:
      - feature/backlot-phase1-hub-directors-cut-review
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backlot-phase1-hub-directors-cut-review
  cancel-in-progress: true
jobs:
  capture-hubs:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile isolated debug-only shared Hub preview
        run: |
          set -euo pipefail
          timeout 75m gradle :app:assembleDebug --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable Android emulator KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Director's Cut and Light Hub previews on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/qa/capture_backlot_phase1_hubs_android.sh
      - name: Upload verified native Android screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backlot-Phase1-Directors-Cut-Reminders-Android15-Review
          path: output/backlot-phase1-hubs-directors-cut/
          retention-days: 30
          if-no-files-found: warn
