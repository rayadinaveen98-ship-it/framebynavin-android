name: v2.0 Alpha 2 Next Best Action

on:
  push:
    branches:
      - "develop/v2.0-alpha2-next-best-action"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha2-next-best-action
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize Alpha 2
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v20_alpha2_next_best_action.py
          git diff --check

      - name: Verify product invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 89' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha2-next-best-action"' app/build.gradle.kts
          grep -q 'PTab.TODAY -> PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'NEXT BEST ACTION' app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          grep -q 'ROUGH ${recommendation.estimatedMinutes} MIN' app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          grep -q 'estimatedMinutes' app/src/main/java/com/framebynavin/app/data/CreatorPriorityEngine.kt
          grep -q 'signals: List<String>' app/src/main/java/com/framebynavin/app/data/CreatorPriorityEngine.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          ! grep -q 'CloudSyncScheduler' app/src/main/java/com/framebynavin/app/MainActivity.kt

      - name: Pin exact clean app source before Gradle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c commit.gpgSign=false commit -m "feat(v2.0): ship explainable next best action"
          fi
          git rev-parse HEAD | tee /tmp/validated_commit

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha2-next-best-action.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha2-next-best-action.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha2-next-best-action"
            echo "versionCode=89"
            echo "commit=$(cat /tmp/validated_commit)"
            echo "acceptedCinematicHomePreserved=true"
            echo "deterministicNextBestAction=true"
            echo "explainableWhyNowSignals=true"
            echo "roughStageEffort=true"
            echo "opaqueAiScoreShown=false"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha2-next-best-action-apk
          path: verification/FrameByNavin-v2.0.0-alpha2-next-best-action.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha2-next-best-action-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push exact validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha2-next-best-action-validated
