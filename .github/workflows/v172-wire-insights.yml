name: Wire v1.7.2 Insights Upgrade

on:
  push:
    branches:
      - "feature/v1.7.2-insights-upgrade"
    paths:
      - "tools/v172_wire_insights.py"
      - ".github/workflows/v172-wire-insights.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.7.2-insights-upgrade
      - name: Apply guarded Insights 2.0 wiring
        run: python tools/v172_wire_insights.py
      - name: Commit live Insights wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/V11YouTubeInsights.kt app/src/main/java/com/framebynavin/app/youtube/YouTubeInsightEngine.kt
          git commit -m "feat(v1.7.2): wire Insights 2.0 into live screen"
          git push origin HEAD:feature/v1.7.2-insights-upgrade
