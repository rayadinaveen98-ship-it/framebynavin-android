name: v2.0 Alpha 1.3D Creator Playbook

on:
  push:
    branches:
      - "develop/v2.0-alpha1.3d-creator-playbook"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha13d-creator-playbook
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v110 Creator Playbook invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 110' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.3d-creator-playbook"' app/build.gradle.kts
          grep -q 'object CreatorPlaybookEngine' app/src/main/java/com/framebynavin/app/data/CreatorPlaybook.kt
          grep -q 'count >= 2 && positiveRate >= 70' app/src/main/java/com/framebynavin/app/data/CreatorPlaybook.kt
          grep -q 'count >= 3 && positiveRate <= 25' app/src/main/java/com/framebynavin/app/data/CreatorPlaybook.kt
          grep -q 'playbook: CreatorPlaybookSnapshot' app/src/main/java/com/framebynavin/app/data/CreatorOpportunityEngine.kt
          grep -q 'CreatorOpportunitySource.PLAYBOOK' app/src/main/java/com/framebynavin/app/data/CreatorOpportunityEngine.kt
          grep -q 'CREATOR PLAYBOOK' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'one result never becomes a rule' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'RECOMMENDATION LEARNING' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'ANALYZE VIDEO WITH GEMINI' app/src/main/java/com/framebynavin/app/ui/V20GeminiIntelligenceUi.kt
          grep -q 'ProjectPulseEngine::repairFalseSurfaceCompletion' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          if grep -R --line-number 'AIzaSy' app/src/main app/src/debug app/src/release; then
            echo 'Firebase API keys must not be copied into Kotlin/Java source.' >&2
            exit 1
          fi
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.3d-creator-playbook.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.3d-creator-playbook.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.3d-creator-playbook"
            echo "versionCode=110"
            echo "commit=$(git rev-parse HEAD)"
            echo "creatorPlaybook=true"
            echo "minimumPositiveSample=2"
            echo "minimumNegativeSample=3"
            echo "outcomeWeightedRanking=true"
            echo "playbookCannotChangeHorizon=true"
            echo "recommendationOutcomeLearningPreserved=true"
            echo "liveGeminiVideoAutopsyPreserved=true"
            echo "reminderCompletionSafetyPreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.3d-creator-playbook-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.3d-creator-playbook.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.3d-creator-playbook-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.3d-creator-playbook-validated
