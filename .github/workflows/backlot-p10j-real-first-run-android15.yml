name: Backlot P10J - Real First-Run Android 15 Navigation QA

# One real MainActivity journey, synthetic local-only account, empty emulator profile.
# Two jobs: build once; emulator can be independently retried with same APK artifacts.
# No full JVM suites, production data, Google account, signed owner APK or release.
on:
  pull_request:
    branches:
      - feature/backlot-v337-point10j-real-first-run-android-qa-20261123

permissions:
  contents: read

concurrency:
  group: backlot-p10j-real-first-run-navigation
  cancel-in-progress: true

jobs:
  build-test-apps:
    name: "01 - Build disposable debug + AndroidTest APKs"
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: No-JVM source and exact test preflight
        shell: bash
        run: |
          set -euo pipefail
          testfile=app/src/androidTest/java/com/framebynavin/app/ui/P10JRealFirstRunNavigationUiTest.kt
          test -s "$testfile"
          grep -Fq 'createAndroidComposeRule<MainActivity>()' "$testfile"
          grep -Fq 'p4-continue-without-account' "$testfile"
          grep -Fq 'p5-first-run-companion-choice' "$testfile"
          grep -Fq 'v219-reminder-home-entry' "$testfile"
          grep -Fq 'v2232-personal-space-switcher' "$testfile"
          grep -Fq 'HardeningTestEnvironment.requireCiEmulator()' "$testfile"
          for api in performClick performScrollTo; do
            if grep -Fq ".$api()" "$testfile"; then
              grep -Fxq "import androidx.compose.ui.test.$api" "$testfile" || {
                echo "Missing Compose UI test import: $api" >&2
                exit 1
              }
            fi
          done
          if grep -RInF -e 'import androidx.compose.ui.test.assertExists' -e 'import androidx.compose.ui.test.assertDoesNotExist' \
              app/src/androidTest --include='*.kt'; then
            echo 'Invalid Compose SemanticsNodeInteraction import' >&2
            exit 1
          fi
          bash tools/check_p10_retired_reminder_visuals.sh
          echo 'PASS: exact first-run test and retired visuals source fence'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile ONLY debug app and instrumentation APK prerequisites
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/p10j/build output/p10j/apks
          git rev-parse HEAD > output/p10j/build/source-sha.txt
          free -h
          timeout --signal=TERM --kill-after=20s 6000s \
            gradle :app:assembleDebug :app:assembleDebugAndroidTest \
              --no-daemon --max-workers=1 --console=plain \
              '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
              '-Pkotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC' \
              '-Porg.gradle.parallel=false' \
              2>&1 | tee output/p10j/build/instrumentation-build.log
      - name: Stage and hash disposable test APKs
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk output/p10j/apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/p10j/apks/
          sha256sum output/p10j/apks/*.apk | tee output/p10j/build/test-apk-sha256.txt
      - name: Publish reusable matching test APKs (not owner preview)
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-P10J-Disposable-App-and-Test-APKs
          path: output/p10j/apks/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve focused build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-P10J-Compilation-Log
          path: output/p10j/build/
          if-no-files-found: warn
          retention-days: 21

  emulator-journey:
    name: "02 - Android 15 actual first-run/navigation journey"
    needs: [build-test-apps]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download exact matching compiled test artifacts
        uses: actions/download-artifact@v4
        with:
          name: Backlot-P10J-Disposable-App-and-Test-APKs
          path: output/p10j/apks
      - name: Verify same-run instrumented APKs without compilation
        shell: bash
        run: |
          set -euo pipefail
          test -s output/p10j/apks/app-debug.apk
          test -s output/p10j/apks/app-debug-androidTest.apk
      - name: Enable Android 15 emulator hardware acceleration
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run exactly one real MainActivity onboarding and navigation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/qa/backlot_p10j_real_first_run_android15.sh
      - name: Preserve failure/success screenshot, OS log and instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-P10J-Actual-First-Run-Android15-Evidence
          path: output/p10j/android15/
          if-no-files-found: warn
          retention-days: 21
