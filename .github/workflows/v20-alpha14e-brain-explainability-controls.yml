name: v2.0 Alpha 1.4E Brain Explainability Controls

on:
  push:
    branches:
      - "develop/v2.0-alpha1.4e-brain-explainability-controls"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha14e-brain-explainability-controls
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v115 Brain explainability UI
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v115_brain_explainability_patch.py
          git diff --check
          git config user.name "rayadinaveen98-ship-it"
          git config user.email "rayadinaveen98@gmail.com"
          if ! git diff --quiet; then
            git add app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
            git commit -m "feat(v115): surface Brain explainability controls [skip ci]"
          fi
          echo "VALIDATED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v115 Brain explainability invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 115' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.4e-brain-explainability-controls"' app/build.gradle.kts
          grep -q 'enum class CreatorBrainLearningControl' app/src/main/java/com/framebynavin/app/data/CreatorBrainExplainability.kt
          grep -q 'object CreatorBrainLearningControlEngine' app/src/main/java/com/framebynavin/app/data/CreatorBrainExplainability.kt
          grep -q 'class CreatorBrainLearningControlStore' app/src/main/java/com/framebynavin/app/data/CreatorBrainExplainability.kt
          grep -q 'object CreatorBrainExplainabilityEngine' app/src/main/java/com/framebynavin/app/data/CreatorBrainExplainability.kt
          grep -q 'CreatorBrainTeachingEvidence' app/src/main/java/com/framebynavin/app/data/CreatorBrainExplainability.kt
          grep -q 'PAUSED' app/src/main/java/com/framebynavin/app/data/CreatorBrainExplainability.kt
          grep -q 'RETIRED' app/src/main/java/com/framebynavin/app/data/CreatorBrainExplainability.kt
          grep -q 'CREATOR BRAIN · EXPLAINABILITY' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'WHAT TAUGHT THE BRAIN' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'Text("PAUSE"' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'Text("RETIRE"' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'Text("RESTORE"' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'CreatorBrainRecommendationEngine.build' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'CreatorBrainEngine.matchForTask' app/src/main/java/com/framebynavin/app/data/CreatorOpportunityEngine.kt
          grep -q 'ANALYZE VIDEO WITH GEMINI' app/src/main/java/com/framebynavin/app/ui/V20GeminiIntelligenceUi.kt
          grep -q 'ProjectPulseEngine::repairFalseSurfaceCompletion' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          if grep -R --line-number 'AIzaSy' app/src/main app/src/debug app/src/release; then
            echo 'Firebase API keys must not be copied into Kotlin/Java source.' >&2
            exit 1
          fi
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.4e-brain-explainability-controls.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.4e-brain-explainability-controls.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.4e-brain-explainability-controls"
            echo "versionCode=115"
            echo "commit=$VALIDATED_SOURCE_SHA"
            echo "brainExplainability=true"
            echo "exactSampleSize=true"
            echo "teachingOutcomeEvidence=true"
            echo "freshnessAndTrajectoryVisible=true"
            echo "brainPauseControl=true"
            echo "brainRetireControl=true"
            echo "brainRestoreControl=true"
            echo "controlsPreserveHistoricalEvidence=true"
            echo "controlledPatternsStopRankingAndGuidance=true"
            echo "creatorBrainRecommendationsPreserved=true"
            echo "creatorBrainTimeAwareMemoryPreserved=true"
            echo "creatorBrainCombinationsPreserved=true"
            echo "creatorPlaybookPreserved=true"
            echo "recommendationOutcomeLearningPreserved=true"
            echo "liveGeminiVideoAutopsyPreserved=true"
            echo "reminderCompletionSafetyPreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.4e-brain-explainability-controls-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.4e-brain-explainability-controls.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.4e-brain-explainability-controls-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to develop and staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:develop/v2.0-alpha1.4e-brain-explainability-controls
          git push origin HEAD:staging/v2.0-alpha1.4e-brain-explainability-controls-validated
