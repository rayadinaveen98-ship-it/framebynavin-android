name: V136 Backlot Frame Guide

on:
  push:
    branches:
      - "feature/v136-frame-guide"
    paths:
      - ".github/workflows/v136-frame-guide.yml"
      - "app/build.gradle.kts"
      - "app/src/main/java/com/framebynavin/app/ui/V129CinePulseGuide.kt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v136-frame-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Frame guide branch
        uses: actions/checkout@v4
        with:
          ref: feature/v136-frame-guide

      - name: Verify Frame guide contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 136' app/build.gradle.kts
          grep -q '2.0.0-rc9-frame-guide' app/build.gradle.kts
          grep -q 'Backlot Frame guide' app/src/main/java/com/framebynavin/app/ui/V129CinePulseGuide.kt
          grep -q 'CinePulseState.WAVE' app/src/main/java/com/framebynavin/app/ui/V129CinePulseGuide.kt
          grep -q 'CinePulseState.POINT' app/src/main/java/com/framebynavin/app/ui/V129CinePulseGuide.kt
          grep -q 'CinePulseState.THINK' app/src/main/java/com/framebynavin/app/ui/V129CinePulseGuide.kt
          grep -q 'CinePulseState.CELEBRATE' app/src/main/java/com/framebynavin/app/ui/V129CinePulseGuide.kt
          if grep -q 'radialGradient\|FrameTertiary\|RecRed\|hotPink' app/src/main/java/com/framebynavin/app/ui/V129CinePulseGuide.kt; then
            echo 'Frame guide must stay flat: legacy glow/ribbon styling detected.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests, Kotlin compile and APK
        run: gradle :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Backlot-v136-FrameGuide.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-v136-frame-guide
          path: Backlot-v136-FrameGuide.apk
          if-no-files-found: error
          retention-days: 90
