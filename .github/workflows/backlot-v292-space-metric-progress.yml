name: Backlot V292 - Optional Personal Spaces Metric Progress

on:
  push:
    branches: [feature/backlot-v292-space-progress-metrics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v292-metric-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile owner-independent feature and unit/UI test binaries
        run: |
          set -euo pipefail
          timeout 75m gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Check six metric JVM tests and preserve V289 domain regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path('app/build/test-results/testDebugUnitTest')
          for suite,minimum in [('V292SpaceMetricSuggestionsTest',6),('V289PersonalSpacePolicyTest',7)]:
              matches=list(base.glob('TEST-*'+suite+'.xml'))
              assert len(matches)==1, f'{suite}: expected one test report'
              xml=ET.parse(matches[0]).getroot()
              assert int(xml.get('tests','0'))>=minimum
              assert int(xml.get('failures','0'))==0
              assert int(xml.get('errors','0'))==0
          print('PASS: opt-in numeric validation and existing Space domain tests')
          PY
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/app-debug-androidTest.apk
          (cd output && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V292-Metric-UI-Test-Binaries
          path: output/
          retention-days: 7
          if-no-files-found: error
  android-15-metric-ui:
    needs: compile-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V292-Metric-UI-Test-Binaries
          path: output
      - name: Verify selected binaries before emulator install
        run: |
          set -euo pipefail
          (cd output && sha256sum -c SHA256SUMS.txt)
          mkdir -p app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug
          cp output/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
          cp output/app-debug-androidTest.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Enable emulator acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 - metric logging and existing six Spaces UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v292-metric-instrumentation.sh
