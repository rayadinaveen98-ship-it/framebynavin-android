              "        versionCode = 83\n        versionName = \"1.9.0-content-project-rc3.1\""
          )

          # Upgrade the authoritative gate identity/invariants/artifact labels.
          path = ".github/workflows/v19-rc3-project-pulse.yml"
          once(path, "name: v1.9 RC3 Project Pulse Gate", "name: v1.9 RC3.1 Project Pulse Gate")
          once(path,
              "          grep -q 'versionCode = 82' app/build.gradle.kts\n          grep -q 'versionName = \"1.9.0-content-project-rc3\"' app/build.gradle.kts",
              "          grep -q 'versionCode = 83' app/build.gradle.kts\n          grep -q 'versionName = \"1.9.0-content-project-rc3.1\"' app/build.gradle.kts"
          )
          once(path,
              "          grep -q 'ProjectPulseEngine.applyAttentionPlan(configured, attentionPlan)' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt",
              "          grep -q 'ProjectPulseEngine.applyAttentionPlan(configured, attentionPlan)' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt\n          grep -q 'enum class ReminderDeliveryPreference' app/src/main/java/com/framebynavin/app/data/CreatorTask.kt\n          grep -q 'deliveryPreference' app/src/main/java/com/framebynavin/app/data/TaskStore.kt\n          grep -q 'resolvedDeliveryMode' app/src/main/java/com/framebynavin/app/data/ProjectPulse.kt\n          grep -q 'REMINDER STYLE' app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt\n          grep -q 'CHOOSE TIME' app/src/main/java/com/framebynavin/app/reminders/VoiceReminderActivity.kt\n          grep -q 'REPLAY' app/src/main/java/com/framebynavin/app/reminders/VoiceReminderActivity.kt"
          )
          count_replace(path, "FrameByNavin-v1.9-rc3-project-pulse-emulator-report", "FrameByNavin-v1.9-rc3.1-project-pulse-emulator-report", 1)
          once(path,
              "          printf 'projectPulseStageLoop=true\\ncustomStageAware=true\\nlegacyDoneDismissOnly=true\\nsmartFinalTargetBounded=true\\n' >> verification/manifest.txt",
              "          printf 'projectPulseStageLoop=true\\ncustomStageAware=true\\nlegacyDoneDismissOnly=true\\nsmartFinalTargetBounded=true\\nstickyDeliveryPreference=true\\nactiveReminderExactReschedule=true\\n' >> verification/manifest.txt"
          )
          count_replace(path, "FrameByNavin-v1.9.0-content-project-rc3-apk", "FrameByNavin-v1.9.0-content-project-rc3.1-apk", 1)
          count_replace(path, "FrameByNavin-v1.9.0-content-project-rc3-verification", "FrameByNavin-v1.9.0-content-project-rc3.1-verification", 1)

          print("RC3.1 source patch complete")
          PY
          git diff --check
