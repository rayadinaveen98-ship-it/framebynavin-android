name: Backlot seven-feature owner APK

on:
  push:
    branches:
      - release/backlot-fc13-seven-integrated-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build owner APK with isolated Kotlin compiler memory
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assemblePersonalStable --no-daemon --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC" \
            --stacktrace 2>&1 | tee seven-feature-build.log
      - name: Package and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find app/build/outputs/apk/personalStable -name '*.apk' -type f | head -n 1)
          test -s "$APK"
          cp "$APK" out/Backlot-325-Seven-Features-Owner-Preview.apk
          sha256sum out/Backlot-325-Seven-Features-Owner-Preview.apk | tee out/SHA256.txt
          command -v apksigner || true
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
            if [ -n "$SIGNER" ]; then "$SIGNER" verify --verbose --print-certs out/Backlot-325-Seven-Features-Owner-Preview.apk; fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-325-Seven-Features-Owner-Preview
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Attach logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-325-Build-Diagnostics
          path: seven-feature-build.log
          if-no-files-found: ignore
