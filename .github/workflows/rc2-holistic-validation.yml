name: RC2 Holistic Validation

on:
  push:
    branches:
      - "feature/v2.0-rc2-holistic-validation"
    paths:
      - ".github/workflows/rc2-holistic-validation.yml"
  workflow_dispatch:

concurrency:
  group: rc2-holistic-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source integrity
        run: |
          git diff --check
          python3 scripts/rc2_holistic_source_audit.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release variant
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify debug APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload holistic RC2 APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v124-rc2-holistic-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v124-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
