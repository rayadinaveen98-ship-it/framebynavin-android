name: Development certificate info

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/dev-cert-info.yml"

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Print SHA-1
        run: |
          keytool -list -v \
            -keystore keystore/REMOVED_PRIVATE_SIGNING_VALUE.jks \
            -alias REMOVED_PRIVATE_SIGNING_VALUE \
            -storepass REMOVED_PRIVATE_SIGNING_VALUE \
            -keypass REMOVED_PRIVATE_SIGNING_VALUE | grep 'SHA1:'
