name: FrameByNavin v1.8.3 Publication Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v1.8.3-publication-recovery
    paths:
      - '.github/workflows/v183-publication-recovery.yml'
      - 'foundation/v183/rc6-publication-recovery.patch.xz'

permissions:
  contents: write
  actions: read

concurrency:
  group: framebynavin-v183-publication-recovery
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'rayadinaveen98-ship-it/framebynavin-android' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact RC5 descendant
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify and apply reviewed source update
        shell: bash
        run: |
          set -euo pipefail
          BASE=f1a986c54e2a26a67dc3cf3231923e58dc82626c
          PAYLOAD=foundation/v183/rc6-publication-recovery.patch.xz
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object "$PAYLOAD")" = '1e111f08e86934b1081383b26bf23a5dc84bfab9'
          echo '3b6ed1d894e96391c01405d29040e9616289af6593dbcccc84ede8c53a3e820a  foundation/v183/rc6-publication-recovery.patch.xz' | sha256sum -c -
          git diff --exit-code "$BASE" HEAD -- app
          git diff --exit-code -- app
          python3 - <<'PY'
          import subprocess
          expected={'.github/workflows/v183-publication-recovery.yml','foundation/v183/rc6-publication-recovery.patch.xz'}
          actual=set(subprocess.check_output(['git','diff','--name-only','f1a986c54e2a26a67dc3cf3231923e58dc82626c','HEAD'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          PY
          xz -dc "$PAYLOAD" > /tmp/fbn183-rc6.patch
          echo '289522152358e423eb21e31d0509c7abb0307b20b1a66baac71f15b38bd03ae7  /tmp/fbn183-rc6.patch' | sha256sum -c -
          git apply --check /tmp/fbn183-rc6.patch
          git apply /tmp/fbn183-rc6.patch
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected={
            'app/build.gradle.kts',
            'app/src/androidTest/java/com/framebynavin/app/data/CreatorPublicationRecoveryV183Test.kt',
            'app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt',
            'app/src/main/java/com/framebynavin/app/data/CreatorPostPublishEngine.kt',
            'app/src/main/java/com/framebynavin/app/data/CreatorPostPublishReconciliation.kt',
            'app/src/main/java/com/framebynavin/app/data/CreatorPublicationRecovery.kt',
            'app/src/main/java/com/framebynavin/app/data/CreatorRewardReconciliation.kt',
            'app/src/main/java/com/framebynavin/app/data/CreatorRewards.kt',
            'app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt',
            'app/src/test/java/com/framebynavin/app/data/CreatorPublicationRecoveryEngineTest.kt',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          actual|=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard','app'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'versionCode = 71' in gradle
          assert 'versionName = "1.8.3-foundation-rc6"' in gradle
          assert 'const val SCHEMA_VERSION = 5' in Path('app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt').read_text()
          assert not any(Path(p).is_symlink() for p in expected)
          recovery=Path('app/src/main/java/com/framebynavin/app/data/CreatorPublicationRecovery.kt').read_text()
          assert 'CreatorDataGate.readyTransaction(appContext)' in recovery
          assert 'suspend fun reconcileRestoredState()' in recovery
          assert 'suspend fun recoverAll()' in recovery
          assert 'CreatorDataGate.checkGeneration(appContext, expectedGeneration)' in recovery
          assert 'checkpoints.reconcilePublications' in recovery
          vm=Path('app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt').read_text()
          assert 'publicationRecovery.finish(epoch)' in vm
          assert 'publicationRecovery.updateCheckpoint' in vm
          assert 'recoveryStage = { _, _ -> stageReward }' in vm
          assert 'publicationRecoveryReady.await()' in vm
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Exact RC6 source scope, payload, version and recovery contracts verified')
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build candidate APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify version and established pilot signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundation/verification
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee foundation/verification/rc6-apk-signature.txt
          grep -Fqi 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0' foundation/verification/rc6-apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.framebynavin.app' versionCode='71' versionName='1.8.3-foundation-rc6'"
          sha256sum "$APK" | tee foundation/verification/rc6-apk.sha256
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator regression suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash hardening/rc2/run_emulator_tests.sh
      - name: Commit verified canonical source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git -c user.name='FrameByNavin Build' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: recover publication and reward writes from authoritative state'
          git push origin HEAD:refs/heads/fix/v1.8.3-publication-recovery
      - name: Archive verified candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundation/source foundation/verification
          git archive --format=tar.gz --output foundation/source/FrameByNavin-v1.8.3-foundation-rc6-source.tar.gz HEAD app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties
          sha256sum foundation/source/FrameByNavin-v1.8.3-foundation-rc6-source.tar.gz | tee foundation/verification/rc6-source.sha256
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          source=pathlib.Path('foundation/source/FrameByNavin-v1.8.3-foundation-rc6-source.tar.gz')
          apk=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
            'status':'internal foundation candidate; not a public release',
            'versionName':'1.8.3-foundation-rc6','versionCode':71,'backupSchemaVersion':5,
            'canonical_base':'f1a986c54e2a26a67dc3cf3231923e58dc82626c',
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'source_sha256':sha(source),'apk_sha256':sha(apk),
            'signing_certificate_sha256':'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0',
            'scope':'Durable publication/reward recovery, explicit stage evidence, checkpoint reconciliation and synthetic regressions. No backend migration or real-user mutation.'
          }
          pathlib.Path('foundation/verification/rc6-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Upload verified candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-foundation-rc6-candidate
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            foundation/verification/rc6-apk.sha256
            foundation/verification/rc6-apk-signature.txt
      - name: Upload verified candidate source
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-foundation-rc6-source
          path: |
            foundation/source/FrameByNavin-v1.8.3-foundation-rc6-source.tar.gz
            foundation/verification/rc6-manifest.json
            foundation/verification/rc6-source.sha256
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-foundation-rc6-diagnostics
          if-no-files-found: ignore
          path: |
            foundation/verification/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            hardening/diagnostics/
