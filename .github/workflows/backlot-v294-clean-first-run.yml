name: Backlot V294 - Clean Install No Sample Data

on:
  push:
    branches: [qa/backlot-v294-clean-first-run]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v294-clean-first-run
  cancel-in-progress: true

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile isolated debug app and matching Android tests
        run: |
          set -euo pipefail
          timeout 80m gradle :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable Android 15 emulator acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify clean first run has zero persisted samples
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v294-clean-first-run.sh
      - name: Preserve synthetic clean first-run report
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V294-Clean-First-Run-Report
          path: output/v294-first-run/
          retention-days: 30
          if-no-files-found: error
