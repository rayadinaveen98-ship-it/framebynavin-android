name: Backlot V293 - Private Photo Backup Preflight

on:
  push:
    branches: [feature/backlot-v293-photo-backup-preflight]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v293-photo-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile V293 photo preflight and existing Android app tests
        run: |
          set -euo pipefail
          timeout 80m gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Require seven V293 preflight unit checks and existing photo/metadata policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('app/build/test-results/testDebugUnitTest')
          for suite,minimum in [
              ('V293PhotoBackupPolicyTest',7),
              ('V289SpacesMetadataCodecTest',7),
              ('V290PhotoTimelinePolicyTest',6),
          ]:
              matches=list(root.glob('TEST-*'+suite+'.xml'))
              assert len(matches)==1, (suite,'missing unit test report')
              xml=ET.parse(matches[0]).getroot()
              assert int(xml.get('tests','0'))>=minimum, suite
              assert int(xml.get('failures','0'))==0, suite
              assert int(xml.get('errors','0'))==0, suite
          print('PASS: private photo preflight and metadata integrity unit suites')
          PY
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/app-debug-androidTest.apk
          (cd output && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V293-Photo-Preflight-Test-Binaries
          path: output/
          retention-days: 7
          if-no-files-found: error

  android-15-photo-preflight:
    needs: compile-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V293-Photo-Preflight-Test-Binaries
          path: output
      - name: Enable emulator KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 - private JPEG change and loss must block backup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v293-photo-backup-preflight.sh
