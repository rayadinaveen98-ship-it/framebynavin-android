name: Backlot Build283 - Standalone Android Lint Diagnostics
on:
  push:
    branches: [feature/backlot-v283-creator-optin-audible-retry, feature/backlot-v283-lint-diagnostics-fix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v283-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Lint (independent of owner APK and emulator validation)
        run: |
          set -euo pipefail
          free -h
          timeout 25m gradle :app:lintDebug --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Upload lint reports for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Build283-Lint-Diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/lint/**
