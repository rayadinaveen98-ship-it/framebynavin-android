name: Backlot — Pending Work Closure / No New Features

on:
  push:
    branches: [stabilization/backlot-pending-closure]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-stabilization-pending-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-run-visual-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject any unreviewed new feature or data change
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/heads/feature/backlot-v310-personal-composer-links:refs/remotes/origin/feature/backlot-v310-personal-composer-links
          git diff --name-only origin/feature/backlot-v310-personal-composer-links HEAD > /tmp/stabilization-files.txt
          cat /tmp/stabilization-files.txt
          while IFS= read -r path; do
            case "$path" in
              app/src/main/java/com/framebynavin/app/ui/V157ReminderCenterUi.kt|app/src/androidTest/java/com/framebynavin/app/ui/BacklotStabilizationEmptyCreatorUiTest.kt|.github/scripts/backlot-stabilization-creator-empty-android15.sh|.github/workflows/backlot-stabilization-closure.yml|docs/release/BACKLOT_STABILIZATION_PENDING_CLOSURE.md) ;;
              *) echo "BLOCKED: non-stabilization source change $path" >&2; exit 1;;
            esac
          done < /tmp/stabilization-files.txt
          echo 'PASS: only empty-state UI, acceptance tests and release tracking changed'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile complete debug app and Android tests, run full unit regression
        run: |
          set -euo pipefail
          timeout 85m gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable Android 15 emulator KVM acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify trimmed Creator screen and original history navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-stabilization-creator-empty-android15.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backlot-Stabilization-Creator-Empty-Android15
          path: output/stabilization-creator-empty/
          retention-days: 30
          if-no-files-found: warn
