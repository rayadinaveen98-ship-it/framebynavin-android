name: Build FrameByNavin v1.7.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v1.7.5-original-frames-splash"
    paths:
      - "tools/v175_integrate.py"
      - ".github/workflows/v175-build.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"

concurrency:
  group: framebynavin-v175-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.7.5 source integration
        run: python tools/v175_integrate.py

      - name: Verify original-frame architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V175BestFramesOfToday' app/src/main/java/com/framebynavin/app/ui/V131PolishUi.kt
          grep -q 'PickMultipleVisualMedia' app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt
          grep -q 'input.copyTo(output' app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt
          grep -q 'versionCode = 37' app/build.gradle.kts
          grep -q '1.7.5-original-frames-splash-rc1' app/build.gradle.kts
          if find app/src/main/res/drawable-nodpi -maxdepth 1 -name 'hero_frame_*.webp' | grep -q .; then
            echo 'Legacy bundled slideshow frames still present'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify v1.7.5 APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          grep -q 'versionCode = 37' app/build.gradle.kts
          grep -q 'versionName = "1.7.5-original-frames-splash-rc1"' app/build.gradle.kts
          echo "APK bytes: $(stat -c%s "$apk")"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.7.5-original-frames-splash-rc1
          path: app/build/outputs/apk/debug/app-debug.apk
