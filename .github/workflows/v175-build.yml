name: Build FrameByNavin v1.7.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v1.7.5-original-frames-splash"
    paths:
      - "tools/v175_integrate.py"
      - "tools/v175_public_prepare.py"
      - ".github/workflows/v175-build.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"

concurrency:
  group: framebynavin-v175-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify local Python
        shell: powershell
        run: py -3.12 --version

      - name: Apply v1.7.5 source integration
        shell: powershell
        run: py -3.12 tools/v175_integrate.py

      - name: Apply public-safe preparation
        shell: powershell
        run: py -3.12 tools/v175_public_prepare.py

      - name: Verify original-frame architecture
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $polish = Get-Content "app/src/main/java/com/framebynavin/app/ui/V131PolishUi.kt" -Raw
          $frames = Get-Content "app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt" -Raw
          $gradle = Get-Content "app/build.gradle.kts" -Raw
          if (-not $polish.Contains("V175BestFramesOfToday")) { throw "Best Frames v1.7.5 is not wired" }
          if (-not $frames.Contains("PickMultipleVisualMedia")) { throw "Multi-image picker is missing" }
          if (-not $frames.Contains("input.copyTo(output")) { throw "Original byte-copy path is missing" }
          if ($frames.Contains("matchParentSize")) { throw "Unsupported matchParentSize usage remains" }
          if (-not $gradle.Contains("versionCode = 37")) { throw "versionCode 37 is missing" }
          if (-not $gradle.Contains('versionName = "1.7.5-original-frames-splash-rc1"')) { throw "v1.7.5 versionName is missing" }
          if ($gradle.Contains("REMOVED_PRIVATE_SIGNING_VALUE")) { throw "Hardcoded signing credential remains" }
          $legacy = Get-ChildItem "app/src/main/res/drawable-nodpi" -Filter "hero_frame_*.webp" -ErrorAction SilentlyContinue
          if ($legacy) { throw "Legacy bundled slideshow frames are still present" }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Bootstrap Android command-line tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = Join-Path $env:USERPROFILE ".android\sdk"
          $cmdLatest = Join-Path $sdkRoot "cmdline-tools\latest"
          $sdkManager = Join-Path $cmdLatest "bin\sdkmanager.bat"
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          if (-not (Test-Path $sdkManager)) {
            $zip = Join-Path $env:RUNNER_TEMP "android-commandlinetools.zip"
            $extract = Join-Path $env:RUNNER_TEMP "android-commandlinetools-extracted"
            if (Test-Path $zip) { Remove-Item $zip -Force }
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            & curl.exe -L --fail --retry 3 --connect-timeout 30 -o $zip "https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip"
            if ($LASTEXITCODE -ne 0) { throw "Android command-line tools download failed" }
            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            if (Test-Path $cmdLatest) { Remove-Item $cmdLatest -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $cmdLatest | Out-Null
            Copy-Item (Join-Path $extract "cmdline-tools\*") $cmdLatest -Recurse -Force
          }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $cmdLatest "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $sdkRoot "platform-tools") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $sdkManager --version

      - name: Accept Android licenses and install SDK 35
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = $env:ANDROID_SDK_ROOT
          $sdkManager = Join-Path $sdkRoot "cmdline-tools\latest\bin\sdkmanager.bat"
          $licenseDir = Join-Path $sdkRoot "licenses"
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          @(
            "24333f8a63b6825ea9c5514f83c2829b004d1fee",
            "8933bad161af4178b1185d1a37fbf41ea5269c55",
            "d56f5187479451eabf01fb78af6dfcb131a6481e"
          ) | Set-Content -Path (Join-Path $licenseDir "android-sdk-license") -Encoding ASCII
          "84831b9409646a918e30573bab4c9c91346d8abd" | Set-Content -Path (Join-Path $licenseDir "android-sdk-preview-license") -Encoding ASCII
          & $sdkManager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }
          if (-not (Test-Path (Join-Path $sdkRoot "platforms\android-35\android.jar"))) { throw "Android 35 platform was not installed" }
          if (-not (Test-Path (Join-Path $sdkRoot "build-tools\35.0.0"))) { throw "Android build-tools 35.0.0 were not installed" }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        shell: powershell
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        shell: powershell
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        shell: powershell
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build debug APK
        shell: powershell
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify v1.7.5 APK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $apk = "app/build/outputs/apk/debug/app-debug.apk"
          if (-not (Test-Path $apk)) { throw "APK not found" }
          if ((Get-Item $apk).Length -le 0) { throw "APK is empty" }
          $gradle = Get-Content "app/build.gradle.kts" -Raw
          if (-not $gradle.Contains("versionCode = 37")) { throw "versionCode verification failed" }
          if (-not $gradle.Contains('versionName = "1.7.5-original-frames-splash-rc1"')) { throw "versionName verification failed" }
          Write-Host "APK bytes: $((Get-Item $apk).Length)"
          Get-FileHash $apk -Algorithm SHA256 | Format-List

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.7.5-original-frames-splash-rc1
          path: app/build/outputs/apk/debug/app-debug.apk
