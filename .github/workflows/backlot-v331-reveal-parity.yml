name: Backlot V331 - Four Prototype Reminder Screens Android APK

on:
  push:
    branches:
      - feature/backlot-v331-approved-reminder-reveal-parity-20261111
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify approved renderer is packaged
        run: |
          set -euo pipefail
          test -s app/src/main/assets/backlot_v330_motion.html
          grep -q 'function drawNodes' app/src/main/assets/backlot_v330_motion.html
          grep -q 'function genNodes' app/src/main/assets/backlot_v330_motion.html
          grep -q '1250' app/src/main/assets/backlot_v330_motion.html
          grep -q 'DOUBLE TAP THE FORMED SIGNAL' app/src/main/assets/backlot_v330_motion.html
          grep -q 'V330ReminderPrototypeScene' app/src/main/java/com/framebynavin/app/reminders/ReminderCheckInScreen.kt
          grep -q 'V330ReminderPrototypeScene' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
      - name: Check four reveal surfaces retain original callbacks
        run: |
          set -euo pipefail
          grep -q 'V331PrototypeRevealHero' app/src/main/java/com/framebynavin/app/reminders/ReminderCheckInScreen.kt
          grep -q 'V331PrototypeRevealHero' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
          grep -q 'onClick = onSnooze' app/src/main/java/com/framebynavin/app/reminders/ReminderCheckInScreen.kt
          grep -q 'onClick = onDone' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
          grep -q 'v279-locked-generic-alarm' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
      - name: Verify visual presentation policy
        run: |
          set -euo pipefail
          gradle :app:testPersonalStableUnitTest --tests 'com.framebynavin.app.reminders.V329ReminderVisualPolicyTest' --tests 'com.framebynavin.app.reminders.V331RevealStyleTest' --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Compile owner-upgrade compatible V331 preview
        run: |
          set -euo pipefail
          # Match the established personal owner-preview path; production release gates are unchanged.
          # Lint is not a compiler/signature check and remains outside this personal preview package.
          gradle :app:assemblePersonalStable -x :app:lintVitalPersonalStable --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Stage signed owner-preview artifact and checksum
        run: |
          set -euo pipefail
          mkdir -p output/v331
          APK=app/build/outputs/apk/personalStable/app-personalStable.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee output/v331/SIGNATURE.txt
          EXPECTED=$(keytool -exportcert -keystore dev-signing/framebynavin-public-debug.jks -storepass framebynavin-dev -alias framebynavin-dev | sha256sum | cut -d ' ' -f 1)
          ACTUAL=$(sed -n -E 's/^(V2 Signer|Signer #1): certificate SHA-256 digest: //p' output/v331/SIGNATURE.txt | head -n 1)
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' "$GITHUB_SHA" > output/v331/COMMIT.txt
          cp app/build/outputs/apk/personalStable/app-personalStable.apk output/v331/Backlot-V331-Prototype-Screens-Owner-Preview.apk
          sha256sum output/v331/Backlot-V331-Prototype-Screens-Owner-Preview.apk > output/v331/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V331-Four-Reminder-Prototypes-Owner-Preview
          path: output/v331/
          retention-days: 30
          if-no-files-found: error
