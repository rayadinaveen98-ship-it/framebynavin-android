name: Backlot V288 - Preserve Owner Data During Signed V287 Upgrade

on:
  push:
    branches: [feature/backlot-v288-preserve-owner-upgrade]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-v288-upgrade-preservation
  cancel-in-progress: true

jobs:
  emulator-upgrade-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download exact previously verified V287 owner APK
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V287-Nap-Wake-Owner-Test
          path: output/v287
          run-id: 41809150847
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exact fully QA-passing V288 owner APK
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V288-Personal-OS-Owner-Test
          path: output/v288
          run-id: 41842400120
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both signed APKs are intact, matching package and newer version
        run: |
          set -euo pipefail
          (cd output/v287 && sha256sum -c SHA256SUMS.txt)
          (cd output/v288 && sha256sum -c SHA256SUMS.txt)
          grep -q "package: name='com.framebynavin.app' versionCode='287'" output/v287/APK-IDENTITY.txt
          grep -q "package: name='com.framebynavin.app' versionCode='288'" output/v288/APK-IDENTITY.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' output/v287/SIGNATURE-VERIFICATION.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' output/v288/SIGNATURE-VERIFICATION.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          certs=[]
          for version in ('v287', 'v288'):
              txt=Path(f'output/{version}/SIGNATURE-VERIFICATION.txt').read_text()
              m=re.search(r'V2 Signer: certificate SHA-256 digest: ([0-9a-f]{64})', txt)
              assert m, f'Signer missing from {version}'
              certs.append(m.group(1))
          assert certs[0]==certs[1], 'V287 and V288 owner APK signers differ'
          print('PASS: V287 and V288 signed APKs match signer and package; only version increases')
          PY
      - name: Compile the isolated upgrade fixture as instrumentation APK only
        run: |
          timeout 65m gradle :app:assembleDebugAndroidTest --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable Android emulator acceleration where available
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo 'KVM accessible'
          else
            echo 'KVM unavailable on this runner; use emulator fallback'
          fi
      - name: Android 15 signed V287 -> V288 in-place owner-data preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v288-inplace-upgrade.sh
