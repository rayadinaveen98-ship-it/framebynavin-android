name: Backlot V161 — Quick Actions Phase 2 UX

on:
  push:
    branches:
      - feature/backlot-v161-quick-actions-hub-and-capture-p2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v161-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: V161 hub + capture APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout V161
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Preserve V154–V160 and validate every Quick Actions route
        run: bash tools/check_v161_quick_actions_hub_capture.sh
      - name: Unit tests — preservation and regression
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Compile Android device tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build V161 APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V161 Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v161-quick-actions-phase2-capture-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  android-emulator:
    name: Android 30 hub and capture behavior
    needs: android-apk
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - name: Checkout V161
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Exercise Quick Actions destinations, optional inputs, and failed save on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.ui.V161QuickActionsUiTest" --stacktrace
      - name: Keep device reports on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v161-quick-actions-ui-android30-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30
