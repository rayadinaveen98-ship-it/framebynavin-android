name: Backlot CW6 - Owner Preview APK Packaging (NOT PRODUCTION RELEASE)

on:
  push:
    branches:
      - candidate/backlot-cw6-owner-apk-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-signed-owner-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Guard exact CW6-validated source and prohibit production code drift
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a106aff25d21e695982b4dd60c3a2821443a3bb9 HEAD
          test "$(git diff --name-only a106aff25d21e695982b4dd60c3a2821443a3bb9 HEAD)" = ".github/workflows/backlot-cw6-owner-preview-apk.yml"
          test "$(grep -c 'applicationId = "com.framebynavin.app"' app/build.gradle.kts)" = 1
          grep -Fq 'versionCode = 336' app/build.gradle.kts
          echo "a106aff25d21e695982b4dd60c3a2821443a3bb9" > validated-cw6-source-sha.txt
      # CW6 full validation ran vital Lint, signed assemble and Android emulator
      # on exactly this source SHA, in successful run 43226463122.
      # This job distributes an already-validated preview build; separate
      # production release validation must never skip vital Lint.
      - name: Preflight Gradle graph - refuse any vital Lint execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/owner-preview-diagnostics
          timeout --signal=TERM --kill-after=20s 300s \
            gradle :app:assemblePersonalStable \
              -x :app:lintVitalAnalyzePersonalStable \
              -x :app:lintVitalReportPersonalStable \
              -x :app:lintVitalPersonalStable \
              -Pkotlin.compiler.execution.strategy=in-process \
              --no-daemon --no-parallel --max-workers=1 \
              '-Dorg.gradle.jvmargs=-Xmx9g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
              --dry-run --console=plain 2>&1 | tee output/owner-preview-diagnostics/GRADLE-DRY-RUN.txt
          if grep -E '^> Task :app:lintVital' output/owner-preview-diagnostics/GRADLE-DRY-RUN.txt; then
            echo "Vital Lint still in task graph. Refusing another stuck build." >&2
            exit 1
          fi
          echo "PREVIEW ONLY: lint already passed in integrated CW6 run 43226463122"
      - name: Build owner-signed preview APK (validated source, exclude repeated vital Lint)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 3300s \
            gradle :app:assemblePersonalStable \
              -x :app:lintVitalAnalyzePersonalStable \
              -x :app:lintVitalReportPersonalStable \
              -x :app:lintVitalPersonalStable \
              -Pkotlin.compiler.execution.strategy=in-process \
              --no-daemon --no-parallel --max-workers=1 \
              '-Dorg.gradle.jvmargs=-Xmx9g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
              --stacktrace --console=plain 2>&1 | tee output/owner-preview-diagnostics/BUILD.txt
      - name: Verify package identity, owner-preview signer and SHA256
        shell: bash
        run: |
          set -euo pipefail
          candidate=app/build/outputs/apk/personalStable/app-personalStable.apk
          test -s "$candidate"
          mkdir -p output/backlot-cw6-owner-preview
          out=output/backlot-cw6-owner-preview
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$candidate" > "$out/SIGNER.txt"
          "$aapt" dump badging "$candidate" | head -n 9 > "$out/PACKAGE.txt"
          grep -Fq "package: name='com.framebynavin.app' versionCode='336'" "$out/PACKAGE.txt"
          grep -Fq 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0' "$out/SIGNER.txt"
          cp "$candidate" "$out/Backlot-CW6-V336-PersonalStable-OwnerPreview.apk"
          (cd "$out" && sha256sum Backlot-CW6-V336-PersonalStable-OwnerPreview.apk > APK-SHA256.txt)
          cp validated-cw6-source-sha.txt "$out/VALIDATED-CW6-SOURCE-SHA.txt"
          git rev-parse HEAD > "$out/PACKAGING-COMMIT-SHA.txt"
          cat > "$out/README-FIRST.txt" <<'EOF'
          Backlot CW6 V336 - owner personalStable preview, not Play Store and not stable promotion.
          Source for all application code: exact validated CW6 source a106aff25d21e695982b4dd60c3a2821443a3bb9.
          APK uses the same personalStable signing certificate checked in prior V336 CI.
          Do not uninstall the installed app or clear its data. Export and verify a backup
          before testing an in-place update. Manual owner acceptance remains required.
          EOF
          test -s "$out/Backlot-CW6-V336-PersonalStable-OwnerPreview.apk"
      - name: Upload verified signed owner-preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-CW6-V336-Owner-PersonalStable-APK-NOT-RELEASE
          path: output/backlot-cw6-owner-preview/
          retention-days: 21
          if-no-files-found: error
      - name: Upload preflight and build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-CW6-Owner-Preview-Packaging-Diagnostics
          path: output/owner-preview-diagnostics/
          retention-days: 14
          if-no-files-found: warn
