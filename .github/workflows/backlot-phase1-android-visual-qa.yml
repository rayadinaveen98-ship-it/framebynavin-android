name: Backlot Phase 1 - Option A actual Android screenshots (debug-only)
on:
  push:
    branches: [feature/backlot-phase1-trust-review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backlot-phase1-android-screenshot-qa
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated debug visual review Activity
        run: |
          set -euo pipefail
          timeout 75m gradle :app:assembleDebug --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable Android emulator KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture five Android 15 screen screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/qa/capture_backlot_phase1_android.sh
      - name: Upload real Android screenshot bundle
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Phase1-OptionA-Actual-Android-15-Screenshots
          path: output/backlot-phase1-option-A/
          retention-days: 30
          if-no-files-found: error