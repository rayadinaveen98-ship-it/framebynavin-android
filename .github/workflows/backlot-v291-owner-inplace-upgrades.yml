name: Backlot V291 - Signed V288 and V290 In-Place Upgrade Preservation

on:
  push:
    branches: [feature/backlot-v291-owner-upgrade-preservation]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-v291-signed-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-upgrade-android-15:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build matching V291 signed owner and personalStable instrumentation
        run: |
          set -euo pipefail
          grep -Fq 'testBuildType = "personalStable"' app/build.gradle.kts
          timeout 78m gradle :app:assemblePersonalStable :app:assemblePersonalStableAndroidTest \
            -PbacklotSignedOwnerTest=true -x :app:lintVitalPersonalStable \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
          mkdir -p output/v291
          cp app/build/outputs/apk/personalStable/app-personalStable.apk output/v291/Backlot-V291-Upgrade-Preservation.apk
          cp app/build/outputs/apk/androidTest/personalStable/app-personalStable-androidTest.apk output/v291/app-personalStable-androidTest.apk
          (cd output/v291 && sha256sum *.apk > SHA256SUMS.txt)
      - name: Fetch verified prior V288 owner APK
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V288-Personal-OS-Owner-Test
          path: output/v288
          run-id: 41842400120
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch verified prior V290 owner APK
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V290-Private-Spaces-Owner-Test
          path: output/v290
          run-id: 41858035754
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all APK checksums, package version and same V2 signer
        run: |
          set -euo pipefail
          for v in v288 v290 v291; do (cd "output/$v" && sha256sum -c SHA256SUMS.txt); done
          grep -q "package: name='com.framebynavin.app' versionCode='288'" output/v288/APK-IDENTITY.txt
          grep -q "package: name='com.framebynavin.app' versionCode='290'" output/v290/APK-IDENTITY.txt
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          apktool="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          "$apktool" verify --verbose --print-certs output/v291/Backlot-V291-Upgrade-Preservation.apk > output/v291/SIGNATURE-VERIFICATION.txt
          "$aapt" dump badging output/v291/Backlot-V291-Upgrade-Preservation.apk > output/v291/APK-IDENTITY.txt
          grep -q "package: name='com.framebynavin.app' versionCode='291'" output/v291/APK-IDENTITY.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          certificates=[]
          for version in ('v288', 'v290', 'v291'):
              signature=Path(f'output/{version}/SIGNATURE-VERIFICATION.txt').read_text()
              assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in signature
              found=re.search(r'V2 Signer: certificate SHA-256 digest: ([0-9a-f]{64})', signature)
              assert found, f'V2 signing certificate missing for {version}'
              certificates.append(found.group(1))
          assert len(set(certificates))==1, 'In-place upgrade signer mismatch'
          assert certificates[0]=='f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0', 'Unexpected signer'
          print('PASS: verified signed V288/V290/V291 APKs all share same owner-preview signer')
          PY
      - name: Enable KVM where available
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 in-place upgrades for Personal/Creator and Spaces/photo bytes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v291-owner-inplace-upgrades.sh
