name: v2.0 Alpha 1.2A Account Cloud Gate

on:
  push:
    branches:
      - "develop/v2.0-alpha1.2-account-cloud"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v20-alpha12a-account-cloud
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Alpha 1.2A invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'versionCode = 86' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2a-account-cloud"' app/build.gradle.kts

          # Accepted Home remains the active Today experience.
          grep -q 'PTab.TODAY -> PTodayScreen(' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -q 'PTab.TODAY -> V20TodayCommandCenter(' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt

          # Returning account detection is typed and cannot be inferred from backup status text.
          grep -q 'RETURNING_CREATOR' app/src/main/java/com/framebynavin/app/cloud/CloudCreatorAccountPolicy.kt
          grep -q 'CloudCreatorAccountPolicy.route' app/src/main/java/com/framebynavin/app/ui/V23AccountOnboarding.kt
          ! grep -q 'resultState.message.startsWith' app/src/main/java/com/framebynavin/app/ui/V23AccountOnboarding.kt

          # Google identity persists before lifecycle inspection; backup safety remains fail-closed.
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt').read_text()
          fn = text[text.index('suspend fun completeGoogleSignIn'):text.index('suspend fun refreshCreatorIdentity')]
          assert fn.index('local.saveSession(session)') < fn.index('api.cloudStatus(session)')
          PY
          grep -q 'local.requireWritable' app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt
          grep -q 'x-creator-write-epoch' app/src/main/java/com/framebynavin/app/cloud/CloudApiClient.kt

          # Deployed lifecycle migration is preserved with source.
          test -s supabase/migrations/20260911_creator_cloud_lifecycle_generation_fence_v20.sql
          grep -q 'creator_cloud_status' supabase/migrations/20260911_creator_cloud_lifecycle_generation_fence_v20.sql
          grep -q 'creator_enforce_write_epoch' supabase/migrations/20260911_creator_cloud_lifecycle_generation_fence_v20.sql
          grep -q 'creator_delete_owned_data' supabase/migrations/20260911_creator_cloud_lifecycle_generation_fence_v20.sql
          grep -q 'creator_resume_owned_data' supabase/migrations/20260911_creator_cloud_lifecycle_generation_fence_v20.sql

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.2a-account-cloud.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.2a-account-cloud.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.2a-account-cloud"
            echo "versionCode=86"
            echo "commit=${GITHUB_SHA}"
            echo "acceptedHomePreserved=true"
            echo "returningCreatorRoutingTyped=true"
            echo "sameAccountDoesNotRecreateCreatorId=true"
            echo "identityIndependentFromBackupHealth=true"
            echo "cloudLifecycleRpcDeployed=true"
            echo "cloudWriteGenerationFence=true"
            echo "existingBackupsPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2a-account-cloud-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.2a-account-cloud.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2a-account-cloud-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90
