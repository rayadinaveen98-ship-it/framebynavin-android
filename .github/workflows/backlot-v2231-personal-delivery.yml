name: Backlot V2231 Personal Delivery QA

on:
  push:
    branches: [feature/backlot-v2231-personal-delivery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify strict personal and creator isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/framebynavin/app/personal")
          delivery=(root/"PersonalDeliveryCoordinator.kt").read_text()
          action=(root/"PersonalReminderReceiver.kt").read_text()
          notif=(root/"PersonalReminderNotifications.kt").read_text()
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert 'backlot-personal://reminders/' in delivery
          assert 'PersonalApplyResult.STALE' in delivery
          assert 'presentedToken' in delivery and 'PersonalResponse.DONE' in delivery
          assert '.personal.PersonalReminderReceiver" android:exported="false"' in manifest
          assert '.personal.PersonalReminderActionReceiver" android:exported="false"' in manifest
          assert 'VISIBILITY_PRIVATE' in notif and 'setPublicVersion(generic)' in notif
          assert 'PersonalDeliveryCoordinator(appContext).reconcile()' in Path("app/src/main/java/com/framebynavin/app/reminders/ReminderRecoveryReceiver.kt").read_text()
          for file in root.glob("*.kt"):
              s=file.read_text()
              for forbidden in ('TaskStore(', 'CreatorTask(', 'ProjectPulseEngine.', 'ReminderScheduler(', 'ReminderActionReceiver::class', 'VoiceReminderService.start(', 'AlarmRingingService.start('):
                  assert forbidden not in s, (file, forbidden)
          assert 'versionCode = 242' in Path("app/build.gradle.kts").read_text()
          print("Personal namespaced delivery and action boundaries verified.")
          PY
      - name: Full JVM regression, lint, debug and Android instrumented APKs
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V2231-Personal-Delivery-Android-Inputs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30

  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V2231-Personal-Delivery-Android-Inputs
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify personal actions, storage, backup and creator Home isolation on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -e
            adb install -r "$(find apks -type f -name app-debug.apk -print -quit)"
            adb install -r "$(find apks -type f -name app-debug-androidTest.apk -print -quit)"
            adb shell am instrument -w -r -e class com.framebynavin.app.personal.V2231PersonalDeliveryTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee personal-actions.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' personal-actions.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' personal-actions.log
            adb shell am instrument -w -r -e class com.framebynavin.app.personal.V223PersonalFoundationTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee personal-store.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' personal-store.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' personal-store.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V222ColdStartProjectsUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee home-regression.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' home-regression.log; then exit 1; fi
            grep -Fq 'OK (1 test)' home-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backlot-V2231-Personal-Delivery-Android-Results
          path: |
            personal-actions.log
            personal-store.log
            home-regression.log
          if-no-files-found: warn
