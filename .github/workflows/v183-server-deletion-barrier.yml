name: FrameByNavin v1.8.3 Server Deletion Barrier

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.8.3-server-deletion-barrier
    paths:
      - backend/migrations/20260909000000_creator_deletion_barrier.sql
      - backend/tests/build_isolated_test.py
      - .github/workflows/v183-server-deletion-barrier.yml

permissions:
  contents: read

concurrency:
  group: rc8-server-deletion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: rc8_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rc8-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rc8_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: rc8_synthetic
      PGUSER: postgres
      PGPASSWORD: rc8-disposable-ci-only
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify ancestry and original source hashes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7e6913321726f2221054cd03b3e4df2483e4a7cb "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'backend/migrations/20260909000000_creator_deletion_barrier.sql': 'be3f2ac7b1eca945c443f370e90cad5398a974d53648d91c83bb9400196e0f71',
              'backend/tests/build_isolated_test.py': '1470521334b103149176861faa92dd4538189fd4795ea96cd59c0204ecb3a298',
          }
          for path, digest in expected.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual == digest, f'Source mismatch: {path}'
          print('Exact original RC8 migration and generator verified')
          PY
      - name: Install PostgreSQL client 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          psql --version
      - name: Generate and verify rollback-only acceptance SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile backend/tests/build_isolated_test.py
          python3 backend/tests/build_isolated_test.py | tee /tmp/rc8-generator.log
          echo 'ddca1e0321c05435db38a3af51608a8320b19fe762ef558622cb10dfc0df77ad  backend/tests/isolated_acceptance.sql' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          text = Path('backend/tests/isolated_acceptance.sql').read_text()
          assert text.lstrip().startswith('BEGIN;')
          assert text.rstrip().endswith('ROLLBACK;')
          assert 'CREATE SCHEMA rc8_auth_test;' in text
          assert 'CREATE SCHEMA rc8_public_test;' in text
          assert 'CREATE SCHEMA IF NOT EXISTS rc8_guard_test;' in text
          assert 'CREATE SCHEMA IF NOT EXISTS creator_guard_v183;' not in text
          assert 'DELETE FROM public.creator_backups' not in text
          assert 'DELETE FROM auth.users' not in text
          print('Isolated SQL scope and rollback boundary verified')
          PY
      - name: Execute synthetic PostgreSQL acceptance
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/isolated_acceptance.sql | tee /tmp/rc8-postgres.log
          grep -q '"synthetic_tests": "passed"' /tmp/rc8-postgres.log
      - name: Confirm rollback and clean database
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -At <<'SQL' | tee /tmp/rc8-rollback.log
          SELECT CASE WHEN EXISTS (
            SELECT 1 FROM pg_namespace WHERE nspname IN ('rc8_auth_test','rc8_public_test','rc8_guard_test')
          ) THEN 'FAIL: synthetic schemas survived' ELSE 'PASS: synthetic schemas rolled back' END;
          SELECT CASE WHEN EXISTS (
            SELECT 1 FROM pg_roles WHERE rolname IN ('anon','authenticated')
          ) THEN 'FAIL: synthetic roles survived' ELSE 'PASS: synthetic roles rolled back' END;
          SQL
          ! grep -q 'FAIL:' /tmp/rc8-rollback.log
      - name: Record verified backend evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/rc8-evidence
          printf '%s\n' "head=$GITHUB_SHA" "base=7e6913321726f2221054cd03b3e4df2483e4a7cb" "deployment=none" "production_credentials=none" > /tmp/rc8-evidence/manifest.txt
          cp /tmp/rc8-generator.log /tmp/rc8-postgres.log /tmp/rc8-rollback.log /tmp/rc8-evidence/ 2>/dev/null || true
          sha256sum backend/migrations/20260909000000_creator_deletion_barrier.sql backend/tests/build_isolated_test.py > /tmp/rc8-evidence/source-sha256.txt
      - name: Upload backend verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-rc8-backend-verification
          path: /tmp/rc8-evidence/
          if-no-files-found: error
