name: Piano Studio Alpha 0.3R Redesign APK

on:
  push:
    branches:
      - "ci/piano-studio-alpha-03r-20260906"
    paths:
      - "piano-ci/**"
      - ".github/workflows/piano-alpha-03r.yml"
  workflow_dispatch:

concurrency:
  group: piano-alpha-03r-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 native toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build and test Alpha 0.3R
        working-directory: piano-ci
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Verify redesign APK
        shell: bash
        run: |
          set -euo pipefail
          apk="piano-ci/app/build/outputs/apk/debug/app-debug.apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          nm="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -s "$apk"
          "$aapt" dump badging "$apk" | grep -q "versionCode='6'"
          "$aapt" dump badging "$apk" | grep -q "versionName='0.3.1-alpha06-redesign'"
          "$aapt" dump badging "$apk" | grep -q "launchable-activity: name='com.pianostudio.alpha.StudioHomeActivity'"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libpianostudio_audio.so"
          unzip -l "$apk" | grep -q "lib/x86_64/libpianostudio_audio.so"
          mkdir -p /tmp/piano03r/arm64 /tmp/piano03r/x86 piano-ci/dist
          unzip -j "$apk" "lib/arm64-v8a/libpianostudio_audio.so" -d /tmp/piano03r/arm64
          unzip -j "$apk" "lib/x86_64/libpianostudio_audio.so" -d /tmp/piano03r/x86
          "$nm" -D /tmp/piano03r/arm64/libpianostudio_audio.so | grep -q "Java_com_pianostudio_alpha_StudioLessonAudioEngine_nativeStart"
          "$nm" -D /tmp/piano03r/x86/libpianostudio_audio.so | grep -q "Java_com_pianostudio_alpha_StudioLessonAudioEngine_nativeStart"
          "$nm" -D /tmp/piano03r/arm64/libpianostudio_audio.so | grep -q "Java_com_pianostudio_alpha_PracticeAudioEngine_nativeStart"
          cp "$apk" piano-ci/dist/PianoStudio-alpha-0.3R-debug.apk
          sha256sum piano-ci/dist/PianoStudio-alpha-0.3R-debug.apk > piano-ci/dist/PianoStudio-alpha-0.3R-debug.apk.sha256

      - name: Upload Alpha 0.3R APK
        uses: actions/upload-artifact@v4
        with:
          name: PianoStudio-alpha-0.3R
          path: |
            piano-ci/dist/PianoStudio-alpha-0.3R-debug.apk
            piano-ci/dist/PianoStudio-alpha-0.3R-debug.apk.sha256
