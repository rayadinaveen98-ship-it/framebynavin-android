name: Build FrameByNavin v1.8 Foundation Alpha7

on:
  workflow_dispatch:
  push:
    branches:
      - foundation/v1.8-cleanup
    paths:
      - "app/**"
      - "dev-signing/framebynavin-public-debug.jks"
      - "tools/v175_integrate.py"
      - "tools/v175_brand_ident_rc4.py"
      - "tools/v175_public_prepare.py"
      - "tools/v175_copy_polish.py"
      - "tools/v175_copy_polish_followup.py"
      - "tools/v175_youtube_signing_fix.py"
      - "tools/v18_foundation_cleanup.py"
      - "tools/v18_foundation_alpha2.py"
      - "tools/v18_accessibility_alpha3.py"
      - "tools/v18_architecture_alpha4.py"
      - "tools/v18_architecture_alpha5.py"
      - "tools/v18_interaction_tests_alpha6.py"
      - "tools/v18_credential_manager_alpha7.py"
      - ".github/workflows/v18-foundation-build.yml"
      - "*.gradle.kts"
      - "gradle.properties"

concurrency:
  group: framebynavin-v18-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply v1.7.5 integration
        run: python3 tools/v175_integrate.py

      - name: Apply locked FrameByNavin ident
        run: python3 tools/v175_brand_ident_rc4.py

      - name: Apply public-safe preparation
        run: python3 tools/v175_public_prepare.py

      - name: Apply UX copy polish
        run: python3 tools/v175_copy_polish.py

      - name: Finish plain-language pass
        run: python3 tools/v175_copy_polish_followup.py

      - name: Keep prototype update signing
        run: python3 tools/v175_youtube_signing_fix.py

      - name: Apply v1.8 foundation cleanup
        run: python3 tools/v18_foundation_cleanup.py

      - name: Apply alpha2 foundation version
        run: python3 tools/v18_foundation_alpha2.py

      - name: Apply alpha3 accessibility pass
        run: python3 tools/v18_accessibility_alpha3.py

      - name: Apply alpha4 architecture split
        run: python3 tools/v18_architecture_alpha4.py

      - name: Apply alpha5 Today split
        run: python3 tools/v18_architecture_alpha5.py

      - name: Apply alpha6 interaction tests
        run: python3 tools/v18_interaction_tests_alpha6.py

      - name: Apply alpha7 Credential Manager migration
        run: python3 tools/v18_credential_manager_alpha7.py

      - name: Foundation gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 47' app/build.gradle.kts
          grep -q 'versionName = "1.8.0-foundation-alpha7"' app/build.gradle.kts
          grep -q 'prototypeStable' app/build.gradle.kts
          grep -q 'black -> light -> mark -> name -> app' app/src/main/java/com/framebynavin/app/ui/V174CinematicWelcome.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V18CoreScreens.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          test -s app/src/androidTest/java/com/framebynavin/app/ui/V18CoreInteractionUiTest.kt

          grep -q 'internal fun PPlanScreen' app/src/main/java/com/framebynavin/app/ui/V18CoreScreens.kt
          grep -q 'internal fun PStudioScreen' app/src/main/java/com/framebynavin/app/ui/V18CoreScreens.kt
          grep -q 'internal fun PInsightsScreen' app/src/main/java/com/framebynavin/app/ui/V18CoreScreens.kt
          grep -q 'internal fun PTodayScreen' app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          ! grep -q 'fun PPlanScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -q 'fun PStudioScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -q 'fun PInsightsScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -q 'fun PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          test "$(wc -l < app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt)" -le 1120
          test "$(grep -c '^    @Test' app/src/androidTest/java/com/framebynavin/app/ui/V18CoreInteractionUiTest.kt)" -eq 8

          grep -q 'androidx.credentials:credentials:1.6.0' app/build.gradle.kts
          grep -q 'androidx.credentials:credentials-play-services-auth:1.6.0' app/build.gradle.kts
          grep -q 'com.google.android.libraries.identity.googleid:googleid:1.2.0' app/build.gradle.kts
          grep -q 'CredentialManager.create' app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          grep -q 'GetSignInWithGoogleOption' app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          grep -q 'GoogleIdTokenCredential.createFrom' app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          grep -q 'clearCredentialState' app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          ! grep -q 'GoogleSignInOptions' app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          ! grep -q 'GoogleSignIn.getClient' app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          ! grep -q 'rememberLauncherForActivityResult' app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt

          ! grep -R -F 'Best Pawan Kalyan interval blocks' app/src/main/java/com/framebynavin/app/ui
          ! grep -R -F 'Search idea, movie, person, note' app/src/main/java/com/framebynavin/app/ui
          ! grep -R -F 'Movie / person / topic' app/src/main/java/com/framebynavin/app/ui
          ! grep -F 'WEEKLY ENGINE' app/src/main/java/com/framebynavin/app/ui/V08WeeklyScheduleUi.kt
          ! grep -F 'RESET TO FRAMEBYNAVIN DEFAULT WEEK' app/src/main/java/com/framebynavin/app/ui/V08WeeklyScheduleUi.kt
          ! grep -F 'Spirit trailer' app/src/main/java/com/framebynavin/app/ui/V09ReleaseDayUi.kt
          ! grep -F 'temporary local snapshot' app/src/main/java/com/framebynavin/app/ui/BackupActivity.kt
          ! grep -F 'Creator OS data' app/src/main/java/com/framebynavin/app/ui/BackupActivity.kt
          ! grep -F 'raw.isNotBlank() -> raw' app/src/main/java/com/framebynavin/app/ui/V11YouTubeInsights.kt

          for f in \
            FrameByNavinApp.kt \
            FrameByNavinV031App.kt \
            FrameByNavinV03App.kt \
            FrameByNavinV04App.kt \
            FrameByNavinV05App.kt \
            FrameByNavinV061App.kt \
            FrameByNavinV06App.kt \
            FrameByNavinV07App.kt \
            FrameByNavinV08App.kt \
            FrameByNavinV09App.kt \
            FrameByNavinV10App.kt \
            FrameByNavinV101App.kt \
            V07ReminderUi.kt \
            V07StudioScreen.kt \
            V101WeeklyPlanUi.kt; do
            test ! -e "app/src/main/java/com/framebynavin/app/ui/$f"
          done
          echo "v1.8 foundation alpha7 gate passed"

      - name: Package post-integration source for audit
        shell: bash
        run: |
          set -euo pipefail
          tar -czf FrameByNavin-v1.8.0-foundation-alpha7-audit-source.tar.gz \
            app/src/main \
            app/src/test \
            app/src/androidTest \
            app/build.gradle.kts \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties

      - name: Upload audit source
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.0-foundation-alpha7-audit-source
          path: FrameByNavin-v1.8.0-foundation-alpha7-audit-source.tar.gz

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run interaction tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.0-foundation-alpha7
          path: app/build/outputs/apk/debug/app-debug.apk
