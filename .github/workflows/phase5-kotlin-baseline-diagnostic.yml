name: Phase5 Kotlin compile baseline diagnosis

on:
  push:
    branches:
      - diagnostic/backlot-phase5-baseline-kotlin-20261110

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile unchanged Phase5 baseline
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=25s 730s \
            gradle :app:compilePersonalStableKotlin --no-daemon --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=daemon \
            "-Pkotlin.daemon.jvmargs=-Xmx9g -XX:+UseG1GC" \
            "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m" \
            --console=plain --stacktrace 2>&1 | tee phase5-compile.log
      - name: Upload baseline compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase5-Baseline-Compile-Diagnostics
          path: phase5-compile.log
          if-no-files-found: ignore
          retention-days: 3
