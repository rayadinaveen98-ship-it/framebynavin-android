name: V137 Backlot Visual Personalization

on:
  push:
    branches: ["feature/v137-visual-personalization"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v137 branch
        uses: actions/checkout@v4
        with:
          ref: feature/v137-visual-personalization
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Verify release contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 137' app/build.gradle.kts
          grep -q '2.0.0-rc10-visual-personalization' app/build.gradle.kts
          test -f app/src/main/java/com/framebynavin/app/ui/V137CharacterSystem.kt
          test -f app/src/main/java/com/framebynavin/app/ui/V137ThemeSystem.kt
          test -f app/src/main/java/com/framebynavin/app/ui/V137GuideSpotlight.kt
      - name: User-facing brand audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_v137_visible_brand.py
      - name: Unit tests, Kotlin compile and APK
        run: gradle :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Backlot-v137-VisualPersonalization.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-v137-visual-personalization
          path: Backlot-v137-VisualPersonalization.apk
          if-no-files-found: error
          retention-days: 90
