name: Backlot Package J — Device Reset Non-Destructive Emulator Acceptance

on:
  push:
    branches:
      - feature/backlot-j-device-reset-android-acceptance-20261113
    paths:
      - 'app/**'
      - '.github/workflows/backlot-package-j-reset-android-acceptance.yml'
      - '.github/scripts/backlot-j-reset-android15.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-j-reset-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-debug-and-tests:
    name: Compile matching debug APKs without erasing user data
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assert non-destructive acceptance suite exists
        run: |
          set -euo pipefail
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V383DeviceResetSafetyAndroidTest.kt
          grep -Fq 'HardeningTestEnvironment.requireCiEmulator()' app/src/androidTest/java/com/framebynavin/app/ui/V383DeviceResetSafetyAndroidTest.kt
          grep -Fq 'clearApplicationUserData()' app/src/main/java/com/framebynavin/app/ui/FreshStartActivity.kt
          grep -Fq 'versionCode = 336' app/build.gradle.kts
      - name: Build debug and matching instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/package-j-reset
          timeout --signal=TERM --kill-after=20s 5300s \
            gradle :app:assembleDebug :app:assembleDebugAndroidTest \
              --no-daemon --no-parallel --max-workers=1 \
              -Pkotlin.compiler.execution.strategy=in-process \
              '-Dorg.gradle.jvmargs=-Xmx9g -XX:MaxMetaspaceSize=1400m -Dfile.encoding=UTF-8' \
              --console=plain --stacktrace 2>&1 | tee output/package-j-reset/BUILD.log
          cp app/build/outputs/apk/debug/app-debug.apk output/package-j-reset/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/package-j-reset/app-debug-androidTest.apk
          (cd output/package-j-reset && sha256sum app-debug*.apk > SHA256SUMS.txt)
      - name: Upload matching APKs for CI emulator (NOT owner release)
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Package-J-Reset-Emulator-Test-APKs
          path: |
            output/package-j-reset/app-debug.apk
            output/package-j-reset/app-debug-androidTest.apk
            output/package-j-reset/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload compile diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Package-J-Reset-Compile-Log
          path: output/package-j-reset/BUILD.log
          if-no-files-found: warn
          retention-days: 7

  android-emulator:
    needs: compile-debug-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-Package-J-Reset-Emulator-Test-APKs
          path: output/package-j-reset
      - name: Verify exact test APK bytes
        run: |
          set -euo pipefail
          (cd output/package-j-reset && sha256sum -c SHA256SUMS.txt)
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute non-destructive device reset acceptance on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-j-reset-android15.sh
      - name: Save real emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Package-J-Reset-Android15-Evidence-NOT-RELEASE
          path: output/package-j-reset/device-results/
          if-no-files-found: warn
          retention-days: 21
