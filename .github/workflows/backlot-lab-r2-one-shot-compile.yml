name: Backlot Lab R2 - Isolated One-Shot Compile Gate

# QA branch ONLY. The stable and integration branches are never targeted.
# Trigger is restricted to one owner-approved request marker, not every edit.
on:
  pull_request:
    branches:
      - qa/backlot-lab-r2-compile-base-20261123
    paths:
      - docs/qa/BACKLOT_LAB_R2_COMPILE_REQUEST_20261123.md

permissions:
  contents: read

concurrency:
  group: backlot-r2-compile-once-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: 01 - Frozen R2 app tree and Lab source contracts (no Gradle)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Refuse any modified application source
        shell: bash
        run: |
          set -euo pipefail
          R2=1577669bc328153a365661a7f3d36fb1558e891c
          git cat-file -e "$R2^{commit}"
          git merge-base --is-ancestor "$R2" HEAD
          # Exactly two diagnosed compiler repairs; no other R2 application changes.
          expected=$(printf '%s\\n' 'app/src/main/java/com/framebynavin/app/reminders/V407ReminderAlertReadiness.kt' 'app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt' | sort)
          changed=$(git diff --name-only "$R2" HEAD -- app | sort)
          if test "$changed" != "$expected"; then
            printf 'STOP: unexpected application diff.\\nExpected:\\n%s\\nActual:\\n%s\\n' "$expected" "$changed" >&2
            exit 1
          fi
          test "$(git rev-parse "$R2:app/src/main/java/com/framebynavin/app/cloud")" = "$(git rev-parse HEAD:app/src/main/java/com/framebynavin/app/cloud")"
          grep -Fq 'testTag("v404-settings-search")' app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt
          ! grep -Fq 'V336DirectorPalette' app/src/main/java/com/framebynavin/app/reminders/V407ReminderAlertReadiness.kt
          echo "PASS: frozen R2 baseline plus exactly two isolated Kotlin repair paths"
      - name: Run R2 source-contract checks
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/backlot_lab_p10q_recovery_contract_gate.sh
          grep -Fq 'applicationId = if (backlotLabMode) "com.framebynavin.app.lab"' app/build.gradle.kts
          grep -Fq 'buildConfigField("boolean", "BACKLOT_LAB"' app/build.gradle.kts
          echo "PASS: Lab-only config source fence; NO build, APK or backend access"

  lab-kotlin-compile:
    name: 02 - Targeted Backlot Lab debug Kotlin compile (no APK)
    needs: [source-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile only Lab Kotlin, serial workers, bounded memory
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/backlot-r2/compile
          git rev-parse HEAD > output/backlot-r2/compile/source-sha.txt
          timeout --signal=TERM --kill-after=20s 5400s \
            gradle :app:compileDebugKotlin -PbacklotLab=true \
              --no-daemon --max-workers=1 --console=plain \
              '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
              '-Pkotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC' \
              '-Porg.gradle.parallel=false' \
              2>&1 | tee output/backlot-r2/compile/targeted-kotlin.log
      - name: Preserve targeted failure or pass evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Lab-R2-Targeted-Kotlin-Compile-Evidence
          path: output/backlot-r2/compile/
          if-no-files-found: warn
          retention-days: 14
