name: Backlot Trust T1 - Phase-End Integration Gate

# Intentionally NOT triggered by every feature-branch push.
# Create a QA gate branch only after T1 features have been implemented.
on:
  push:
    branches:
      - 'qa/backlot-trust-t1-stage-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-trust-t1-phase-gate
  cancel-in-progress: true

jobs:
  verify-trust-t1:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify immutable preview app identity and read-only inventory boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.framebynavin.app"' app/build.gradle.kts
          test "$(git rev-parse HEAD:app/src/main/java/com/framebynavin/app/personal/PersonalRebuildSchedulePack.kt)" = "98a8533a0ff32d5b6664e0e608fe97f5cdeb268e"
          test -f app/src/main/java/com/framebynavin/app/cloud/TrustBackupInventory.kt
          test -f app/src/main/java/com/framebynavin/app/cloud/TrustLocalBackupInventoryReader.kt
          grep -Fq 'canUploadAsUniversalBackup' app/src/main/java/com/framebynavin/app/cloud/TrustBackupInventory.kt
          test -f app/src/androidTest/java/com/framebynavin/app/cloud/TrustT1BInventoryDeviceTest.kt
      - name: Full JVM regression and Android instrumented compile (once per T1 gate)
        shell: bash
        run: |
          set -euo pipefail
          timeout 85m gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest \
            --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android 15 T1 read-only and encrypted archive verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/qa/backlot_trust_t1_stage_android15.sh
      - name: Upload test evidence only - never owner APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Trust-T1-Stage-Gate-Evidence-NOT-RELEASE
          path: |
            output/trust-t1-stage/
            app/build/test-results/testDebugUnitTest/
          retention-days: 21
          if-no-files-found: warn
