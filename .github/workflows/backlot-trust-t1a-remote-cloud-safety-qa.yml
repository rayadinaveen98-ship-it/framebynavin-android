name: Backlot Trust T1A - Legacy Personal Cloud Remote Safety

on:
  push:
    branches:
      - feature/backlot-trust-t1a-cloud-remote-safety-20261109
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-trust-t1a-remote-cloud-safety
  cancel-in-progress: true

jobs:
  verified-remote-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Protect owner app identity, schedule and phase separation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 324' app/build.gradle.kts
          grep -Fq 'applicationId = "com.framebynavin.app"' app/build.gradle.kts
          test "$(git rev-parse HEAD:app/src/main/java/com/framebynavin/app/personal/PersonalRebuildSchedulePack.kt)" = "98a8533a0ff32d5b6664e0e608fe97f5cdeb268e"
          test -f app/src/main/java/com/framebynavin/app/cloud/PersonalCloudPortableSnapshot.kt
          test -f app/src/main/java/com/framebynavin/app/cloud/PersonalCloudLegacyRemoteGate.kt
          grep -Fq 'PersonalCloudLegacyRemoteGate.requireLegacyOnly' app/src/main/java/com/framebynavin/app/cloud/PersonalCloudSyncManager.kt
          grep -Fq 'requireChallengeCoverage()' app/src/main/java/com/framebynavin/app/cloud/PersonalCloudSyncManager.kt
          test -f app/src/androidTest/java/com/framebynavin/app/cloud/TrustT1ALegacyCloudSafetyDeviceTest.kt

      - name: Compile debug Android tests and run complete unit regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 85m gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest \
            --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace

      - name: Enable Android KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 verify legacy remote guard does not mutate Personal stores
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            mkdir -p output/trust-t1a
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e hardeningTestEnvironment ci-emulator -e class com.framebynavin.app.cloud.TrustT1ALegacyCloudSafetyDeviceTest com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner > output/trust-t1a/GUARD-READ-ONLY.txt 2>&1 || { cat output/trust-t1a/GUARD-READ-ONLY.txt; exit 1; }
            cat output/trust-t1a/GUARD-READ-ONLY.txt
            grep -Fq 'OK (1 test)' output/trust-t1a/GUARD-READ-ONLY.txt
            adb shell am instrument -w -r -e hardeningTestEnvironment ci-emulator -e class com.framebynavin.app.personal.Phase1HabitArchiveCoverageGuardDeviceTest com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner > output/trust-t1a/ENCRYPTED-ARCHIVE-RECEIPTS.txt 2>&1 || { cat output/trust-t1a/ENCRYPTED-ARCHIVE-RECEIPTS.txt; exit 1; }
            cat output/trust-t1a/ENCRYPTED-ARCHIVE-RECEIPTS.txt
            grep -Fq 'OK (1 test)' output/trust-t1a/ENCRYPTED-ARCHIVE-RECEIPTS.txt

      - name: Upload QA results only — no owner APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Trust-T1A-Remote-Safety-NOT-RELEASE
          path: |
            output/trust-t1a/
            app/build/test-results/testDebugUnitTest/
          retention-days: 21
          if-no-files-found: warn
