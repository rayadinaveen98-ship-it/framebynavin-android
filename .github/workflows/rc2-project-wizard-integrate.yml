name: RC2 Project Wizard Validate

on:
  push:
    branches:
      - feature/v2.0-rc2-insights-v2
    paths:
      - .github/workflows/rc2-project-wizard-integrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply project wizard
        run: |
          cp .github/rc2/V20NewProjectWizard.kt.txt app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt
          python3 .github/rc2/apply_project_wizard.py

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0-rc2-project-wizard
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit validated app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(rc2): add personalized sequential project wizard'
          git push origin HEAD:feature/v2.0-rc2-insights-v2
