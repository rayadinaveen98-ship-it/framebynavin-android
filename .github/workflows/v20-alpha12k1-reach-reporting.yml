name: v2.0 Alpha 1.2K.1 Reach Reporting

on:
  push:
    branches:
      - "develop/v2.0-alpha1.2k.1-reach-reporting"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha12k1-reach-reporting
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v98.1 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v20_alpha12k1_reach_reporting.py
          git diff --check
          git status --short
          git config user.name "FrameByNavin CI"
          git config user.email "actions@users.noreply.github.com"
          git add app
          git commit -m "feat(v2.0): import official YouTube reach reports"
          git rev-parse HEAD | tee /tmp/validated_commit

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v98.1 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 99' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2k.1-reach-reporting"' app/build.gradle.kts
          grep -q 'channel_reach_basic_a1' app/src/main/java/com/framebynavin/app/youtube/YouTubeReachReporting.kt
          grep -q 'video_thumbnail_impressions' app/src/main/java/com/framebynavin/app/youtube/YouTubeReachReporting.kt
          grep -q 'video_thumbnail_impressions_ctr' app/src/main/java/com/framebynavin/app/youtube/YouTubeReachReporting.kt
          grep -q 'Reach reporting is scheduled' app/src/main/java/com/framebynavin/app/youtube/YouTubeReachReporting.kt
          grep -q 'YouTubeDatasetState.PENDING' app/src/main/java/com/framebynavin/app/ui/V20InsightsFoundationUi.kt
          grep -q 'YouTubeReachReportingClient' app/src/main/java/com/framebynavin/app/ui/V11YouTubeInsights.kt
          grep -q 'normal Insights data is unaffected' app/src/main/java/com/framebynavin/app/youtube/YouTubeReachReporting.kt
          grep -q 'PTab.TODAY -> PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.2k.1-reach-reporting.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.2k.1-reach-reporting.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.2k.1-reach-reporting"
            echo "versionCode=99"
            echo "commit=$(cat /tmp/validated_commit)"
            echo "reachReportType=channel_reach_basic_a1"
            echo "thumbnailImpressions=true"
            echo "thumbnailCtr=true"
            echo "asyncReachPendingState=true"
            echo "backfillReplacementByCreateTime=true"
            echo "reportHeaderDrivenImport=true"
            echo "reportingApiUsesExistingAnalyticsScope=true"
            echo "reportingFailureDoesNotBreakNormalInsights=true"
            echo "acceptedCinematicHomePreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2k.1-reach-reporting-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.2k.1-reach-reporting.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2k.1-reach-reporting-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:staging/v2.0-alpha1.2k.1-reach-reporting-validated
