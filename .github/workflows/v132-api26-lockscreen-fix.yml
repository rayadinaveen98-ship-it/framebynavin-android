name: Apply v1.3.2 API26 Lock Screen Fix

on:
  workflow_dispatch:
  push:
    branches: [ "repair/v1.3.2-release-blockers" ]
    paths:
      - "tools/v132_api26_lockscreen_fix.py"
      - ".github/workflows/v132-api26-lockscreen-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/v1.3.2-release-blockers
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply API 26 compatibility fix
        run: python tools/v132_api26_lockscreen_fix.py

      - name: Commit compatibility repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/reminders/AlarmActivity.kt app/src/main/java/com/framebynavin/app/reminders/VoiceReminderActivity.kt
          if git diff --cached --quiet; then
            echo "No compatibility patch needed"
          else
            git commit -m "fix: support lock-screen reminder UI on Android 8.0"
            git push origin HEAD:repair/v1.3.2-release-blockers
          fi
