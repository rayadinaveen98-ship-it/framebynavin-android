name: Repair v1.0.2.1 Studio integration

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/v1021-studio-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore helpers removed by the broad Studio patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = "app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt"
          green = subprocess.check_output(["git", "show", "56d2d3949a90e1b33a8a4c4c0b0beff3ca5b0f5e:" + path], text=True)
          current = Path(path).read_text()
          studio = green.find("@Composable\nprivate fun PStudioProject(")
          first_after_studio = green.find("\n@Composable\n", studio + 20)
          stage_rail = green.find("@Composable\nprivate fun PStageRail(", first_after_studio)
          current_stage_rail = current.find("@Composable\nprivate fun PStageRail(")
          if min(studio, first_after_studio, stage_rail, current_stage_rail) < 0:
              raise SystemExit("Studio repair markers not found")
          missing_helpers = green[first_after_studio + 1:stage_rail]
          if "private fun PInsightsScreen(" not in missing_helpers:
              raise SystemExit("Expected helper block was not found in last-green shell")
          if "private fun PInsightsScreen(" in current:
              raise SystemExit("Helpers already restored; refusing duplicate insertion")
          repaired = current[:current_stage_rail] + missing_helpers + current[current_stage_rail:]
          Path(path).write_text(repaired)

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          git commit -m "fix: restore helpers around Studio hotfix"
          git push
