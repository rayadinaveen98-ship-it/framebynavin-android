name: Backlot V329 - Five Reminder Motion Styles QA

on:
  push:
    branches:
      - feature/backlot-v329-custom-reminder-motion-five-styles-20261110
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cancel-redundant-v329:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel explicitly superseded V329 runs
        uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [42876203003, 42876094511]) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
              if (run.head_branch !== 'feature/backlot-v329-custom-reminder-motion-five-styles-20261110' ||
                  run.path !== '.github/workflows/backlot-v329-motion-qa.yml') {
                throw new Error(`Refusing to cancel unexpected run ${run_id}`);
              }
              if (run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id });
                core.info(`Cancellation requested for ${run_id}`);
              } else {
                core.info(`${run_id} already completed: ${run.conclusion}`);
              }
            }
  compile-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify visual presentation policy
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --tests 'com.framebynavin.app.reminders.V329ReminderVisualPolicyTest' --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Compile owner-upgrade compatible V329 preview
        run: |
          set -euo pipefail
          gradle :app:assemblePersonalStable --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Stage signed owner-preview artifact and checksum
        run: |
          set -euo pipefail
          mkdir -p output/v329
          APK=app/build/outputs/apk/personalStable/app-personalStable.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee output/v329/SIGNATURE.txt
          EXPECTED=$(keytool -exportcert -keystore dev-signing/framebynavin-public-debug.jks -storepass framebynavin-dev -alias framebynavin-dev | sha256sum | cut -d ' ' -f 1)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' output/v329/SIGNATURE.txt)
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' "$GITHUB_SHA" > output/v329/COMMIT.txt
          cp app/build/outputs/apk/personalStable/app-personalStable.apk output/v329/Backlot-V329-Motion-Owner-Preview.apk
          sha256sum output/v329/Backlot-V329-Motion-Owner-Preview.apk > output/v329/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V329-Five-Reminder-Motion-Owner-Preview
          path: output/v329/
          retention-days: 30
          if-no-files-found: error
