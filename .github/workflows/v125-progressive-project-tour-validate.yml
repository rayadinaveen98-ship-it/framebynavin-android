name: V125 Progressive Project Tour Validate

on:
  push:
    branches:
      - "fix/v124-progressive-project-tour"
    paths:
      - ".github/workflows/v125-progressive-project-tour-validate.yml"
      - "scripts/apply_v125_project_tour_integration.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v125-progressive-project-tour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v124-progressive-project-tour
          fetch-depth: 0

      - name: Apply deterministic shell integration
        run: python3 scripts/apply_v125_project_tour_integration.py

      - name: Verify UX contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 125' app/build.gradle.kts
          grep -q '2.0.0-rc2-progressive-project-tour-fix' app/build.gradle.kts
          grep -q 'Build it one decision at a time' app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt
          grep -q 'Everything stays on this page' app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt
          grep -q 'CREATE & OPEN WORKSPACE' app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt
          grep -q 'NOT NOW · NEXT' app/src/main/java/com/framebynavin/app/ui/V20GuidedFirstRun.kt
          grep -q 'color = Color(0xD018181B)' app/src/main/java/com/framebynavin/app/ui/V20GuidedFirstRun.kt
          grep -q 'tab = PTab.INSIGHTS' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          if grep -q 'var step by rememberSaveable' app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt; then
            echo 'Old seven-screen pager state is still present' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests, Kotlin compile and APK
        run: gradle :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleDebug --stacktrace

      - name: Commit validated shell integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FrameByNavin CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix(v125): integrate progressive project tour navigation"
            git push origin HEAD:fix/v124-progressive-project-tour
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v125-progressive-project-tour-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
