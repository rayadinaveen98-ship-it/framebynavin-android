name: Insights V2 Phase 3 Apply

on:
  push:
    branches:
      - feature/v145-insights-v2-major
    paths:
      - .github/workflows/insights-v2-phase3-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v145-insights-v2-major
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/scripts/apply_insights_v2_phase3.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/V172InsightsUi.kt app/src/main/java/com/framebynavin/app/ui/V11YouTubeInsights.kt app/src/main/java/com/framebynavin/app/ui/V20InsightsFoundationUi.kt app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          git diff --cached --check
          git commit -m "feat(insights): make next moves actionable and simplify video detail"
          git push origin HEAD:feature/v145-insights-v2-major
