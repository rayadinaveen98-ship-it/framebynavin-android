name: v2.0 Alpha 1.3 Opportunity Engine

on:
  push:
    branches:
      - "develop/v2.0-alpha1.3-opportunity-engine"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha13-opportunity-engine
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v106 Opportunity Engine invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 106' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.3-opportunity-engine"' app/build.gradle.kts
          grep -q 'object CreatorOpportunityEngine' app/src/main/java/com/framebynavin/app/data/CreatorOpportunityEngine.kt
          grep -q 'AI never becomes a' app/src/main/java/com/framebynavin/app/data/CreatorOpportunityEngine.kt
          grep -q 'OPPORTUNITY ENGINE' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'V20OpportunityEngineInsightsCard(snapshot)' app/src/main/java/com/framebynavin/app/ui/V20InsightsFoundationUi.kt
          grep -q 'CreatorPriorityEngine.rankActive' app/src/main/java/com/framebynavin/app/data/CreatorOpportunityEngine.kt
          grep -q 'YouTubeOpportunityEngine.build' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'CreatorAiReportStore' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'implementation("com.google.firebase:firebase-ai")' app/build.gradle.kts
          grep -q 'DebugAppCheckProviderFactory' app/src/debug/java/com/framebynavin/app/CreatorAppCheck.kt
          grep -q 'PlayIntegrityAppCheckProviderFactory' app/src/release/java/com/framebynavin/app/CreatorAppCheck.kt
          grep -q 'ANALYZE VIDEO WITH GEMINI' app/src/main/java/com/framebynavin/app/ui/V20GeminiIntelligenceUi.kt
          grep -q 'ProjectPulseEngine::repairFalseSurfaceCompletion' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          if grep -R --line-number 'AIzaSy' app/src/main app/src/debug app/src/release; then
            echo 'Firebase API keys must not be copied into Kotlin/Java source.' >&2
            exit 1
          fi
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.3-opportunity-engine.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.3-opportunity-engine.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.3-opportunity-engine"
            echo "versionCode=106"
            echo "commit=$(git rev-parse HEAD)"
            echo "opportunityEngine=true"
            echo "localEvidence=true"
            echo "youtubeEvidence=true"
            echo "optionalGeminiEvidence=true"
            echo "aiCanCreateOpportunityAlone=false"
            echo "insightsOpportunitySurface=true"
            echo "geminiVideoAutopsyPreserved=true"
            echo "appCheckDebugForDebug=true"
            echo "appCheckPlayIntegrityForRelease=true"
            echo "reminderCompletionSafetyPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.3-opportunity-engine-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.3-opportunity-engine.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.3-opportunity-engine-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.3-opportunity-engine-validated
