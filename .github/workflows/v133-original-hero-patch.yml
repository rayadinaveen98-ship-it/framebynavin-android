name: Apply Original Hero Patch

on:
  push:
    branches:
      - "repair/v1.3.2-release-blockers"
    paths:
      - ".github/workflows/v133-original-hero-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1.3.2-release-blockers
          fetch-depth: 0
      - name: Apply Netflix-style original hero UI patch
        run: python3 tools/v133_original_hero_patch.py
      - name: Commit hero UI patch
        shell: bash
        run: |
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/V131PolishUi.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat: refine home hero for original cinematic frames"
          git push origin HEAD:repair/v1.3.2-release-blockers
