name: Backlot Lab R2 Stabilization - S5 Focused Policy Unit Tests

# Explicit request only. Never runs automatically for source edits.
on:
  push:
    branches:
      - qa/backlot-lab-r2-stabilization-s5-source-20261124
    paths:
      - docs/qa/BACKLOT_LAB_R2_STABILIZATION_S5_UNIT_REQUEST_20261124.md

permissions:
  contents: read

concurrency:
  group: backlot-lab-r2-stabilization-s5-units
  cancel-in-progress: false

jobs:
  policy-fence:
    name: '01 - Exact source and focused unit test inventory'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check source unchanged since frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          FROZEN=b69df0db7f0b24ca9c4b504179693a628f22acf6
          git cat-file -e "$FROZEN^{commit}"
          test "$(git rev-parse "$FROZEN:app")" = "$(git rev-parse 'HEAD:app')"
          test -s app/src/test/java/com/framebynavin/app/reminders/P10ReminderIconStylePolicyTest.kt
          test -s app/src/test/java/com/framebynavin/app/reminders/P10CreatorLockScreenMediaPolicyTest.kt
          test -s app/src/test/java/com/framebynavin/app/reminders/ReminderExperienceMixPolicyTest.kt
          echo 'PASS: same tested frozen app tree, three founder-approved policy test classes'

  focused-unit-tests:
    name: '02 - Only three new reminder policy test classes'
    needs: [policy-fence]
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Focused policy tests; no full test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/backlot-s5/unit
          git rev-parse HEAD > output/backlot-s5/unit/qa-sha.txt
          timeout --signal=TERM --kill-after=20s 5400s \
            gradle :app:testDebugUnitTest -PbacklotLab=true \
              --tests com.framebynavin.app.reminders.P10ReminderIconStylePolicyTest \
              --tests com.framebynavin.app.reminders.P10CreatorLockScreenMediaPolicyTest \
              --tests com.framebynavin.app.reminders.ReminderExperienceMixPolicyTest \
              --no-daemon --max-workers=1 --console=plain \
              '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
              '-Pkotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC' \
              '-Porg.gradle.parallel=false' \
              2>&1 | tee output/backlot-s5/unit/focused-unit.log
      - name: Preserve pass or fail details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Lab-S5-Focused-Policy-Junit-Evidence
          path: |
            output/backlot-s5/unit/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
