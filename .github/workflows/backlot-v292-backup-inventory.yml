name: Backlot V292 - Read-only Backup Coverage Inventory

on:
  push:
    branches: [feature/backlot-v292-backup-coverage-inventory]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v292-backup-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile existing V291 app and V292 inventory tests
        run: |
          set -euo pipefail
          timeout 80m gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Verify five new truthful coverage unit tests plus V290 disclosure regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('app/build/test-results/testDebugUnitTest')
          for name,expected in [('V292BackupInventoryCopyTest',5),
                                ('V290CloudCoverageDisclosureTest',3)]:
              reports=list(root.glob('TEST-*'+name+'.xml'))
              assert len(reports)==1, f'{name}: missing or duplicate reports'
              xml=ET.parse(reports[0]).getroot()
              assert int(xml.get('tests',0))>=expected
              assert int(xml.get('failures',0))==0
              assert int(xml.get('errors',0))==0
          print('PASS: truthful cloud and unsynced local Spaces coverage tests')
          PY
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/app-debug-androidTest.apk
          (cd output && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V292-Backup-Inventory-Android-Test
          path: output/
          retention-days: 7
          if-no-files-found: error
  android-15-inventory:
    needs: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V292-Backup-Inventory-Android-Test
          path: output
      - name: Enable emulator KVM where available
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 - strictly read-only inventory and corruption handling
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v292-backup-inventory-android.sh
