name: Backlot Phase 1 - Signed Owner Upgrade Gate (not a Play release)
on:
  push:
    branches:
      - feature/backlot-phase1-final-integration-review
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  signed-owner-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build candidate with SAME known owner sideload signer
        run: |
          set -euo pipefail
          timeout 75m gradle :app:assemblePersonalStable :app:assemblePersonalStableAndroidTest -PbacklotSignedOwnerTest=true --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
          test -s app/build/outputs/apk/personalStable/app-personalStable.apk
          test -s app/build/outputs/apk/androidTest/personalStable/app-personalStable-androidTest.apk
      - name: Recover the verified installed Build 320 baseline
        uses: actions/download-artifact@v4
        with:
          run-id: 42345904442
          name: Backlot-PhaseB-Verified-PersonalStable-320
          github-token: ${{ github.token }}
          path: output/build320
      - name: Verify both signed APK identities and SHA
        run: |
          set -euo pipefail
          BASE=output/build320/Backlot-PhaseB-Personal-Stable-Candidate.apk
          NEXT=app/build/outputs/apk/personalStable/app-personalStable.apk
          test -s "$BASE" && test -s "$NEXT"
          echo 'c2045b573d17bad66f0c6f470af4dce4ced995bbe4b9a5a52de611090f522c55  output/build320/Backlot-PhaseB-Personal-Stable-Candidate.apk' | sha256sum --check --status
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$BASE" > output/build320-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$NEXT" > output/phase1-signature.txt
          grep -qi 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0' output/build320-signature.txt
          grep -qi 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0' output/phase1-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$BASE" | grep -q "name='com.framebynavin.app' versionCode='320'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$NEXT" | grep -q "name='com.framebynavin.app' versionCode='321'"
          echo 'PASS: matching package signer, verified Build 320, monotonic version 321' > output/UPGRADE-SIGNING-GATE.txt
      - name: Enable emulator hardware acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actually install Build 320 and UPDATE without uninstalling or clearing app data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            BASE=output/build320/Backlot-PhaseB-Personal-Stable-Candidate.apk
            NEXT=app/build/outputs/apk/personalStable/app-personalStable.apk
            TEST=app/build/outputs/apk/androidTest/personalStable/app-personalStable-androidTest.apk
            adb install -r "$BASE"
            adb install -r "$TEST"
            adb shell dumpsys package com.framebynavin.app | grep -q 'versionCode=320'
            adb shell am start -n com.framebynavin.app/.MainActivity
            sleep 8
            # Real on-disk synthetic app data is written while version 320 is installed.
            timeout 8m adb shell am instrument -w               -e class com.framebynavin.app.personal.Phase1Build320InPlaceUpgradeDeviceTest#seedBuild320LocalDataBeforeInstallUpgrade               -e hardeningTestEnvironment ci-emulator               com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner               > output/BUILD320-SENTINEL-WRITTEN.txt 2>&1
            cat output/BUILD320-SENTINEL-WRITTEN.txt
            grep -q 'OK (1 test)' output/BUILD320-SENTINEL-WRITTEN.txt
            adb shell am force-stop com.framebynavin.app
            # No uninstall or pm clear: the signed APK must replace 320 in-place.
            adb install -r "$NEXT"
            adb shell dumpsys package com.framebynavin.app | grep -q 'versionCode=321'
            # The same saved preference must survive the signed package update.
            timeout 8m adb shell am instrument -w               -e class com.framebynavin.app.personal.Phase1Build320InPlaceUpgradeDeviceTest#verifySameLocalDataAfterUpgradeTo321               -e hardeningTestEnvironment ci-emulator               com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner               > output/BUILD321-SENTINEL-SURVIVED.txt 2>&1
            cat output/BUILD321-SENTINEL-SURVIVED.txt
            grep -q 'OK (1 test)' output/BUILD321-SENTINEL-SURVIVED.txt
            adb shell am start -n com.framebynavin.app/.MainActivity
            sleep 8
            adb shell pidof com.framebynavin.app >/dev/null
            echo 'PASS: signed in-place Android 15 Build 320 -> 321, local sentinel survived and app launched' > output/IN-PLACE-INSTALL-GATE.txt
      - name: Save signed draft APK and upgrade evidence (not approved release)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Backlot-Phase1-Signed-Owner-321-UPGRADE-REVIEW-NOT-RELEASE
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/outputs/apk/personalStable/app-personalStable.apk
            output/UPGRADE-SIGNING-GATE.txt
            output/IN-PLACE-INSTALL-GATE.txt
            output/BUILD320-SENTINEL-WRITTEN.txt
            output/BUILD321-SENTINEL-SURVIVED.txt
            output/build320-signature.txt
            output/phase1-signature.txt
