name: Piano Studio Alpha 0.1B APK

on:
  push:
    branches:
      - "ci/piano-studio-alpha-01b-20260906"
    paths:
      - "piano-ci/**"
      - ".github/workflows/piano-alpha-01b.yml"
  workflow_dispatch:

concurrency:
  group: piano-alpha-01b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 37 and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        working-directory: piano-ci
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify native engine is packaged
        shell: bash
        run: |
          set -euo pipefail
          apk="piano-ci/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libpianostudio_audio.so"
          mkdir -p piano-ci/dist
          cp "$apk" piano-ci/dist/PianoStudio-alpha-0.1B-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PianoStudio-alpha-0.1B
          path: piano-ci/dist/PianoStudio-alpha-0.1B-debug.apk
