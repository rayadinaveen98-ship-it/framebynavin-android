name: Backlot Phase 1 - Single-activity real DataStore device QA
on:
  push:
    branches:
      - feature/backlot-phase1-habit-store-device-qa
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backlot-phase1-habit-store-device-qa
  cancel-in-progress: true
jobs:
  datastore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android app and dedicated instrumentation tests
        run: |
          set -euo pipefail
          timeout 75m gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable Android emulator KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 Pixel 6 owner-data isolation and DataStore test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/qa/backlot_phase1_habit_store_device_qa.sh
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backlot-Phase1-OneHabit-Real-DataStore-Android15-QA
          path: output/backlot-phase1-habit-store-device/
          retention-days: 30
          if-no-files-found: warn
