name: Backlot FC13 owner APK candidate

on:
  push:
    branches:
      - feature/backlot-fc13-feedback-completion
  pull_request:
    branches:
      - feature/backlot-phase5-calendar-reminders-weekly-automation-20261109

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed personalStable APK
        run: |
          set -o pipefail
          gradle :app:assemblePersonalStable --no-daemon --stacktrace 2>&1 | tee fc13-build.log
      - name: Prepare owner APK
        run: |
          set -euo pipefail
          mkdir -p staging
          APK=$(find app/build/outputs/apk/personalStable -name '*.apk' -type f | head -n 1)
          test -s "$APK"
          cp "$APK" staging/Backlot-FC13-Owner-Preview.apk
          sha256sum staging/Backlot-FC13-Owner-Preview.apk > staging/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-FC13-Owner-Preview
          path: staging/
          if-no-files-found: error
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-FC13-Diagnostics
          path: fc13-build.log
          if-no-files-found: ignore
