name: Wire FrameByNavin v1.7.5 Original Frames

on:
  push:
    branches:
      - "feature/v1.7.5-original-frames-splash"
    paths:
      - "tools/v175_integrate.py"
      - ".github/workflows/v175-apply.yml"

permissions:
  contents: write

concurrency:
  group: framebynavin-v175-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v1.7.5-original-frames-splash
          fetch-depth: 0

      - name: Apply v1.7.5 changes
        run: python tools/v175_integrate.py

      - name: Commit wired release
        run: |
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat(v1.7.5): original-quality Best Frames and cinematic launch polish"
          git push origin HEAD:feature/v1.7.5-original-frames-splash
