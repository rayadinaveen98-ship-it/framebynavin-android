name: Backlot V185 — Idea conversion preview
on:
  push:
    branches: [feature/backlot-v185-idea-conversion]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backlot-v185-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preserve existing source contracts
        run: |
          set -euo pipefail
          for version in $(seq 161 182); do
            script=$(find tools -maxdepth 1 -name "check_v${version}_*.sh" | head -n 1)
            test -n "$script"
            bash "$script"
          done
          grep -Fq 'versionCode = 185' app/build.gradle.kts
          grep -Fq 'versionName = "2.3.5-v185-idea-conversion-preview"' app/build.gradle.kts
      - name: Clean build, regressions, lint and instrumentation compilation
        run: gradle :app:clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePersonalStable --stacktrace
      - name: Upload compiled instrumentation APKs
        uses: actions/upload-artifact@v4
        with:
          name: V185-Instrumentation-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload candidate and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V185-Idea-Conversion-Candidate
          path: |
            app/build/outputs/apk/personalStable/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
  emulator:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: V185-Instrumentation-APKs
          path: instrumentation-apks
      - name: Execute precompiled Android 11 acceptance suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r instrumentation-apks/debug/app-debug.apk
            adb install -r instrumentation-apks/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            bash tools/run_v185_instrumentation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backlot-V185-Emulator-Results
          path: |
            v185-instrumentation.log
            v185-logcat.txt
            v185-emulator-screen.png
            v185-conversion-dialog.png
