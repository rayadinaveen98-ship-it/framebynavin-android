name: Apply v1.3.2 Reminder Fallback Repair

on:
  workflow_dispatch:
  push:
    branches: [ "repair/v1.3.2-release-blockers" ]
    paths:
      - "tools/v132_alarm_fallback_repair.py"
      - ".github/workflows/v132-alarm-fallback-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/v1.3.2-release-blockers
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reminder fallback repair
        run: python tools/v132_alarm_fallback_repair.py

      - name: Commit reminder fallback repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/reminders
          if git diff --cached --quiet; then
            echo "No reminder repair needed"
          else
            git commit -m "fix: make reminder fallbacks platform-safe"
            git push
          fi
