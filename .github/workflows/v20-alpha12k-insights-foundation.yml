name: v2.0 Alpha 1.2K Insights Foundation 2.0

on:
  push:
    branches:
      - "develop/v2.0-alpha1.2k-insights-foundation-2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha12k-insights-foundation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v98 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v20_alpha12k_insights_foundation.py
          git diff --check
          git status --short
          git config user.name "FrameByNavin CI"
          git config user.email "actions@users.noreply.github.com"
          git add app
          git commit -m "feat(v2.0): build Insights Foundation 2.0"
          git rev-parse HEAD | tee /tmp/validated_commit

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v98 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 98' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2k-insights-foundation-2"' app/build.gradle.kts
          grep -q 'engagedViews' app/src/main/java/com/framebynavin/app/youtube/YouTubeInsightsFoundation.kt
          grep -q 'insightTrafficSourceType' app/src/main/java/com/framebynavin/app/youtube/YouTubeInsightsFoundation.kt
          grep -q 'subscribedStatus' app/src/main/java/com/framebynavin/app/youtube/YouTubeInsightsFoundation.kt
          grep -q 'deviceType' app/src/main/java/com/framebynavin/app/youtube/YouTubeInsightsFoundation.kt
          grep -q 'operatingSystem' app/src/main/java/com/framebynavin/app/youtube/YouTubeInsightsFoundation.kt
          grep -q 'elapsedVideoTimeRatio' app/src/main/java/com/framebynavin/app/youtube/YouTubeInsightsFoundation.kt
          grep -q 'channel_reach' app/src/main/java/com/framebynavin/app/youtube/YouTubeInsightsFoundation.kt || true
          grep -q 'listOf(30, 120, 360, 1_440, 4_320, 10_080, 40_320)' app/src/main/java/com/framebynavin/app/youtube/YouTubePublishCheckpointsV2.kt
          grep -q 'SCHEMA_VERSION = 6' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -q 'youtubePublishCheckpoints' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -q 'V20InsightsFoundationCard(snapshot)' app/src/main/java/com/framebynavin/app/ui/V172InsightsUi.kt
          grep -q 'PTab.TODAY -> PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          test ! -e app/src/main/java/com/framebynavin/app/cloud/CloudSyncWorker.kt
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.2k-insights-foundation-2.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.2k-insights-foundation-2.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.2k-insights-foundation-2"
            echo "versionCode=98"
            echo "commit=$(cat /tmp/validated_commit)"
            echo "engagedViewsSeparated=true"
            echo "metricDefinitionSafety=true"
            echo "trafficSourceDataset=true"
            echo "subscribedStatusDataset=true"
            echo "deviceDataset=true"
            echo "operatingSystemDataset=true"
            echo "geographyDataset=true"
            echo "retentionDataset=true"
            echo "reachCtrTruthfulPending=true"
            echo "postPublishCheckpointLadder=30m,2h,6h,24h,72h,7d,28d"
            echo "checkpointLateCaptureExplicit=true"
            echo "checkpointBackupPortable=true"
            echo "acceptedCinematicHomePreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2k-insights-foundation-2-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.2k-insights-foundation-2.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2k-insights-foundation-2-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:staging/v2.0-alpha1.2k-insights-foundation-validated
