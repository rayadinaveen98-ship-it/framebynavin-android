name: v2.0 Alpha 1.4C Deeper Creator Memory

on:
  push:
    branches:
      - "develop/v2.0-alpha1.4c-deeper-creator-memory"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha14c-deeper-creator-memory
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v113 deeper Creator Memory invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 113' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.4c-deeper-creator-memory"' app/build.gradle.kts
          grep -q 'enum class CreatorBrainFreshness' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'enum class CreatorBrainTrajectory' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'FRESH_WINDOW_MILLIS = 45L' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'AGING_WINDOW_MILLIS = 120L' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'CreatorBrainFreshness.STALE' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'classifyTrajectory' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'CreatorBrainTrajectory.IMPROVING' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'CreatorBrainTrajectory.WEAKENING' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'recentEvaluatedCount' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'archetype_hook' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'topic_hook' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'series_hook' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'CreatorBrainEngine.matchForTask' app/src/main/java/com/framebynavin/app/data/CreatorOpportunityEngine.kt
          grep -q 'CreatorPlaybookEngine.build' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'ANALYZE VIDEO WITH GEMINI' app/src/main/java/com/framebynavin/app/ui/V20GeminiIntelligenceUi.kt
          grep -q 'ProjectPulseEngine::repairFalseSurfaceCompletion' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          if grep -R --line-number 'AIzaSy' app/src/main app/src/debug app/src/release; then
            echo 'Firebase API keys must not be copied into Kotlin/Java source.' >&2
            exit 1
          fi
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.4c-deeper-creator-memory.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.4c-deeper-creator-memory.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.4c-deeper-creator-memory"
            echo "versionCode=113"
            echo "commit=$(git rev-parse HEAD)"
            echo "creatorBrainTimeAwareMemory=true"
            echo "freshMemoryWindowDays=45"
            echo "agingMemoryWindowDays=120"
            echo "staleMemoryStopsRanking=true"
            echo "agingMemoryDecays=true"
            echo "trajectoryLearning=true"
            echo "trajectoryMinimumEvaluated=6"
            echo "creatorBrainCombinationsPreserved=true"
            echo "creatorPlaybookPreserved=true"
            echo "recommendationOutcomeLearningPreserved=true"
            echo "liveGeminiVideoAutopsyPreserved=true"
            echo "reminderCompletionSafetyPreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.4c-deeper-creator-memory-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.4c-deeper-creator-memory.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.4c-deeper-creator-memory-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.4c-deeper-creator-memory-validated
