name: V141 Backlot Release Readiness Emulator Matrix

on:
  push:
    branches: ["validation/v141-emulator-readiness"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v141-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35, 36]

    steps:
      - name: Checkout immutable v141 validation source
        uses: actions/checkout@v4
        with:
          ref: validation/v141-emulator-readiness
          fetch-depth: 0

      - name: Verify v141 candidate contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 141' app/build.gradle.kts
          grep -q '2.0.0-rc14-welcome-sfx-voice-inheritance' app/build.gradle.kts
          grep -q 'V140_IDENT_DURATION_MS = 5_000' app/src/main/java/com/framebynavin/app/ui/V140CinematicWelcome.kt
          grep -q 'V141_IDENT_DURATION_SECONDS = 5.0' app/src/main/java/com/framebynavin/app/ui/WelcomeSonicIdent.kt
          grep -q 'V141InheritedVoiceCard' app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt
          grep -q 'selected = settings.defaultVoicePersona' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -q 'onVoicePersonaChange' app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt
          test -s app/src/androidTest/java/com/framebynavin/app/ContentDnaPersistenceV96Test.kt
          test -s app/src/androidTest/java/com/framebynavin/app/cloud/CloudLocalStoreV183Test.kt
          test -s app/src/androidTest/java/com/framebynavin/app/data/CreatorBackupV183Test.kt
          test -s app/src/androidTest/java/com/framebynavin/app/data/CreatorContentProjectRc2InstrumentedTest.kt
          test -s app/src/androidTest/java/com/framebynavin/app/data/ProjectPulseRc3PersistenceInstrumentedTest.kt
          test -s app/src/androidTest/java/com/framebynavin/app/data/V18ReliabilityAlpha18InstrumentationTest.kt
          test -s app/src/androidTest/java/com/framebynavin/app/ui/V18PrimaryNavigationAlpha10UiTest.kt
          test -s app/src/androidTest/java/com/framebynavin/app/ui/V18CoreInteractionUiTest.kt
          test -s app/src/androidTest/java/com/framebynavin/app/ui/V141VoiceInheritanceInstrumentedTest.kt
          test -s app/src/androidTest/java/com/framebynavin/app/V141StartupSmokeInstrumentedTest.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Backlot regression + v141 contract tests on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            gradle :app:connectedDebugAndroidTest --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.ContentDnaPersistenceV96Test,com.framebynavin.app.cloud.CloudLocalStoreV183Test,com.framebynavin.app.data.CreatorBackupV183Test,com.framebynavin.app.data.CreatorContentProjectRc2InstrumentedTest,com.framebynavin.app.data.ProjectPulseRc3PersistenceInstrumentedTest,com.framebynavin.app.data.V18ReliabilityAlpha18InstrumentationTest,com.framebynavin.app.ui.V18PrimaryNavigationAlpha10UiTest,com.framebynavin.app.ui.V18CoreInteractionUiTest,com.framebynavin.app.ui.V141VoiceInheritanceInstrumentedTest,com.framebynavin.app.V141StartupSmokeInstrumentedTest
            -Pandroid.testInstrumentationRunnerArguments.hardeningTestEnvironment=ci-emulator

      - name: Upload API ${{ matrix.api }} instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-v141-api-${{ matrix.api }}-instrumentation-contract
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 90
