name: Build FrameByNavin v1.7.5 Copy Polish RC2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.7.5-ux-copy-polish
    paths:
      - "app/**"
      - "tools/v175_integrate.py"
      - "tools/v175_public_prepare.py"
      - "tools/v175_copy_polish.py"
      - ".github/workflows/v175-copy-polish-build.yml"
      - "*.gradle.kts"
      - "gradle.properties"

concurrency:
  group: framebynavin-v175-copy-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply v1.7.5 integration
        run: python3 tools/v175_integrate.py

      - name: Apply public-safe preparation
        run: python3 tools/v175_public_prepare.py

      - name: Apply UX copy polish
        run: python3 tools/v175_copy_polish.py

      - name: Copy-only release gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e keystore/REMOVED_PRIVATE_SIGNING_VALUE.jks
          ! grep -R --exclude-dir=.git --exclude='*.lock' -n 'REMOVED_PRIVATE_SIGNING_VALUE' .
          grep -q 'versionCode = 38' app/build.gradle.kts
          grep -q 'versionName = "1.7.5-ux-copy-polish-rc2"' app/build.gradle.kts
          grep -q 'CHANNEL PULSE' app/src/main/java/com/framebynavin/app/ui/V172InsightsUi.kt
          grep -q 'WHAT WORKS BEST' app/src/main/java/com/framebynavin/app/ui/V172InsightsUi.kt
          grep -q "WHAT I'M LEARNING" app/src/main/java/com/framebynavin/app/ui/V16CreatorIntelligenceUi.kt
          grep -q 'AUTOMATIC HELP' app/src/main/java/com/framebynavin/app/ui/V17AutomationCenter.kt
          grep -q 'BACKUP & SYNC' app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          grep -q 'MARK STEP DONE' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'PickMultipleVisualMedia' app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt
          grep -q 'input.copyTo(output' app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt
          ! grep -q 'visible baseline' app/src/main/java/com/framebynavin/app/ui/V172InsightsUi.kt
          ! grep -q 'rolling baseline' app/src/main/java/com/framebynavin/app/youtube/YouTubeInsightEngine.kt

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.7.5-ux-copy-polish-rc2
          path: app/build/outputs/apk/debug/app-debug.apk
