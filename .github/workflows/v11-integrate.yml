name: Integrate v1.1 YouTube Insights

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/v11-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v1.1 integration
        run: python scripts/v11_integrate.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          git commit -m "feat: integrate YouTube analytics into Insights" || exit 0
          git push
