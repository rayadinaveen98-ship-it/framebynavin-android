name: v2.0 Alpha 1.2B Drive Vault Emulator

on:
  push:
    branches:
      - "staging/v2.0-alpha1.2b-drive-vault-validated"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v20-alpha12b-drive-vault-emulator
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify exact Drive vault app source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 88' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2b-drive-vault"' app/build.gradle.kts
          test -s app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V20DriveRecoveryGate.kt
          test -s app/src/androidTest/java/com/framebynavin/app/cloud/DriveVaultV20InstrumentedTest.kt
          test ! -e app/src/main/java/com/framebynavin/app/cloud/CloudSyncWorker.kt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run storage and creator recovery suite on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            gradle :app:connectedDebugAndroidTest --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.cloud.DriveVaultV20InstrumentedTest,com.framebynavin.app.cloud.CloudLocalStoreV183Test,com.framebynavin.app.data.CreatorHardeningV181InstrumentedTest,com.framebynavin.app.data.CreatorBackupV183Test,com.framebynavin.app.data.CreatorPublicationRecoveryV183Test,com.framebynavin.app.data.ProjectPulseRc3PersistenceInstrumentedTest,com.framebynavin.app.data.V18ReliabilityAlpha18InstrumentationTest
            -Pandroid.testInstrumentationRunnerArguments.hardeningTestEnvironment=ci-emulator

      - name: Upload emulator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2b-drive-vault-emulator-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 90
