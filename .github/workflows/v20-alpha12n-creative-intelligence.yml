name: v2.0 Alpha 1.2N Creative Intelligence

on:
  push:
    branches:
      - "develop/v2.0-alpha1.2n-creative-intelligence"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha12n-creative-intelligence
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v103 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v20_alpha12n_creative_intelligence.py
          git diff --check
          git status --short
          git config user.name "FrameByNavin CI"
          git config user.email "actions@users.noreply.github.com"
          git add app
          git commit -m "feat(v2.0): build Creative Intelligence foundation"
          git rev-parse HEAD | tee /tmp/validated_commit

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v103 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 103' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2n-creative-intelligence"' app/build.gradle.kts
          grep -q 'object CreatorCreativeIntelligenceEngine' app/src/main/java/com/framebynavin/app/data/CreatorCreativeIntelligence.kt
          grep -q 'MIN_PATTERN_SAMPLES = 2' app/src/main/java/com/framebynavin/app/data/CreatorCreativeIntelligence.kt
          grep -q 'correlation, not proof of causation' app/src/main/java/com/framebynavin/app/ui/V20CreativeIntelligenceUi.kt
          grep -q 'Thumbnail visual style is not inferred here' app/src/main/java/com/framebynavin/app/ui/V20CreativeIntelligenceUi.kt
          grep -q 'selectedHook().orEmpty().ifBlank' app/src/main/java/com/framebynavin/app/data/CreatorVideoPostmortem.kt
          grep -q 'V20CreativeIntelligenceCard(snapshot, tasks, links)' app/src/main/java/com/framebynavin/app/ui/V172InsightsUi.kt
          grep -q 'object CreatorVideoPostmortemEngine' app/src/main/java/com/framebynavin/app/data/CreatorVideoPostmortem.kt
          grep -q 'CreatorWorkflowTimelineStore' app/src/main/java/com/framebynavin/app/data/CreatorWorkflowTimelineStore.kt
          grep -q 'channel_reach_basic_a1' app/src/main/java/com/framebynavin/app/youtube/YouTubeReachReporting.kt
          grep -q 'PTab.TODAY -> PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.2n-creative-intelligence.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.2n-creative-intelligence.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.2n-creative-intelligence"
            echo "versionCode=103"
            echo "commit=$(cat /tmp/validated_commit)"
            echo "creativeIntelligence=deterministic-creator-specific-correlations"
            echo "minimumPatternSamples=2"
            echo "repeatedEvidenceThreshold=4"
            echo "missingMetricExcludedNotZero=true"
            echo "hookStructureTransparent=true"
            echo "titleStructureTransparent=true"
            echo "scriptSizeCorrelation=true"
            echo "contentDnaCorrelation=true"
            echo "ctrRetentionSubscriberConversion=true"
            echo "thumbnailVisionDeferredToOptionalAI=true"
            echo "videoPostmortemPreserved=true"
            echo "acceptedCinematicHomePreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2n-creative-intelligence-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.2n-creative-intelligence.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2n-creative-intelligence-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.2n-creative-intelligence-validated
