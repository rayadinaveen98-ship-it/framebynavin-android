name: Publish direct V327 owner preview APK download

on:
  push:
    branches:
      - release/backlot-v327-proven-base-no-preloads-20261110
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-owner-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch previously built and signed APK
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V327-Lean-Owner-Signed-APK
          run-id: 42729405298
          repository: rayadinaveen98-ship-it/framebynavin-android
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact APK identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate/Backlot-V327-Lean-Owner-Preview.apk
          sed 's|output/||' candidate/SHA256SUMS.txt | (cd candidate && sha256sum -c -)
          echo "0dc2a2932afdfd1709f3e7203ec018dee14a8b0222a9dbfca4f2b44339ee4c5c  candidate/Backlot-V327-Lean-Owner-Preview.apk" | sha256sum -c -
          grep -Fq "versionCode='327'" candidate/APK-IDENTITY.txt
          test -s candidate/SIGNING-VERIFY.txt
      - name: Publish clearly labeled pre-release for direct Android download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create backlot-v327-owner-preview-20261110             candidate/Backlot-V327-Lean-Owner-Preview.apk             --repo "$GITHUB_REPOSITORY"             --target 7d6aea3446ba52c177b30c6f6b5629bf3658384b             --prerelease             --latest=false             --title "Backlot V327 Owner Preview — Not Production"             --notes "Owner-testing APK built from the verified V324 codebase plus selected changes. Public prototype signing certificate. Not a Play Store or production release. This APK contains no user data; upgrading should retain existing data when Android accepts the matching signer. Please back up your data and verify on device."
