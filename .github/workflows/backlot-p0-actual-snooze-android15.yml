name: Backlot P0 real Android 15 challenge snooze-delivery verification

on:
  push:
    branches:
      - audit/backlot-v337-actual-snooze-android15-20261116

permissions:
  contents: read

concurrency:
  group: backlot-p0-actual-snooze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-snooze:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile synthetic snooze instrumentation on frozen V337
        run: |
          set -euo pipefail
          mkdir -p output/p0-actual-snooze
          # Preexisting V339–V343 UI sources are excluded only in disposable
          # CI checkout; full unexcluded compiler audit is separate PR #386.
          ui_dir=app/src/androidTest/java/com/framebynavin/app/ui
          quarantine=$(mktemp -d)
          for name in \
            V339HomeOverflowMenuUiTest.kt \
            V340HomeSpacesEntryUiTest.kt \
            V341UnifiedBackupPanelUiTest.kt \
            V342UnifiedRestorePreparationUiTest.kt \
            V343UnifiedRecoveryEscrowUiTest.kt; do
            test -f "$ui_dir/$name"
            mv "$ui_dir/$name" "$quarantine/$name"
            printf '%s\n' "$ui_dir/$name" >> output/p0-actual-snooze/EXCLUDED_UNRELATED_UI_TESTS.txt
          done
          git rev-parse HEAD > output/p0-actual-snooze/SOURCE-SHA.txt
          timeout --signal=TERM --kill-after=20s 70m gradle :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
            --console=plain 2>&1 | tee output/p0-actual-snooze/BUILD.log
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Let Android OS deliver challenge and its actual ten-minute Snooze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            bash tools/qa/backlot_p0_actual_snooze_android15.sh
      - name: Preserve real Android snooze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-P0-Android15-Actual-Ten-Minute-Snooze
          path: output/p0-actual-snooze/
          retention-days: 30
          if-no-files-found: warn
