name: Backlot Phase 1 - one-activity challenge policy tests (draft only)
on:
  push:
    branches:
      - feature/backlot-phase1-single-habit-policy
  workflow_dispatch:
permissions:
  contents: read
jobs:
  habit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and run Phase 1 habit policy and archive tests
        run: |
          set -euo pipefail
          timeout 60m gradle :app:testDebugUnitTest --tests 'com.framebynavin.app.personal.Phase1HabitPolicyTest' --tests 'com.framebynavin.app.personal.Phase1HabitCodecTest' --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Upload unit test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backlot-Phase1-Habit-Policy-Gradle-Test-Evidence
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn
