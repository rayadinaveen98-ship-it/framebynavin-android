name: Backlot Lab R2 Stabilization - S5 Frozen Source and Targeted Kotlin

# One explicit QA request only. Never builds on every staged source edit.
on:
  push:
    branches:
      - qa/backlot-lab-r2-stabilization-s5-source-20261124
    paths:
      - docs/qa/BACKLOT_LAB_R2_STABILIZATION_S5_REQUEST_20261124.md

permissions:
  contents: read

concurrency:
  group: backlot-lab-r2-stabilization-s5
  cancel-in-progress: false

jobs:
  source-contract:
    name: '01 - Frozen source fence (no JVM)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source ancestry, scoped changes and Lab identity
        shell: bash
        run: |
          set -euo pipefail
          BASE=64ced7c21f0de30c82926505985d81ddcaf5a5f3
          FROZEN=b69df0db7f0b24ca9c4b504179693a628f22acf6
          git cat-file -e "$FROZEN^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor "$FROZEN" HEAD
          test "$(git rev-parse "$FROZEN:app")" = "$(git rev-parse 'HEAD:app')"
          test "$(git diff --name-only "$FROZEN" HEAD -- app | wc -l | tr -d ' ')" = 0
          test -z "$(git diff --name-only "$BASE" "$FROZEN" -- app/src/main/java/com/framebynavin/app/cloud app/src/main/java/com/framebynavin/app/data app/src/main/AndroidManifest.xml app/build.gradle.kts)"
          for f in \
            app/src/main/java/com/framebynavin/app/reminders/P10PremiumReminderIcon.kt \
            app/src/main/java/com/framebynavin/app/reminders/P10ReminderIconStyle.kt \
            app/src/main/java/com/framebynavin/app/reminders/P10CreatorLockScreenMediaPolicy.kt \
            app/src/main/java/com/framebynavin/app/reminders/ReminderAlarmGainEnvelope.kt; do
            test -s "$f"
          done
          grep -Fq 'LIVING_ENERGY' app/src/main/java/com/framebynavin/app/reminders/P10ReminderIconStyle.kt
          grep -Fq 'p10q-review-five-page-creator-setup' app/src/main/java/com/framebynavin/app/ui/V23ProfileAccountUi.kt
          grep -Fq 'p10q-home-avatar-top-right' app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt
          grep -Fq 'P10CreatorLockScreenMediaPolicy.allowed' app/src/main/java/com/framebynavin/app/reminders/P10ReminderVisualContract.kt
          grep -Fq 'ReminderMusicMixPolicy.DURING_VOICE' app/src/main/java/com/framebynavin/app/reminders/ReminderBackingMusic.kt || grep -Fq 'ReminderMusicMixPolicy.level' app/src/main/java/com/framebynavin/app/reminders/ReminderBackingMusic.kt
          grep -Fq 'applicationId = if (backlotLabMode) "com.framebynavin.app.lab"' app/build.gradle.kts
          test -s docs/engineering/BACKLOT_LAB_R2_STABILIZATION_IMPLEMENTATION_20261124.md
          echo 'PASS: exact frozen S5 application source; no protected or cloud changes'

  kotlin:
    name: '02 - Compile Lab debug Kotlin only (no APK)'
    needs: [source-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Single targeted Lab Kotlin compile
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/backlot-s5
          git rev-parse HEAD > output/backlot-s5/qa-request-sha.txt
          git rev-parse b69df0db7f0b24ca9c4b504179693a628f22acf6 > output/backlot-s5/frozen-app-source-sha.txt
          timeout --signal=TERM --kill-after=20s 5400s \
            gradle :app:compileDebugKotlin -PbacklotLab=true \
              --no-daemon --max-workers=1 --console=plain \
              '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
              '-Pkotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC' \
              '-Porg.gradle.parallel=false' \
              2>&1 | tee output/backlot-s5/kotlin-compile.log
      - name: Archive targeted compiler pass/failure once
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Lab-S5-Frozen-Kotlin-Compile
          path: output/backlot-s5/
          if-no-files-found: warn
          retention-days: 14
