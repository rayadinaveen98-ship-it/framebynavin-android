name: FrameByNavin v1.8.3 Server Lifecycle Client

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v1.8.3-server-lifecycle-client
    paths:
      - '.github/workflows/v183-server-lifecycle-client.yml'
      - 'foundation/v183/rc8c-client.patch.xz'

permissions:
  contents: write
  actions: read

concurrency:
  group: framebynavin-v183-server-lifecycle-client
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'rayadinaveen98-ship-it/framebynavin-android' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact RC7 descendant
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify and apply reviewed source update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, os, pathlib, subprocess
          BASE='7e6913321726f2221054cd03b3e4df2483e4a7cb'
          STAGING='d1f823ca8f9fe9663976e7375aa6d5841fddf2ef'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def sha(data): return hashlib.sha256(data).hexdigest()
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert git('rev-parse','HEAD') == os.environ['GITHUB_SHA']
          subprocess.run(['git','merge-base','--is-ancestor',BASE,'HEAD'],check=True)
          assert git('rev-parse','HEAD^') == STAGING
          expected_stage={'foundation/v183/rc8c-client.patch.xz','foundation/v183/rc8c-client-contract.md','.github/workflows/v183-server-lifecycle-client.yml'}
          actual_stage=set(git('diff','--name-only',BASE,'HEAD').splitlines())
          assert actual_stage == expected_stage,(actual_stage,expected_stage)
          subprocess.run(['git','diff','--exit-code',BASE,'HEAD','--','app'],check=True)
          packed=pathlib.Path('foundation/v183/rc8c-client.patch.xz').read_bytes()
          assert blob(packed)=='f3d11cdb969a15626407b168ee8e491e5699ecfc'
          assert sha(packed)=='8322e1c6f55d67b861efd3e651906ac59696fe7c0df9dcae74e77196e88c1aa1'
          patch=lzma.decompress(packed)
          assert sha(patch)=='43bdf8ecb5ec7f836ad5f18e88537c611855d9faeeceecad646a80754a860849'
          pathlib.Path('/tmp/fbn183-rc8c.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/fbn183-rc8c.patch'],check=True)
          subprocess.run(['git','apply','/tmp/fbn183-rc8c.patch'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          expected=set('''app/build.gradle.kts
          app/src/main/java/com/framebynavin/app/cloud/CloudApiClient.kt
          app/src/main/java/com/framebynavin/app/cloud/CloudDeletionRecovery.kt
          app/src/main/java/com/framebynavin/app/cloud/CloudLocalStore.kt
          app/src/main/java/com/framebynavin/app/cloud/CloudModels.kt
          app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt
          app/src/test/java/com/framebynavin/app/cloud/CloudDeletionRecoveryTest.kt
          app/src/androidTest/java/com/framebynavin/app/cloud/CloudDeletionJournalV183Test.kt'''.splitlines())
          actual=set(git('diff','--name-only').splitlines())
          actual|=set(git('ls-files','--others','--exclude-standard','app').splitlines())
          assert actual==expected,(actual,expected)
          assert not any(pathlib.Path(p).is_symlink() for p in expected)
          gradle=pathlib.Path('app/build.gradle.kts').read_text()
          assert 'versionCode = 73' in gradle
          assert 'versionName = "1.8.3-foundation-rc8c"' in gradle
          assert 'const val SCHEMA_VERSION = 5' in pathlib.Path('app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt').read_text()
          api=pathlib.Path('app/src/main/java/com/framebynavin/app/cloud/CloudApiClient.kt').read_text()
          assert api.count('writeEpoch = writeEpoch,')==4
          assert 'x-creator-write-epoch' in api
          assert 'creator_delete_owned_data' in api and 'creator_resume_owned_data' in api
          assert '"DELETE", "/rest/v1/creator_backups' not in api
          recovery=pathlib.Path('app/src/main/java/com/framebynavin/app/cloud/CloudDeletionRecovery.kt').read_text()
          assert 'journal.pendingGeneration()' in recovery
          assert recovery.index('journal.begin(userId, expected)') < recovery.index('remote.deleteOwnedData(userId, expected)') < recovery.index('journal.clear(userId)')
          store=pathlib.Path('app/src/main/java/com/framebynavin/app/cloud/CloudLocalStore.kt').read_text()
          assert 'pending_cloud_deletion_v183' in store and 'cloud_lifecycle_v183' in store
          assert 'fun requireWritable(userId: String)' in store
          manager=pathlib.Path('app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt').read_text()
          assert 'CloudDeletionRecovery(local, remote)' in manager
          assert 'private suspend fun requireActiveLifecycle' in manager
          assert 'suspend fun resumeCloudData()' in manager
          assert manager.count('api.resumeCloudData(')==1
          assert 'api.hasCloudData(session)' in manager
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          pathlib.Path('foundation/verification').mkdir(parents=True,exist_ok=True)
          pathlib.Path('foundation/verification/rc8c-payload.sha256').write_text(sha(packed)+'  rc8c-client.patch.xz\n'+sha(patch)+'  rc8c-client.patch\n')
          print('Exact RC8c source scope, transport, version, signing baseline and lifecycle contracts verified')
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build candidate APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify version and established pilot signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundation/verification
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee foundation/verification/rc8c-apk-signature.txt
          grep -Fqi 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0' foundation/verification/rc8c-apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.framebynavin.app' versionCode='73' versionName='1.8.3-foundation-rc8c'"
          sha256sum "$APK" | tee foundation/verification/rc8c-apk.sha256
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator regression suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash hardening/rc2/run_emulator_tests.sh
      - name: Commit verified canonical source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git -c user.name='FrameByNavin Build' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: fence cloud lifecycle writes and deletion retries by server generation'
          git push origin HEAD:refs/heads/fix/v1.8.3-server-lifecycle-client
      - name: Archive verified candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundation/source foundation/verification
          git archive --format=tar.gz --output foundation/source/FrameByNavin-v1.8.3-foundation-rc8c-source.tar.gz HEAD app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties foundation/v183/rc8c-client-contract.md
          sha256sum foundation/source/FrameByNavin-v1.8.3-foundation-rc8c-source.tar.gz | tee foundation/verification/rc8c-source.sha256
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          source=pathlib.Path('foundation/source/FrameByNavin-v1.8.3-foundation-rc8c-source.tar.gz')
          apk=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
            'status':'internal foundation candidate; not a public release',
            'versionName':'1.8.3-foundation-rc8c','versionCode':73,'backupSchemaVersion':5,
            'canonical_base':'7e6913321726f2221054cd03b3e4df2483e4a7cb',
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'source_sha256':sha(source),'apk_sha256':sha(apk),
            'signing_certificate_sha256':'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0',
            'backend_contract_commit':'562fdfdc7ce48bdc7dfb905e077c21867dcab542',
            'backend_migration_sha256':'61425ebedad2ff4eaaf85b0c58dbe2382e0c35360f9b2416ab207c35139be45a',
            'backend_deployed':False,
            'scope':'Generation-aware cloud writes, atomic creator-data deletion client, durable retry fencing, explicit reactivation, legacy journal preservation and synthetic regressions. No live backend migration or user-record mutation. Full Auth deletion, live HTTP acceptance and physical-device gates remain pending.'
          }
          pathlib.Path('foundation/verification/rc8c-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Upload verified candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-foundation-rc8c-candidate
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            foundation/verification/rc8c-apk.sha256
            foundation/verification/rc8c-apk-signature.txt
      - name: Upload verified candidate source
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-foundation-rc8c-source
          path: |
            foundation/source/FrameByNavin-v1.8.3-foundation-rc8c-source.tar.gz
            foundation/verification/rc8c-manifest.json
            foundation/verification/rc8c-source.sha256
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-foundation-rc8c-diagnostics
          if-no-files-found: ignore
          path: |
            foundation/verification/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            hardening/diagnostics/
