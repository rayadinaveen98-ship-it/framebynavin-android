name: v2.0 Alpha 1.4D Creator Brain Recommendations

on:
  push:
    branches:
      - "develop/v2.0-alpha1.4d-creator-brain-recommendations"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha14d-creator-brain-recommendations
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v114 Creator Brain guidance UI
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v114_creator_brain_recommendations_patch.py
          git diff --check
          git config user.name "rayadinaveen98-ship-it"
          git config user.email "rayadinaveen98@gmail.com"
          if ! git diff --quiet; then
            git add app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
            git commit -m "feat(v114): surface Creator Brain guidance [skip ci]"
          fi
          echo "VALIDATED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v114 Creator Brain recommendation invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 114' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.4d-creator-brain-recommendations"' app/build.gradle.kts
          grep -q 'object CreatorBrainRecommendationEngine' app/src/main/java/com/framebynavin/app/data/CreatorBrainRecommendations.kt
          grep -q 'CreatorBrainRecommendationKind.LEAN_IN' app/src/main/java/com/framebynavin/app/data/CreatorBrainRecommendations.kt
          grep -q 'CreatorBrainRecommendationKind.AVOID_FOR_NOW' app/src/main/java/com/framebynavin/app/data/CreatorBrainRecommendations.kt
          grep -q 'CreatorBrainRecommendationKind.REFRESH_EVIDENCE' app/src/main/java/com/framebynavin/app/data/CreatorBrainRecommendations.kt
          grep -q 'CreatorBrainTrajectory.WEAKENING' app/src/main/java/com/framebynavin/app/data/CreatorBrainRecommendations.kt
          grep -q 'CreatorBrainFreshness.STALE' app/src/main/java/com/framebynavin/app/data/CreatorBrainRecommendations.kt
          grep -q 'CREATOR BRAIN · GUIDANCE' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'CreatorBrainRecommendationEngine.build' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'CREATOR BRAIN · MEMORY' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'CreatorBrainEngine.matchForTask' app/src/main/java/com/framebynavin/app/data/CreatorOpportunityEngine.kt
          grep -q 'CreatorPlaybookEngine.build' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'ANALYZE VIDEO WITH GEMINI' app/src/main/java/com/framebynavin/app/ui/V20GeminiIntelligenceUi.kt
          grep -q 'ProjectPulseEngine::repairFalseSurfaceCompletion' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          if grep -R --line-number 'AIzaSy' app/src/main app/src/debug app/src/release; then
            echo 'Firebase API keys must not be copied into Kotlin/Java source.' >&2
            exit 1
          fi
          git diff --check HEAD^

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.4d-creator-brain-recommendations.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.4d-creator-brain-recommendations.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.4d-creator-brain-recommendations"
            echo "versionCode=114"
            echo "commit=$VALIDATED_SOURCE_SHA"
            echo "creatorBrainGuidance=true"
            echo "projectSpecificBrainGuidance=true"
            echo "leanInGuidance=true"
            echo "controlledRetestGuidance=true"
            echo "weakeningPatternWarning=true"
            echo "cautionPatternRework=true"
            echo "stalePatternRefresh=true"
            echo "timeAwareMemoryPreserved=true"
            echo "creatorBrainCombinationsPreserved=true"
            echo "creatorPlaybookPreserved=true"
            echo "recommendationOutcomeLearningPreserved=true"
            echo "liveGeminiVideoAutopsyPreserved=true"
            echo "reminderCompletionSafetyPreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.4d-creator-brain-recommendations-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.4d-creator-brain-recommendations.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.4d-creator-brain-recommendations-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to develop and staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:develop/v2.0-alpha1.4d-creator-brain-recommendations
          git push origin HEAD:staging/v2.0-alpha1.4d-creator-brain-recommendations-validated
