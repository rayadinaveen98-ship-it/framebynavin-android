name: Switch v1.3.3 Home

on:
  push:
    branches:
      - "repair/v1.3.2-release-blockers"
    paths:
      - ".github/workflows/v133-home-switch.yml"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1.3.2-release-blockers
          fetch-depth: 0
      - name: Switch Today to Creator Control Room
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt')
          s = p.read_text()
          old = '''                PTab.TODAY -> PTodayScreen(
                    tasks = vm.tasks,
                    onAdd = { openComposer() },
                    onStart = vm::startTask,
                    onAdvance = vm::advanceWorkflow,
                    onViewAllReminders = { showReminders = true },
                    onFocus = { focusTaskId = it },
                )'''
          new = '''                PTab.TODAY -> V133CreatorHome(
                    tasks = vm.tasks,
                    onNewProject = { openComposer() },
                    onIdeas = { overlay = POverlay.IDEAS },
                    onReminders = { showReminders = true },
                    onStudio = { tab = PTab.STUDIO },
                    onStart = vm::startTask,
                    onAdvance = vm::advanceWorkflow,
                    onFocus = { focusTaskId = it },
                )'''
          if old not in s:
              raise SystemExit('Expected Today screen call not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          git commit -m "feat: switch home to creator control room"
          git push origin HEAD:repair/v1.3.2-release-blockers
