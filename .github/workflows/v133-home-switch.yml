name: Prepare v1.3.3 Home Patch

on:
  push:
    branches:
      - "repair/v1.3.2-release-blockers"
    paths:
      - ".github/workflows/v133-home-switch.yml"
      - "tools/v133_home_switch.py"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/v1.3.2-release-blockers
      - name: Prepare patched Home source
        run: python3 tools/v133_home_switch.py
      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: v133-home-source
          path: app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
