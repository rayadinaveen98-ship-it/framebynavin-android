name: Fix v1.7.1 Nav Safety

on:
  push:
    branches:
      - "feature/v1.7.1-visual-polish"
    paths:
      - "tools/v171_nav_safety.py"
      - ".github/workflows/v171-nav-safety.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.7.1-visual-polish
      - name: Apply nav compile-safety patch
        run: python tools/v171_nav_safety.py
      - name: Commit safer nav structure
        run: |
          if git diff --quiet; then
            echo "No nav changes needed"
            exit 0
          fi
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          git commit -m "fix(v1.7.1): make centered nav action compile-safe"
          git push origin HEAD:feature/v1.7.1-visual-polish
