name: Backlot V220.4 — Android 15 Gestural New Idea Acceptance

on:
  push:
    branches: [feature/backlot-v2204-new-idea-activity-owned]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v2204-gesture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Guard against reintroducing a second Android Dialog
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; s=Path("app/src/main/java/com/framebynavin/app/ui/V09IdeaVaultUi.kt").read_text(); a=s.index("internal fun V09NewIdeaCleanEditor("); b=s.index("private fun V09IdeaEditor(",a); assert "Dialog(" not in s[a:b]; root=Path("app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt").read_text(); assert root.index("V09NewIdeaCleanEditor(")>root.index("PBottomNav(")'
      - name: Compile owner APKs and root tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V2204-Android15-Gesture-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14
          if-no-files-found: error

  gesture:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V2204-Android15-Gesture-APKs
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 edge-to-edge with real gesture navigation and IME
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.gestural
            adb shell settings put secure show_ime_with_hard_keyboard 1
            echo "NAVIGATION_MODE=$(adb shell settings get secure navigation_mode)"
            adb shell cmd overlay list | grep -i navbar || true
            adb install -r apks/debug/app-debug.apk
            adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            mkdir -p gesture-evidence
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2204NewIdeaRootOverlayUiTest -e backlotVisualProfile gestural -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v2204-gestural.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v2204-gestural.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v2204-gestural.log
            for scene in nav-clear keyboard-clear; do adb exec-out run-as com.framebynavin.app cat "files/v2204-idea-evidence/v2204-gestural-${scene}.png" > "gesture-evidence/v2204-gestural-${scene}.png"; done
            python3 -c 'from pathlib import Path; import struct; files=list(Path("gesture-evidence").glob("*.png")); assert len(files)==2; assert all(p.read_bytes()[:8]==bytes.fromhex("89504e470d0a1a0a") and p.stat().st_size>10000 for p in files); print([(p.name,struct.unpack(">II",p.read_bytes()[16:24])) for p in files])'
      - name: Upload Android 15 real-system-bar/IME screenshots and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V2204-Android15-Gestural-Window-Evidence
          path: |
            gesture-evidence/*.png
            v2204-gestural.log
          retention-days: 14
          if-no-files-found: warn
