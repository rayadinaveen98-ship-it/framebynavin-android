name: FrameByNavin v1.8.2 Reminder Safety

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v1.8.2-reminder-safety
    paths:
      - 'hotfix/v182/**'
      - '.github/workflows/v182-reminder-safety.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: framebynavin-v182-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact hotfix candidate
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct verified v1.8.1 source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 hardening/rc2/restore_source.py
      - name: Apply v1.8.1 compatibility fixes
        run: |
          python3 hardening/rc2/compile_fix.py
          python3 hardening/rc2/locking_fix.py
          python3 hardening/rc2/ui_fix.py
          python3 hardening/rc2/ui_label_fix.py
      - name: Apply v1.8.2 reminder-safety hotfix
        run: python3 hotfix/v182/apply_patch.py
      - name: Source and version gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 65' app/build.gradle.kts
          grep -Fq 'versionName = "1.8.2-reminder-safety"' app/build.gradle.kts
          git diff --check
          test -f app/src/main/java/com/framebynavin/app/reminders/ReminderScheduler.kt
          test -f app/src/main/java/com/framebynavin/app/reminders/AlarmActivity.kt
          test -f app/src/main/java/com/framebynavin/app/reminders/VoiceReminderActivity.kt
          echo 'v1.8.2 source gate passed'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK identity and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --print-certs "$APK" | tee hotfix/v182/apk-signature.txt
          grep -Fqi 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0' hotfix/v182/apk-signature.txt
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.framebynavin.app' versionCode='65' versionName='1.8.2-reminder-safety'"
          sha256sum "$APK" | tee FrameByNavin-v1.8.2-reminder-safety.sha256
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator regression suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash hardening/rc2/run_emulator_tests.sh
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.2-reminder-safety
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            FrameByNavin-v1.8.2-reminder-safety.sha256
            hotfix/v182/apk-signature.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.2-reminder-safety-diagnostics
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            hardening/diagnostics/
