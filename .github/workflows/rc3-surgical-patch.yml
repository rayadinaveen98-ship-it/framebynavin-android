name: RC3 surgical source patch

on:
  push:
    branches:
      - "release/v1.9.0-rc3-project-pulse"
    paths:
      - ".github/rc3-patch-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RC3 branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.9.0-rc3-project-pulse
          fetch-depth: 0

      - name: Apply fail-closed RC3 source patch
        run: python3 tools/rc3_apply_persistence_patch.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'SmartTargetBoundary.bound' app/src/main/java/com/framebynavin/app/reminders/SmartEscalationScheduler.kt
          ! grep -q 'private fun finalStage' app/src/main/java/com/framebynavin/app/reminders/SmartEscalationScheduler.kt

      - name: Commit source-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/reminders/SmartEscalationScheduler.kt
          git diff --cached --quiet && { echo 'No patch produced'; exit 1; }
          git commit -m "fix(v1.9): enforce Smart final-target boundary through pure policy"
          git push origin HEAD:release/v1.9.0-rc3-project-pulse
