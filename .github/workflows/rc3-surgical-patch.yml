name: RC3 surgical source patch

on:
  push:
    branches:
      - "release/v1.9.0-rc3-project-pulse"
    paths:
      - ".github/rc3-patch-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RC3 branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.9.0-rc3-project-pulse
          fetch-depth: 0

      - name: Apply fail-closed RC3 source patch
        run: python3 tools/rc3_apply_persistence_patch.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'attentionPlan != ProjectAttentionPlan.OFF' app/src/main/java/com/framebynavin/app/data/TaskStore.kt
          ! grep -q 'attentionPlan != ProjectAttentionPlan.CUSTOM && attentionPlan != ProjectAttentionPlan.OFF' app/src/main/java/com/framebynavin/app/data/TaskStore.kt
          grep -q 'val task = ProjectPulseEngine.applyAttentionPlan(baseTask, attentionPlan)' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'val updated = ProjectPulseEngine.applyAttentionPlan(configured, attentionPlan)' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'afterWorkflowStageChanged' app/src/main/java/com/framebynavin/app/data/ProjectPulse.kt

      - name: Commit source-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/framebynavin/app/data/TaskStore.kt \
            app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt \
            app/src/main/java/com/framebynavin/app/data/ProjectPulse.kt
          git diff --cached --quiet && { echo 'No patch produced'; exit 1; }
          git commit -m "fix(v1.9): persist RC3 stage-aware Custom check-ins"
          git push origin HEAD:release/v1.9.0-rc3-project-pulse
