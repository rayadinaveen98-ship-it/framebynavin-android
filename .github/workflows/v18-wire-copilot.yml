name: Wire v1.8 Creator Copilot

on:
  push:
    branches:
      - "feature/v1.8-creator-copilot"
    paths:
      - "tools/v18_wire_copilot.py"
      - ".github/workflows/v18-wire-copilot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.8-creator-copilot
      - name: Apply guarded wiring
        run: python tools/v18_wire_copilot.py
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          git commit -m "feat(v1.8): expose Creator Copilot from Control"
          git push origin HEAD:feature/v1.8-creator-copilot
