name: Backlot V294 - Wave 1 Unit and Data-Preservation Guard

on:
  push:
    branches: [feature/backlot-v294-universal-ui-wave1, feature/backlot-v294-wave2-quiet-settings, qa/backlot-v294-wave2-release-candidate, feature/backlot-v295-universal-personal-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v294-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no storage changes and version-only build update
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/heads/feature/backlot-v294-wave2-quiet-settings:refs/remotes/origin/feature/backlot-v294-wave2-quiet-settings
          git diff --name-only origin/feature/backlot-v294-wave2-quiet-settings HEAD > /tmp/v294-rc-changed.txt
          cat /tmp/v294-rc-changed.txt
          if grep -E '^(app/src/main/java/com/framebynavin/app/(data|cloud|reminders)/|app/src/main/AndroidManifest.xml)' /tmp/v294-rc-changed.txt; then
            echo 'FAIL: production data, reminder, cloud or manifest changes forbidden' >&2
            exit 1
          fi
          if grep -E '^app/src/main/java/com/framebynavin/app/personal/' /tmp/v294-rc-changed.txt | grep -Fv 'app/src/main/java/com/framebynavin/app/personal/V288ReminderSuggestion.kt'; then
            echo 'FAIL: only user-facing Personal suggestion copy may change in V295' >&2
            exit 1
          fi
          git show origin/feature/backlot-v294-wave2-quiet-settings:app/build.gradle.kts > /tmp/v294-base-gradle
          sed -e 's/versionCode = 292/versionCode = 294/' -e 's/versionName = "2.26.0-rc2-personal-metrics"/versionName = "2.27.0-rc1-universal-ui"/' /tmp/v294-base-gradle > /tmp/v294-expected-gradle
          cmp -s /tmp/v294-expected-gradle app/build.gradle.kts || { echo 'FAIL: unsupported build configuration change' >&2; exit 1; }
          echo 'PASS: version bump only; storage logic unchanged'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run full debug unit suite including Settings and safe starter cleanup
        run: |
          set -euo pipefail
          timeout 65m gradle :app:testDebugUnitTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Verify critical owner-data preservation unit suites
        run: |
          set -euo pipefail
          mkdir -p output/v294-wave1-units
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          src=Path('app/build/test-results/testDebugUnitTest')
          required=[
              ('V167SettingsNavigationPolicyTest',3),
              ('V230LegacyStarterProjectPolicyTest',5),
              ('V2281StarterSchedulePolicyTest',2),
              ('V290CloudCoverageDisclosureTest',3),
              ('V292SpaceMetricSuggestionsTest',6),
          ]
          for name,minimum in required:
              paths=list(src.glob('TEST-*'+name+'.xml'))
              assert len(paths)==1, (name, 'missing expected test suite')
              result=ET.parse(paths[0]).getroot()
              tests=int(result.get('tests','0'))
              failures=int(result.get('failures','0'))
              errors=int(result.get('errors','0'))
              assert tests>=minimum and not failures and not errors, (name,tests,failures,errors)
              print(f"PASS {name}: {tests} tests")
          PY
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml output/v294-wave1-units/
          (cd output/v294-wave1-units && sha256sum *.xml > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V294-Wave1-Unit-Regression-Results
          path: output/v294-wave1-units/
          retention-days: 30
          if-no-files-found: error
