name: Backlot V294 - Wave 1 Unit and Data-Preservation Guard

on:
  push:
    branches: [feature/backlot-v294-universal-ui-wave1, feature/backlot-v294-wave2-quiet-settings, qa/backlot-v294-wave2-release-candidate, feature/backlot-v295-universal-personal-foundation, feature/backlot-v296-guided-personal-composer, feature/backlot-v297-owner-21-day-challenges, feature/backlot-v298-personal-reminder-groups, feature/backlot-v299-personal-recovery-preflight, feature/backlot-v300-encrypted-personal-archive-foundation, feature/backlot-v301-recovery-dry-run, feature/backlot-v302-owner-encrypted-archive-ui, feature/backlot-v303-space-receipt-provenance, feature/backlot-v304-restore-transaction-preparation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v294-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no storage changes and version-only build update
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/heads/feature/backlot-v294-wave2-quiet-settings:refs/remotes/origin/feature/backlot-v294-wave2-quiet-settings
          git diff --name-only origin/feature/backlot-v294-wave2-quiet-settings HEAD > /tmp/v294-rc-changed.txt
          cat /tmp/v294-rc-changed.txt
          if grep -E '^(app/src/main/java/com/framebynavin/app/(data|reminders)/|app/src/main/AndroidManifest.xml)' /tmp/v294-rc-changed.txt; then
            echo 'FAIL: production data, reminder delivery or manifest changes forbidden' >&2
            exit 1
          fi
          # Cloud behavior is frozen: permit only a narrow release-copy correction
          # identifying challenges/groups as outside the existing sync contract.
          # V299 can add a single read-only panel reference to Backup & Recovery.
          # The cloud upload/restore engine and its data formats stay frozen.
          while IFS= read -r changed; do
            case "$changed" in
              app/src/main/java/com/framebynavin/app/cloud/V290CloudCoverageDisclosure.kt) ;;
              app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt) ;;
              app/src/main/java/com/framebynavin/app/cloud/*)
                echo 'FAIL: cloud sync engine must not change in V299' >&2
                exit 1
                ;;
            esac
          done < /tmp/v294-rc-changed.txt
          # Refuse edits to established reminder, alarm, data or cloud source.
          while IFS= read -r changed; do
            case "$changed" in
              app/src/main/java/com/framebynavin/app/personal/V288ReminderSuggestion.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V297Challenge.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V297ChallengeStore.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V298ReminderGroup.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V298ReminderGroupStore.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V299PersonalRecoveryPreflight.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V300EncryptedPersonalArchive.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V300PersonalArchiveSource.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V300RestoreReadinessPolicy.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V301RestoreDryRun.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V301LocalRecoveryReader.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V301ArchiveConflictPreview.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V303SpaceReceiptArchiveCodec.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V303SpaceSnapshotReader.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V304RestorePreparation.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/V304ArchivePreparationCoordinator.kt) ;;
              app/src/main/java/com/framebynavin/app/personal/*)
                echo 'FAIL: existing Personal source must not change' >&2
                exit 1
                ;;
            esac
          done < /tmp/v294-rc-changed.txt
          git show origin/feature/backlot-v294-wave2-quiet-settings:app/build.gradle.kts > /tmp/v294-base-gradle
          sed -e 's/versionCode = 292/versionCode = 294/' -e 's/versionName = "2.26.0-rc2-personal-metrics"/versionName = "2.27.0-rc1-universal-ui"/' /tmp/v294-base-gradle > /tmp/v294-expected-gradle
          # Only V296 may add the explicitly pinned-by-BOM Compose animation module.
          # All earlier V294/V295 source contracts remain unchanged.
          if [[ "${GITHUB_REF_NAME}" == "feature/backlot-v296-guided-personal-composer" || "${GITHUB_REF_NAME}" == "feature/backlot-v297-owner-21-day-challenges" || "${GITHUB_REF_NAME}" == "feature/backlot-v298-personal-reminder-groups" || "${GITHUB_REF_NAME}" == "feature/backlot-v299-personal-recovery-preflight" || "${GITHUB_REF_NAME}" == "feature/backlot-v300-encrypted-personal-archive-foundation" || "${GITHUB_REF_NAME}" == "feature/backlot-v301-recovery-dry-run" || "${GITHUB_REF_NAME}" == "feature/backlot-v302-owner-encrypted-archive-ui" || "${GITHUB_REF_NAME}" == "feature/backlot-v303-space-receipt-provenance" || "${GITHUB_REF_NAME}" == "feature/backlot-v304-restore-transaction-preparation" ]]; then
            sed -i '/    implementation("androidx.compose.ui:ui")/a\    // V296 guided composer uses explicit animated step transitions.' /tmp/v294-expected-gradle
            sed -i '/    \/\/ V296 guided composer uses explicit animated step transitions./a\    implementation("androidx.compose.animation:animation")' /tmp/v294-expected-gradle
          fi
          cmp -s /tmp/v294-expected-gradle app/build.gradle.kts || { echo 'FAIL: unsupported build configuration change' >&2; exit 1; }
          echo 'PASS: pinned dependency boundary; storage and scheduling logic unchanged'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run full debug unit suite including Settings and safe starter cleanup
        run: |
          set -euo pipefail
          timeout 65m gradle :app:testDebugUnitTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Verify critical owner-data preservation unit suites
        run: |
          set -euo pipefail
          mkdir -p output/v294-wave1-units
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          src=Path('app/build/test-results/testDebugUnitTest')
          required=[
              ('V167SettingsNavigationPolicyTest',3),
              ('V230LegacyStarterProjectPolicyTest',5),
              ('V2281StarterSchedulePolicyTest',2),
              ('V290CloudCoverageDisclosureTest',3),
              ('V292SpaceMetricSuggestionsTest',6),
              ('V297ChallengeTest',7),
              ('V299RecoveryCountsTest',5),
              ('V299PhotoIntegrityPolicyTest',4),
              ('V300EncryptedPersonalArchiveTest',10),
              ('V303SpaceReceiptArchiveCodecTest',9),
              ('V304RestorePreparationTest',11),
              ('V300RestoreReadinessPolicyTest',5),
              ('V300PrivatePhotoInventoryPolicyTest',3),
              ('V301RestoreDryRunTest',11),
              ('V302OwnerArchiveFingerprintTest',3),
              ('V298ReminderGroupTest',7),
          ]
          for name,minimum in required:
              paths=list(src.glob('TEST-*'+name+'.xml'))
              assert len(paths)==1, (name, 'missing expected test suite')
              result=ET.parse(paths[0]).getroot()
              tests=int(result.get('tests','0'))
              failures=int(result.get('failures','0'))
              errors=int(result.get('errors','0'))
              assert tests>=minimum and not failures and not errors, (name,tests,failures,errors)
              print(f"PASS {name}: {tests} tests")
          PY
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml output/v294-wave1-units/
          (cd output/v294-wave1-units && sha256sum *.xml > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V294-Wave1-Unit-Regression-Results
          path: output/v294-wave1-units/
          retention-days: 30
          if-no-files-found: error
