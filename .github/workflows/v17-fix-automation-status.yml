name: Fix v1.7 Automation Status

on:
  push:
    branches: [ "feature/v1.7-creator-automation" ]
    paths:
      - "tools/v17_fix_automation_status.py"
      - ".github/workflows/v17-fix-automation-status.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python tools/v17_fix_automation_status.py
      - run: |
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/V17AutomationCenter.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix(v1.7): correct automation follow-up status count"
            git push
          fi
