name: Build FrameByNavin v1.7.4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v1.7.4-cinematic-home-welcome"
    paths:
      - "app/**"
      - ".github/workflows/v174-build.yml"

concurrency:
  group: framebynavin-v174-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify v1.7.4 version
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -q 'versionCode = 36' app/build.gradle.kts
          grep -q '1.7.4-cinematic-home-welcome-rc1' app/build.gradle.kts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.7.4-cinematic-home-welcome-rc1
          path: app/build/outputs/apk/debug/app-debug.apk
