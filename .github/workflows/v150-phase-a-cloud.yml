name: V150 Phase A Cloud Complete Recovery

on:
  push:
    branches:
      - feature/v150-pilot-product-focus
    paths:
      - .github/workflows/v150-phase-a-cloud.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate cloud voice recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/framebynavin/app/cloud/CreatorCloudSyncManager.kt')
          s = p.read_text()
          if 'private val voiceMedia = CreatorCloudVoiceMediaManager(app)' not in s:
              old = '    private val backup = CreatorBackupManager(app)\n    private val state = CreatorCloudSyncStateStore(app)'
              assert old in s
              s = s.replace(old, old + '\n    private val voiceMedia = CreatorCloudVoiceMediaManager(app)', 1)
          if 'val prepared = prepare()' in s:
              assert s.count('val prepared = prepare()') == 2
              s = s.replace('val prepared = prepare()', 'val prepared = prepare(session)')
          old_prepare = '''    private suspend fun prepare(): PreparedCreatorSnapshot {
        val payload = backup.createBackup()
        val preview = backup.validate(payload)
        return PreparedCreatorSnapshot('''
          if old_prepare in s:
              new_prepare = '''    private suspend fun prepare(session: CloudSession): PreparedCreatorSnapshot {
        voiceMedia.protectLocal(session)
        val payload = CreatorCloudPayloadSanitizer.sanitize(backup.createBackup())
        val preview = backup.validate(payload)
        return PreparedCreatorSnapshot('''
              s = s.replace(old_prepare, new_prepare, 1)
          old_restore = '        backup.restore(cloud.payload)\n        state.bindWorkspace(session.userId)'
          if old_restore in s:
              s = s.replace(old_restore, '        backup.restore(cloud.payload)\n        voiceMedia.restoreMissing(session)\n        state.bindWorkspace(session.userId)', 1)
          old_nochange = '''            CreatorCloudReconciliationAction.NO_CHANGE -> {
                val current = requireNotNull(cloud)
                state.bindWorkspace(session.userId)'''
          if old_nochange in s:
              s = s.replace(old_nochange, '''            CreatorCloudReconciliationAction.NO_CHANGE -> {
                val current = requireNotNull(cloud)
                voiceMedia.restoreMissing(session)
                state.bindWorkspace(session.userId)''', 1)
          assert 'private suspend fun prepare(session: CloudSession)' in s
          assert 'voiceMedia.restoreMissing(session)' in s
          p.write_text(s)

          vm = Path('app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt')
          s = vm.read_text()
          if 'import com.framebynavin.app.cloud.CreatorCloudSyncWorker' not in s:
              anchor = 'import androidx.lifecycle.viewModelScope\n'
              assert anchor in s
              s = s.replace(anchor, anchor + 'import com.framebynavin.app.cloud.CreatorCloudSyncWorker\n', 1)
          sync_line = '                            if (weeklyAutoPlanEnabled && writeError == null) syncWeeklyScheduleInternal()\n'
          if 'CreatorCloudSyncWorker.enqueueSoon(getApplication())' not in s:
              assert sync_line in s
              s = s.replace(sync_line, sync_line + '                            if (writeError == null) CreatorCloudSyncWorker.enqueueSoon(getApplication())\n', 1)
          vm.write_text(s)
          PY

      - name: Commit cloud integration
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "Backlot V150 Builder"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/com/framebynavin/app/cloud/CreatorCloudSyncManager.kt app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
            git commit -m "feat(v150): integrate voice media recovery with creator cloud"
            git push origin HEAD:feature/v150-pilot-product-focus
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: backlot-v150-phase-a-cloud-apk
          path: app/build/outputs/apk/debug/app-debug.apk
