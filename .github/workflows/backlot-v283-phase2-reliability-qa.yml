name: Backlot Build283 - Phase2 Reminder Reliability Emulator Matrix
on:
  push:
    branches: [feature/backlot-v283-phase2-reminder-reliability]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-v283-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-reliability-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Phase2 Android instrumentation (not a production build)
        run: |
          set -euo pipefail
          timeout 47m gradle :app:assembleDebugAndroidTest --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          mkdir -p test-artifact
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk test-artifact/app-debug-androidTest.apk
          (cd test-artifact && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-Build283-Phase2-Device-Tests
          path: test-artifact/
          retention-days: 14
          if-no-files-found: error

  emulator-matrix:
    needs: build-reliability-tests
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-Build283-Phase2-Device-Tests
          path: tests
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-Build283-Android-Tests
          path: app283
          run-id: 41463961020
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Verify unchanged Build283 app and compiled test artifacts
        run: |
          set -euo pipefail
          (cd app283 && sha256sum -c SHA256SUMS.txt)
          (cd tests && sha256sum -c SHA256SUMS.txt)
          test -s app283/app-debug.apk
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate stale token, acknowledgement, snooze and recovery safety on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb install -r app283/app-debug.apk
            adb install -r tests/app-debug-androidTest.apk
            adb shell pm clear com.framebynavin.app
            adb shell am instrument -w -r -e hardeningTestEnvironment ci-emulator -e class com.framebynavin.app.reminders.V283Phase2ReminderSafetyDeviceTest com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/backlot-phase2.log
            grep -F 'OK (5 tests)' /tmp/backlot-phase2.log
            if grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' /tmp/backlot-phase2.log; then exit 1; fi
            echo 'PASS Build283 Phase2 no-replay, snooze, and recovery isolation on Android API ${{ matrix.api }}'
