            grep -Fq "OK (2 tests)" v2293-personal-android15.log
            adb shell am instrument -w -r -e class com.framebynavin.app.personal.V2283FollowUpSafetyUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v2293-followups-android15.log
            grep -Fq "OK (2 tests)" v2293-followups-android15.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2284StageCelebrationUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v2293-stage-android15.log
            grep -Fq "OK (2 tests)" v2293-stage-android15.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2285WorkspaceFocusUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v2293-workspace-android15.log
            grep -Fq "OK (3 tests)" v2293-workspace-android15.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2291NudgePauseControlsUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v2293-nudge-android15.log
            grep -Fq "OK (2 tests)" v2293-nudge-android15.log
