name: Build FrameByNavin v1.7.5 YouTube Fix RC3

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.7.5-youtube-signing-fix
    paths:
      - "app/**"
      - "dev-signing/framebynavin-public-debug.jks"
      - "tools/v175_integrate.py"
      - "tools/v175_public_prepare.py"
      - "tools/v175_copy_polish.py"
      - "tools/v175_copy_polish_followup.py"
      - "tools/v175_youtube_signing_fix.py"
      - ".github/workflows/v175-youtube-fix-build.yml"
      - "*.gradle.kts"
      - "gradle.properties"

concurrency:
  group: framebynavin-v175-youtube-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Use stable prototype debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          cp dev-signing/framebynavin-public-debug.jks "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -F "SHA1: 27:C3:0C:07:18:79:38:95:CF:CB:5B:29:1E:66:1F:BD:4B:1C:76:D1"
          echo "Stable prototype signing fingerprint verified"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply v1.7.5 integration
        run: python3 tools/v175_integrate.py

      - name: Apply public-safe preparation
        run: python3 tools/v175_public_prepare.py

      - name: Apply UX copy polish
        run: python3 tools/v175_copy_polish.py

      - name: Finish plain-language pass
        run: python3 tools/v175_copy_polish_followup.py

      - name: Apply YouTube connection RC3 version
        run: python3 tools/v175_youtube_signing_fix.py

      - name: Release gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 39' app/build.gradle.kts
          grep -q 'versionName = "1.7.5-youtube-connection-fix-rc3"' app/build.gradle.kts
          test -s app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt
          test -s "$HOME/.android/debug.keystore"
          echo "RC3 source + stable signing gate passed"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signing and file
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | grep -F "Signer #1 certificate SHA-1 digest: 27c30c0718793895cfcb5b291e661fbd4b1c76d1"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.7.5-youtube-connection-fix-rc3
          path: app/build/outputs/apk/debug/app-debug.apk
