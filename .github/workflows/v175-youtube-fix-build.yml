name: Build FrameByNavin v1.7.5 Brand Ident RC4

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.7.5-brand-ident-rc4
    paths:
      - "app/**"
      - "dev-signing/framebynavin-public-debug.jks"
      - "tools/v175_integrate.py"
      - "tools/v175_brand_ident_rc4.py"
      - "tools/v175_public_prepare.py"
      - "tools/v175_copy_polish.py"
      - "tools/v175_copy_polish_followup.py"
      - "tools/v175_youtube_signing_fix.py"
      - ".github/workflows/v175-youtube-fix-build.yml"
      - "*.gradle.kts"
      - "gradle.properties"

concurrency:
  group: framebynavin-v175-brand-ident-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Inspect original prototype signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE=dev-signing/framebynavin-public-debug.jks
          test -s "$KEYSTORE"
          KEYINFO="$(keytool -list -v -keystore "$KEYSTORE" -storepass framebynavin-dev -alias framebynavin-dev)"
          echo "$KEYINFO" | grep -F "SHA1:"
          EXPECTED="$(echo "$KEYINFO" | sed -n 's/.*SHA1: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          test -n "$EXPECTED"
          printf '%s' "$EXPECTED" > /tmp/framebynavin_expected_sha1
          echo "Original prototype signing fingerprint captured"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply v1.7.5 integration
        run: python3 tools/v175_integrate.py

      - name: Apply RC4 original brand ident
        run: python3 tools/v175_brand_ident_rc4.py

      - name: Apply public-safe preparation
        run: python3 tools/v175_public_prepare.py

      - name: Apply UX copy polish
        run: python3 tools/v175_copy_polish.py

      - name: Finish plain-language pass
        run: python3 tools/v175_copy_polish_followup.py

      - name: Apply RC4 brand ident version and signing
        run: python3 tools/v175_youtube_signing_fix.py

      - name: Release gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 40' app/build.gradle.kts
          grep -q 'versionName = "1.7.5-brand-ident-rc4"' app/build.gradle.kts
          grep -q 'prototypeStable' app/build.gradle.kts
          grep -q 'black -> light -> mark -> name -> app' app/src/main/java/com/framebynavin/app/ui/V174CinematicWelcome.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt
          echo "RC4 brand ident + signing gate passed"

      - name: Package post-integration source for audit
        shell: bash
        run: |
          set -euo pipefail
          tar -czf FrameByNavin-v1.7.5-brand-ident-rc4-audit-source.tar.gz \
            app/src/main \
            app/src/test \
            app/src/androidTest \
            app/build.gradle.kts \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties

      - name: Upload audit source
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.7.5-brand-ident-rc4-audit-source
          path: FrameByNavin-v1.7.5-brand-ident-rc4-audit-source.tar.gz

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signing and file
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          ACTUAL="$(echo "$CERTS" | sed -n 's/.*SHA-1 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ': ')"
          EXPECTED="$(cat /tmp/framebynavin_expected_sha1)"
          test "$ACTUAL" = "$EXPECTED"
          echo "APK certificate matches original prototype certificate"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.7.5-brand-ident-rc4
          path: app/build/outputs/apk/debug/app-debug.apk
