name: Piano Studio P0 Build and Runtime QA

on:
  push:
    branches:
      - ci/piano-studio-alpha-03p0-20260906
    paths:
      - piano-ci/**
      - .github/workflows/piano-alpha-03p0.yml
  workflow_dispatch:

concurrency:
  group: piano-p0-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 and native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile, unit tests and instrumentation APK
        working-directory: piano-ci
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :core:music:testDebugUnitTest :core:designsystem:assembleDebug :core:data:assembleDebug --stacktrace
      - name: Verify P0 source, package, version and native ABI contracts
        shell: bash
        run: |
          set -euo pipefail
          apk=piano-ci/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -tq "$apk" | tail -1
          aapt="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" > /tmp/piano-p0-badging.txt
          grep -q "package: name='com.pianostudio.alpha' versionCode='9' versionName='0.3.3-alpha09-p0'" /tmp/piano-p0-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/piano-p0-badging.txt
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libpianostudio_audio.so'
          unzip -l "$apk" | grep -q 'lib/x86_64/libpianostudio_audio.so'
          nmtool="$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a x86_64; do
            mkdir -p "/tmp/piano-p0/$abi"
            unzip -p "$apk" "lib/$abi/libpianostudio_audio.so" > "/tmp/piano-p0/$abi/libpianostudio_audio.so"
            "$nmtool" -D --defined-only "/tmp/piano-p0/$abi/libpianostudio_audio.so" > "/tmp/piano-p0/$abi/symbols.txt"
            for symbol in R2AudioEngine_nativeStart R2AudioEngine_nativeNoteOn R2AudioEngine_nativeNoteOff R2AudioEngine_nativeStop R2PracticeAudio_nativeStart R2PracticeAudio_nativeSetMetronome R2PracticeAudio_nativeNoteOn R2PracticeAudio_nativeNoteOff R2LessonAudio_nativeStart R2LessonAudio_nativeNoteOn R2LessonAudio_nativeNoteOff; do
              grep -q "Java_com_pianostudio_alpha_$symbol" "/tmp/piano-p0/$abi/symbols.txt"
            done
          done
          test ! -e piano-ci/app/src/main/java/com/pianostudio/alpha/R2Smoke.kt
          test ! -e piano-ci/app/src/main/java/com/pianostudio/alpha/MainActivity.kt
      - name: Upload build verification APK
        uses: actions/upload-artifact@v4
        with:
          name: PianoStudio-P0-build
          path: |
            piano-ci/app/build/outputs/apk/debug/app-debug.apk
            piano-ci/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14

  runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: |
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: actions/download-artifact@v4
        with:
          name: PianoStudio-P0-build
          path: /tmp/piano-p0-build
      - name: Run actual activity and navigation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r /tmp/piano-p0-build/app-debug.apk
            adb install -r /tmp/piano-p0-build/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.pianostudio.alpha.P0NavigationSmokeTest com.pianostudio.alpha.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/piano-p0-instrumentation.txt
            grep -q '^OK (2 tests)' /tmp/piano-p0-instrumentation.txt
            mkdir -p /tmp/piano-p0-screens
            adb shell am start -W -n com.pianostudio.alpha/.StudioHomeActivity
            sleep 2
            adb exec-out screencap -p > /tmp/piano-p0-screens/home.png
            adb shell am start -W -n com.pianostudio.alpha/.LearningHubActivity
            sleep 2
            adb exec-out screencap -p > /tmp/piano-p0-screens/learn.png
            adb shell am start -W -n com.pianostudio.alpha/.StudioHomeActivity
            adb shell input keyevent 4
            adb logcat -d -v time > /tmp/piano-p0-logcat.txt
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PianoStudio-P0-runtime-evidence
          path: |
            /tmp/piano-p0-instrumentation.txt
            /tmp/piano-p0-logcat.txt
            /tmp/piano-p0-screens/*.png
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [build, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PianoStudio-P0-build
          path: /tmp/piano-p0-build
      - name: Prepare exact verified APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/piano-p0-build/app-debug.apk dist/PianoStudio-alpha-0.3P0-debug.apk
          cd dist
          sha256sum PianoStudio-alpha-0.3P0-debug.apk > PianoStudio-alpha-0.3P0-debug.apk.sha256
          printf '%s\n' "Commit: $GITHUB_SHA" "Version: 0.3.3-alpha09-p0 (9)" "Build and emulator navigation gates passed." > verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PianoStudio-alpha-0.3P0
          path: dist/
          retention-days: 30
