name: Backlot Phase 3A-3B - Continue Work Android QA (owner review only)
on:
  push:
    branches:
      - feature/backlot-phase3-home-3a3b-owner-review
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backlot-phase3-home-3ab
  cancel-in-progress: true

jobs:
  compile-and-native-home-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Static non-mutating Continue Work contract
        shell: bash
        run: |
          set -euo pipefail
          home=app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          grep -Fq '.testTag("phase3-home-continue")' "$home"
          grep -Fq 'onClick = { onOpenProject(selected.id) }' "$home"
          grep -Fq '.testTag("phase3-home-focus")' "$home"
          grep -Fq 'V219ReminderHomeEntry(tasks = tasks' "$home"
          ! grep -Fq 'Text("START THIS MOVE"' "$home"
          ! grep -Fq 'Text("PRIORITY ${recommendation.score}"' "$home"
          ! grep -Fq 'onClick = { onStart(selected.id) }' "$home"
          ! grep -Fq 'onAdvance(selected.id)' "$home"
          grep -Fq 'nextMoveHasNoDuplicateStartAndContinueOpensSelectedProject' app/src/androidTest/java/com/framebynavin/app/ui/V220HomeConsolidationUiTest.kt
          grep -Fq 'workingProjectHasContinueAndFocusWithoutDuplicateStartButtons' app/src/androidTest/java/com/framebynavin/app/ui/V220HomeConsolidationUiTest.kt
          grep -Fq 'phase3-project-begin' app/src/main/java/com/framebynavin/app/ui/V071WorkflowInlineContent.kt
          grep -Fq 'onStart = vm::startTask,' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          test -f app/src/androidTest/java/com/framebynavin/app/ui/Phase3ExplicitBeginProjectUiTest.kt
      - name: Compile app + Android instrumentations and run unit regression
        run: |
          set -euo pipefail
          timeout 75m gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable Android KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android 15 Continue navigation, Focus isolation and Home screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            mkdir -p output/backlot-phase3-3ab
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V220HomeConsolidationUiTest -e hardeningTestEnvironment ci-emulator -e backlotVisualProfile default com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee output/backlot-phase3-3ab/ANDROID-HOME-TEST.txt
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' output/backlot-phase3-3ab/ANDROID-HOME-TEST.txt; then exit 1; fi
            grep -Fq 'OK (5 tests)' output/backlot-phase3-3ab/ANDROID-HOME-TEST.txt
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.Phase3ExplicitBeginProjectUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee output/backlot-phase3-3ab/ANDROID-EXPLICIT-BEGIN-TEST.txt
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' output/backlot-phase3-3ab/ANDROID-EXPLICIT-BEGIN-TEST.txt; then exit 1; fi
            grep -Fq 'OK (2 tests)' output/backlot-phase3-3ab/ANDROID-EXPLICIT-BEGIN-TEST.txt
            adb exec-out run-as com.framebynavin.app cat "files/phase3-project-begin/planned-explicit-begin.png" > "output/backlot-phase3-3ab/phase3-planned-explicit-begin.png"
            test -s output/backlot-phase3-3ab/phase3-planned-explicit-begin.png
            for scene in phase3-next-move-collapsed phase3-next-move-expanded phase3-working-home-actions; do
              adb exec-out run-as com.framebynavin.app cat "files/v220-ui/v220-default-${scene}.png" > "output/backlot-phase3-3ab/v220-default-${scene}.png"
              test -s "output/backlot-phase3-3ab/v220-default-${scene}.png"
            done
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V215HomeFirstFoldVisualUiTest -e backlotVisualProfile default -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee output/backlot-phase3-3ab/ANDROID-HOME-NAV-TEST.txt
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' output/backlot-phase3-3ab/ANDROID-HOME-NAV-TEST.txt; then exit 1; fi
            grep -Fq 'OK (4 tests)' output/backlot-phase3-3ab/ANDROID-HOME-NAV-TEST.txt
            git rev-parse HEAD > output/backlot-phase3-3ab/SOURCE-COMMIT.txt
            sha256sum output/backlot-phase3-3ab/*.png > output/backlot-phase3-3ab/SCREENSHOT-SHA256SUMS.txt
      - name: Upload only owner-preview QA evidence, never a Play/owner signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Phase3A3B-Home-Native-QA-NOT-RELEASE
          path: |
            output/backlot-phase3-3ab/
            app/build/test-results/testDebugUnitTest/
          retention-days: 21
          if-no-files-found: warn
