name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feature/v149-supabase-voice-reminder-fix"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "----- FULL LINT REPORT -----"
              cat "$report"
              echo "----- END LINT REPORT -----"
            fi
            exit "$status"
          fi

      - name: Compile instrumentation test APK
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-v149-rc26-Supabase-Voice-Reminder-Fix
          path: app/build/outputs/apk/debug/app-debug.apk

  device-regression:
    name: RC26 device regression
    needs: build
    if: github.ref == 'refs/heads/feature/v149-supabase-voice-reminder-fix' || github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run connected Android regression suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
