name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feature/v1.3.2-reliability-recovery"
      - "repair/v1.3.2-release-blockers"
      - "feature/v142-framebynavin-v4-schedule"
      - "fix/v143-profile-weekly-progress"
      - "feature/v144-guide-schedule-refresh"
      - "fix/v145-guide-revenue-hotfix"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "----- FULL LINT REPORT -----"
              cat "$report"
              echo "----- END LINT REPORT -----"
            fi
            exit "$status"
          fi

      - name: Compile instrumentation test APK
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Run release-blocker UI smoke tests
        if: github.ref == 'refs/heads/repair/v1.3.2-release-blockers'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-v145-Guide-Revenue-Hotfix
          path: app/build/outputs/apk/debug/app-debug.apk

  ui-smoke-v145:
    if: github.ref == 'refs/heads/fix/v145-guide-revenue-hotfix'
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run V145 connected UI and guide asset smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.ui.V132ReleaseBlockerUiTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.ui.V145GuideAssetDecodeTest --stacktrace
