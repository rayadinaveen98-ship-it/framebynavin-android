name: V130 Cine Pulse Mascot Rebuild

on:
  push:
    branches:
      - "feature/v130-cine-pulse-mascot-rebuild"
    paths:
      - ".github/workflows/v130-cine-pulse-mascot-rebuild.yml"
      - "app/build.gradle.kts"
      - "app/src/main/java/com/framebynavin/app/ui/V130CinePulseMascot.kt"
      - "app/src/main/java/com/framebynavin/app/ui/V127GuideCompanion.kt"
      - "docs/visual-experience/V130_CINE_PULSE_MASCOT_REBUILD_SPEC.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v130-cine-pulse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v130 branch
        uses: actions/checkout@v4
        with:
          ref: feature/v130-cine-pulse-mascot-rebuild
          fetch-depth: 0

      - name: Verify mascot contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 130' app/build.gradle.kts
          grep -q '2.0.0-rc6-cine-pulse-mascot-rebuild' app/build.gradle.kts
          grep -q 'internal fun CinePulseMascotV130' app/src/main/java/com/framebynavin/app/ui/V130CinePulseMascot.kt
          grep -q 'CinePulseMascotV130(state = state' app/src/main/java/com/framebynavin/app/ui/V127GuideCompanion.kt
          ! grep -q 'CinePulseGuide(state = state' app/src/main/java/com/framebynavin/app/ui/V127GuideCompanion.kt
          grep -q 'heartPath' app/src/main/java/com/framebynavin/app/ui/V130CinePulseMascot.kt
          grep -q 'frontRibbon' app/src/main/java/com/framebynavin/app/ui/V130CinePulseMascot.kt
          grep -q 'backRibbon' app/src/main/java/com/framebynavin/app/ui/V130CinePulseMascot.kt
          grep -q 'CinePulseState.CELEBRATE' app/src/main/java/com/framebynavin/app/ui/V130CinePulseMascot.kt
          grep -q 'CinePulseState.WALK' app/src/main/java/com/framebynavin/app/ui/V130CinePulseMascot.kt
          grep -q 'android.permission.READ_CALENDAR' app/src/main/AndroidManifest.xml
          grep -q 'Nothing is listening yet' app/src/main/java/com/framebynavin/app/ui/V117VoiceQuickIdeaUi.kt
          grep -q 'ProjectAttentionPlan.URGENT' app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt
          grep -q 'ProjectAttentionPlan.CUSTOM' app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests, Kotlin compile and APK
        run: gradle :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FrameByNavin-v130-CinePulse-Mascot-Rebuild.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v130-cine-pulse-mascot-rebuild
          path: FrameByNavin-v130-CinePulse-Mascot-Rebuild.apk
          if-no-files-found: error
          retention-days: 90
