name: Backlot V290 - Signed Owner APK End-to-End Android Regression

on:
  push:
    branches: [feature/backlot-v290-signed-apk-regression]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-v290-signed-owner-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-owner-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Wait for pinned independent owner-preview artifact (never rebuild/debug substitute)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output
          for i in $(seq 1 75); do
            if gh run download 41858035754 --repo "${{ github.repository }}" \
              --name Backlot-V290-Private-Spaces-Owner-Test --dir output; then
              echo 'PASS: downloaded exact signed V290 candidate'
              break
            fi
            conclusion=$(gh run view 41858035754 --repo "${{ github.repository }}" --json conclusion -q '.conclusion' || true)
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "Upstream V290 build $conclusion; no signed APK was approved." >&2
              exit 1
            fi
            if [ "$i" -eq 75 ]; then
              echo 'Pinned signed V290 artifact not available; do not substitute debug APK' >&2
              exit 1
            fi
            sleep 30
          done
          (cd output && sha256sum -c SHA256SUMS.txt)
          test -s output/Backlot-V290-Private-Spaces-Owner-Test.apk
          test -s output/app-debug-androidTest.apk
      - name: Download previously verified V288 signer for comparison
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V288-Personal-OS-Owner-Test
          path: output/v288
          run-id: 41842400120
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signed owner identity, package, version and matching V288 signer
        run: |
          set -euo pipefail
          (cd output/v288 && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          import re
          v288=Path('output/v288/SIGNATURE-VERIFICATION.txt').read_text()
          v290=Path('output/SIGNATURE-VERIFICATION.txt').read_text()
          find=lambda x: re.search(r'V2 Signer: certificate SHA-256 digest: ([0-9a-f]{64})',x)
          assert find(v288) and find(v290), 'Missing V2 owner signer'
          assert find(v288).group(1)==find(v290).group(1), 'Owner preview signing key changed'
          assert "package: name='com.framebynavin.app' versionCode='290'" in Path('output/APK-IDENTITY.txt').read_text()
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in v290
          print('PASS: version 290 owner APK shares the signed V288 sideload identity')
          PY
      - name: Enable Android 15 emulator acceleration if supported
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo 'KVM available'
          else
            echo 'KVM not exposed; let Android Emulator runner attempt software mode'
          fi
      - name: Android 15 - exercise actual signed owner APK across 39 regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v290-signed-owner-regression.sh
