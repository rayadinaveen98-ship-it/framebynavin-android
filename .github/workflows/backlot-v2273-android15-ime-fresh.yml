name: V2273 Android15 Fresh Emulator IME Gate
on:
  push:
    branches: [qa/backlot-v2273-android15-ime-isolated-20261029]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fresh-ime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V2273-Device-QA-Test-APKs
          path: apks
          run-id: 40821754835
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real keyboard and Save Idea in fresh Android15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -e
            adb install -r "$(find apks -type f -name app-debug.apk -print -quit)"
            adb install -r "$(find apks -type f -name app-debug-androidTest.apk -print -quit)"
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.gestural
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2204NewIdeaRootOverlayUiTest -e backlotVisualProfile gestural com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee newidea-android15-isolated.log
            mkdir -p evidence
            adb exec-out run-as com.framebynavin.app cat files/v2204-idea-evidence/v2204-gestural-keyboard-clear.png > evidence/keyboard-first.png || true
            adb exec-out run-as com.framebynavin.app cat files/v2204-idea-evidence/v2204-gestural-keyboard-settled.png > evidence/keyboard-settled.png || true
            adb logcat -d -t 2000 | grep -Ei 'ANR in|Quickstep.*not responding|Input dispatching timed out' > evidence/system-anr.log || true
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' newidea-android15-isolated.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' newidea-android15-isolated.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V2273-Android15-Fresh-IME-Evidence
          path: |
            evidence/
            newidea-android15-isolated.log
          if-no-files-found: warn
