name: Backlot V197.1 — Adaptive Project and Reminder Screens
on:
  push:
    branches: [feature/backlot-v197-1-adaptive-project-reminders]
  workflow_dispatch:
  pull_request:
    branches: [feature/backlot-v197-adaptive-workspace-foundation]
permissions:
  contents: read
concurrency:
  group: backlot-v197-1-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preserve existing source contracts
        run: |
          set -euo pipefail
          # Historical source guards hard-code accepted version numbers through V185.
          # Run them against a temporary V185 version marker only; restore V192 before build.
          original=$(mktemp)
          cp app/build.gradle.kts "$original"
          trap 'cp "$original" app/build.gradle.kts; rm -f "$original"' EXIT
          sed -i -e 's/versionCode = 211/versionCode = 185/' \
                 -e 's/2.6.1-v197.1-adaptive-project-reminders-preview/2.3.5-v185-idea-conversion-preview/' app/build.gradle.kts
          for version in $(seq 161 182); do
            script=$(find tools -maxdepth 1 -name "check_v${version}_*.sh" | head -n 1)
            test -n "$script"
            echo "V${version} contract: $script"
            bash "$script"
          done
          cp "$original" app/build.gradle.kts
          rm -f "$original"
          trap - EXIT
          grep -Fq 'versionCode = 211' app/build.gradle.kts
          grep -Fq 'versionName = "2.6.1-v197.1-adaptive-project-reminders-preview"' app/build.gradle.kts
      - name: Verify minimal Insights UI contract
        run: bash tools/check_v190_insights_minimal.sh
      - name: Verify V191 stability invariants
        run: bash tools/check_v191_insights_stability.sh
      - name: Check V192 UI contract
        run: bash tools/check_v192_insights_thumbnails.sh
      - name: Verify V193 Pulse computation invariants
        run: bash tools/check_v193_pulse_truth.sh
      - name: Validate inherited V194 acceptance guards
        run: bash tools/check_v194_insights_acceptance.sh
      - name: Validate living-scene source contract
        run: bash tools/check_v195_living_scenes.sh
      - name: Validate V195.1 reminder delivery guards
        run: bash tools/check_v196_reminder_delivery.sh
      - name: Validate full-screen ambient scene and manual reveal
        run: bash tools/check_v197_immersive_particles.sh
      - name: Validate richer motion and vibrance source contracts
        run: bash tools/check_v198_motion_vibrance.sh
      - name: Validate Spark mode-specific animation and visual safety
        run: bash tools/check_v199_reminder_spark.sh
      - name: Validate V195.4 Phase 4B minimal reminder UI
        run: bash tools/check_v200_reminder_ui.sh
      - name: Validate V195.4 Phase 4C action feedback and callback safety
        run: bash tools/check_v201_action_feedback.sh
      - name: Validate V195.5 doubled motion and durable reminder countdown
        run: bash tools/check_v202_v203_premium_reminders.sh
      - name: Verify V196 workspace safety source rules
        run: |
          set -euo pipefail
          hub=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha6Ui.kt
          plan=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          publish=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha5Ui.kt
          grep -Fq 'val overallProgress = CreatorWorkflowEngine.progress(task)' "$hub"
          ! grep -Fq 'maxOf(workflowProgress, workspaceProgress)' "$hub"
          grep -Fq 'pendingRemovalId = d.id' "$plan"
          grep -Fq 'protectedRemovalIds(deliverables' "$plan"
          grep -Fq 'enabled = !gate.required && !protectedCheck' "$publish"
          grep -Fq 'enabled = !protectedCheck' "$publish"
          grep -Fq 'require(historyAtRisk.isEmpty())' app/src/main/java/com/framebynavin/app/data/CreatorContentStabilization.kt
          grep -Fq 'it.required && it.status != CreatorPublishGateStatus.DONE' app/src/main/java/com/framebynavin/app/data/CreatorPublishWorkflow.kt
      - name: Verify V196.2 workspace UI hierarchy
        run: |
          set -euo pipefail
          hub=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha6Ui.kt
          plan=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          script=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha4Ui.kt
          publish=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha5Ui.kt
          guide=app/src/main/java/com/framebynavin/app/ui/V20ContentBlueprintUi.kt
          grep -Fq 'val overallProgress = CreatorWorkflowEngine.progress(task)' "$hub"
          grep -Fq 'var showStages by rememberSaveable(task.id)' "$hub"
          grep -Fq 'MinimalWorkspaceToolCard(' "$hub"
          grep -Fq 'onOpenBlueprint' "$hub"
          grep -Fq 'pendingRemovalId = d.id' "$plan"
          ! grep -Fq 'Alpha3Section.SCRIPT' "$plan"
          ! grep -Fq '"JUMP TO"' "$plan"
          grep -Fq 'Alpha4Title("HOOKS", "")' "$script"
          grep -Fq 'Alpha5Title("FINAL CHECKS", ""' "$publish"
          ! grep -Fq 'onClick = {}' "$guide"
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V196WorkspaceMinimalUiTest.kt
      - name: Verify Phase 3 Plan-to-Script source contracts
        run: |
          set -euo pipefail
          a=app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          plan=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          script=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha4Ui.kt
          grep -Fq 'nextMode = Alpha6WorkspaceMode.SCRIPT' "$a"
          grep -Fq 'if (nextMode == Alpha6WorkspaceMode.SCRIPT) openScriptStudio(saved)' "$a"
          grep -Fq 'CreatorContentStabilization.prepareProjectEditorSave' "$a"
          grep -Fq 'onSaveAndScript(task.id, originalRevision, draft())' "$plan"
          grep -Fq 'CreatorPlanScriptBridge.fields(task.workspace)' "$script"
          test -f app/src/test/java/com/framebynavin/app/data/CreatorPlanScriptBridgeTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V196PlanScriptHandoffUiTest.kt
      - name: Verify Phase 3B Script-to-Publish contracts
        run: |
          set -euo pipefail
          a=app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          script=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha4Ui.kt
          publish=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha5Ui.kt
          bridge=app/src/main/java/com/framebynavin/app/data/CreatorScriptPublishBridge.kt
          grep -Fq 'nextMode = Alpha6WorkspaceMode.PUBLISH' "$a"
          grep -Fq 'mode = if (nextMode == Alpha6WorkspaceMode.PUBLISH)' "$a"
          grep -Fq 'onSaveAndPublish(originalStudioRevision, originalWorkspaceRevision, draft())' "$script"
          grep -Fq 'CreatorScriptPublishBridge.selectedTitle(task.workspace.scriptStudio)' "$publish"
          grep -Fq 'CreatorScriptPublishBridge.useTitle(currentTarget, scriptTitle)' "$publish"
          grep -Fq 'deliverable.publicationHistory.isEmpty()' "$bridge"
          grep -Fq 'deliverable.status != CreatorDeliverableStatus.PUBLISHED' "$bridge"
          test -f app/src/test/java/com/framebynavin/app/data/CreatorScriptPublishBridgeTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V196ScriptPublishHandoffUiTest.kt
      - name: Verify Phase 3C reference and asset open contracts
        run: |
          set -euo pipefail
          plan=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          opener=app/src/main/java/com/framebynavin/app/ui/CreatorWorkspaceExternalOpen.kt
          rules=app/src/main/java/com/framebynavin/app/data/CreatorWorkspaceLinkRules.kt
          grep -Fq 'CreatorWorkspaceExternalOpen.openSource(context, ref.url)' "$plan"
          grep -Fq 'CreatorWorkspaceExternalOpen.openAsset(context, asset.location)' "$plan"
          grep -Fq 'CreatorWorkspaceLinkRules.isAssetLocation(asset.location)' "$plan"
          grep -Fq 'CreatorWorkspaceLinkRules.isWebUrl(ref.url)' "$plan"
          grep -Fq 'Intent.FLAG_GRANT_READ_URI_PERMISSION' "$opener"
          grep -Fq 'Intent.ACTION_VIEW' "$opener"
          ! grep -Fq 'Intent.FLAG_GRANT_WRITE_URI_PERMISSION' "$opener"
          grep -Fq 'uri.rawUserInfo == null' "$rules"
          grep -Fq 'uri.scheme.equals("content", true)' "$rules"
          test -f app/src/test/java/com/framebynavin/app/data/CreatorWorkspaceLinkRulesTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V196ResearchAssetUiTest.kt
      - name: Verify Phase 4 save and durability guards
        run: |
          set -euo pipefail
          activity=app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          gate=app/src/main/java/com/framebynavin/app/data/CreatorWorkspaceSaveGate.kt
          grep -Fq 'private val saveGate = CreatorWorkspaceSaveGate()' "$activity"
          test "$(grep -Fc 'if (!saveGate.tryBegin()) return' "$activity")" = 2
          test "$(grep -Fc 'saveGate.end()' "$activity")" = 2
          grep -Fq 'Publication reconciliation deferred' "$activity"
          grep -Fq 'Stale editor draft cleanup deferred' "$activity"
          grep -Fq 'Script draft cleanup deferred' "$activity"
          grep -Fq 'AtomicBoolean(false)' "$gate"
          test -f app/src/test/java/com/framebynavin/app/data/CreatorWorkspaceSaveGateTest.kt
          test -f app/src/test/java/com/framebynavin/app/data/CreatorWorkspaceEndToEndTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/V196WorkspaceDurabilityAndroidTest.kt
      - name: Verify V197 responsive window and save contract
        run: |
          set -euo pipefail
          path=app/src/main/java/com/framebynavin/app/ui/
          for f in V19ContentWorkspaceAlpha3Ui.kt V19ContentWorkspaceAlpha4Ui.kt V19ContentWorkspaceAlpha5Ui.kt V19ContentWorkspaceAlpha6Ui.kt V20ContentBlueprintUi.kt; do
            grep -Fq 'WorkspaceAdaptiveFrame {' "${path}${f}"
            ! grep -Fq 'Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false))' "${path}${f}"
          done
          frame=${path}WorkspaceAdaptiveFrame.kt
          activity=${path}ContentWorkspaceActivity.kt
          plan=${path}V19ContentWorkspaceAlpha3Ui.kt
          grep -Fq '.windowInsetsPadding(WindowInsets.safeDrawing)' "$frame"
          grep -Fq '.imePadding()' "$frame"
          grep -Fq 'contentWindowInsets = WindowInsets(0, 0, 0, 0)' "$frame"
          grep -Fq 'maxWidth < 380.dp || largeText' "$frame"
          grep -Fq 'BackHandler(enabled = !confirmEditorClose' "$activity"
          grep -Fq 'ScrollableTabRow(' "$plan"
          grep -Fq 'LocalDensity.current.fontScale >= 1.3f' "$plan"
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V197AdaptiveWorkspaceUiTest.kt
      - name: Verify V197.1 app overlay source contracts
        run: |
          set -euo pipefail
          ui=app/src/main/java/com/framebynavin/app/ui
          grep -Fq 'BackHandler(onBack = onDismissRequest)' "$ui/CreatorAdaptiveFullScreen.kt"
          grep -Fq '.windowInsetsPadding(WindowInsets.safeDrawing)' "$ui/CreatorAdaptiveFullScreen.kt"
          grep -Fq '.imePadding()' "$ui/CreatorAdaptiveFullScreen.kt"
          grep -Fq 'CreatorAdaptiveFullScreen(onDismissRequest = onDismiss)' "$ui/V20NewProjectWizard.kt"
          grep -Fq 'CreatorAdaptiveFullScreen(' "$ui/V157ReminderCenterUi.kt"
          grep -Fq 'CreatorAdaptiveFullScreen(onDismissRequest = { requestExit() })' "$ui/V101BReminderUi.kt"
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V197AdaptiveAppOverlaysUiTest.kt
      - name: Clean build, regressions, lint and instrumentation compilation
        run: gradle :app:clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePersonalStable --stacktrace
      - name: Upload compiled instrumentation APKs
        uses: actions/upload-artifact@v4
        with:
          name: V197-1-Instrumentation-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload candidate and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V197-1-Adaptive-Preview-APK
          path: |
            app/build/outputs/apk/personalStable/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: V197-1-Instrumentation-APKs
          path: instrumentation-apks
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute precompiled Android 11 acceptance suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r instrumentation-apks/debug/app-debug.apk
            adb install -r instrumentation-apks/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            bash tools/run_v185_instrumentation.sh
            adb shell am instrument -w -r -e class com.framebynavin.app.youtube.YouTubeCacheLifecycleV183Test -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v187-insights-instrumentation.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v187-insights-instrumentation.log; then exit 1; fi
            grep -Fq 'OK (8 tests)' v187-insights-instrumentation.log
            adb shell am instrument -w -r -e class com.framebynavin.app.youtube.V188RevenueAndReachOwnerTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v188-revenue-audience-instrumentation.log
            grep -Fq 'OK (3 tests)' v188-revenue-audience-instrumentation.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V189VideoUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v189-video-ui-instrumentation.log
            grep -Fq 'OK (2 tests)' v189-video-ui-instrumentation.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V190InsightsUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v190-insights-ui-instrumentation.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v190-insights-ui-instrumentation.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' v190-insights-ui-instrumentation.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V191ContentStabilityUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v191-content-stability-instrumentation.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v191-content-stability-instrumentation.log; then exit 1; fi
            grep -Fq 'OK (1 test)' v191-content-stability-instrumentation.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V192ThumbnailSortUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v192-thumbnail-sort-instrumentation.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v192-thumbnail-sort-instrumentation.log; then exit 1; fi
            grep -Fq 'OK (1 test)' v192-thumbnail-sort-instrumentation.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V194InsightsSnapshotOwnershipUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v194-snapshot-ownership-instrumentation.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v194-snapshot-ownership-instrumentation.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v194-snapshot-ownership-instrumentation.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V196WorkspaceMinimalUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v196-p2-workspace-ui.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v196-p2-workspace-ui.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v196-p2-workspace-ui.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V196PlanScriptHandoffUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v196-p3-plan-script-ui.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v196-p3-plan-script-ui.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v196-p3-plan-script-ui.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V196ScriptPublishHandoffUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v196-p3b-script-publish-ui.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v196-p3b-script-publish-ui.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' v196-p3b-script-publish-ui.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V196ResearchAssetUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v196-p3c-research-assets-ui.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v196-p3c-research-assets-ui.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v196-p3c-research-assets-ui.log
            adb shell am instrument -w -r -e class com.framebynavin.app.data.V196WorkspaceDurabilityAndroidTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v196-p4-durability.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v196-p4-durability.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v196-p4-durability.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V197AdaptiveWorkspaceUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v197-adaptive-default.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v197-adaptive-default.log; then exit 1; fi
            grep -Fq 'OK (5 tests)' v197-adaptive-default.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V197AdaptiveAppOverlaysUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v197-1-overlays-default.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v197-1-overlays-default.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' v197-1-overlays-default.log
            # Compact phone + accessibility font scaling. Reset before remaining app suites.
            adb shell wm size 900x1600
            adb shell settings put system font_scale 1.5
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V197AdaptiveWorkspaceUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v197-adaptive-compact.log
            adb shell wm size reset
            adb shell settings put system font_scale 1.0
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v197-adaptive-compact.log; then exit 1; fi
            grep -Fq 'OK (5 tests)' v197-adaptive-compact.log
            adb shell wm size 900x1600
            adb shell settings put system font_scale 1.5
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V197AdaptiveAppOverlaysUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v197-1-overlays-compact.log
            adb shell wm size reset
            adb shell settings put system font_scale 1.0
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v197-1-overlays-compact.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' v197-1-overlays-compact.log
            adb shell am instrument -w -r -e class com.framebynavin.app.reminders.V195ReminderSceneUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v195-reminder-scene-ui.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v195-reminder-scene-ui.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v195-reminder-scene-ui.log
            adb shell am instrument -w -r -e class com.framebynavin.app.reminders.V197ImmersiveSceneUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v197-immersive-scene-ui.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v197-immersive-scene-ui.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v197-immersive-scene-ui.log
            adb shell am instrument -w -r -e class com.framebynavin.app.reminders.V199ReminderSparkUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v199-spark-expression-ui.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v199-spark-expression-ui.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v199-spark-expression-ui.log
            adb shell am instrument -w -r -e class com.framebynavin.app.reminders.V200ReminderUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v200-reminder-ui.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v200-reminder-ui.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' v200-reminder-ui.log
            adb shell am instrument -w -r -e class com.framebynavin.app.reminders.V201ReminderFeedbackUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v201-reminder-feedback-ui.log
