name: Build FrameByNavin v1.7.2 APK

on:
  push:
    branches:
      - "feature/v1.7.2-insights-upgrade"
    paths:
      - "app/**"
      - ".github/workflows/v172-simple-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v1.7.2-insights-upgrade
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.7.2-insights-upgrade-rc1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
