name: Package v1.3.2 Verified Hero Frames

on:
  workflow_dispatch:
  push:
    branches: [ "repair/v1.3.2-release-blockers" ]
    paths:
      - ".github/workflows/v132-package-hero-frames.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/v1.3.2-release-blockers
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cherry-pick verified image tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 7025276e0794633a3993954aa93dddb75778cbb6
          git push origin HEAD:repair/v1.3.2-release-blockers
