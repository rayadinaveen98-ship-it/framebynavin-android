name: Backlot P0 V337 combined reliability gates

on:
  push:
    branches:
      - integration/backlot-v337-p0-reliability-combined-20261116

permissions:
  contents: read

concurrency:
  group: backlot-p0-v337-combined-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: All JVM regressions, no tests excluded
        run: |
          set -euo pipefail
          mkdir -p output/p0-combined/jvm
          git rev-parse HEAD > output/p0-combined/jvm/SOURCE-SHA.txt
          timeout --signal=TERM --kill-after=20s 80m gradle :app:testDebugUnitTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
            --console=plain 2>&1 | tee output/p0-combined/jvm/RESULT.log
      - name: Preserve all JVM XML and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-P0-Combined-Full-JVM
          path: |
            output/p0-combined/jvm/
            app/build/test-results/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn

  android15-unexcluded:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile ALL Android instrumentation tests; do not quarantine V339-V343
        run: |
          set -euo pipefail
          mkdir -p output/p0-combined/android15
          git rev-parse HEAD > output/p0-combined/android15/SOURCE-SHA.txt
          git ls-files app/src/androidTest/java > output/p0-combined/android15/TEST-SOURCES.txt
          timeout --signal=TERM --kill-after=20s 70m gradle :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
            --console=plain 2>&1 | tee output/p0-combined/android15/BUILD.log
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Validate corrected channel contract and natural 10-minute Snooze on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            bash -euo pipefail <<'BASH'
            mkdir -p output/p0-combined/android15
            out=output/p0-combined/android15
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -qx '1'
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am force-stop com.framebynavin.app || true
            adb shell pm clear com.framebynavin.app > "$out/CLEARED_CI_CHANNEL_TEST.txt"
            adb shell pm grant com.framebynavin.app android.permission.POST_NOTIFICATIONS
            timeout --signal=TERM --kill-after=20s 5m adb shell am instrument -w -r \
              -e hardeningTestEnvironment ci-emulator \
              -e class com.framebynavin.app.personal.P0AlertHealthCorrectedDeviceTest \
              com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner \
              > "$out/CORRECTED_CHANNEL_CONTRACT.txt" 2>&1 || {
                cat "$out/CORRECTED_CHANNEL_CONTRACT.txt"
                exit 1
              }
            cat "$out/CORRECTED_CHANNEL_CONTRACT.txt"
            grep -q 'OK (1 test)' "$out/CORRECTED_CHANNEL_CONTRACT.txt"
            # The Snooze harness clears only the disposable CI emulator app,
            # sets exact-alarm appop and waits for a real 10-minute OS redelivery.
            bash tools/qa/backlot_p0_actual_snooze_android15.sh
            BASH
      - name: Preserve all Android build and real OS delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-P0-Combined-Android15
          path: |
            output/p0-combined/android15/
            output/p0-actual-snooze/
          retention-days: 30
          if-no-files-found: warn
