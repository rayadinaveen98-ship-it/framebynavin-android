name: Backlot V176 New Project P6 — Release Acceptance Candidate

on:
  push:
    branches:
      - feature/backlot-v176-new-project-p6-release-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v176-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: V176 full project regressions and candidate APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Confirm V176 identity
        run: |
          grep -q 'versionCode = 176' app/build.gradle.kts
          grep -q '2.2.6-v176-new-project-acceptance-preview' app/build.gradle.kts
      - name: Preserve V161–V175 and verify P6 release safeguards
        run: |
          for version in 161 162 163 164 165 166 167 168 169 170; do
            script=$(find tools -maxdepth 1 -name "check_v${version}_*.sh" | head -n 1)
            test -n "$script"
            bash "$script"
          done
          bash tools/check_v171_project_safety.sh
          bash tools/check_v172_new_project_draft_ux.sh
          bash tools/check_v173_new_project_visual_consistency.sh
          bash tools/check_v174_quick_create.sh
          bash tools/check_v175_project_details.sh
          bash tools/check_v176_release_acceptance.sh
      - name: JVM unit regression tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Android instrumentation-test compilation
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build debug preview APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V176 candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v176-new-project-p6-qa-candidate-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  android-emulator:
    name: Android 11 New Project creation/edit/backup acceptance
    needs: android-apk
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run New Project end-to-end UI and persistence cases on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            gradle :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.ui.V156ReminderSetupUiInstrumentedTest,com.framebynavin.app.ui.V172DraftDiscardUiTest,com.framebynavin.app.ui.V173ProjectVisualUiTest,com.framebynavin.app.ui.V174QuickCreateReminderUiTest,com.framebynavin.app.ui.V175ProjectNotesUiTest,com.framebynavin.app.ui.V176ProjectJourneyUiTest,com.framebynavin.app.data.V176ProjectPersistenceInstrumentedTest,com.framebynavin.app.data.ProjectPulseRc3PersistenceInstrumentedTest,com.framebynavin.app.ui.V170LocalBackupScreenUiTest,com.framebynavin.app.ui.V169SettingsRemindersPlanningUiTest" --stacktrace
      - name: Upload Android 11 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v176-android11-new-project-acceptance-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30
