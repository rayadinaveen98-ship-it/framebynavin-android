name: V144 Route Settings Hub Once

on:
  push:
    branches:
      - feature/v144-guide-schedule-refresh
    paths:
      - .github/workflows/v144-route-settings-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v144-guide-schedule-refresh
          fetch-depth: 0

      - name: Route V144 settings hub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt')
          text = p.read_text()
          route_old = 'POverlay.SETTINGS -> PSettingsScreen('
          route_new = 'POverlay.SETTINGS -> V144SettingsHub('
          permissions_old = '                permissions = permissions,'
          permissions_new = '''                notificationsReady = permissions.notifications,
                preciseTimingReady = permissions.preciseTiming,
                fullScreenReady = permissions.fullScreen,
                batteryReady = permissions.batteryAccess,'''
          if text.count(route_old) != 1:
              raise SystemExit(f'Expected one Settings route, found {text.count(route_old)}; refusing rewrite.')
          if text.count(permissions_old) != 1:
              raise SystemExit(f'Expected one Settings permissions argument, found {text.count(permissions_old)}; refusing rewrite.')
          text = text.replace(route_old, route_new, 1)
          text = text.replace(permissions_old, permissions_new, 1)
          p.write_text(text)
          PY

      - name: Commit routing change and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v144-route-settings-once.yml
          git add app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          git commit -m "feat(v144): route categorized settings hub"
          git push origin HEAD:feature/v144-guide-schedule-refresh
