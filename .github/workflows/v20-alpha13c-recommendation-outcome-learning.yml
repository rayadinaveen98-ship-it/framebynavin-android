name: v2.0 Alpha 1.3C Recommendation Outcome Learning

on:
  push:
    branches:
      - "develop/v2.0-alpha1.3c-recommendation-outcome-learning"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha13c-recommendation-outcome-learning
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v109 learning-loop invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 109' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.3c-recommendation-outcome-learning"' app/build.gradle.kts
          grep -q 'class CreatorRecommendationOutcomeStore' app/src/main/java/com/framebynavin/app/data/CreatorRecommendationOutcomeLearning.kt
          grep -q 'object CreatorRecommendationOutcomeEngine' app/src/main/java/com/framebynavin/app/data/CreatorRecommendationOutcomeLearning.kt
          grep -q 'CreatorRecommendationOutcomeStatus.EVALUATED' app/src/main/java/com/framebynavin/app/data/CreatorRecommendationOutcomeLearning.kt
          grep -q 'sourceRefId == outcome.ideaId' app/src/main/java/com/framebynavin/app/data/CreatorRecommendationOutcomeLearning.kt
          grep -q 'RECOMMENDATION LEARNING' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'outcomeStore.recordAction(opportunity)' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'NOW · NEXT · LATER' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'ANALYZE VIDEO WITH GEMINI' app/src/main/java/com/framebynavin/app/ui/V20GeminiIntelligenceUi.kt
          grep -q 'ProjectPulseEngine::repairFalseSurfaceCompletion' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          if grep -R --line-number 'AIzaSy' app/src/main app/src/debug app/src/release; then
            echo 'Firebase API keys must not be copied into Kotlin/Java source.' >&2
            exit 1
          fi
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.3c-recommendation-outcome-learning.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.3c-recommendation-outcome-learning.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.3c-recommendation-outcome-learning"
            echo "versionCode=109"
            echo "commit=$(git rev-parse HEAD)"
            echo "opportunityNowNextLater=true"
            echo "recommendationActionTracking=true"
            echo "ideaToProjectOutcomeLink=true"
            echo "publishOutcomeLink=true"
            echo "youtubePerformanceEvaluation=true"
            echo "recommendationLearningSummary=true"
            echo "liveGeminiVideoAutopsyPreserved=true"
            echo "reminderCompletionSafetyPreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.3c-recommendation-outcome-learning-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.3c-recommendation-outcome-learning.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.3c-recommendation-outcome-learning-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.3c-recommendation-outcome-learning-validated
