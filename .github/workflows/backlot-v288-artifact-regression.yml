name: Backlot V288 - Verified Artifact Android Regression

on:
  push:
    branches: [feature/backlot-v288-artifact-regression]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-v288-artifact-regression
  cancel-in-progress: true

jobs:
  instrument-existing-v288:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Download previously built and signed V288 APKs (7bc26565)
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V288-Personal-OS-Owner-Test
          path: output
          run-id: 41834705679
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify artifact checksums, immutable build identity and test-script fix
        run: |
          set -euo pipefail
          (cd output && sha256sum -c SHA256SUMS.txt)
          test -s output/Backlot-V288-Personal-OS-Owner-Test.apk
          test -s output/app-debug.apk
          test -s output/app-debug-androidTest.apk
          grep -F 'grep -F "OK (1 test)" "$logfile"' .github/scripts/backlot-personal-instrumentation.sh
          echo 'PASS: reuse the existing V288 signed APK and updated runner script'
      - name: Enable KVM when available (no hard fail on inaccessible host)
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo 'KVM ready'
          else
            echo 'KVM not exposed on this runner; emulator may use software acceleration'
          fi
      - name: Android 15 all V288 + Personal V223-V287 regression classes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-personal-instrumentation.sh com.framebynavin.app.ui.V288PersonalOsUiTest com.framebynavin.app.ui.V2232PersonalReminderUiTest com.framebynavin.app.ui.V274SelfCareEditorUiTest com.framebynavin.app.ui.V287NapWakeUiTest com.framebynavin.app.ui.V286PersonalReadinessUiTest com.framebynavin.app.ui.V285PersonalLifePlannerUiTest com.framebynavin.app.personal.V285PersonalLifeNotificationsDeviceTest com.framebynavin.app.ui.V284DietFitnessSetupUiTest com.framebynavin.app.personal.V284DietFitnessPlanDeviceTest
