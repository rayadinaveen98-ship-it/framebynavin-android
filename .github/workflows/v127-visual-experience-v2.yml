name: V127 Visual Experience V2

on:
  push:
    branches:
      - "feature/v127-visual-experience-v2"
    paths:
      - ".github/workflows/v127-visual-experience-v2.yml"
      - "scripts/v127_visual_experience_patch.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v127-visual-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v127 branch
        uses: actions/checkout@v4
        with:
          ref: feature/v127-visual-experience-v2
          fetch-depth: 0

      - name: Apply v127 integration patch
        run: python3 scripts/v127_visual_experience_patch.py

      - name: Verify visual experience contract
        shell: bash
        run: |
          set -euo pipefail
          THEME=app/src/main/java/com/framebynavin/app/ui/theme/FrameByNavinTheme.kt
          GUIDE=app/src/main/java/com/framebynavin/app/ui/V20GuidedFirstRun.kt
          VOICE=app/src/main/java/com/framebynavin/app/ui/V117VoiceQuickIdeaUi.kt
          TRANSCRIBER=app/src/main/java/com/framebynavin/app/voice/IdeaVoiceTranscriber.kt
          MANIFEST=app/src/main/AndroidManifest.xml
          WIZARD=app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt

          grep -q 'versionCode = 127' app/build.gradle.kts
          grep -q '2.0.0-rc3-visual-experience-v2' app/build.gradle.kts
          for theme in DIRECTORS_CUT MIDNIGHT EMBER VIOLET_NEON IVORY_STUDIO; do grep -q "$theme" "$THEME"; done
          grep -q 'VisualExperiencePrefs' "$THEME"
          grep -q 'V127AppearanceSettings' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'FrameGuideCompanion' "$GUIDE"
          grep -q 'V127SetupGuideStrip(page)' app/src/main/java/com/framebynavin/app/ui/V18CreatorOnboarding.kt
          grep -q 'FramePulseOrb' "$VOICE"
          grep -q 'listener.onRmsChanged(rmsdB)' "$TRANSCRIBER"
          grep -q 'V20_WELCOME_STRIPE_COUNT = 26' app/src/main/java/com/framebynavin/app/ui/V174CinematicWelcome.kt
          grep -q 'WelcomeSonicIdent.play' app/src/main/java/com/framebynavin/app/ui/V174CinematicWelcome.kt
          grep -q 'V127StageCompletionPulse' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'V127RewardAura' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt

          for provider in QuickIdeaWidgetProvider NewProjectWidgetProvider CurrentProjectWidgetProvider NextReminderWidgetProvider ContentCalendarWidgetProvider DailyBriefWidgetProvider CreatorInsightsWidgetProvider; do
            grep -q "$provider" "$MANIFEST"
          done

          # Preserve the v126 New Project parity contract.
          grep -q 'ProjectAttentionPlan.URGENT' "$WIZARD"
          grep -q 'ProjectAttentionPlan.CUSTOM' "$WIZARD"
          grep -q 'REMINDER STYLE' "$WIZARD"
          grep -q 'NOTES · OPTIONAL' "$WIZARD"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests, Kotlin compile and APK
        run: gradle :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleDebug --stacktrace

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FrameByNavin CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/build.gradle.kts app/src
          if ! git diff --cached --quiet; then
            git commit -m "feat(v127): integrate Visual Experience V2"
            git push origin HEAD:feature/v127-visual-experience-v2
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v127-visual-experience-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
