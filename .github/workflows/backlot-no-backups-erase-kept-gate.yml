name: Backlot — Backup/Restore Withdrawal, Local Erase Retained (QA ONLY)

on:
  push:
    branches:
      - feature/backlot-no-backup-settings-keep-erase-20261114
    paths:
      - 'app/**'
      - '.github/workflows/backlot-no-backups-erase-kept-gate.yml'
      - '.github/scripts/backlot_no_backup_settings_android15.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-withdraw-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assert all old backup routes withdrawn and local erase remains
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.framebynavin.app"' app/build.gradle.kts
          grep -Fq 'versionCode = 336' app/build.gradle.kts
          grep -Fq 'create("personalStable")' app/build.gradle.kts
          ! grep -Fq 'Backup & storage' app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt
          ! grep -Fq 'V167SettingsSection.DATA' app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt
          ! grep -Fq 'Cloud Sync' app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt
          ! grep -Fq 'BackupActivity' app/src/main/AndroidManifest.xml
          ! grep -Fq 'PersonalBackupActivity' app/src/main/AndroidManifest.xml
          ! grep -Fq 'RecoveryCopiesActivity' app/src/main/AndroidManifest.xml
          ! grep -Fq 'CloudSyncActivity' app/src/main/AndroidManifest.xml
          grep -Fq '.ui.FreshStartActivity' app/src/main/AndroidManifest.xml
          grep -Fq 'clearApplicationUserData()' app/src/main/java/com/framebynavin/app/ui/FreshStartActivity.kt
          grep -Fq 'V383UnifiedDeviceResetPreflight.inspect(filesDir)' app/src/main/java/com/framebynavin/app/ui/FreshStartActivity.kt
          grep -Fq 'override suspend fun doWork(): Result = Result.success()' app/src/main/java/com/framebynavin/app/cloud/CreatorCloudSyncWorker.kt
      - name: Run complete JVM regressions and compile debug/test/preview APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/rollback/build
          timeout --signal=TERM --kill-after=20s 6200s \
            gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePersonalStable \
              --no-daemon --no-parallel --max-workers=1 \
              -Pkotlin.compiler.execution.strategy=in-process \
              '-Dorg.gradle.jvmargs=-Xmx9g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
              --console=plain --stacktrace 2>&1 | tee output/rollback/build/BUILD.log
      - name: Verify original preview signature and exact APK identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/rollback/debug output/rollback/signed
          cp app/build/outputs/apk/debug/app-debug.apk output/rollback/debug/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/rollback/debug/
          cp app/build/outputs/apk/personalStable/app-personalStable.apk output/rollback/signed/Backlot-No-Backup-Restore-Keep-Erase-V336-QA.apk
          (cd output/rollback/debug && sha256sum *.apk > SHA256SUMS.txt)
          (cd output/rollback/signed && sha256sum *.apk > SHA256SUMS.txt)
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs output/rollback/signed/*.apk > output/rollback/signed/SIGNER.txt
          "$aapt" dump badging output/rollback/signed/*.apk | head -n 8 > output/rollback/signed/IDENTITY.txt
          grep -Fq "package: name='com.framebynavin.app' versionCode='336'" output/rollback/signed/IDENTITY.txt
          grep -Fq 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0' output/rollback/signed/SIGNER.txt
          git rev-parse HEAD > output/rollback/signed/SOURCE-SHA.txt
      - name: Save compile diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Withdrawn-Backup-Compile-Evidence
          path: output/rollback/build/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload matching disposable emulator APKs
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Withdrawn-Backup-Debug-AndroidTest-APKs
          path: output/rollback/debug/
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed candidate for downstream acceptance (not an owner release)
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Withdrawn-Backup-Internal-Signed-Candidate
          path: output/rollback/signed/
          if-no-files-found: error
          retention-days: 14

  android15-settings-and-erase:
    needs: source-build-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-Withdrawn-Backup-Debug-AndroidTest-APKs
          path: output/rollback/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Settings and non-destructive Erase local data UI on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot_no_backup_settings_android15.sh
      - name: Upload Android 15 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Withdrawn-Backup-Android15-UI-Evidence
          path: output/rollback/device/
          if-no-files-found: warn
          retention-days: 21

  owner-preview-artifact:
    needs: [source-build-and-unit, android15-settings-and-erase]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-Withdrawn-Backup-Internal-Signed-Candidate
          path: output/rollback/signed/
      - name: Verify signed APK checksum before owner preview publication
        run: |
          (cd output/rollback/signed && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-No-Backup-Restore-Keep-Local-Erase-V336-Owner-QA
          path: output/rollback/signed/
          if-no-files-found: error
          retention-days: 30
