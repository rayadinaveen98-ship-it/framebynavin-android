name: Backlot V292 - Signed Owner V287 and V291 In-Place Upgrade

on:
  push:
    branches: [feature/backlot-v292-owner-inplace-preservation]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-v292-owner-inplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-owner-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile signed V292 and personalStable-matched Android test runner
        run: |
          set -euo pipefail
          timeout 80m gradle :app:assemblePersonalStable :app:assemblePersonalStableAndroidTest \
            -PbacklotSignedOwnerTest=true -x :app:lintVitalPersonalStable \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
          mkdir -p output/v292
          cp app/build/outputs/apk/personalStable/app-personalStable.apk output/v292/Backlot-V292-Signed-Upgrade-Test.apk
          cp app/build/outputs/apk/androidTest/personalStable/app-personalStable-androidTest.apk output/v292/app-personalStable-androidTest.apk
          (cd output/v292 && sha256sum *.apk > SHA256SUMS.txt)
      - name: Download verified V287 owner APK
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V287-Nap-Wake-Owner-Test
          path: output/v287
          run-id: 41809150847
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download V291 APK from passed signed-owner Android tests
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V291-Signed-Owner-Domain-Regression
          path: output/v291
          run-id: 41951919175
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify old and new APK checksums, identity and V2 signing equality
        run: |
          set -euo pipefail
          for v in v287 v291 v292; do
            (cd "output/$v" && sha256sum -c SHA256SUMS.txt)
          done
          grep -q "package: name='com.framebynavin.app' versionCode='287'" output/v287/APK-IDENTITY.txt
          grep -q "package: name='com.framebynavin.app' versionCode='291'" output/v291/APK-IDENTITY.txt
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          signer="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs output/v292/Backlot-V292-Signed-Upgrade-Test.apk > output/v292/SIGNATURE-VERIFICATION.txt
          "$aapt" dump badging output/v292/Backlot-V292-Signed-Upgrade-Test.apk > output/v292/APK-IDENTITY.txt
          grep -q "package: name='com.framebynavin.app' versionCode='292'" output/v292/APK-IDENTITY.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          certs = []
          for v in ('v287', 'v291', 'v292'):
              content = Path(f'output/{v}/SIGNATURE-VERIFICATION.txt').read_text()
              assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in content, v
              found = re.search(r'V2 Signer: certificate SHA-256 digest: ([0-9a-f]{64})', content)
              assert found, f'{v} missing verified signer'
              certs.append(found.group(1))
          assert len(set(certs)) == 1, f'Signer mismatch: {certs}'
          assert certs[0] == 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0'
          print('PASS: all three APKs share signed sideload owner identity')
          PY
      - name: Enable Android 15 emulator acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 verified V287→V292 and V291→V292 owner preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v292-owner-direct-inplace.sh
