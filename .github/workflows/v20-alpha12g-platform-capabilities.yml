name: v2.0 Alpha 1.2G Platform Capabilities

on:
  push:
    branches:
      - "develop/v2.0-alpha1.2g-platform-capabilities"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha12g-platform-capabilities
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize Platform Capabilities
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v20_alpha12g_platform_capabilities.py
          git diff --check

      - name: Verify platform capability invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 94' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2g-platform-capabilities"' app/build.gradle.kts
          grep -q 'data class CreatorPlatformCapabilities' app/src/main/java/com/framebynavin/app/data/CreatorPlatformRegistry.kt
          grep -q 'legacyFormats = setOf("Cinematic Moment", "Long video", "Short / explainer")' app/src/main/java/com/framebynavin/app/data/CreatorPlatformRegistry.kt
          grep -q 'fun acceptsFormat' app/src/main/java/com/framebynavin/app/data/CreatorPlatformRegistry.kt
          grep -q 'fun formatOptions' app/src/main/java/com/framebynavin/app/data/CreatorPlatformRegistry.kt
          grep -q 'fun canonicalName' app/src/main/java/com/framebynavin/app/data/CreatorPlatformRegistry.kt
          grep -q 'CreatorPlatformRegistry::canonicalName' app/src/main/java/com/framebynavin/app/data/CreatorProfile.kt
          grep -q 'object ProductionStyleRegistry' app/src/main/java/com/framebynavin/app/data/ProductionStyleRegistry.kt
          grep -q 'object ContentArchetypeRegistry' app/src/main/java/com/framebynavin/app/data/ContentArchetypeRegistry.kt
          grep -q 'object CreatorModeRegistry' app/src/main/java/com/framebynavin/app/data/CreatorModeRegistry.kt
          grep -q 'PTab.TODAY -> PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          test ! -e app/src/main/java/com/framebynavin/app/cloud/CloudSyncWorker.kt

      - name: Pin exact app source before Gradle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c commit.gpgSign=false commit -m "feat(v2.0): ship Platform Capability Registry V2"
          fi
          git rev-parse HEAD | tee /tmp/validated_commit

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.2g-platform-capabilities.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.2g-platform-capabilities.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.2g-platform-capabilities"
            echo "versionCode=94"
            echo "commit=$(cat /tmp/validated_commit)"
            echo "platformCapabilityRegistryV2=true"
            echo "cinematicMomentRemovedFromNewYouTubeFormats=true"
            echo "cinematicMomentLegacyCompatible=true"
            echo "legacyDeliverableFormatsPreserved=true"
            echo "customPlatformsRemainPermissive=true"
            echo "productionStylesPreserved=true"
            echo "contentArchetypesPreserved=true"
            echo "creatorModesPreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "acceptedCinematicHomePreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2g-platform-capabilities-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.2g-platform-capabilities.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2g-platform-capabilities-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.2g-platform-capabilities-validated
