name: RC3 Device Feedback Patcher

on:
  push:
    branches:
      - "release/v1.9.0-rc3-project-pulse"
    paths:
      - ".github/workflows/rc3-device-feedback-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'remove RC3 device feedback patcher') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed RC3.1 device fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}\n--- pattern ---\n{old}")
              p.write_text(text.replace(old, new, count))

          # 1) Persist user delivery intent separately from runtime delivery mode.
          patch(
              "app/src/main/java/com/framebynavin/app/data/CreatorTask.kt",
              '''enum class ReminderMode {
              NONE,
              SIMPLE,
              VOICE,
              ALARM,
              SMART,
          }
          ''',
              '''enum class ReminderMode {
              NONE,
              SIMPLE,
              VOICE,
              ALARM,
              SMART,
          }

          /** User intent. AUTO lets Project Pulse adapt; explicit values stay sticky across stages. */
          enum class ReminderDeliveryPreference {
              AUTO,
              NOTIFICATION,
              VOICE,
              ALARM,
              SMART,
          }
          ''',
          )
          patch(
              "app/src/main/java/com/framebynavin/app/data/CreatorTask.kt",
              '''    val reminderMode: ReminderMode = ReminderMode.SIMPLE,
              val voicePersona: VoicePersona = VoicePersona.WARM,
          ''',
              '''    val reminderMode: ReminderMode = ReminderMode.SIMPLE,
              val deliveryPreference: ReminderDeliveryPreference = ReminderDeliveryPreference.AUTO,
              val voicePersona: VoicePersona = VoicePersona.WARM,
          ''',
          )

          # 2) Portable persistence + safe legacy migration.
          patch(
              "app/src/main/java/com/framebynavin/app/data/TaskStore.kt",
              '''                    .put("reminderMode", task.reminderMode.name)
                      .put("voicePersona", task.voicePersona.name)
          ''',
              '''                    .put("reminderMode", task.reminderMode.name)
                      .put("deliveryPreference", task.deliveryPreference.name)
                      .put("voicePersona", task.voicePersona.name)
          ''',
          )
          patch(
              "app/src/main/java/com/framebynavin/app/data/TaskStore.kt",
              '''                val attentionPlan = runCatching {
                      ProjectAttentionPlan.valueOf(item.optString("attentionPlan", migratedAttentionPlan.name))
                  }.getOrDefault(migratedAttentionPlan)
                  val pulseManagedReminder = item.optBoolean("pulseManagedReminder", false) &&
                      attentionPlan != ProjectAttentionPlan.OFF
          ''',
              '''                val attentionPlan = runCatching {
                      ProjectAttentionPlan.valueOf(item.optString("attentionPlan", migratedAttentionPlan.name))
                  }.getOrDefault(migratedAttentionPlan)
                  val deliveryPreference = runCatching {
                      ReminderDeliveryPreference.valueOf(item.optString("deliveryPreference"))
                  }.getOrElse {
                      // Older Custom reminders represented an explicit user delivery choice in reminderMode.
                      // Managed Light/Guided/Urgent modes were auto-generated, so migrate those to AUTO.
                      if (attentionPlan == ProjectAttentionPlan.CUSTOM && reminderEnabled) {
                          when (reminderMode) {
