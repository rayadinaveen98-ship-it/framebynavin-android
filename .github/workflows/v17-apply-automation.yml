name: Apply v1.7 Creator Automation

on:
  push:
    branches: [ "feature/v1.7-creator-automation" ]
    paths:
      - "tools/v17_apply_automation.py"
      - ".github/workflows/v17-apply-automation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v1.7 wiring
        run: python tools/v17_apply_automation.py

      - name: Commit wiring
        run: |
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt \
                  app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          if git diff --cached --quiet; then
            echo "No v1.7 wiring changes needed"
          else
            git commit -m "feat(v1.7): wire automation center and 14-day planner"
            git push
          fi
