name: Backlot V151 — Phases 1-4

on:
  push:
    branches:
      - fix/v151-phases-1-4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v151-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload V151 APK
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v151-phases-1-4-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
