name: Backlot V290 - Preserve V288 Owner Data on In-Place Upgrade

on:
  push:
    branches: [feature/backlot-v290-owner-upgrade-preservation]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-v290-upgrade-preservation
  cancel-in-progress: true

jobs:
  signed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile separate two-stage upgrade instrumentation APK
        run: |
          timeout 65m gradle :app:assembleDebugAndroidTest --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Download fully verified V288 owner APK
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V288-Personal-OS-Owner-Test
          path: output/v288
          run-id: 41842400120
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download V290 owner candidate from full owner-preview QA
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V290-Private-Spaces-Owner-Test
          path: output/v290
          run-id: 41858035754
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify APK checksums, matching signing certificate and version upgrade
        run: |
          set -euo pipefail
          (cd output/v288 && sha256sum -c SHA256SUMS.txt)
          (cd output/v290 && sha256sum -c SHA256SUMS.txt)
          grep -q "package: name='com.framebynavin.app' versionCode='288'" output/v288/APK-IDENTITY.txt
          grep -q "package: name='com.framebynavin.app' versionCode='290'" output/v290/APK-IDENTITY.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' output/v288/SIGNATURE-VERIFICATION.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' output/v290/SIGNATURE-VERIFICATION.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          certs=[]
          for version in ('v288', 'v290'):
              txt=Path(f'output/{version}/SIGNATURE-VERIFICATION.txt').read_text()
              found=re.search(r'V2 Signer: certificate SHA-256 digest: ([0-9a-f]{64})',txt)
              assert found, f'Missing V2 signer for {version}'
              certs.append(found.group(1))
          assert certs[0]==certs[1], 'Signed APK mismatch; in-place update would be unsafe'
          print('PASS: matching signed application ID and trusted owner-preview key')
          PY
      - name: Enable Android 15 emulator acceleration where available
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo 'KVM accessible'
          else
            echo 'KVM unavailable; permit emulator fallback'
          fi
      - name: Android 15 signed V288 to V290 in-place preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v290-inplace-upgrade.sh
