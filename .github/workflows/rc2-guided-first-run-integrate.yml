name: RC2 Guided First Run Integrate

on:
  push:
    branches:
      - "feature/v2.0-rc2-guided-first-run"
    paths:
      - ".github/workflows/rc2-guided-first-run-integrate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc2-guided-first-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guided first-run integration
        run: |
          python3 .github/rc2/apply_guided_first_run_v124.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify v124 guided first-run identity
        run: |
          grep -F 'versionCode = 124' app/build.gradle.kts
          grep -F 'versionName = "2.0.0-rc2-guided-first-run"' app/build.gradle.kts
          grep -F 'V20GuidedFirstRunCoach(' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -F 'onReplayTour' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -F 'guidedTourVersion' app/src/main/java/com/framebynavin/app/data/CreatorOsSettings.kt

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v124-guided-first-run
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(rc2): integrate guided first-run journey v124'
          git push origin HEAD:feature/v2.0-rc2-guided-first-run
