name: v2.0 Alpha 1.2M Video Postmortem

on:
  push:
    branches:
      - "develop/v2.0-alpha1.2m-video-postmortem"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha12m-video-postmortem
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v102 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v20_alpha12m_video_postmortem.py
          git diff --check
          git status --short
          git config user.name "FrameByNavin CI"
          git config user.email "actions@users.noreply.github.com"
          git add app
          git commit -m "feat(v2.0): build Video Postmortem foundation"
          git rev-parse HEAD | tee /tmp/validated_commit

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v102 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 102' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2m-video-postmortem"' app/build.gradle.kts
          grep -q 'object CreatorVideoPostmortemEngine' app/src/main/java/com/framebynavin/app/data/CreatorVideoPostmortem.kt
          grep -q 'EXACT_FROM_PROJECT_CREATION' app/src/main/java/com/framebynavin/app/data/CreatorVideoPostmortem.kt
          grep -q 'LOWER_BOUND_FROM_FIRST_OBSERVATION' app/src/main/java/com/framebynavin/app/data/CreatorVideoPostmortem.kt
          grep -q 'val totalCount: Int get() = 8' app/src/main/java/com/framebynavin/app/data/CreatorVideoPostmortem.kt
          grep -q 'V20VideoPostmortemCard(task = task, video = video, windowDays = windowDays)' app/src/main/java/com/framebynavin/app/ui/V172InsightsUi.kt
          grep -q 'missing data stays missing' app/src/main/java/com/framebynavin/app/ui/V20VideoPostmortemUi.kt
          grep -q 'Project/stage duration is elapsed residence time, not active editing or research time' app/src/main/java/com/framebynavin/app/ui/V20VideoPostmortemUi.kt
          grep -q 'CreatorWorkflowTimelineStore' app/src/main/java/com/framebynavin/app/data/CreatorWorkflowTimelineStore.kt
          grep -q 'channel_reach_basic_a1' app/src/main/java/com/framebynavin/app/youtube/YouTubeReachReporting.kt
          grep -q 'PTab.TODAY -> PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.2m-video-postmortem.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.2m-video-postmortem.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.2m-video-postmortem"
            echo "versionCode=102"
            echo "commit=$(cat /tmp/validated_commit)"
            echo "videoPostmortem=derived-creator-plus-platform-evidence"
            echo "missingEvidenceNotInvented=true"
            echo "exactVsLowerBoundTiming=true"
            echo "contentDnaJoined=true"
            echo "workflowTimelineJoined=true"
            echo "publicationPackagingJoined=true"
            echo "youtubePerformanceJoined=true"
            echo "reachRetentionReleaseCurveOptional=true"
            echo "creatorLearningJoined=true"
            echo "acceptedCinematicHomePreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2m-video-postmortem-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.2m-video-postmortem.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2m-video-postmortem-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.2m-video-postmortem-validated
