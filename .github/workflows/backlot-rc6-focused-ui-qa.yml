  upgrade11:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-RC4-Test-APKs
          run-id: 40889471748
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-RC6-Test-APKs
          path: current
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 actual 266 to 267 in-place upgrade with Creator and Personal records
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            # android-emulator-runner starts a fresh shell for EACH script line.
            # Inline artifact resolution; do not depend on ephemeral shell vars.
            test -s "$(find previous -type f -name app-debug.apk -print -quit)" && test -s "$(find current -type f -name app-debug.apk -print -quit)" && test -s "$(find current -type f -name app-debug-androidTest.apk -print -quit)"
            adb install -r "$(find previous -type f -name app-debug.apk -print -quit)"
            adb install -r "$(find current -type f -name app-debug-androidTest.apk -print -quit)"
            adb shell am instrument -w -r -e class 'com.framebynavin.app.data.V267InPlaceUpgradePersistenceTest#phase1SeedOlderAppAndCaptureVerifiedBackup' -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee rc6-upgrade-old-30.log
            grep -Fq 'OK (1 test)' rc6-upgrade-old-30.log
            adb shell am force-stop com.framebynavin.app
            # Crucial proof: same Android application ID and same debug signer.
            # Never use uninstall, pm clear or a fresh data directory.
            adb install -r "$(find current -type f -name app-debug.apk -print -quit)"
            adb shell am instrument -w -r -e class 'com.framebynavin.app.data.V267InPlaceUpgradePersistenceTest#phase2VerifyUpgradeWithoutUninstall' -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee rc6-upgrade-new-30.log
            grep -Fq 'OK (1 test)' rc6-upgrade-new-30.log
            adb shell am start -n com.framebynavin.app/.MainActivity
            sleep 8
            adb shell am force-stop com.framebynavin.app
            adb shell am instrument -w -r -e class 'com.framebynavin.app.data.V267InPlaceUpgradePersistenceTest#phase3VerifyAfterNewAppLaunchAndCleanUp' -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee rc6-upgrade-launch-30.log
            grep -Fq 'OK (1 test)' rc6-upgrade-launch-30.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backlot-RC6-Upgrade30-Evidence
          path: |
            rc6-upgrade-old-30.log
            rc6-upgrade-new-30.log
            rc6-upgrade-launch-30.log
          if-no-files-found: warn

