name: Backlot Lab R2 - Android 15 First-Run QA

# One isolated QA PR, disposable Lab debug/test APKs only. No stable merge or owner release.
on:
  pull_request:
    branches:
      - qa/backlot-lab-r2-android15-base-20261124
    paths:
      - docs/qa/BACKLOT_LAB_R2_ANDROID15_REQUEST_20261124.md

permissions:
  contents: read

concurrency:
  group: backlot-lab-r2-android15-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-gate:
    name: 01 - R2 two-file source fence and Lab identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify approved R2 source before Gradle
        shell: bash
        run: |
          set -euo pipefail
          R2=1577669bc328153a365661a7f3d36fb1558e891c
          git merge-base --is-ancestor "$R2" HEAD
          expected=$(printf '%s\n' \
            'app/src/main/java/com/framebynavin/app/reminders/V407ReminderAlertReadiness.kt' \
            'app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt' | sort)
          changed=$(git diff --name-only "$R2" HEAD -- app | sort)
          if [[ "$changed" != "$expected" ]]; then
            printf 'STOP: unexpected R2 application changes.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$changed" >&2
            exit 1
          fi
          git diff --quiet "$R2" HEAD -- app/src/main/java/com/framebynavin/app/cloud
          bash tools/qa/backlot_lab_p10q_recovery_contract_gate.sh
          grep -Fq 'testTag("v404-settings-search")' app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt
          ! grep -Fq 'V336DirectorPalette' app/src/main/java/com/framebynavin/app/reminders/V407ReminderAlertReadiness.kt
          test -s tools/qa/backlot_lab_r2_android15_navigation.sh
          grep -Fq 'com.framebynavin.app.lab.test' tools/qa/backlot_lab_r2_android15_navigation.sh
          echo "PASS: exactly two R2 compiler repairs, Lab identity and first-run QA runner"

  build-test-apks:
    name: 02 - Build Lab debug and AndroidTest APKs once
    needs: [source-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Single Android Lab debug + AndroidTest build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/backlot-r2/build output/backlot-r2/apks
          git rev-parse HEAD > output/backlot-r2/build/source-sha.txt
          timeout --signal=TERM --kill-after=20s 6000s \
            gradle :app:assembleDebug :app:assembleDebugAndroidTest -PbacklotLab=true \
              --no-daemon --max-workers=1 --console=plain \
              '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
              '-Pkotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC' \
              '-Porg.gradle.parallel=false' \
              2>&1 | tee output/backlot-r2/build/androidtest-compile.log
      - name: Preserve exact matching disposable debug/test APK pair
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk output/backlot-r2/apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/backlot-r2/apks/
          sha256sum output/backlot-r2/apks/*.apk | tee output/backlot-r2/build/apk-sha256.txt
      - name: Upload disposable QA pair (not owner preview)
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Lab-R2-Disposable-Debug-AndTest-APKs
          path: output/backlot-r2/apks/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compilation diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Lab-R2-AndroidTest-Compile-Evidence
          path: output/backlot-r2/build/
          if-no-files-found: warn
          retention-days: 21

  android15-first-run:
    name: 03 - Android15 Lab first-run and Personal/Creator switch 2x
    needs: [build-test-apks]
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-Lab-R2-Disposable-Debug-AndTest-APKs
          path: output/backlot-r2/apks
      - name: Check reused APKs; no Gradle in runtime stage
        shell: bash
        run: |
          set -euo pipefail
          test -s output/backlot-r2/apks/app-debug.apk
          test -s output/backlot-r2/apks/app-debug-androidTest.apk
          sha256sum output/backlot-r2/apks/*.apk
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run real first-launch journey twice on disposable Android15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/qa/backlot_lab_r2_android15_navigation.sh
      - name: Preserve first-run results and OS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Lab-R2-Android15-FirstRun-Evidence
          path: output/backlot-r2/android15/
          if-no-files-found: warn
          retention-days: 21
