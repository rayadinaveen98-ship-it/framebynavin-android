name: Backlot V285 - Personal 21-Day Life Planner QA

on:
  push:
    branches: [feature/backlot-v285-personal-life-planner]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v285-personal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-test-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify schedule guardrails, unit tests and preview APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.framebynavin.app"' in app
          assert 'versionCode = 285' in app
          assert 'versionName = "2.19.0-rc1-personal-life-planner-owner-test"' in app
          p = Path('app/src/main/java/com/framebynavin/app/personal/V285PersonalLifePlan.kt').read_text()
          assert 'PersonalReminderStore' in p and 'PersonalDeliveryCoordinator' in p
          assert 'mergeMissing' in p and 'autoRetryEnabled = false' in p
          assert '2026, 11, 5' in p and 'firstDay.plusDays(20)' in p
          assert 'CreatorTask(' not in p
          assert 'PersonalAlert.NOTIFICATION' in p
          print('PASS: opt-in Personal-only plan, no duplicate Creator entries')
          PY
          timeout 62m gradle :app:testDebugUnitTest :app:assemblePersonalStable :app:assembleDebug :app:assembleDebugAndroidTest -x :app:lintVitalPersonalStable --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Verify V285 and V284 regression unit tests
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('app/build/test-results/testDebugUnitTest')
          for name,minimum in [('V285PersonalLifePlanTest',9),('V285PersonalAgendaFilterTest',3),('V284DietFitnessPlanTest',7)]:
              suites=list(root.glob('TEST-*'+name+'.xml'))
              assert len(suites)==1, name+' suite missing'
              report=ET.parse(suites[0]).getroot()
              assert int(report.attrib.get('tests',0))>=minimum, name+' insufficient tests'
              assert int(report.attrib.get('errors',0))==0, name+' suite errors'
              assert int(report.attrib.get('failures',0))==0, name+' suite failures'
          print('PASS: V285 dates/routines/duplicates and V284 diet regression')
          PY
      - name: Verify preview package, signature and archive APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/personalStable/app-personalStable.apk
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/Backlot-V285-Life-Planner-Owner-Test.apk
          cp app/build/outputs/apk/debug/app-debug.apk output/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/app-debug-androidTest.apk
          (cd output && sha256sum *.apk > SHA256SUMS.txt)
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > output/SIGNATURE-VERIFICATION.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' output/SIGNATURE-VERIFICATION.txt
          "$AAPT" dump badging "$APK" > output/APK-IDENTITY.txt
          grep -q "package: name='com.framebynavin.app' versionCode='285'" output/APK-IDENTITY.txt
          echo 'PASS: V285 Android package/version and non-Play owner test signature'
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V285-Life-Planner-Owner-Test
          path: output/
          retention-days: 14
          if-no-files-found: error

  emulator-smoke:
    needs: compile-test-preview
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V285-Life-Planner-Owner-Test
          path: output
      - name: Verify uploaded binaries
        run: (cd output && sha256sum -c SHA256SUMS.txt)
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run V285 and V284 Personal UI smoke tests on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb install -r output/app-debug.apk
            adb install -r output/app-debug-androidTest.apk
            for classname in com.framebynavin.app.ui.V285PersonalLifePlannerUiTest com.framebynavin.app.ui.V284DietFitnessSetupUiTest com.framebynavin.app.personal.V284DietFitnessPlanDeviceTest; do
              adb shell pm clear com.framebynavin.app
              adb shell am instrument -w -r -e hardeningTestEnvironment ci-emulator -e class "$classname" com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/backlot-v285-suite.log
              grep -F 'OK (2 tests)' /tmp/backlot-v285-suite.log
              if grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' /tmp/backlot-v285-suite.log; then exit 1; fi
            done
            echo 'PASS: 21-day planner, V284 diet, privacy and UI checks'
