name: V126 New Project Feature Parity

on:
  push:
    branches:
      - "fix/v126-new-project-feature-parity"
    paths:
      - ".github/workflows/v126-new-project-feature-parity.yml"
      - ".github/v126/**"
      - "scripts/apply_v126_new_project_parity.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v126-new-project-feature-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v126-new-project-feature-parity
          fetch-depth: 0

      - name: Apply full New Project parity patch
        run: python3 scripts/apply_v126_new_project_parity.py

      - name: Verify New Project contract
        shell: bash
        run: |
          set -euo pipefail
          WIZARD=app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt
          COMPOSER=app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt
          VM=app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'versionCode = 126' app/build.gradle.kts
          grep -q '2.0.0-rc2-new-project-feature-parity' app/build.gradle.kts
          grep -q 'V20NewProjectSupportPlans.forEach' "$WIZARD"
          grep -q 'V20NewProjectReminderStyles.forEach' "$WIZARD"
          grep -q 'ProjectAttentionPlan.URGENT' "$WIZARD"
          grep -q 'ProjectAttentionPlan.CUSTOM' "$WIZARD"
          grep -q 'REMINDER STYLE' "$WIZARD"
          grep -q 'REMINDER TIME' "$WIZARD"
          grep -q 'IMPORTANCE' "$WIZARD"
          grep -q 'NOTES · OPTIONAL' "$WIZARD"
          grep -q 'onPickCustomReminder' "$WIZARD"
          grep -q 'deliveryPreference = deliveryPreference' "$COMPOSER"
          test "$(grep -c 'deliveryPreference = deliveryPreference' "$VM")" -ge 2
          if grep -q 'Advanced reminder controls stay available in Edit Project later.' "$WIZARD"; then
            echo 'Deferred-feature copy returned to New Project' >&2
            exit 1
          fi
          if grep -q 'listOf(ProjectAttentionPlan.OFF, ProjectAttentionPlan.LIGHT, ProjectAttentionPlan.GUIDED)' "$WIZARD"; then
            echo 'New Project support was narrowed again' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests, Kotlin compile and APK
        run: gradle :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleDebug --stacktrace

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FrameByNavin CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/framebynavin/app/ui/V20NewProjectWizard.kt \
            app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt \
            app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt \
            app/src/test/java/com/framebynavin/app/ui/NewProjectParityContractTest.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix(v126): restore full progressive New Project setup"
            git push origin HEAD:fix/v126-new-project-feature-parity
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v126-new-project-feature-parity
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
