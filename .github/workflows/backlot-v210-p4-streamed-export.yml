          grep -Fq 'android:icon="@mipmap/backlot_v198_launcher"' "$manifest"
          grep -Fq 'windowSplashScreenAnimatedIcon">@drawable/backlot_v198_approved_icon' "$res/values/themes.xml"
          grep -Fq 'android:color="#3B9EFF"' "$res/drawable/backlot_v198_brand_mark.xml"
          grep -Fq 'android:color="#D0B9FF"' "$res/drawable/backlot_v198_brand_mark.xml"
          grep -Fq 'android:color="#FA748E"' "$res/drawable/backlot_v198_brand_mark.xml"
          grep -Fq 'painterResource(id = R.drawable.backlot_v198_brand_mark)' "$ui/V174CinematicWelcome.kt"
          grep -Fq 'text = "Built for Creators"' "$ui/V174CinematicWelcome.kt"
          grep -Fq 'backlot_v198_notification_monochrome' "$reminders/ReminderNotifications.kt"
