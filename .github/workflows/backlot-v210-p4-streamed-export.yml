name: Backlot Creator C1 — Bounded Project Draft Fingerprints and Full Regression
on:
  push:
    branches: [feature/backlot-v210-p4-streamed-frame-export, feature/backlot-home-photo-manager-phase-b1, feature/backlot-home-photos-settings-entry-b2, feature/backlot-home-photo-import-safety-b3, feature/backlot-home-playback-accessibility-b4, feature/backlot-home-append-photos-b5, feature/backlot-creator-draft-fingerprint-c1]
  workflow_dispatch:
  pull_request:
    branches: [feature/backlot-v210-p4-integrated-acceptance, feature/backlot-v210-p4-streamed-frame-export, feature/backlot-home-greeting-slideshow-phase-a, feature/backlot-home-photo-manager-phase-b1, feature/backlot-home-photos-settings-entry-b2, feature/backlot-home-photo-import-safety-b3, feature/backlot-home-playback-accessibility-b4, feature/backlot-home-append-photos-b5]
permissions:
  contents: read
concurrency:
  group: backlot-v210-streamed-export-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preserve existing source contracts
        run: |
          set -euo pipefail
          # Historical source guards hard-code accepted version numbers through V185.
          # Run them against a temporary V185 version marker only; restore V192 before build.
          original=$(mktemp)
          cp app/build.gradle.kts "$original"
          trap 'cp "$original" app/build.gradle.kts; rm -f "$original"' EXIT
          sed -i -e 's/versionCode = 237/versionCode = 185/' \
                 -e 's/2.8.7-v210-streamed-export-preview/2.3.5-v185-idea-conversion-preview/' app/build.gradle.kts
          for version in $(seq 161 182); do
            script=$(find tools -maxdepth 1 -name "check_v${version}_*.sh" | head -n 1)
            test -n "$script"
            echo "V${version} contract: $script"
            bash "$script"
          done
          cp "$original" app/build.gradle.kts
          rm -f "$original"
          trap - EXIT
          grep -Fq 'versionCode = 237' app/build.gradle.kts
          grep -Fq 'versionName = "2.8.7-v210-streamed-export-preview"' app/build.gradle.kts
      - name: Verify V209 P3 backup and frame-media checks before building
        run: |
          set -euo pipefail
          grep -Fq 'val externalProjectAssetCount: Int = 0' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'val personalFrameCount: Int = 0' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'Project attachments' app/src/main/java/com/framebynavin/app/ui/BackupActivity.kt
          grep -Fq 'Best Frames' app/src/main/java/com/framebynavin/app/ui/BackupActivity.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/V209BackupCoverageTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/V209LargeFrameAcceptanceTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/V210RecoveryCheckpointTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/V210ProcessBoundaryRecoveryTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/V210LiveRestoreKillTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/V210BackupIoFailureTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/V210StreamedFramesExportTest.kt
          grep -Fq 'snapshot(includeHero = false)' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'PortableBestFrameMedia.prepareFromFiles(' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'Base64.encode(chunk, 0, size, Base64.NO_WRAP)' app/src/main/java/com/framebynavin/app/data/PortableBestFrameMedia.kt
          grep -Fq 'ByteArray(8190)' app/src/main/java/com/framebynavin/app/data/PortableBestFrameMedia.kt
          test -f tools/run_v210_live_restore_kill.sh
          grep -Fq 'adb shell am force-stop "${package}"' tools/run_v210_live_restore_kill.sh
          grep -Fq 'afterImagesCommittedForTest?.invoke()' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'internal suspend fun restorePortableCompact(' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'snapshot(includeHero = false)' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'CreatorHeroArchive.restoreOriginalOrder(appContext, oldFrames)' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'CreatorHeroArchive.importVerifiedFiles(appContext, frames)' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'creatorBackup.restorePortableCompact(rewritten, staged.bestFrames)' app/src/main/java/com/framebynavin/app/data/PortableCreatorBackupManager.kt
          grep -Fq 'val restored = portable.restore(ByteArrayInputStream(zipBytes))' app/src/androidTest/java/com/framebynavin/app/data/V209LargeFrameAcceptanceTest.kt
          grep -Fq 'private fun fingerprintSha256(root: JSONObject, schema: Int)' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'updateDigestUtf8(digest, value)' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          ! grep -Fq 'sha256(fingerprint(root' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'FRAME_MANIFEST_ENTRY = "best_frames.tsv"' app/src/main/java/com/framebynavin/app/data/PortableBackupArchive.kt
          grep -Fq 'PortableBestFrameMedia.expand(' app/src/main/java/com/framebynavin/app/data/PortableCreatorBackupManager.kt
          grep -Fq 'creatorBackup.verifyPortableJsonEnvelope(staged.backupJson)' app/src/main/java/com/framebynavin/app/data/PortableCreatorBackupManager.kt
          grep -Fq 'fingerprintSha256(root, schema) == root.optString("payloadSha256")' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -Fq 'rewritePortablePersonalFrames(' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          python3 tools/check_v209_trust_hygiene.py --help >/dev/null
      - name: Verify Settings photo-management route contract
        run: |
            # Verify Settings routes to the existing Home editor and consumes requests.
            grep -Fq 'onOpenHomeSlideshow()' app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt
            grep -Fq 'homeSlideshowRequestNonce += 1L' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
            grep -Fq 'onEditorRequestHandled()' app/src/main/java/com/framebynavin/app/ui/V175BestFramesUi.kt
      - name: Verify minimal Insights UI contract
        run: bash tools/check_v190_insights_minimal.sh
      - name: Verify V191 stability invariants
        run: bash tools/check_v191_insights_stability.sh
      - name: Check V192 UI contract
        run: bash tools/check_v192_insights_thumbnails.sh
      - name: Verify V193 Pulse computation invariants
        run: bash tools/check_v193_pulse_truth.sh
      - name: Validate inherited V194 acceptance guards
        run: bash tools/check_v194_insights_acceptance.sh
      - name: Validate living-scene source contract
        run: bash tools/check_v195_living_scenes.sh
      - name: Validate V195.1 reminder delivery guards
        run: bash tools/check_v196_reminder_delivery.sh
      - name: Validate full-screen ambient scene and manual reveal
        run: bash tools/check_v197_immersive_particles.sh
      - name: Validate richer motion and vibrance source contracts
        run: bash tools/check_v198_motion_vibrance.sh
      - name: Validate Spark mode-specific animation and visual safety
        run: bash tools/check_v199_reminder_spark.sh
      - name: Validate V195.4 Phase 4B minimal reminder UI
        run: bash tools/check_v200_reminder_ui.sh
      - name: Validate V195.4 Phase 4C action feedback and callback safety
        run: bash tools/check_v201_action_feedback.sh
      - name: Validate V195.5 doubled motion and durable reminder countdown
        run: bash tools/check_v202_v203_premium_reminders.sh
      - name: Verify V196 workspace safety source rules
        run: |
          set -euo pipefail
          hub=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha6Ui.kt
          plan=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          publish=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha5Ui.kt
          grep -Fq 'val overallProgress = CreatorWorkflowEngine.progress(task)' "$hub"
          ! grep -Fq 'maxOf(workflowProgress, workspaceProgress)' "$hub"
          grep -Fq 'pendingRemovalId = d.id' "$plan"
          grep -Fq 'protectedRemovalIds(deliverables' "$plan"
          grep -Fq 'enabled = !gate.required && !protectedCheck' "$publish"
          grep -Fq 'enabled = !protectedCheck' "$publish"
          grep -Fq 'require(historyAtRisk.isEmpty())' app/src/main/java/com/framebynavin/app/data/CreatorContentStabilization.kt
          grep -Fq 'it.required && it.status != CreatorPublishGateStatus.DONE' app/src/main/java/com/framebynavin/app/data/CreatorPublishWorkflow.kt
      - name: Verify V196.2 workspace UI hierarchy
        run: |
          set -euo pipefail
          hub=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha6Ui.kt
          plan=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          script=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha4Ui.kt
          publish=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha5Ui.kt
          guide=app/src/main/java/com/framebynavin/app/ui/V20ContentBlueprintUi.kt
          grep -Fq 'val overallProgress = CreatorWorkflowEngine.progress(task)' "$hub"
          grep -Fq 'var showStages by rememberSaveable(task.id)' "$hub"
          grep -Fq 'MinimalWorkspaceToolCard(' "$hub"
          grep -Fq 'onOpenBlueprint' "$hub"
          grep -Fq 'pendingRemovalId = d.id' "$plan"
          ! grep -Fq 'Alpha3Section.SCRIPT' "$plan"
          ! grep -Fq '"JUMP TO"' "$plan"
          grep -Fq 'Alpha4Title("HOOKS", "")' "$script"
          grep -Fq 'Alpha5Title("FINAL CHECKS", ""' "$publish"
          ! grep -Fq 'onClick = {}' "$guide"
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V196WorkspaceMinimalUiTest.kt
      - name: Verify Phase 3 Plan-to-Script source contracts
        run: |
          set -euo pipefail
          a=app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          plan=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          script=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha4Ui.kt
          grep -Fq 'nextMode = Alpha6WorkspaceMode.SCRIPT' "$a"
          grep -Fq 'if (nextMode == Alpha6WorkspaceMode.SCRIPT) openScriptStudio(saved)' "$a"
          grep -Fq 'CreatorContentStabilization.prepareProjectEditorSave' "$a"
          grep -Fq 'onSaveAndScript(task.id, originalRevision, draft())' "$plan"
          grep -Fq 'CreatorPlanScriptBridge.fields(task.workspace)' "$script"
          test -f app/src/test/java/com/framebynavin/app/data/CreatorPlanScriptBridgeTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V196PlanScriptHandoffUiTest.kt
      - name: Verify Phase 3B Script-to-Publish contracts
        run: |
          set -euo pipefail
          a=app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          script=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha4Ui.kt
          publish=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha5Ui.kt
          bridge=app/src/main/java/com/framebynavin/app/data/CreatorScriptPublishBridge.kt
          grep -Fq 'nextMode = Alpha6WorkspaceMode.PUBLISH' "$a"
          grep -Fq 'mode = if (nextMode == Alpha6WorkspaceMode.PUBLISH)' "$a"
          grep -Fq 'onSaveAndPublish(originalStudioRevision, originalWorkspaceRevision, draft())' "$script"
          grep -Fq 'CreatorScriptPublishBridge.selectedTitle(task.workspace.scriptStudio)' "$publish"
          grep -Fq 'CreatorScriptPublishBridge.useTitle(currentTarget, scriptTitle)' "$publish"
          grep -Fq 'deliverable.publicationHistory.isEmpty()' "$bridge"
          grep -Fq 'deliverable.status != CreatorDeliverableStatus.PUBLISHED' "$bridge"
          test -f app/src/test/java/com/framebynavin/app/data/CreatorScriptPublishBridgeTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V196ScriptPublishHandoffUiTest.kt
      - name: Verify Phase 3C reference and asset open contracts
        run: |
          set -euo pipefail
          plan=app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          opener=app/src/main/java/com/framebynavin/app/ui/CreatorWorkspaceExternalOpen.kt
          rules=app/src/main/java/com/framebynavin/app/data/CreatorWorkspaceLinkRules.kt
          grep -Fq 'CreatorWorkspaceExternalOpen.openSource(context, ref.url)' "$plan"
          grep -Fq 'CreatorWorkspaceExternalOpen.openAsset(context, asset.location)' "$plan"
          grep -Fq 'CreatorWorkspaceLinkRules.isAssetLocation(asset.location)' "$plan"
          grep -Fq 'CreatorWorkspaceLinkRules.isWebUrl(ref.url)' "$plan"
          grep -Fq 'Intent.FLAG_GRANT_READ_URI_PERMISSION' "$opener"
          grep -Fq 'Intent.ACTION_VIEW' "$opener"
          ! grep -Fq 'Intent.FLAG_GRANT_WRITE_URI_PERMISSION' "$opener"
          grep -Fq 'uri.rawUserInfo == null' "$rules"
          grep -Fq 'uri.scheme.equals("content", true)' "$rules"
          test -f app/src/test/java/com/framebynavin/app/data/CreatorWorkspaceLinkRulesTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V196ResearchAssetUiTest.kt
      - name: Verify Phase 4 save and durability guards
        run: |
          set -euo pipefail
          activity=app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          gate=app/src/main/java/com/framebynavin/app/data/CreatorWorkspaceSaveGate.kt
          grep -Fq 'private val saveGate = CreatorWorkspaceSaveGate()' "$activity"
          test "$(grep -Fc 'if (!saveGate.tryBegin()) return' "$activity")" = 2
          test "$(grep -Fc 'saveGate.end()' "$activity")" = 2
          grep -Fq 'Publication reconciliation deferred' "$activity"
          grep -Fq 'Stale editor draft cleanup deferred' "$activity"
          grep -Fq 'Script draft cleanup deferred' "$activity"
          grep -Fq 'AtomicBoolean(false)' "$gate"
          test -f app/src/test/java/com/framebynavin/app/data/CreatorWorkspaceSaveGateTest.kt
          test -f app/src/test/java/com/framebynavin/app/data/CreatorWorkspaceEndToEndTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/V196WorkspaceDurabilityAndroidTest.kt
      - name: Verify V197 responsive window and save contract
        run: |
          set -euo pipefail
          path=app/src/main/java/com/framebynavin/app/ui/
          for f in V19ContentWorkspaceAlpha3Ui.kt V19ContentWorkspaceAlpha4Ui.kt V19ContentWorkspaceAlpha5Ui.kt V19ContentWorkspaceAlpha6Ui.kt V20ContentBlueprintUi.kt; do
            grep -Fq 'WorkspaceAdaptiveFrame {' "${path}${f}"
            ! grep -Fq 'Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false))' "${path}${f}"
          done
          frame=${path}WorkspaceAdaptiveFrame.kt
          activity=${path}ContentWorkspaceActivity.kt
          plan=${path}V19ContentWorkspaceAlpha3Ui.kt
          grep -Fq '.windowInsetsPadding(WindowInsets.safeDrawing)' "$frame"
          grep -Fq '.imePadding()' "$frame"
          grep -Fq 'contentWindowInsets = WindowInsets(0, 0, 0, 0)' "$frame"
          grep -Fq 'maxWidth < 380.dp || largeText' "$frame"
          grep -Fq 'BackHandler(enabled = !confirmEditorClose' "$activity"
          grep -Fq 'ScrollableTabRow(' "$plan"
          grep -Fq 'LocalDensity.current.fontScale >= 1.3f' "$plan"
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V197AdaptiveWorkspaceUiTest.kt
      - name: Verify V197.1 app overlay source contracts
        run: |
          set -euo pipefail
          ui=app/src/main/java/com/framebynavin/app/ui
          grep -Fq 'BackHandler(onBack = onDismissRequest)' "$ui/CreatorAdaptiveFullScreen.kt"
          grep -Fq '.windowInsetsPadding(WindowInsets.safeDrawing)' "$ui/CreatorAdaptiveFullScreen.kt"
          grep -Fq '.imePadding()' "$ui/CreatorAdaptiveFullScreen.kt"
          grep -Fq 'CreatorAdaptiveFullScreen(onDismissRequest = onDismiss)' "$ui/V20NewProjectWizard.kt"
          grep -Fq 'CreatorAdaptiveFullScreen(' "$ui/V157ReminderCenterUi.kt"
          grep -Fq 'CreatorAdaptiveFullScreen(onDismissRequest = { requestExit() })' "$ui/V101BReminderUi.kt"
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V197AdaptiveAppOverlaysUiTest.kt
      - name: Verify V197.2 measured navigation and scroll contracts
        run: |
          set -euo pipefail
          ui=app/src/main/java/com/framebynavin/app/ui
          grep -Fq 'coordinates.findRootCoordinates().size.height' "$ui/FrameByNavinV101BApp.kt"
          grep -Fq 'coordinates.positionInRoot().y' "$ui/FrameByNavinV101BApp.kt"
          grep -Fq 'V197BottomNavigationClearance.calculate(' "$ui/FrameByNavinV101BApp.kt"
          grep -Fq 'bottomNavigationClearance = bottomNavClearanceDp.dp' "$ui/FrameByNavinV101BApp.kt"
          test "$(grep -Fc 'bottomNavigationClearance = bottomNavClearanceDp.dp' "$ui/FrameByNavinV101BApp.kt")" -eq 4
          grep -Fq '.padding(bottom = bottomNavigationClearance)' "$ui/V18TodayScreen.kt"
          grep -Fq '.padding(bottom = bottomNavigationClearance)' "$ui/V11YouTubeInsights.kt"
          grep -Fq 'maxLines = 2' "$ui/FrameByNavinV101BApp.kt"
          test -f app/src/test/java/com/framebynavin/app/ui/V197BottomNavigationClearanceTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V197BottomNavigationUiTest.kt
      - name: Verify V197.3 Settings and onboarding safe viewport
        run: |
          set -euo pipefail
          ui=app/src/main/java/com/framebynavin/app/ui
          grep -Fq '.windowInsetsPadding(WindowInsets.safeDrawing)' "$ui/V144SettingsHub.kt"
          grep -Fq '.imePadding()' "$ui/V144SettingsHub.kt"
          ! grep -Fq 'verticalScroll(rememberScrollState()).statusBarsPadding().navigationBarsPadding()' "$ui/V144SettingsHub.kt"
          grep -Fq '.windowInsetsPadding(WindowInsets.safeDrawing)' "$ui/V18CreatorOnboarding.kt"
          grep -Fq '.imePadding()' "$ui/V18CreatorOnboarding.kt"
          grep -Fq 'V197OnboardingActions(' "$ui/V18CreatorOnboarding.kt"
          grep -Fq 'stackActions = maxWidth < 370.dp || LocalDensity.current.fontScale >= 1.35f' "$ui/V197OnboardingActions.kt"
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V197SettingsOnboardingUiTest.kt
      - name: Verify V197.4 modal layering, safe viewport and editor actions
        run: |
          set -euo pipefail
          ui=app/src/main/java/com/framebynavin/app/ui
          grep -Fq 'CreatorAdaptiveFullScreen(onDismissRequest = ::dismissQuickCapture)' "$ui/V14QuickCaptureUi.kt"
          grep -Fq 'onDismissRequest = ::dismiss,' "$ui/V09IdeaVaultUi.kt"
          grep -Fq '.windowInsetsPadding(WindowInsets.safeDrawing)' "$ui/V09IdeaVaultUi.kt"
          grep -Fq 'bottomNavigationClearance = bottomNavClearanceDp.dp' "$ui/FrameByNavinV101BApp.kt"
          test "$(grep -Fc 'bottomNavigationClearance = bottomNavClearanceDp.dp' "$ui/FrameByNavinV101BApp.kt")" -eq 4
          grep -Fq 'Modifier.fillMaxWidth().horizontalScroll(rememberScrollState())' "$ui/V189VideoDetailScreen.kt"
          grep -Fq 'Dialog(onDismissRequest = onDismiss,' "$ui/V189VideoDetailScreen.kt"
          grep -Fq 'V197ProfileEditorFooter(' "$ui/V168CreatorProfileEditor.kt"
          grep -Fq '.imePadding()' "$ui/V168CreatorProfileEditor.kt"
          grep -Fq 'testTag("v168-save-profile")' "$ui/V197ProfileEditorFooter.kt"
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V197RemainingScreensUiTest.kt
      - name: Verify V197.5 calendar, shortcuts and weekly plan source invariants
        run: |
          set -euo pipefail
          ui=app/src/main/java/com/framebynavin/app/ui
          grep -Fq 'bottomNavigationClearance = bottomNavClearanceDp.dp' "$ui/FrameByNavinV101BApp.kt"
          grep -Fq 'bottomNavigationClearance = 36.dp' "$ui/FrameByNavinV101BApp.kt"
          grep -Fq '.padding(bottom = bottomNavigationClearance)' "$ui/V15ContextUi.kt"
          grep -Fq 'Modifier.navigationBarsPadding()' "$ui/V15ContextUi.kt"
          grep -Fq 'LocalDensity.current.fontScale >= 1.35f' "$ui/V161QuickActionsHubUi.kt"
          grep -Fq '.horizontalScroll(rememberScrollState())' "$ui/V161QuickActionsHubUi.kt"
          grep -Fq 'V197WeeklyPlanActions(' "$ui/V08WeeklyScheduleUi.kt"
          grep -Fq 'testTag("v164-create-preview")' "$ui/V197WeeklyPlanActions.kt"
          grep -Fq 'WindowInsets.safeDrawing' "$ui/V08WeeklyScheduleUi.kt"
          grep -Fq 'WindowInsets.safeDrawing' "$ui/V17AutomationCenter.kt"
          grep -Fq 'WindowInsets.safeDrawing' "$ui/V09ReleaseDayUi.kt"
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V197QuickCalendarAdaptiveUiTest.kt
      - name: Verify inherited V197.6 no-schema-change acceptance matrix
        run: |
          set -euo pipefail
          test -f docs/qa/V197_6_E2E_RELIABILITY_AND_RELEASE_GATES.md
          for f in \
            data/V185IdeaProjectConversionTest.kt \
            data/CreatorPublicationRecoveryV183Test.kt \
            data/V176ProjectPersistenceInstrumentedTest.kt \
            data/CreatorBackupV183Test.kt \
            ui/V170LocalBackupScreenUiTest.kt \
            reminders/V159ReminderScheduleAcceptanceTest.kt; do
            test -f "app/src/androidTest/java/com/framebynavin/app/$f"
          done
          grep -Fq 'versionCode = 237' app/build.gradle.kts
      - name: Validate RC source scope and preserved stable signing config
        run: |
          set -euo pipefail
          test -f tools/check_backlot_personal_apk_signer.py
          test -f docs/releases/BACKLOT_V197_RC1.md
          grep -Fq 'versionCode = 237' app/build.gradle.kts
          grep -Fq 'versionName = "2.8.7-v210-streamed-export-preview"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.framebynavin.app"' app/build.gradle.kts
          grep -Fq 'signingConfig = signingConfigs.getByName("prototypeStable")' app/build.gradle.kts
          grep -Fq 'matchingFallbacks += listOf("release")' app/build.gradle.kts
      - name: Verify V198 approved branding references and unchanged startup policy
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml
          res=app/src/main/res
          ui=app/src/main/java/com/framebynavin/app/ui
          reminders=app/src/main/java/com/framebynavin/app/reminders
          test -f "$res/drawable/backlot_v198_brand_mark.xml"
          test -f "$res/drawable/backlot_v198_notification_monochrome.xml"
          test -f "$res/mipmap-anydpi-v26/backlot_v198_launcher.xml"
          test -s "$res/drawable-nodpi/backlot_v198_approved_icon.webp"
          test "$(git hash-object "$res/drawable-nodpi/backlot_v198_approved_icon.webp")" = d02fcce620543960d4276aeefcc39323e3b936d0
          grep -Fq '@drawable/backlot_v198_approved_icon' "$res/mipmap-anydpi-v26/backlot_v198_launcher.xml"
