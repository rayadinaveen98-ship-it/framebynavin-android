        with:
          name: Backlot-V210-P4.6-Integrated-QA-APK
          path: |
            app/build/outputs/apk/personalStable/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: V210-P4.6-Instrumentation-APKs
          path: instrumentation-apks
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute precompiled Android 11 acceptance suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r instrumentation-apks/debug/app-debug.apk
            adb install -r instrumentation-apks/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            bash tools/run_v185_instrumentation.sh
            # Separate Home-layout PR: run the seven greeting/photo control, populated media, reorder/remove-one and missing-file safety tests
