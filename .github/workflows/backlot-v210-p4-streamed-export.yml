        run: |
          set -euo pipefail
          ui=app/src/main/java/com/framebynavin/app/ui
          test -f "$ui/V199ParticleWelcome.kt"
          test -f "$ui/V199WelcomeSound.kt"
          test -f app/src/test/java/com/framebynavin/app/ui/V199WelcomeTimelineTest.kt
          grep -Fq 'const val DURATION_MS = 3_000L' "$ui/V199ParticleWelcome.kt"
          grep -Fq 'const val CONVERGE_END_MS = 1_900L' "$ui/V199ParticleWelcome.kt"
          grep -Fq 'val total = when' "$ui/V199ParticleWelcome.kt"
          grep -Fq 'canvas.drawPoints(packed[group]' "$ui/V199ParticleWelcome.kt"
          grep -Fq 'val word = "Backlot"' "$ui/V199ParticleWelcome.kt"
          grep -Fq 'V199ParticleWelcome(' "$ui/V131LaunchGate.kt"
          grep -Fq 'fadeIn(tween(0)) togetherWith fadeOut(tween(0))' "$ui/V131LaunchGate.kt"
          grep -Fq 'V199WelcomeTimeline.DURATION_MS' "$ui/V199WelcomeSound.kt"
          ! grep -Fq 'V174CinematicWelcome(' "$ui/V131LaunchGate.kt"
          grep -Fq 'versionCode = 237' app/build.gradle.kts
      - name: Guard V200 brand identity
        run: python3 tools/check_v208_setup_backup.py
      - name: Verify bounded project draft signatures
        run: |
          set -euo pipefail
          bash tools/check_v172_new_project_draft_ux.sh
          grep -Fq 'MessageDigest.getInstance("SHA-256")' app/src/main/java/com/framebynavin/app/ui/V172ProjectDraftPolicy.kt
          grep -Fq 'return "sha256:"' app/src/main/java/com/framebynavin/app/ui/V172ProjectDraftPolicy.kt
          grep -Fq 'hugeScriptSignatureStaysBoundedAndNeverContainsDraftText' app/src/test/java/com/framebynavin/app/ui/V172ProjectDraftPolicyTest.kt
      - name: Clean build, regressions, lint and instrumentation compilation
        run: gradle :app:clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePersonalStable --stacktrace
      - name: Verify RC personal APK signer, package and upgrade version
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/personalStable/app-personalStable.apk"
          test -s "$apk"
          python3 tools/check_backlot_personal_apk_signer.py \
            --apk "$apk" \
            --expected-cert-sha256 f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0
          aapt_tool=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$aapt_tool"
          badging=$("$aapt_tool" dump badging "$apk")
          package_line=$(printf '%s\n' "$badging" | grep '^package:')
          printf '%s\n' "$package_line"
          grep -Fq "name='com.framebynavin.app'" <<< "$package_line"
          grep -Fq "versionCode='237'" <<< "$package_line"
          grep -Fq "versionName='2.8.7-v210-streamed-export-preview'" <<< "$package_line"
          # Verify the installed APK resource table, not only its source tree.
          resources_dump=$("$aapt_tool" dump resources "$apk")
          grep -Fq 'drawable/backlot_v198_notification_monochrome' <<< "$resources_dump"
          grep -Fq 'drawable/backlot_v198_approved_icon' <<< "$resources_dump"
          for retired in ic_framebynavin_launcher ic_framebynavin_splash backlot_icon_cinematic backlot_icon_minimal backlot_icon_light backlot_icon_horizontal backlot_splash_mark; do
            if grep -Fq "drawable/$retired" <<< "$resources_dump"; then
              printf 'Retired icon still packaged in APK: %s\\n' "$retired" >&2
              exit 1
            fi
          done
          sha256sum "$apk" | tee backlot-v208-setup-backup-apk.sha256
          printf 'Personal side-load RC only. Same public dev signer, not production Play signing.\n'
      - name: Upload RC fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V210-P4.6-Certificate-and-SHA256
          path: backlot-v208-setup-backup-apk.sha256
          retention-days: 30
      - name: Upload compiled instrumentation APKs
        uses: actions/upload-artifact@v4
