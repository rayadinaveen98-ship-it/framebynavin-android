name: V144 Idea Voice Once

on:
  push:
    branches:
      - feature/v144-guide-schedule-refresh
    paths:
      - .github/workflows/v144-idea-voice-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v144-guide-schedule-refresh
          fetch-depth: 0

      - name: Add voice capture under Idea notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/framebynavin/app/ui/V09IdeaVaultUi.kt')
          text = p.read_text()
          old = '''                OutlinedTextField(notes, { notes = it }, modifier = Modifier.fillMaxWidth().heightIn(min = 95.dp), label = { Text("Notes · optional") })
                Spacer(Modifier.height(12.dp))'''
          new = '''                OutlinedTextField(notes, { notes = it }, modifier = Modifier.fillMaxWidth().heightIn(min = 95.dp), label = { Text("Notes · optional") })
                Spacer(Modifier.height(8.dp))
                V117VoiceIdeaInput(
                    onTranscript = { transcript ->
                        val clean = transcript.trim()
                        if (clean.isNotBlank()) {
                            notes = if (notes.isBlank()) clean else "${notes.trimEnd()}\\n$clean"
                        }
                    },
                )
                Spacer(Modifier.height(12.dp))'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Idea notes field block, found {count}')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v144-idea-voice-once.yml
          git add app/src/main/java/com/framebynavin/app/ui/V09IdeaVaultUi.kt
          git commit -m "feat(v144): add voice capture to idea notes"
          git push origin HEAD:feature/v144-guide-schedule-refresh
