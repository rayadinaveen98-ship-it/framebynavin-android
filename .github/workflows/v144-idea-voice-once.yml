name: V144 Idea Voice Once

on:
  push:
    branches:
      - feature/v144-guide-schedule-refresh
    paths:
      - .github/workflows/v144-idea-voice-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v144-guide-schedule-refresh
          fetch-depth: 0

      - name: Add voice capture under Idea notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/framebynavin/app/ui/V09IdeaVaultUi.kt')
          text = p.read_text()
          needle = 'OutlinedTextField(notes, { notes = it }, modifier = Modifier.fillMaxWidth().heightIn(min = 95.dp), label = { Text("Notes · optional") })'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'Expected exactly one Idea notes field, found {count}')
          i = text.index(needle)
          line_start = text.rfind('\n', 0, i) + 1
          indent = text[line_start:i]
          child = indent + '    '
          replacement = (
              needle + '\n' +
              indent + 'Spacer(Modifier.height(8.dp))\n' +
              indent + 'V117VoiceIdeaInput(\n' +
              child + 'onTranscript = { transcript ->\n' +
              child + '    val clean = transcript.trim()\n' +
              child + '    if (clean.isNotBlank()) {\n' +
              child + '        notes = if (notes.isBlank()) clean else "${notes.trimEnd()}\\n$clean"\n' +
              child + '    }\n' +
              child + '},\n' +
              indent + ')'
          )
          p.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v144-idea-voice-once.yml
          git add app/src/main/java/com/framebynavin/app/ui/V09IdeaVaultUi.kt
          git commit -m "feat(v144): add voice capture to idea notes"
          git push origin HEAD:feature/v144-guide-schedule-refresh
