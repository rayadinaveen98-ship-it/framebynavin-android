name: FrameByNavin v1.8.1 Hardening

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.8.1-hardening
    paths:
      - 'hardening/rc2/**'
      - '.github/workflows/v181-hardening.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: framebynavin-v181-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct verified Alpha23 source and apply hardening
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 hardening/rc2/restore_source.py
      - name: Source and version gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 64' app/build.gradle.kts
          grep -Fq 'versionName = "1.8.1-hardening-rc1"' app/build.gradle.kts
          test -f app/src/main/java/com/framebynavin/app/data/CreatorPublicationEngine.kt
          test -f app/src/main/java/com/framebynavin/app/data/CreatorDataGate.kt
          test -f app/src/main/java/com/framebynavin/app/data/CreatorDeltaEngine.kt
          test -f app/src/test/java/com/framebynavin/app/data/CreatorHardeningV181Test.kt
          test -f app/src/androidTest/java/com/framebynavin/app/data/CreatorHardeningV181InstrumentedTest.kt
          echo 'Verified hardening source gate passed'
      - name: Package generated candidate source
        run: tar -czf FrameByNavin-v1.8.1-hardening-source.tar.gz app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties hardening/rc2/restore_source.py
      - name: Upload candidate source
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.1-hardening-source
          path: FrameByNavin-v1.8.1-hardening-source.tar.gz
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run interaction tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -F "versionCode='64' versionName='1.8.1-hardening-rc1'"
          sha256sum "$APK" | tee FrameByNavin-v1.8.1-hardening.sha256
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.1-hardening-rc1
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            FrameByNavin-v1.8.1-hardening.sha256
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.1-hardening-diagnostics
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
