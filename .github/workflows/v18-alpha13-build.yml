name: Build FrameByNavin v1.8 Product Alpha13

on:
  push:
    branches:
      - feature/v1.8-product-alpha13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Alpha13 creator loop pass
        run: python tools/v18_creator_loop_alpha13.py

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Alpha13 APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.0-product-alpha13
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload audit source
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.0-product-alpha13-audit-source
          path: |
            app/build.gradle.kts
            app/src/main/java/com/framebynavin/app/ui/V18CreatorLoop.kt
            app/src/test/java/com/framebynavin/app/ui/V18CreatorLoopAlpha13Test.kt
            app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          if-no-files-found: error
          retention-days: 90
