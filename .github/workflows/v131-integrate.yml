name: Integrate v1.3.1 Cinematic Management

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "tools/v131_integrate.py"
      - ".github/workflows/v131-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply v1.3.1 patch
        run: python tools/v131_integrate.py

      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/android-apk.yml
          if git diff --cached --quiet; then
            echo "No integration changes"
          else
            git commit -m "feat: integrate v1.3.1 cinematic management polish"
            git push
          fi
