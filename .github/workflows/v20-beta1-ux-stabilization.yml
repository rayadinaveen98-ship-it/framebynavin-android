name: v2.0 Beta 1 UX Stabilization

on:
  push:
    branches:
      - "develop/v2.0-beta1-ux-stabilization"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-beta1-ux-stabilization
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v116 UX stabilization
        run: |
          python tools/v116_fix_materializer.py
          python tools/v20_beta1_ux_stabilization.py

      - name: Verify v116 UX invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 116' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-beta1-ux-stabilization"' app/build.gradle.kts
          grep -q 'V18JourneyDestination.CREATE else null' app/src/main/java/com/framebynavin/app/ui/V18CreatorJourney.kt
          ! grep -q 'V18CreatorLoop.afterPublished' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'onCapture = { openComposer() }' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -q 'V20OpportunityEngineCard(' app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          grep -q 'V20OpportunityEngineInsightsCard(snapshot)' app/src/main/java/com/framebynavin/app/ui/V20InsightsFoundationUi.kt
          grep -q 'WEEKLY FOCUS' app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          grep -q 'compactCard = selectionMode || (done && !expanded)' app/src/main/java/com/framebynavin/app/ui/V18CoreScreens.kt
          grep -q 'CREATIVE OPTIONS · OPTIONAL' app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt
          grep -q 'imePadding()' app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt
          grep -q 'CHANNEL SIGNALS' app/src/main/java/com/framebynavin/app/ui/V20InsightsFoundationUi.kt
          grep -q 'WHY THIS?' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'Normal Insights still works' app/src/main/java/com/framebynavin/app/youtube/YouTubeReachReporting.kt
          grep -q 'ANALYZE VIDEO WITH GEMINI' app/src/main/java/com/framebynavin/app/ui/V20GeminiIntelligenceUi.kt
          grep -q 'ProjectPulseEngine::repairFalseSurfaceCompletion' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          if grep -R --line-number 'AIzaSy' app/src/main app/src/debug app/src/release; then
            echo 'Firebase API keys must not be copied into Kotlin/Java source.' >&2
            exit 1
          fi
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-beta1-ux-stabilization.apk
          sha256sum verification/FrameByNavin-v2.0.0-beta1-ux-stabilization.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-beta1-ux-stabilization"
            echo "versionCode=116"
            echo "commit=$(git rev-parse HEAD)"
            echo "finishProjectStaysInCreate=true"
            echo "postPublishAutoRedirectRemoved=true"
            echo "bottomPlusCreatesProject=true"
            echo "opportunityEngineInsightsOnly=true"
            echo "creatorFocusCompact=true"
            echo "studioSelectionCompact=true"
            echo "completedProjectsCompact=true"
            echo "projectComposerProgressiveDisclosure=true"
            echo "projectComposerImeSafe=true"
            echo "technicalCopyReduced=true"
            echo "reachApiFailureCreatorFriendly=true"
            echo "liveGeminiVideoAutopsyPreserved=true"
            echo "reminderCompletionSafetyPreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-beta1-ux-stabilization-apk
          path: verification/FrameByNavin-v2.0.0-beta1-ux-stabilization.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-beta1-ux-stabilization-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to develop and staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if ! git diff --cached --quiet; then
            git commit -m "fix(v116): stabilize core creator UX [skip ci]"
          fi
          git push origin HEAD:develop/v2.0-beta1-ux-stabilization
          git push origin HEAD:staging/v2.0-beta1-ux-stabilization-validated
