name: Backlot V222 Cold Start Project Reliability

on:
  push:
    branches: [feature/backlot-v222-preplay-final-refinements]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify cold-start fix is snapshot-keyed, no data mutation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt").read_text()
          assert "val visibleTasks = tasks.toList()" in p
          assert "remember(visibleTasks) { pActiveQueue(visibleTasks).take(10) }" in p
          assert "remember(creatorProfile, visibleTasks)" in p
          assert "remember(tasks) { pActiveQueue(tasks)" not in p
          q=Path("app/src/androidTest/java/com/framebynavin/app/ui/V222ColdStartProjectsUiTest.kt").read_text()
          assert "mutableStateListOf<CreatorTask>()" in q
          assert "coldStartMutableTaskListLoadsHomeWithoutSwitchingTabs" in q
          PY
      - name: Full JVM tests and build debug plus UI test APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload test inputs
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V222-ColdStart-Emulator-Inputs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  cold-start-emulator:
    needs: cold-start-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V222-ColdStart-Emulator-Inputs
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real mutable task list cold loading on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r "$(find apks -type f -name app-debug.apk -print -quit)"
            adb install -r "$(find apks -type f -name app-debug-androidTest.apk -print -quit)"
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V222ColdStartProjectsUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee cold-start.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' cold-start.log; then exit 1; fi
            grep -Fq 'OK (1 test)' cold-start.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V220HomeConsolidationUiTest -e backlotVisualProfile default -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee home-regressions.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' home-regressions.log; then exit 1; fi
            grep -Fq 'OK (4 tests)' home-regressions.log
      - name: Upload Android test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V222-ColdStart-Results
          path: |
            cold-start.log
            home-regressions.log
          if-no-files-found: warn
