name: FrameByNavin v1.8.3 Backup Safety

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v1.8.3-backup-safety
    paths:
      - '.github/workflows/v183-backup-safety.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: framebynavin-v183-backup-safety
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'rayadinaveen98-ship-it/framebynavin-android' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact canonical candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify complete source payload before Android setup
        run: python3 foundation/v183/apply_backup_safety.py --verify-payload
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply reviewed backup-safety changes
        run: |
          python3 foundation/v183/apply_backup_safety.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          old = 'versionCode = 66'
          assert text.count(old) == 1
          assert 'versionName = "1.8.3-foundation-rc2"' in text
          path.write_text(text.replace(old, 'versionCode = 67', 1))
          PY
      - name: Gate exact source scope and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'versionCode = 67' app/build.gradle.kts
          grep -Fq 'versionName = "1.8.3-foundation-rc2"' app/build.gradle.kts
          grep -Fq 'const val SCHEMA_VERSION = 5' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          git diff --check
          git add app/build.gradle.kts \
            app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt \
            app/src/main/java/com/framebynavin/app/reminders/AlarmLedger.kt \
            app/src/main/java/com/framebynavin/app/reminders/ReminderOccurrenceStore.kt \
            app/src/androidTest/java/com/framebynavin/app/data/CreatorBackupV183Test.kt \
            app/src/androidTest/java/com/framebynavin/app/data/CreatorHardeningV181InstrumentedTest.kt
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/actual-source-paths
          printf '%s\n' \
            app/build.gradle.kts \
            app/src/androidTest/java/com/framebynavin/app/data/CreatorBackupV183Test.kt \
            app/src/androidTest/java/com/framebynavin/app/data/CreatorHardeningV181InstrumentedTest.kt \
            app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt \
            app/src/main/java/com/framebynavin/app/reminders/AlarmLedger.kt \
            app/src/main/java/com/framebynavin/app/reminders/ReminderOccurrenceStore.kt | sort > /tmp/expected-source-paths
          diff -u /tmp/expected-source-paths /tmp/actual-source-paths
          git diff --cached --stat
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build candidate APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify version and established pilot signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundation/verification
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee foundation/verification/apk-signature.txt
          grep -Fqi 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0' foundation/verification/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.framebynavin.app' versionCode='67' versionName='1.8.3-foundation-rc2'"
          sha256sum "$APK" | tee foundation/verification/apk.sha256
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator regression suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash hardening/rc2/run_emulator_tests.sh
      - name: Commit verified canonical source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git -c user.name='FrameByNavin Build' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve legacy backup data and invalidate stale restore authority'
          git push origin HEAD:refs/heads/fix/v1.8.3-backup-safety
      - name: Archive verified candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundation/source foundation/verification
          git archive --format=tar.gz --output foundation/source/FrameByNavin-v1.8.3-foundation-rc2-source.tar.gz HEAD app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties
          sha256sum foundation/source/FrameByNavin-v1.8.3-foundation-rc2-source.tar.gz | tee foundation/verification/source.sha256
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          source = pathlib.Path('foundation/source/FrameByNavin-v1.8.3-foundation-rc2-source.tar.gz')
          apk = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          manifest = {
              'status': 'internal foundation candidate; not a public release',
              'versionName': '1.8.3-foundation-rc2', 'versionCode': 67,
              'backupSchemaVersion': 5,
              'canonical_base': 'd533d5d28d8808b36e174b956104ef123bc6cd64',
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'source_sha256': sha(source), 'apk_sha256': sha(apk),
              'signing_certificate_sha256': 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0',
              'scope': 'Backup schema 5, legacy optional-section preservation, restore occurrence and delivery-ledger invalidation, synthetic regression tests. No live database migration.'
          }
          pathlib.Path('foundation/verification/manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          pathlib.Path('foundation/verification/source-commit.txt').write_text(manifest['source_commit']+'\n')
          PY
      - name: Upload verified candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-foundation-rc2-candidate
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            foundation/verification/apk.sha256
            foundation/verification/apk-signature.txt
      - name: Upload verified candidate source
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-foundation-rc2-source
          path: |
            foundation/source/
            foundation/verification/
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.3-foundation-rc2-diagnostics
          if-no-files-found: ignore
          path: |
            foundation/verification/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            hardening/diagnostics/
