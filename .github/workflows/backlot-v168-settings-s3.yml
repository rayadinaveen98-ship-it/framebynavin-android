name: Backlot V168 — Settings S3 Profile and Personalization

on:
  push:
    branches:
      - feature/backlot-v168-settings-s3-profile-personalization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v168-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: V168 Settings S3 preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout V168
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Preserve V161-V167 and verify Settings S3
        run: bash tools/check_v161_quick_actions_hub_capture.sh && bash tools/check_v162_idea_vault.sh && bash tools/check_v163_brief_calendar.sh && bash tools/check_v164_weekly_plan_automation.sh && bash tools/check_v165_creator_progress_e2e.sh && bash tools/check_v166_settings_safety.sh && bash tools/check_v167_settings_navigation.sh && bash tools/check_v168_settings_profile.sh
      - name: Unit tests — preservation and regression
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Compile Android device tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build V168 APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V168 Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v168-settings-s3-profile-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  android-emulator:
    name: Android 30 Settings S3 profile and safety acceptance
    needs: android-apk
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - name: Checkout V168
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Exercise profile editor and preserved Settings navigation on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.ui.V168ProfileEditorUiTest,com.framebynavin.app.ui.V167SettingsNavigationUiTest,com.framebynavin.app.ui.V166SettingsSafetyUiTest" --stacktrace
      - name: Keep device reports on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v168-settings-s3-android30-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30
