name: Backlot UX09-02A disconnected journal crash-safety JVM tests

on:
  pull_request:
    branches:
      - feature/backlot-ux09-02-android-offline-sync-audit-20261117
    paths:
      - 'app/src/main/java/com/framebynavin/app/cloud/ux09/**'
      - 'app/src/test/java/com/framebynavin/app/cloud/ux09/**'
      - '.github/workflows/backlot-ux09-02a-contract-unit.yml'
      - 'docs/engineering/UX09_02A_DISCONNECTED_JOURNAL_EVIDENCE_20261117.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-ux09-02a-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-journal-test:
    name: Gradle UX09-02A local-only test (NOT an APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify the feature is inert and backend is not contacted
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const val ENABLED = false' app/src/main/java/com/framebynavin/app/cloud/ux09/Ux09SyncContract.kt
          test -f app/src/main/java/com/framebynavin/app/cloud/ux09/Ux09DiskIntentJournal.kt
          test -f app/src/test/java/com/framebynavin/app/cloud/ux09/Ux09OfflineContractAndJournalTest.kt
          ! grep -ER 'https?://|CloudApiClient|CreatorCloudSyncWorker|WorkManager' \
            app/src/main/java/com/framebynavin/app/cloud/ux09
          echo 'Only disconnected, dormant UX09-02A prototype is tested.'
      - name: Compile app and test UX09-02A crash/recovery contract
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 3900s \
            gradle :app:testDebugUnitTest \
              --tests 'com.framebynavin.app.cloud.ux09.Ux09OfflineContractAndJournalTest' \
              -Pkotlin.compiler.execution.strategy=in-process \
              --no-daemon --no-parallel --max-workers=1 \
              '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1250m -Dfile.encoding=UTF-8' \
              --console=plain 2>&1 | tee ux09-02a-jvm-tests.log
      - name: Upload focused JVM evidence (NOT an APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-UX09-02A-Journal-JVM-Only-NO-RELEASE
          path: |
            app/build/test-results/testDebugUnitTest/
            ux09-02a-jvm-tests.log
          if-no-files-found: warn
          retention-days: 14
