name: Backlot Phase1 Build270 COMPLETE Android Stability Gate

on:
  push:
    branches: [release/backlot-phase1-build270-device-stability-gate]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-build270:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exactly the verified Build270 source and signing gate
        run: |
          set -euo pipefail
          test "${{ github.event.repository.private }}" = false
          BASE=9b21e9631c2a19a44c4bb98787387ee10e428b7e
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/phase1-files.txt
          python3 - <<'PY'
          from pathlib import Path
          actual=set(Path('/tmp/phase1-files.txt').read_text().splitlines())
          allowed={
            '.github/scripts/backlot-phase1-device-regression.sh',
            '.github/workflows/backlot-phase1-build270-complete-qa.yml',
            'docs/release/PHASE1_BUILD270_DEVICE_GATE.md',
          }
          assert actual==allowed, f'UNEXPECTED app/source change: {sorted(actual ^ allowed)}'
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'versionCode = 270' in gradle
          assert 'applicationId = "com.framebynavin.app"' in gradle
          assert 'targetSdk = 36' in gradle
          assert 'tasks.register("verifyPrivateReleaseSigning")' in gradle
          assert 'android:allowBackup="false"' in Path('app/src/main/AndroidManifest.xml').read_text()
          script=Path('.github/scripts/backlot-phase1-device-regression.sh').read_text()
          assert script.count('  com.framebynavin.app.')==17
          assert 'adb install owner/Backlot-RC25-Build270-Full-App.apk' in script
          assert '74ec1aa31fd9cf9083103423bc6040e2451db1fb454419823150f5cd1b568780' in script
          assert 'adb shell pm clear' not in script
          assert not any(p.startswith(('app/','supabase/','release-site/')) for p in actual)
          print('PASS Phase1 source EXACT Build270, no APK/feature backend change; independent device review still pending')
          PY
      - name: Validate phase1 Bash script
        run: bash -n .github/scripts/backlot-phase1-device-regression.sh

  device-stability:
    needs: frozen-build270
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            profile: compact
          - api: 36
            profile: tablet
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable Build270 signed owner APK, test APK, and old Build269 debug APK
        uses: actions/download-artifact@v4
        with:
          name: Backlot-RC25-Build270-Full-App-Owner-Preview
          run-id: 41050788970
          github-token: ${{ github.token }}
          path: owner
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-RC25-Debug-And-Test-APKs
          run-id: 41050788970
          github-token: ${{ github.token }}
          path: tests
      - if: matrix.profile == 'tablet'
        uses: actions/download-artifact@v4
        with:
          name: Backlot-RC13-Test-APKs
          run-id: 41031529526
          github-token: ${{ github.token }}
          path: old
      - name: Verify exactly tested owner APK digest and debug artifacts
        run: |
          set -euo pipefail
          test -s owner/Backlot-RC25-Build270-Full-App.apk
          test -s tests/app-debug.apk && test -s tests/app-debug-androidTest.apk
          (cd owner && sha256sum -c SHA256SUMS.txt)
          test "$(sha256sum owner/Backlot-RC25-Build270-Full-App.apk | cut -d' ' -f1)" = "74ec1aa31fd9cf9083103423bc6040e2451db1fb454419823150f5cd1b568780"
          test "$(stat -c%s owner/Backlot-RC25-Build270-Full-App.apk)" = 17971790
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Full Phase1 UI, backups, reminders, upgrade, signed APK start/relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-phase1-device-regression.sh ${{ matrix.profile }}
      - name: Save logs and screenshots from synthetic emulators for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Phase1-${{ matrix.profile }}-QA-Evidence
          path: phase1-evidence/
          retention-days: 14
          if-no-files-found: warn
