name: RC2 Account Cloud Sync Validate

on:
  push:
    branches:
      - "feature/v2.0-rc2-account-cloud-sync"
  workflow_dispatch:

concurrency:
  group: rc2-account-cloud-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify v123 identity
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          grep -q 'versionCode = 123' app/build.gradle.kts
          grep -q '2.0.0-rc2-account-cloud-sync' app/build.gradle.kts

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v123-account-cloud-sync
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
