name: v2.0 Alpha 1.2H Content DNA

on:
  push:
    branches:
      - "develop/v2.0-alpha1.2h-content-dna"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha12h-content-dna
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Content DNA invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'versionCode = 95' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.2h-content-dna"' app/build.gradle.kts
          grep -q 'data class CreatorContentDna' app/src/main/java/com/framebynavin/app/data/CreatorContentDna.kt
          grep -q 'object CreatorContentDnaEngine' app/src/main/java/com/framebynavin/app/data/CreatorContentDna.kt
          grep -q 'fun resolve(task: CreatorTask' app/src/main/java/com/framebynavin/app/data/CreatorContentDna.kt
          grep -q 'fun forNewProject' app/src/main/java/com/framebynavin/app/data/CreatorContentDna.kt
          grep -q '"cinematic moment" to "highlights"' app/src/main/java/com/framebynavin/app/data/CreatorContentDna.kt
          grep -q 'semanticContentTypeIsNotMistakenForPlatformFormat' app/src/test/java/com/framebynavin/app/data/CreatorContentDnaTest.kt
          grep -q 'object ContentArchetypeRegistry' app/src/main/java/com/framebynavin/app/data/ContentArchetypeRegistry.kt
          grep -q 'object ProductionStyleRegistry' app/src/main/java/com/framebynavin/app/data/ProductionStyleRegistry.kt
          grep -q 'data class CreatorPlatformCapabilities' app/src/main/java/com/framebynavin/app/data/CreatorPlatformRegistry.kt
          grep -q 'object CreatorModeRegistry' app/src/main/java/com/framebynavin/app/data/CreatorModeRegistry.kt
          grep -q 'PTab.TODAY -> PTodayScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          test ! -e app/src/main/java/com/framebynavin/app/cloud/CloudSyncWorker.kt
          git rev-parse HEAD | tee /tmp/validated_commit

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.2h-content-dna.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.2h-content-dna.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.2h-content-dna"
            echo "versionCode=95"
            echo "commit=$(cat /tmp/validated_commit)"
            echo "contentDnaFoundation=true"
            echo "contentDnaReadOnlyResolution=true"
            echo "legacyProjectsNotRewritten=true"
            echo "legacyCinematicMomentMapsToHighlights=true"
            echo "semanticTypeNotForcedIntoDeliveryFormat=true"
            echo "newProjectRegistryDefaults=true"
            echo "platformCapabilitiesPreserved=true"
            echo "productionStylesPreserved=true"
            echo "contentArchetypesPreserved=true"
            echo "creatorModesPreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "acceptedCinematicHomePreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2h-content-dna-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.2h-content-dna.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.2h-content-dna-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.2h-content-dna-validated
