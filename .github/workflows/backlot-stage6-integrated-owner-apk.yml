name: Backlot six-stage integrated owner APK and regression gate
on:
  push:
    branches:
      - feature/backlot-stage6-personal-first-onboarding-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-stage6-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run full JVM regression tests
        run: |
          set -euo pipefail
          mkdir -p output/integrated-tests
          timeout --signal=TERM --kill-after=20s 5200s gradle :app:testDebugUnitTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
            --console=plain 2>&1 | tee output/integrated-tests/TEST.log
      - name: Upload tests and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-Six-Stage-Full-JVM-Results
          path: |
            output/integrated-tests/
            app/build/test-results/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn

  integrated-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify all six stage source invariants
        run: |
          set -euo pipefail
          mkdir -p output/integrated-apk
          grep -Fq 'versionCode = 336' app/build.gradle.kts
          grep -Fq 'applicationId = "com.framebynavin.app"' app/build.gradle.kts
          ! grep -Fq 'Backup & storage' app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt
          grep -Fq 'Start fresh on this phone' app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt
          grep -Fq 'Phase1HabitVoicePlaybackPolicy.WATCHDOG_MILLIS' app/src/main/java/com/framebynavin/app/personal/Phase1HabitLiveDelivery.kt
          grep -Fq 'V144GuideIdentity.MIRA' app/src/main/java/com/framebynavin/app/ui/V144GuideSystem.kt
          test "$(ls app/src/main/res/drawable-nodpi/guide_mira_*.webp | wc -l)" = "6"
          grep -Fq 'V391ReminderBackdrop' app/src/main/java/com/framebynavin/app/reminders/ReminderCheckInScreen.kt
          grep -Fq 'V391ReminderBackdrop' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
          test "$(grep -c '<receiver android:name=".widget.' app/src/main/AndroidManifest.xml)" = "3"
          ! grep -Fq 'android:name=".widget.V224TodayFocusWidgetProvider"' app/src/main/AndroidManifest.xml
          grep -Fq 'V393FirstRunFocusScreen' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -Fq 'V393QuickCreatorSetup' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          echo 'All six stage code-scope assertions passed.' > output/integrated-apk/SOURCE-CHECK.txt
      - name: Assemble owner preview signed APK
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 5200s gradle :app:assemblePersonalStable \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
            --console=plain 2>&1 | tee output/integrated-apk/BUILD.log
      - name: Verify package identity and public owner preview signer
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/personalStable/app-personalStable.apk output/integrated-apk/Backlot-V336-Six-Stage-Owner-QA.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs output/integrated-apk/Backlot-V336-Six-Stage-Owner-QA.apk > output/integrated-apk/SIGNER.txt
          "$aapt" dump badging output/integrated-apk/Backlot-V336-Six-Stage-Owner-QA.apk | head -n 9 > output/integrated-apk/IDENTITY.txt
          grep -Fq "package: name='com.framebynavin.app' versionCode='336'" output/integrated-apk/IDENTITY.txt
          grep -Fq 'f0ddec789172ec9f83a037a95b14e90293126f61936d8bab056d3a57e0d472a0' output/integrated-apk/SIGNER.txt
          sha256sum output/integrated-apk/Backlot-V336-Six-Stage-Owner-QA.apk > output/integrated-apk/SHA256SUMS.txt
          git rev-parse HEAD > output/integrated-apk/SOURCE-SHA.txt
          echo 'Owner preview signed with known public personalStable certificate. Not a Play Store production release. Physical tests pending.' > output/integrated-apk/SIGNING-NOTE.txt
      - name: Upload owner APK or compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V336-Six-Stage-Owner-APK
          path: output/integrated-apk/
          retention-days: 30
          if-no-files-found: warn
