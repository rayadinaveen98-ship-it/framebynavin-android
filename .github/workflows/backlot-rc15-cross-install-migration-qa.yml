name: Backlot RC15 Cross Install Recovery Android11 to Android16

on:
  push:
    branches: [feature/backlot-rc15-cross-install-migration-qa]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-rc15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect frozen Build269 app source
        run: |
          set -euo pipefail
          BASE=c822d6e7f2189c627778aeda9f91098d786b66af
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > rc15-changed.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path("rc15-changed.txt").read_text().splitlines())
          expected={
            "app/src/androidTest/java/com/framebynavin/app/data/RC15CrossInstallPortableTransferTest.kt",
            ".github/scripts/backlot-rc15-export.sh",
            ".github/scripts/backlot-rc15-import.sh",
            ".github/workflows/backlot-rc15-cross-install-migration-qa.yml",
            "docs/release/RC15_BUILD269_CROSS_INSTALL_MIGRATION.md",
          }
          assert changed==expected, f"Unexpected changes: {sorted(changed ^ expected)}"
          gradle=Path("app/build.gradle.kts").read_text()
          assert 'versionCode = 269' in gradle
          assert '2.15.6-rc13-data-privacy-preview' in gradle
          assert 'applicationId = "com.framebynavin.app"' in gradle
          assert 'targetSdk = 36' in gradle
          code=Path("app/src/androidTest/java/com/framebynavin/app/data/RC15CrossInstallPortableTransferTest.kt").read_text()
          assert code.count("HardeningTestEnvironment.requireCiEmulator()")==2
          print("PASS immutable Build269 app and emulator-only migration fixture")
          PY

  compile-tests:
    needs: scope-check
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile app/test and run unit tests and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify package and APKs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.framebynavin.app' versionCode='269'"
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-RC15-CI-Synthetic-Transfer-APKs
          path: apks/
          retention-days: 14

  cross-install-recovery:
    needs: compile-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-RC15-CI-Synthetic-Transfer-APKs
          path: apks/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sender Android11 exports synthetic Creator and Personal backup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          avd-name: backlot-rc15-source-api30
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-rc15-export.sh
      - name: Verify exact copied bytes on CI runner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("transfer")
          m=json.loads((p/"manifest.json").read_text())
          assert m["schema"]=="RC15CrossInstallSyntheticV1"
          for f,key in (("creator.fbnbackup","creatorSha256"),("personal.json","personalSha256")):
            assert hashlib.sha256((p/f).read_bytes()).hexdigest()==m[key], f
          print("PASS both synthetic backups survived host transfer")
          PY
      - name: Recipient fresh Android16 imports Creator then Personal
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          avd-name: backlot-rc15-receiver-api36
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-rc15-import.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backlot-RC15-Synthetic-Cross-Install-QA-Logs
          path: |
            rc15-sender.log
            rc15-receiver.log
          if-no-files-found: warn
          retention-days: 21
