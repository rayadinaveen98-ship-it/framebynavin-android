name: Backlot V219 — Reminder Hub Discoverability

on:
  push:
    branches: [feature/backlot-v219-reminder-hub-entry]
  workflow_dispatch:
  pull_request:
    branches: [feature/backlot-v218-unified-reminder-wave]

permissions:
  contents: read

concurrency:
  group: backlot-v219-reminders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Static release-safety gate
        run: |
          set -euo pipefail
          grep -Fq 'V219ReminderHomeEntry(tasks = tasks' app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          grep -Fq 'V219ReminderHubFilter.entries.forEach' app/src/main/java/com/framebynavin/app/ui/V157ReminderCenterUi.kt
          grep -Fq 'V157ReminderCenterUi(' app/src/main/java/com/framebynavin/app/ui/V131PolishUi.kt
          grep -Fq 'PTab.CREATE, Icons.Outlined.MovieEdit, "Projects"' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          test -f app/src/test/java/com/framebynavin/app/ui/V219ReminderHubPolicyTest.kt
          test -f app/src/androidTest/java/com/framebynavin/app/ui/V219ReminderHubUiTest.kt
      - name: Test all unit policies and compile complete Backlot
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload full Backlot synthetic-test APKs
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V219-Full-App-Android-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V219-Full-App-Android-APKs
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Compose captureToImage() excludes Android system bars: validate root width and height range.\n      - name: Real Android Home to Reminders Hub screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r apks/debug/app-debug.apk
            adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            mkdir -p v219-evidence
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V219ReminderHubUiTest -e backlotVisualProfile default -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v219-default.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v219-default.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v219-default.log
            for scene in home-hub-card center-over-home hub-all hub-upcoming hub-today; do adb exec-out run-as com.framebynavin.app cat "files/v219-ui/v219-default-${scene}.png" > "v219-evidence/v219-default-${scene}.png"; done
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V157ReminderCenterUiTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v219-center-regression.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v219-center-regression.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' v219-center-regression.log
            adb shell wm size 900x1600
            adb shell settings put system font_scale 1.5
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V219ReminderHubUiTest -e backlotVisualProfile compact -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee v219-compact.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' v219-compact.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' v219-compact.log
            for scene in home-hub-card center-over-home hub-all hub-upcoming hub-today; do adb exec-out run-as com.framebynavin.app cat "files/v219-ui/v219-compact-${scene}.png" > "v219-evidence/v219-compact-${scene}.png"; done
            adb shell wm size reset
            adb shell settings put system font_scale 1.0
            python3 -c 'from pathlib import Path; from struct import unpack; fs=list(Path("v219-evidence").glob("*.png")); assert len(fs)==10,len(fs); sizes={p.name:unpack(">II",p.read_bytes()[16:24]) for p in fs}; assert all(p.read_bytes()[:8]==bytes.fromhex("89504e470d0a1a0a") and p.stat().st_size>10000 for p in fs); assert all(wh[0]==900 and 1300<=wh[1]<=1600 for n,wh in sizes.items() if "compact" in n); assert all(wh[0]==1080 and 2100<=wh[1]<=2400 for n,wh in sizes.items() if "default" in n); print(sizes)'
      - name: Upload real Android Home/Center PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V219-Real-Android-Reminder-Hub
          path: |
            v219-evidence/*.png
            v219-*.log
          if-no-files-found: warn
          retention-days: 14
