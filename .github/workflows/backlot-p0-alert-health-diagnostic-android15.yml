name: Backlot P0 Alert Health known-discrepancy characterization - Android 15

on:
  push:
    branches:
      - audit/backlot-v337-p0-alert-health-regression-20261116

permissions:
  contents: read

concurrency:
  group: backlot-p0-alert-health-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android15-alert-health-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build P0 diagnostic app and instrumentation
        run: |
          set -euo pipefail
          mkdir -p output/p0-alert-health-diagnostic
          # Only in disposable CI checkout: five unrelated V339–V343 UI
          # tests have preexisting compile errors on frozen V337.
          ui_dir=app/src/androidTest/java/com/framebynavin/app/ui
          quarantine=$(mktemp -d)
          for name in \
            V339HomeOverflowMenuUiTest.kt \
            V340HomeSpacesEntryUiTest.kt \
            V341UnifiedBackupPanelUiTest.kt \
            V342UnifiedRestorePreparationUiTest.kt \
            V343UnifiedRecoveryEscrowUiTest.kt; do
            test -f "$ui_dir/$name"
            mv "$ui_dir/$name" "$quarantine/$name"
            printf '%s\n' "$ui_dir/$name" >> output/p0-alert-health-diagnostic/EXCLUDED_EXISTING_UI_TESTS.txt
          done
          timeout --signal=TERM --kill-after=20s 70m gradle :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
            --console=plain 2>&1 | tee output/p0-alert-health-diagnostic/BUILD.log
          git rev-parse HEAD > output/p0-alert-health-diagnostic/SOURCE-SHA.txt
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Reproduce suspected Alert Health reporting discrepancies on disposable Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            bash tools/qa/backlot_p0_alert_health_diagnostic_android15.sh
      - name: Upload diagnostic evidence regardless of success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-P0-Android15-Alert-Health-Diagnostic
          path: output/p0-alert-health-diagnostic/
          retention-days: 30
          if-no-files-found: warn
