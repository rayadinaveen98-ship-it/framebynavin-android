name: v2.0 Alpha 1.4B Brain Combinations

on:
  push:
    branches:
      - "develop/v2.0-alpha1.4b-brain-combinations"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha14b-brain-combinations
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v112 Brain combinations invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 112' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha1.4b-brain-combinations"' app/build.gradle.kts
          grep -q 'ANGLE_STYLE' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'TOPIC' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'SERIES' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'COMBINATION' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'archetype_hook' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'angle_hook' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'topic_hook' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'series_hook' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'extractSeriesKey' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'extractTopicKey' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'count >= 3 && positiveRate >= 67' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'count >= 4 && positiveRate >= 75' app/src/main/java/com/framebynavin/app/data/CreatorBrain.kt
          grep -q 'CreatorBrainEngine.matchForTask' app/src/main/java/com/framebynavin/app/data/CreatorOpportunityEngine.kt
          grep -q 'CreatorPlaybookEngine.build' app/src/main/java/com/framebynavin/app/ui/V20OpportunityEngineUi.kt
          grep -q 'ANALYZE VIDEO WITH GEMINI' app/src/main/java/com/framebynavin/app/ui/V20GeminiIntelligenceUi.kt
          grep -q 'ProjectPulseEngine::repairFalseSurfaceCompletion' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'DriveVaultManager' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt
          if grep -R --line-number 'AIzaSy' app/src/main app/src/debug app/src/release; then
            echo 'Firebase API keys must not be copied into Kotlin/Java source.' >&2
            exit 1
          fi
          git diff --check

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-alpha1.4b-brain-combinations.apk
          sha256sum verification/FrameByNavin-v2.0.0-alpha1.4b-brain-combinations.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-alpha1.4b-brain-combinations"
            echo "versionCode=112"
            echo "commit=$(git rev-parse HEAD)"
            echo "creatorBrainCombinations=true"
            echo "anglePatternLearning=true"
            echo "explicitTopicMemory=true"
            echo "explicitSeriesMemory=true"
            echo "contentDnaHookCombinations=true"
            echo "combinationRankingCapped=true"
            echo "minimumThreeEvaluatedForEmerging=true"
            echo "minimumFourEvaluatedForProvenOrCaution=true"
            echo "creatorPlaybookPreserved=true"
            echo "recommendationOutcomeLearningPreserved=true"
            echo "liveGeminiVideoAutopsyPreserved=true"
            echo "reminderCompletionSafetyPreserved=true"
            echo "driveVaultFoundationPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.4b-brain-combinations-apk
          path: verification/FrameByNavin-v2.0.0-alpha1.4b-brain-combinations.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-alpha1.4b-brain-combinations-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:staging/v2.0-alpha1.4b-brain-combinations-validated
