name: V2273 Android15 Personal Editor Isolation Diagnostics
on:
  push:
    branches: [qa/backlot-v2273-api35-personal-isolated-20261029]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V2273-Device-QA-Test-APKs
          path: apks
          run-id: 40815449153
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolate Personal Normal and Keyboard Tests in Real Android15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -e
            adb install -r "$(find apks -type f -name app-debug.apk -print -quit)"
            adb install -r "$(find apks -type f -name app-debug-androidTest.apk -print -quit)"
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.gestural
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell am instrument -w -r -e class 'com.framebynavin.app.ui.V2271PersonalEditorDeviceUiTest#normalPhoneEditorKeepsActionsWithinActualDialog' com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee isolated-normal.log
            grep -Fq 'OK (1 test)' isolated-normal.log
            adb shell am instrument -w -r -e class 'com.framebynavin.app.ui.V2271PersonalEditorDeviceUiTest#largeFontScaleStacksAndKeepsKeyboardSafeSaveClickable' com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee isolated-keyboard.log
            grep -Fq 'OK (1 test)' isolated-keyboard.log
            # A combined run is diagnostic only; never label its failure as green.
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2271PersonalEditorDeviceUiTest com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee combined-reproduction.log || true
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' isolated-normal.log isolated-keyboard.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Backlot-V2273-API35-Personal-Isolation-Evidence
          path: |
            isolated-normal.log
            isolated-keyboard.log
            combined-reproduction.log
          if-no-files-found: warn
