name: Wire v1.7.1 Visual Polish

on:
  push:
    branches:
      - "feature/v1.7.1-visual-polish"
    paths:
      - "tools/v171_visual_patch.py"
      - ".github/workflows/v171-visual-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.7.1-visual-polish
      - name: Apply guarded bottom-nav patch
        run: python tools/v171_visual_patch.py
      - name: Commit nav polish
        run: |
          if git diff --quiet; then
            echo "No nav changes needed"
            exit 0
          fi
          git config user.name "FrameByNavin Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          git commit -m "feat(v1.7.1): add centered create action to bottom nav"
          git push origin HEAD:feature/v1.7.1-visual-polish
