name: V150 Phase B Product Focus

on:
  push:
    branches:
      - feature/v150-pilot-product-focus
    paths:
      - .github/workflows/v150-phase-b-product.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V150 product patch
        run: python3 scripts/v150_patch_product.py

      - name: Commit product integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Backlot V150 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/data/CreatorWorkflow.kt app/src/main/java/com/framebynavin/app/ui/V09IdeaVaultUi.kt
          if ! git diff --cached --quiet; then
            git commit -m "feat(v150): activate category workflows and clean idea vault"
            git push origin HEAD:feature/v150-pilot-product-focus
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation APK
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: backlot-v150-phase-b-product-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

