name: Backlot RC1 - Integrated Owner APK In-Place Data Preservation
# Integrated owner artifact verified: run 41486414618, SHA256 b455463cbd9c645ac17f22cf1cc92abd9e9dbfc9addf7196f0fe3dd3252968a9
on:
  push:
    branches: [feature/backlot-v283-rc1-integrated-upgrade-qa]
permissions:
  contents: read
  actions: read

jobs:
  upgrade-test:
    # Start only once completed RC1 owner APK artifacts have been published.
    # First workflow-creation commit intentionally does NOT trigger costly emulators.
    if: contains(github.event.head_commit.message, '[run-owner-upgrade]')
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-282-to-283-InPlace-Test-Harness
          path: harness
          run-id: 41479960679
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-Build282-PersonalAutoRetry-Owner-Test
          path: old
          run-id: 41394336705
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-RC1-Integrated-Owner-APK
          path: new
          run-id: 41486414618
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Verify archive checksums and same-preview signer
        run: |
          set -euo pipefail
          (cd old && sha256sum -c SHA256SUMS.txt)
          (cd harness && sha256sum -c SHA256SUMS.txt)
          (cd new && sha256sum -c SHA256SUMS.txt)
          OLD=old/Backlot-Build282-PersonalAutoRetry-Owner-Test.apk
          NEW=new/Backlot-Build283-CreatorAutoRetry-Owner-Test.apk
          test -s "$OLD" && test -s "$NEW"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' new/SIGNATURE-VERIFICATION.txt
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$OLD" > /tmp/old-apk-signature.txt
          "$APKSIGNER" verify --verbose --print-certs "$NEW" > /tmp/new-apk-signature.txt
          # Build Tools 37 reports "V2 Signer: certificate SHA-256 digest" rather
          # than older "Signer #1 certificate SHA-256 digest". Parse values,
          # compare actual fingerprint bytes, not the human-readable prefix.
          python3 - <<'PY'
          import pathlib
          import re
          def fingerprint(path):
              text = pathlib.Path(path).read_text()
              matches = re.findall(r'certificate SHA-256 digest:\\s*([0-9a-fA-F]{64})', text)
              assert matches, f'No signer X.509 certificate SHA256 found in {path}'
              assert len(set(x.lower() for x in matches)) == 1, f'Ambiguous signer certificate in {path}'
              return matches[0].lower()
          old = fingerprint('/tmp/old-apk-signature.txt')
          new = fingerprint('/tmp/new-apk-signature.txt')
          assert old == new, f'APK signer mismatch! Build282: {old} / RC1: {new}'
          print('PASS exact preview certificate match:',new)
          PY
          echo 'PASS Build282/RC1 APK SHA256SUMS and v2-signature verification'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install 282 then upgrade to integrated RC1 without clearing app storage (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb install old/Backlot-Build282-PersonalAutoRetry-Owner-Test.apk
            adb install harness/upgrade-androidTest.apk
            # Only initial disposable-emulator fixture creation clears app data.
            adb shell pm clear com.framebynavin.app
            adb shell am instrument -w -r -e hardeningTestEnvironment ci-emulator -e class 'com.framebynavin.app.release.V283UpgradeDeviceTest#seed282' com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/rc1-old-seed.log
            grep -Fq 'OK (1 test)' /tmp/rc1-old-seed.log
            if grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' /tmp/rc1-old-seed.log; then exit 1; fi
            # Critical: NO pm clear, uninstall, data overwrite, backup restore, or account login below.
            adb shell am force-stop com.framebynavin.app
            adb install -r new/Backlot-Build283-CreatorAutoRetry-Owner-Test.apk
            adb shell am instrument -w -r -e hardeningTestEnvironment ci-emulator -e class 'com.framebynavin.app.release.V283UpgradeDeviceTest#verify283' com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/rc1-upgraded.log
            grep -Fq 'OK (1 test)' /tmp/rc1-upgraded.log
            if grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' /tmp/rc1-upgraded.log; then exit 1; fi
            echo 'PASS Build282 to integrated RC1 Build283 Creator and Personal upgrade on API ${{ matrix.api }}'
