name: v2.0 Alpha 1.1 Home + Login Repair

on:
  push:
    branches:
      - "fix/v2.0-alpha1.1-home-login"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-alpha11-home-login-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[alpha11-repair-done]') == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore Home and decouple login from cloud safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Restore the exact pre-v2 Today/Home route. Keep v2 command-center source dormant
          # so it can be reintroduced additively later instead of replacing Home.
          app = Path("app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt")
          text = app.read_text()
          old = '''                PTab.TODAY -> V20TodayCommandCenter(
                              creatorProfile = settings.creatorProfile,
                              tasks = vm.tasks,
                              onAdd = { openComposer() },
                              onCapture = { showQuickCapture = true },
                              onStart = vm::startTask,
                              onViewAllReminders = { showReminders = true },
                              onFocus = { focusTaskId = it },
                              onOpenProject = ::openProject,
                          )'''
          new = '''                PTab.TODAY -> PTodayScreen(
                              creatorProfile = settings.creatorProfile,
                              tasks = vm.tasks,
                              onAdd = { openComposer() },
                              onStart = vm::startTask,
                              onAdvance = ::advanceWorkflowWithJourney,
                              onViewAllReminders = { showReminders = true },
                              onFocus = { focusTaskId = it },
                              onOpenProject = ::openProject,
                          )'''
          if old not in text:
              raise SystemExit("Expected v2 Today route not found; refusing broad Home rewrite")
          app.write_text(text.replace(old, new, 1))

          # 2) Make lifecycle cache explicitly clearable. Unknown server state must never inherit
          # a previous writable generation after sign-in/account transition.
          local = Path("app/src/main/java/com/framebynavin/app/cloud/CloudLocalStore.kt")
          text = local.read_text()
          marker = '''    /** Legacy RC7 journal strings have no safe replay generation. */'''
          addition = '''    fun clearLifecycle() = synchronized(accountLock) {
        check(
            prefs.edit()
                .remove(KEY_LIFECYCLE)
                .remove(KEY_RECONCILED_USER)
                .putBoolean(KEY_ENABLED, false)
                .commit()
        ) { "Could not clear cloud lifecycle state" }
    }

'''
          if addition.strip() not in text:
              if marker not in text:
                  raise SystemExit("CloudLocalStore lifecycle insertion marker missing")
              text = text.replace(marker, addition + marker, 1)
          local.write_text(text)

          # 3) Persist authenticated identity before optional lifecycle inspection. Existing
          # creator profile lookup is read-only. If the lifecycle RPC is absent, login succeeds
          # while cloud writes remain blocked because lifecycle/approval are both cleared.
          manager = Path("app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt")
          text = manager.read_text()
          start = text.index("    suspend fun completeGoogleSignIn(idToken: String): CloudOperationResult {")
          end = text.index("    suspend fun refreshCreatorProfile(): Result<CloudCreatorProfile?>", start)
          replacement = '''    suspend fun completeGoogleSignIn(idToken: String): CloudOperationResult {
        return transitionResult { epoch ->
            runCatching {
                val session = api.signInWithGoogle(idToken)
                require(session.userId.isNotBlank()) { "Account identity missing" }
                accountGate.requireCurrent(epoch, local.generation())

                // Authentication is an identity concern. Persist it before optional cloud-backup
                // lifecycle inspection so a missing safety RPC cannot masquerade as Google failure.
                check(local.clearApproval()) { "Could not clear cloud backup approval" }
                local.clearLifecycle()
                local.saveSession(session)
                local.clearCreatorProfile()

                // Returning-account identity lookup is read-only and does not authorize uploads.
                val profile = runCatching { api.fetchCreatorProfile(session) }
                    .onFailure { it.rethrowCancellation() }
                    .getOrNull()
                accountGate.requireCurrent(epoch, local.generation())
                require(profile == null || profile.userId == session.userId) { "Account profile mismatch" }
                profile?.let(local::saveCreatorProfile)

                val lifecycle = try {
                    api.cloudStatus(session)
                } catch (error: Throwable) {
                    error.rethrowCancellation()
                    if (isCloudSafetyServiceUnavailable(error)) {
                        val message = "Google account connected. Cloud backup safety is temporarily unavailable, so uploads remain off."
                        local.markError(message)
                        return@runCatching CloudOperationResult.Success(message)
                    }
                    throw error
                }

                accountGate.requireCurrent(epoch, local.generation())
                local.saveLifecycle(session.userId, lifecycle)
                val writable = lifecycle.active && !local.deletionPendingFor(session.userId)
                if (writable) {
                    api.upsertProfile(session, lifecycle.generation)
                    val refreshedProfile = api.fetchCreatorProfile(session)
                    accountGate.requireCurrent(epoch, local.generation())
                    require(refreshedProfile == null || refreshedProfile.userId == session.userId) { "Account profile mismatch" }
                    if (refreshedProfile != null) local.saveCreatorProfile(refreshedProfile)
                    api.upsertDevice(session, local.deviceKey(), deviceLabel(), BuildConfig.VERSION_NAME, lifecycle.generation)
                }
                val points = api.listRestorePoints(session)
                accountGate.requireCurrent(epoch, local.generation())

                if (!lifecycle.active) {
                    CloudOperationResult.Success("Account connected. Cloud creator data is deleted. Your phone data is safe. Review the account state before explicitly starting a new cloud history.")
                } else if (local.deletionPendingFor(session.userId)) {
                    CloudOperationResult.Success("Cloud data deletion is unfinished. Retry it from Account & Data. Your phone data is safe and uploads remain blocked.")
                } else if (points.isEmpty()) {
                    check(local.approveUser(session.userId)) { "Could not save cloud backup approval" }
                    CloudOperationResult.Success("Account connected. Your phone remains the main copy. Backups are manual.")
                } else {
                    CloudOperationResult.Success("Account connected. Review your existing cloud backups before creating a new one.")
                }
            }.getOrElse {
                it.rethrowCancellation()
                if (it is CloudAccountChanged) return@getOrElse CloudOperationResult.Skipped(it.message.orEmpty())
                val message = cloudMessage(it, "Couldn't connect Google account")
                local.markError(message)
                CloudOperationResult.Failure(message, retryable = it !is CloudHttpException || it.statusCode >= 500)
            }
        }
    }

    /** Identity refresh is intentionally read-only and independent from backup lifecycle state. */
    suspend fun refreshCreatorIdentity(): Result<CloudCreatorProfile?> = runCatching {
        currentAccount { epoch ->
            val session = freshSession(local.loadSession() ?: error("Sign in with Google first"), epoch)
            val profile = api.fetchCreatorProfile(session)
            accountGate.requireCurrent(epoch, local.generation())
            require(profile == null || profile.userId == session.userId) { "Account profile mismatch" }
            if (profile == null) local.clearCreatorProfile() else local.saveCreatorProfile(profile)
            profile
        }
    }.onFailure { it.rethrowCancellation() }

'''
          text = text[:start] + replacement + text[end:]

          old_helper = '''    private fun cloudMessage(error: Throwable, fallback: String): String = when (error) {
        is CloudHttpException -> if (error.statusCode == 404 || error.message.contains("PGRST202"))
            "Cloud safety service is not available yet. Creator data remains on this phone; no upload was started."
        else error.message.ifBlank { fallback }
        else -> fallback
    }
'''
          new_helper = '''    private fun cloudMessage(error: Throwable, fallback: String): String = when {
        isCloudSafetyServiceUnavailable(error) ->
            "Cloud backup safety service is not available yet. Creator data remains on this phone; no upload was started."
        error is CloudHttpException -> error.message.ifBlank { fallback }
        else -> fallback
    }
'''
          if old_helper not in text:
              raise SystemExit("Cloud error helper contract changed; refusing broad rewrite")
          text = text.replace(old_helper, new_helper, 1)
          if "internal fun isCloudSafetyServiceUnavailable" not in text:
              text += '''\ninternal fun isCloudSafetyServiceUnavailable(error: Throwable): Boolean =
    error is CloudHttpException &&
        (error.statusCode == 404 || error.message.contains("PGRST202", ignoreCase = true))
'''
          manager.write_text(text)

          # 4) Account onboarding must use the identity-only refresh. Returning users with a
          # server profile enter immediately; when the safety RPC is missing, authenticated users
          # may still enter locally while cloud writes stay disabled.
          onboarding = Path("app/src/main/java/com/framebynavin/app/ui/V23AccountOnboarding.kt")
          text = onboarding.read_text()
          old_success = '''                        is CloudOperationResult.Success -> {
                            manager.refreshCreatorProfile()
                            reload()
                        }'''
          new_success = '''                        is CloudOperationResult.Success -> {
                            manager.refreshCreatorIdentity()
                            reload()
                            val connectedSession = manager.localState().session
                            val connectedProfile = manager.cachedCreatorProfile()
                            when {
                                connectedSession != null && !connectedProfile?.username.isNullOrBlank() ->
                                    onComplete(connectedProfile!!.displayName.ifBlank { connectedSession.displayName })
                                connectedSession != null && resultState.message.startsWith("Google account connected.") ->
                                    onComplete(connectedSession.displayName)
                            }
                        }'''
          if old_success not in text:
              raise SystemExit("Google onboarding success block changed; refusing broad rewrite")
          text = text.replace(old_success, new_success, 1)

          old_effect = '''    LaunchedEffect(Unit) {
        if (session != null) {
            manager.refreshCreatorProfile()
            reload()
        }
    }'''
          new_effect = '''    LaunchedEffect(Unit) {
        if (session != null) {
            manager.refreshCreatorIdentity()
            reload()
            val connectedSession = manager.localState().session
            val connectedProfile = manager.cachedCreatorProfile()
            if (connectedSession != null && !connectedProfile?.username.isNullOrBlank()) {
                onComplete(connectedProfile!!.displayName.ifBlank { connectedSession.displayName })
            }
        }
    }'''
          if old_effect not in text:
              raise SystemExit("Account onboarding refresh effect changed; refusing broad rewrite")
          onboarding.write_text(text.replace(old_effect, new_effect, 1))

          # 5) This is a new corrective APK; never overwrite v84 identity.
          gradle = Path("app/build.gradle.kts")
          build = gradle.read_text()
          if 'versionCode = 84' not in build or 'versionName = "2.0.0-today-alpha1"' not in build:
              raise SystemExit("Unexpected Alpha 1 build identity")
          build = build.replace('versionCode = 84', 'versionCode = 85', 1)
          build = build.replace('versionName = "2.0.0-today-alpha1"', 'versionName = "2.0.0-today-alpha1.1"', 1)
          gradle.write_text(build)
          PY

          git diff --check

      - name: Add regression test for missing safety RPC classification
        shell: bash
        run: |
          set -euo pipefail
          cat > app/src/test/java/com/framebynavin/app/cloud/CloudLoginAlpha11Test.kt <<'EOF'
          package com.framebynavin.app.cloud

          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class CloudLoginAlpha11Test {
              @Test
              fun missingLifecycleRpc_isClassifiedAsSafetyServiceUnavailable() {
                  assertTrue(isCloudSafetyServiceUnavailable(CloudHttpException(404, "not found")))
                  assertTrue(isCloudSafetyServiceUnavailable(CloudHttpException(400, "PGRST202 function missing")))
              }

              @Test
              fun authAndOtherServerErrors_areNotMisclassified() {
                  assertFalse(isCloudSafetyServiceUnavailable(CloudHttpException(401, "unauthorized")))
                  assertFalse(isCloudSafetyServiceUnavailable(CloudHttpException(500, "server error")))
                  assertFalse(isCloudSafetyServiceUnavailable(IllegalStateException("offline")))
              }
          }
          EOF
          git diff --check

      - name: Verify corrective invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PTab.TODAY -> PTodayScreen(' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -q 'PTab.TODAY -> V20TodayCommandCenter(' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'onAdvance = ::advanceWorkflowWithJourney' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V20TodayCommandCenter.kt

          grep -q 'local.saveSession(session)' app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt
          grep -q 'api.cloudStatus(session)' app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt
          grep -q 'refreshCreatorIdentity' app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt
          grep -q 'local.clearLifecycle()' app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt
          grep -q 'Cloud backup safety is temporarily unavailable, so uploads remain off' app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt
          grep -q 'manager.refreshCreatorIdentity()' app/src/main/java/com/framebynavin/app/ui/V23AccountOnboarding.kt
          ! grep -q 'manager.refreshCreatorProfile()' app/src/main/java/com/framebynavin/app/ui/V23AccountOnboarding.kt

          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt').read_text()
          fn = text[text.index('suspend fun completeGoogleSignIn'):text.index('suspend fun refreshCreatorIdentity')]
          assert fn.index('local.saveSession(session)') < fn.index('api.cloudStatus(session)'), 'Session must persist before optional lifecycle RPC'
          assert fn.index('local.clearLifecycle()') < fn.index('local.saveSession(session)'), 'Lifecycle must be unknown before persisting new account session'
          PY

          grep -q 'versionCode = 85' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-today-alpha1.1"' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml

      - name: Commit exact corrective source locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --check
          git -c commit.gpgSign=false commit -m "fix(v2.0) [alpha11-repair-done] restore Home and unblock safe account login"
          git rev-parse HEAD | tee /tmp/repair_commit

      - name: Full Android validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          cp app/build/outputs/apk/debug/app-debug.apk verification/FrameByNavin-v2.0.0-today-alpha1.1.apk
          sha256sum verification/FrameByNavin-v2.0.0-today-alpha1.1.apk | tee verification/apk.sha256
          {
            echo "versionName=2.0.0-today-alpha1.1"
            echo "versionCode=85"
            echo "commit=$(cat /tmp/repair_commit)"
            echo "previousHomeRestored=true"
            echo "v20CommandCenterDormant=true"
            echo "googleIdentityPersistsBeforeLifecycleCheck=true"
            echo "missingLifecycleRpcDoesNotBlockLogin=true"
            echo "cloudUploadsRemainFailClosed=true"
            echo "creatorIdentityRefreshReadOnly=true"
            echo "publicationAuthority=deliverable-publish-studio"
            echo "projectWorkflowAuthority=creator-workflow-engine"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload corrective APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-today-alpha1.1-apk
          path: verification/FrameByNavin-v2.0.0-today-alpha1.1.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload corrective verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-today-alpha1.1-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated repair source
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/v2.0-alpha1.1-home-login
