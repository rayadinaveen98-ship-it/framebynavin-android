name: Build FrameByNavin v1.8 Product Alpha10

on:
  workflow_dispatch:
  push:
    branches:
      - foundation/v1.8-cleanup
    paths:
      - "app/**"
      - "dev-signing/framebynavin-public-debug.jks"
      - "tools/v175_integrate.py"
      - "tools/v175_brand_ident_rc4.py"
      - "tools/v175_public_prepare.py"
      - "tools/v175_copy_polish.py"
      - "tools/v175_copy_polish_followup.py"
      - "tools/v175_youtube_signing_fix.py"
      - "tools/v18_foundation_cleanup.py"
      - "tools/v18_foundation_alpha2.py"
      - "tools/v18_accessibility_alpha3.py"
      - "tools/v18_architecture_alpha4.py"
      - "tools/v18_architecture_alpha5.py"
      - "tools/v18_interaction_tests_alpha6.py"
      - "tools/v18_credential_manager_alpha7.py"
      - "tools/v18_creator_intelligence_alpha8.py"
      - "tools/v18_creator_identity_alpha9.py"
      - "tools/v18_creator_identity_alpha9_test_fix.py"
      - "tools/v18_primary_navigation_alpha10.py"
      - ".github/workflows/v18-product-build.yml"
      - "*.gradle.kts"
      - "gradle.properties"

concurrency:
  group: framebynavin-v18-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply v1.7.5 integration
        run: python3 tools/v175_integrate.py

      - name: Apply locked FrameByNavin ident
        run: python3 tools/v175_brand_ident_rc4.py

      - name: Apply public-safe preparation
        run: python3 tools/v175_public_prepare.py

      - name: Apply UX copy polish
        run: python3 tools/v175_copy_polish.py

      - name: Finish plain-language pass
        run: python3 tools/v175_copy_polish_followup.py

      - name: Keep prototype update signing
        run: python3 tools/v175_youtube_signing_fix.py

      - name: Apply v1.8 foundation cleanup
        run: python3 tools/v18_foundation_cleanup.py

      - name: Apply alpha2 foundation version
        run: python3 tools/v18_foundation_alpha2.py

      - name: Apply alpha3 accessibility pass
        run: python3 tools/v18_accessibility_alpha3.py

      - name: Apply alpha4 architecture split
        run: python3 tools/v18_architecture_alpha4.py

      - name: Apply alpha5 Today split
        run: python3 tools/v18_architecture_alpha5.py

      - name: Apply alpha6 interaction tests
        run: python3 tools/v18_interaction_tests_alpha6.py

      - name: Apply alpha7 Credential Manager migration
        run: python3 tools/v18_credential_manager_alpha7.py

      - name: Apply alpha8 creator-neutral YouTube intelligence
        run: python3 tools/v18_creator_intelligence_alpha8.py

      - name: Apply alpha9 creator identity and onboarding
        run: python3 tools/v18_creator_identity_alpha9.py

      - name: Apply alpha9 instrumentation compatibility fix
        run: python3 tools/v18_creator_identity_alpha9_test_fix.py

      - name: Apply alpha10 primary Creator OS navigation
        run: python3 tools/v18_primary_navigation_alpha10.py

      - name: Product gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 50' app/build.gradle.kts
          grep -q 'versionName = "1.8.0-product-alpha10"' app/build.gradle.kts
          grep -q 'prototypeStable' app/build.gradle.kts

          test -s app/src/main/java/com/framebynavin/app/data/CreatorProfile.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V18CreatorOnboarding.kt
          test -s app/src/test/java/com/framebynavin/app/data/CreatorProfileAlpha9Test.kt
          grep -q 'val creatorProfile: CreatorProfile' app/src/main/java/com/framebynavin/app/data/CreatorOsSettings.kt
          grep -q 'creatorProfile' app/src/main/java/com/framebynavin/app/data/CreatorOsSettings.kt
          grep -q 'setCreatorProfile' app/src/main/java/com/framebynavin/app/data/CreatorOsSettings.kt
          grep -q 'V18CreatorOnboarding' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'settings.creatorProfile.safeDisplayName' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'EDIT CREATOR PROFILE' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -q 'creatorName: String' app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt
          test "$(grep -c '^    @Test' app/src/test/java/com/framebynavin/app/data/CreatorProfileAlpha9Test.kt)" -eq 3
          test "$(grep -c 'creatorName = "Test Creator"' app/src/androidTest/java/com/framebynavin/app/ui/V18CoreInteractionUiTest.kt)" -eq 2

          grep -Fq 'internal enum class PTab { TODAY, IDEAS, CREATE, CALENDAR, INSIGHTS }' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -Fq 'internal fun PBottomNav' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -Fq '"Ideas"' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -Fq '"Create"' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -Fq '"Calendar"' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -Fq 'Text("CAPTURE"' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -Fq '"Capture idea"' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -Fq 'PTab.PLAN' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -Fq 'PTab.STUDIO' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -Fq 'POverlay.IDEAS' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -Fq 'POverlay.CALENDAR' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          grep -Fq 'onClose: (() -> Unit)?' app/src/main/java/com/framebynavin/app/ui/V09IdeaVaultUi.kt
          grep -Fq 'onClose: (() -> Unit)?' app/src/main/java/com/framebynavin/app/ui/V15ContextUi.kt
          grep -Fq 'Text("CREATE"' app/src/main/java/com/framebynavin/app/ui/V131PolishUi.kt
          grep -Fq 'Turn ideas into finished work.' app/src/main/java/com/framebynavin/app/ui/V131PolishUi.kt
          test -s app/src/androidTest/java/com/framebynavin/app/ui/V18PrimaryNavigationAlpha10UiTest.kt
          test "$(grep -c '^    @Test' app/src/androidTest/java/com/framebynavin/app/ui/V18PrimaryNavigationAlpha10UiTest.kt)" -eq 4

          ! grep -R -F 'Good Morning, Navin' app/src/main/java/com/framebynavin/app/ui
          ! grep -R -F 'Good Afternoon, Navin' app/src/main/java/com/framebynavin/app/ui
          ! grep -R -F 'Good Evening, Navin' app/src/main/java/com/framebynavin/app/ui
          ! grep -R -F 'Good Night, Navin' app/src/main/java/com/framebynavin/app/ui
          ! grep -R -F 'ZoneId.of("Asia/Kolkata")' app/src/main/java/com/framebynavin/app/ui
          ! grep -F 'private fun POnboarding' app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt
          ! grep -R -F 'Save an idea to Inbox in seconds' app/src/main/java/com/framebynavin/app/ui

          test -s app/src/main/java/com/framebynavin/app/youtube/YouTubeContentClassifier.kt
          grep -q 'androidx.credentials:credentials:1.6.0' app/build.gradle.kts
          grep -q 'CredentialManager.create' app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          test -s app/src/androidTest/java/com/framebynavin/app/ui/V18CoreInteractionUiTest.kt
          test "$(wc -l < app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt)" -le 1060

          echo "v1.8 product alpha10 gate passed"

      - name: Package post-integration source for audit
        shell: bash
        run: |
          set -euo pipefail
          tar -czf FrameByNavin-v1.8.0-product-alpha10-audit-source.tar.gz \
            app/src/main \
            app/src/test \
            app/src/androidTest \
            app/build.gradle.kts \
            build.gradle.kts \
            settings.gradle.kts \
            gradle.properties

      - name: Upload audit source
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.0-product-alpha10-audit-source
          path: FrameByNavin-v1.8.0-product-alpha10-audit-source.tar.gz

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run interaction tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.8.0-product-alpha10
          path: app/build/outputs/apk/debug/app-debug.apk
