name: v2.0 Beta 2.2 Production Security Data Audit

on:
  push:
    branches:
      - "develop/v2.0-beta2.2-production-security-data-audit"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v20-beta2.2-production-security-data-audit
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v120 security and data invariants
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionCode = 120' app/build.gradle.kts
          grep -q 'versionName = "2.0.0-beta2.2-production-security-data-audit"' app/build.gradle.kts
          grep -A8 'getByName("release")' app/build.gradle.kts | grep -q 'isDebuggable = false'
          ! grep -A8 'getByName("release")' app/build.gradle.kts | grep -q 'prototypeStable'

          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          test "$(grep -c 'android:exported="true"' app/src/main/AndroidManifest.xml)" -eq 1
          grep -A6 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml | grep -q 'android:exported="true"'

          grep -q 'PlayIntegrityAppCheckProviderFactory' app/src/release/java/com/framebynavin/app/CreatorAppCheck.kt
          ! grep -q 'DebugAppCheckProviderFactory' app/src/release/java/com/framebynavin/app/CreatorAppCheck.kt
          grep -q 'DebugAppCheckProviderFactory' app/src/debug/java/com/framebynavin/app/CreatorAppCheck.kt
          grep -q 'CreatorAppCheck.install' app/src/main/java/com/framebynavin/app/MainActivity.kt

          grep -q 'AES/GCM/NoPadding' app/src/main/java/com/framebynavin/app/cloud/CloudLocalStore.kt
          grep -q 'AndroidKeyStore' app/src/main/java/com/framebynavin/app/cloud/CloudLocalStore.kt
          grep -q 'Drive access tokens are never written to disk' app/src/main/java/com/framebynavin/app/cloud/DriveVaultTokenMemory.kt
          test "$(grep -c 'DriveVaultTokenMemory.clear()' app/src/main/java/com/framebynavin/app/cloud/CloudSyncManager.kt)" -ge 2
          test -f app/src/test/java/com/framebynavin/app/cloud/DriveVaultTokenMemoryTest.kt
          grep -q 'new account authorization replaces previous account token' app/src/test/java/com/framebynavin/app/cloud/DriveVaultTokenMemoryTest.kt

          migration='supabase/migrations/20260912034000_harden_creator_profiles_privileges.sql'
          test -f "$migration"
          grep -q 'revoke all privileges on table public.creator_profiles from anon' "$migration"
          grep -q 'revoke truncate, references, trigger on table public.creator_profiles from authenticated' "$migration"
          grep -q 'grant select, insert, update, delete on table public.creator_profiles to authenticated' "$migration"
          grep -q 'revoke execute on function public.claim_creator_username(text, text) from anon' "$migration"

          test -f docs/release/v120-production-security-data-audit.md
          grep -q 'Production Supabase authorization review' docs/release/v120-production-security-data-audit.md
          grep -q 'anon.*no table privileges' docs/release/v120-production-security-data-audit.md
          grep -q 'Verified production schema gate.*PASSED' docs/release/2.0-rc-gates.md

          grep -q 'CreatorDataGate.transaction' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -q 'recoverPendingRestore' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -q 'payloadSha256' app/src/main/java/com/framebynavin/app/data/CreatorBackupManager.kt
          grep -q 'spaces=appDataFolder' app/src/main/java/com/framebynavin/app/cloud/DriveVaultApi.kt
          grep -q 'Drive snapshot integrity check failed' app/src/main/java/com/framebynavin/app/cloud/DriveVaultManager.kt

          grep -q 'ProjectPulseEngine::repairFalseSurfaceCompletion' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'ANALYZE VIDEO WITH GEMINI' app/src/main/java/com/framebynavin/app/ui/V20GeminiIntelligenceUi.kt
          grep -q 'V117VoiceIdeaInput' app/src/main/java/com/framebynavin/app/ui/V14QuickCaptureUi.kt
          grep -q 'V20OpportunityEngineInsightsCard(snapshot)' app/src/main/java/com/framebynavin/app/ui/V20InsightsFoundationUi.kt

          if grep -R --line-number -E 'AIzaSy|sb_secret_' app/src/main app/src/debug app/src/release; then
            echo 'A copied/private application credential was found in app source.' >&2
            exit 1
          fi

          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Full debug and release validation
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebugAndroidTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          apk='verification/FrameByNavin-v2.0.0-beta2.2-production-security-data-audit.apk'
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" | tee verification/apk.sha256

          release_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$release_apk"
          sha256sum "$release_apk" | tee verification/release-unsigned.sha256

          {
            echo "versionName=2.0.0-beta2.2-production-security-data-audit"
            echo "versionCode=120"
            echo "sourceCommit=$(git rev-parse HEAD)"
            echo "supabaseProductionRlsReviewed=true"
            echo "supabaseAnonTablePrivileges=none"
            echo "supabaseAuthenticatedPrivileges=select-insert-update-delete"
            echo "supabaseBroadTablePrivilegesRemoved=true"
            echo "driveTokenPersisted=false"
            echo "driveTokenClearedOnAccountTransition=true"
            echo "driveVaultScope=appDataFolder"
            echo "cloudSessionEncryption=android-keystore-aes-gcm"
            echo "backupJournalRecoveryPreserved=true"
            echo "backupPayloadIntegrity=sha256"
            echo "releaseVariantCompiled=true"
            echo "releaseVariantSigned=false"
            echo "releaseDebuggable=false"
            echo "releaseAppCheck=play-integrity"
            echo "reminderCompletionSafetyPreserved=true"
            echo "finishProjectSafetyPreserved=true"
            echo "liveGeminiVideoAutopsyPreserved=true"
            echo "voiceQuickIdeaPreserved=true"
            echo "distributionSigning=development-sideload-only"
          } > verification/manifest.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-beta2.2-production-security-data-audit-apk
          path: verification/FrameByNavin-v2.0.0-beta2.2-production-security-data-audit.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v2.0.0-beta2.2-production-security-data-audit-verification
          path: |
            verification/manifest.txt
            verification/apk.sha256
            verification/release-unsigned.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Push validated source to staging
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:staging/v2.0-beta2.2-production-security-data-audit-validated
