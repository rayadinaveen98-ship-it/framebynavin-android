name: Backlot V294 - Synthetic Android 15 UX Screenshots

on:
  push:
    branches: [design/backlot-v294-app-wide-experience-audit, feature/backlot-v294-universal-ui-wave1, feature/backlot-v294-wave2-quiet-settings, qa/backlot-v294-wave2-release-candidate, feature/backlot-v295-universal-personal-foundation, feature/backlot-v296-guided-personal-composer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v294-visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-visual-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated debug app and screenshot Android test APK
        run: |
          set -euo pipefail
          timeout 75m gradle :app:assembleDebug :app:assembleDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Enable Android 15 emulator acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture four synthetic V294 screens on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-v294-emulator-visual-capture.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V294-Android15-Visual-Baseline
          path: output/v294-visual-audit/
          retention-days: 30
          if-no-files-found: error
