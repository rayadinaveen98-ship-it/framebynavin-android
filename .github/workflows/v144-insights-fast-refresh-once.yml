name: V144 Fast Insights Refresh Once

on:
  push:
    branches:
      - feature/v144-guide-schedule-refresh
    paths:
      - .github/workflows/v144-insights-fast-refresh-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v144-guide-schedule-refresh
          fetch-depth: 0
      - name: Apply guarded Insights patch
        run: python3 scripts/v144_insights_patch.py
      - name: Commit patch and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v144-insights-fast-refresh-once.yml scripts/v144_insights_patch.py
          git add app/src/main/java/com/framebynavin/app/ui/V11YouTubeInsights.kt app/src/main/java/com/framebynavin/app/ui/V172InsightsUi.kt app/src/main/java/com/framebynavin/app/ui/V20InsightsFoundationUi.kt
          git commit -m "perf(v144): publish core Insights before deep refresh"
          git push origin HEAD:feature/v144-guide-schedule-refresh
