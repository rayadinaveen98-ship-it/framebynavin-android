name: Backlot V171 New Project P1 — Safety Preview

on:
  push:
    branches:
      - feature/backlot-v171-new-project-p1-safety
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v171-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: V171 Project safety unit tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Confirm preview identity
        run: |
          grep -q 'versionCode = 171' app/build.gradle.kts
          grep -q '2.2.1-v171-new-project-safety-p1-preview' app/build.gradle.kts
      - name: Inherited safety and V171 regression guards
        run: |
          bash tools/check_v161_quick_actions_hub_capture.sh
          bash tools/check_v162_idea_vault.sh
          bash tools/check_v163_brief_calendar.sh
          bash tools/check_v164_weekly_plan_automation.sh
          bash tools/check_v165_creator_progress_e2e.sh
          bash tools/check_v166_settings_safety.sh
          bash tools/check_v167_settings_navigation.sh
          bash tools/check_v168_settings_profile.sh
          bash tools/check_v169_settings_reminders_planning.sh
          bash tools/check_v170_backup_sync_release_qa.sh
          bash tools/check_v171_project_safety.sh
      - name: JVM unit regression tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Android instrumentation APK compilation
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Build V171 debug preview APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V171 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v171-new-project-p1-safety-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
