name: Backlot P10F - Focused QA Gate

# Deliberately confined to a draft PR into the isolated P10E candidate.
# Does not merge, deploy, run the full JVM suite or produce an APK.
on:
  pull_request:
    branches:
      - feature/backlot-v337-point10e-legacy-reminder-cleanup-after-p10d-20261123
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-p10f-focused-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    name: "01 - Source and branch fence (no JVM)"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify inherited accepted V337 baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 815ba69775f75b6e5f25bb838c2c17b4f09c203e HEAD
          test "$(grep -c 'include(":app")' settings.gradle.kts)" -eq 1
          ! grep -Fq 'include(":v218review")' settings.gradle.kts
          echo "Source fence: accepted V337 ancestor; Backlot Android module present"
      - name: Check retired visual absence and P10 wiring
        shell: bash
        run: bash tools/check_p10_retired_reminder_visuals.sh
      - name: No private signer / production app or server mutation
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          grep -Fq 'versionCode = 337' app/build.gradle.kts
          grep -Fq 'applicationId = "com.framebynavin.app"' app/build.gradle.kts
          echo "QA only: no signing, publishing or hosted data access"

  kotlin-compile:
    name: "02 - Kotlin debug compile only (no tests/APK)"
    needs: [source-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile scoped Kotlin target; no clean, unit test or APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/p10f
          timeout --signal=TERM --kill-after=20s 5700s \
            gradle :app:compileDebugKotlin \
              --no-daemon --max-workers=2 --console=plain \
              '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1500m -Dfile.encoding=UTF-8' \
              2>&1 | tee output/p10f/compile-debug-kotlin.log
      - name: Save diagnostics even on a failed compile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-P10F-Focused-Kotlin-Compile-Log
          path: output/p10f/compile-debug-kotlin.log
          if-no-files-found: warn
          retention-days: 14
