name: Integrate v1.3 Cloud Sync

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/v13_integrate.py"
      - ".github/workflows/v13-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.3 integration
        run: python scripts/v13_integrate.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/framebynavin/app/MainActivity.kt app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt app/src/main/java/com/framebynavin/app/cloud/CloudSyncActivity.kt
          git commit -m "feat: integrate v1.3 cloud sync into Creator OS"
          git push
