name: Backlot V154 — Insights Freshness and Project Choice

on:
  push:
    branches:
      - feature/backlot-v154-insights-freshness-and-project-choice
  workflow_dispatch:
  pull_request:
    branches:
      - feature/backlot-v153-simple-creator-experience

permissions:
  contents: read

concurrency:
  group: backlot-v154-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V154
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Visible-language and entrypoint smoke checks
        run: bash tools/check_v154_smoke.sh

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Assemble APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Backlot V154 Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: backlot-v154-insights-project-choice-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
