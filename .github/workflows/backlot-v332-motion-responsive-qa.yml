name: Backlot V332 - Responsive Reminder Motion Android QA

on:
  push:
    branches:
      - feature/backlot-v332-reminder-motion-layout-reliability-20261111
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify responsive renderer and native load safeguards
        run: |
          set -euo pipefail
          grep -q 'ResizeObserver' app/src/main/assets/backlot_v330_motion.html
          grep -q 'startNormalized' app/src/main/assets/backlot_v330_motion.html
          grep -q -- '--hero-center-y' app/src/main/assets/backlot_v330_motion.html
          grep -q 'addOnLayoutChangeListener' app/src/main/java/com/framebynavin/app/reminders/V330ReminderPrototypeScene.kt
          grep -q 'onRenderProcessGone' app/src/main/java/com/framebynavin/app/reminders/V330ReminderPrototypeScene.kt
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/backlot_v330_motion.html').read_text()
          Path('/tmp/backlot-v332-motion.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/backlot-v332-motion.js
      - name: Verify approved renderer is packaged
        run: |
          set -euo pipefail
          test -s app/src/main/assets/backlot_v330_motion.html
          grep -q 'function drawNodes' app/src/main/assets/backlot_v330_motion.html
          grep -q 'function genNodes' app/src/main/assets/backlot_v330_motion.html
          grep -q '1250' app/src/main/assets/backlot_v330_motion.html
          grep -q 'DOUBLE TAP THE FORMED SIGNAL' app/src/main/assets/backlot_v330_motion.html
          grep -q 'V330ReminderPrototypeScene' app/src/main/java/com/framebynavin/app/reminders/ReminderCheckInScreen.kt
          grep -q 'V330ReminderPrototypeScene' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
      - name: Check four reveal surfaces retain original callbacks
        run: |
          set -euo pipefail
          grep -q 'V331PrototypeRevealHero' app/src/main/java/com/framebynavin/app/reminders/ReminderCheckInScreen.kt
          grep -q 'V331PrototypeRevealHero' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
          grep -q 'onClick = onSnooze' app/src/main/java/com/framebynavin/app/reminders/ReminderCheckInScreen.kt
          grep -q 'onClick = onDone' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
          grep -q 'v279-locked-generic-alarm' app/src/main/java/com/framebynavin/app/personal/PersonalAlertActivity.kt
      - name: Verify visual presentation policy
        run: |
          set -euo pipefail
          gradle :app:testPersonalStableUnitTest --tests 'com.framebynavin.app.reminders.V329ReminderVisualPolicyTest' --tests 'com.framebynavin.app.reminders.V331RevealStyleTest' --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Compile owner-upgrade compatible V332 preview
        run: |
          set -euo pipefail
          # Match the established personal owner-preview path; production release gates are unchanged.
          # Lint is not a compiler/signature check and remains outside this personal preview package.
          gradle :app:assemblePersonalStable -x :app:lintVitalPersonalStable --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Stage signed owner-preview artifact and checksum
        run: |
          set -euo pipefail
          mkdir -p output/v332
          APK=app/build/outputs/apk/personalStable/app-personalStable.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee output/v332/SIGNATURE.txt
          EXPECTED=$(keytool -exportcert -keystore dev-signing/framebynavin-public-debug.jks -storepass framebynavin-dev -alias framebynavin-dev | sha256sum | cut -d ' ' -f 1)
          ACTUAL=$(sed -n -E 's/^(V2 Signer|Signer #1): certificate SHA-256 digest: //p' output/v332/SIGNATURE.txt | head -n 1)
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' "$GITHUB_SHA" > output/v332/COMMIT.txt
          cp app/build/outputs/apk/personalStable/app-personalStable.apk output/v332/Backlot-V332-Motion-Fix-Owner-Preview.apk
          sha256sum output/v332/Backlot-V332-Motion-Fix-Owner-Preview.apk > output/v332/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V332-Responsive-Motion-Owner-Preview
          path: output/v332/
          retention-days: 30
          if-no-files-found: error

  android-render-smoke:
    needs: compile-responsive
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect real Android Canvas rendering and capture four screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: false
          script: |
            set +e
            gradle :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.reminders.V332MotionRendererDeviceTest' --no-daemon --no-parallel --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8'
            status=$?
            mkdir -p output/v332/device-captures
            for scene in creator_alarm creator_voice personal_alarm personal_voice; do
              adb exec-out run-as com.framebynavin.app cat "files/v332_${scene}.png" > "output/v332/device-captures/${scene}.png" || rm -f "output/v332/device-captures/${scene}.png"
            done
            exit "$status"
      - name: Upload real-emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V332-Android-Emulator-Visual-Proofs
          path: output/v332/device-captures/
          retention-days: 30
          if-no-files-found: warn
