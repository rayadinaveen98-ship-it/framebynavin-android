name: v1.9 RC3.1 Project Pulse Gate

on:
  push:
    branches:
      - "release/v1.9.0-rc3-project-pulse"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v19-rc3-project-pulse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify RC3.1 Project Pulse invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 83' app/build.gradle.kts
          grep -q 'versionName = "1.9.0-content-project-rc3.1"' app/build.gradle.kts
          test -s dev-signing/framebynavin-public-debug.jks
          test -s app/src/main/java/com/framebynavin/app/data/ProjectPulse.kt
          test -s app/src/main/java/com/framebynavin/app/data/ProjectPulseHistoryStore.kt
          test -s app/src/main/java/com/framebynavin/app/reminders/ProjectPulseNextStagePrompt.kt
          test -s app/src/main/java/com/framebynavin/app/reminders/SmartTargetBoundary.kt
          test -s app/src/test/java/com/framebynavin/app/data/ProjectPulseRc3Test.kt
          test -s app/src/test/java/com/framebynavin/app/reminders/ReminderActionSafetyRc3Test.kt
          test -s app/src/test/java/com/framebynavin/app/reminders/SmartTargetBoundaryRc3Test.kt
          test -s app/src/androidTest/java/com/framebynavin/app/data/ProjectPulseRc3PersistenceInstrumentedTest.kt
          grep -q 'enum class ReminderDeliveryPreference' app/src/main/java/com/framebynavin/app/data/CreatorTask.kt
          grep -q 'deliveryPreference' app/src/main/java/com/framebynavin/app/data/TaskStore.kt
          grep -q 'private fun resolvedDeliveryMode' app/src/main/java/com/framebynavin/app/data/ProjectPulse.kt
          grep -q 'REMINDER STYLE' app/src/main/java/com/framebynavin/app/ui/V101BReminderUi.kt
          grep -q 'Text("REPLAY"' app/src/main/java/com/framebynavin/app/reminders/VoiceReminderActivity.kt
          grep -q 'Text("CHOOSE TIME"' app/src/main/java/com/framebynavin/app/reminders/VoiceReminderActivity.kt
          grep -q 'ACTION_STAGE_DONE' app/src/main/java/com/framebynavin/app/reminders/ReminderConstants.kt
          grep -q 'Legacy RC2 action' app/src/main/java/com/framebynavin/app/reminders/ReminderConstants.kt
          grep -q 'afterWorkflowStageChanged' app/src/main/java/com/framebynavin/app/data/ProjectPulse.kt
          grep -q 'needsCustomNextStagePrompt' app/src/main/java/com/framebynavin/app/data/ProjectPulse.kt
          grep -q 'attentionPlan != ProjectAttentionPlan.OFF' app/src/main/java/com/framebynavin/app/data/TaskStore.kt
          ! grep -q 'attentionPlan != ProjectAttentionPlan.CUSTOM && attentionPlan != ProjectAttentionPlan.OFF' app/src/main/java/com/framebynavin/app/data/TaskStore.kt
          grep -q 'SmartTargetBoundary.bound' app/src/main/java/com/framebynavin/app/reminders/SmartEscalationScheduler.kt
          ! grep -q 'private fun finalStage' app/src/main/java/com/framebynavin/app/reminders/SmartEscalationScheduler.kt
          grep -q 'EXTRA_ATTENTION_PLAN' app/src/main/java/com/framebynavin/app/reminders/AlarmRingingService.kt
          grep -q 'runCatching { history.append' app/src/main/java/com/framebynavin/app/reminders/ReminderActionReceiver.kt
          grep -q 'ProjectPulseEngine.applyAttentionPlan(baseTask, attentionPlan)' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          grep -q 'ProjectPulseEngine.applyAttentionPlan(configured, attentionPlan)' app/src/main/java/com/framebynavin/app/data/CreatorViewModel.kt
          test ! -e .github/workflows/rc3-surgical-patch.yml
          test ! -e tools/rc3_apply_persistence_patch.py
          test ! -e .github/rc3-patch-trigger
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation APK
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run RC3.1 lifecycle and persistence suite on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            gradle :app:connectedDebugAndroidTest --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.data.CreatorContentProjectRc1InstrumentedTest,com.framebynavin.app.data.CreatorContentProjectRc2InstrumentedTest,com.framebynavin.app.data.ProjectPulseRc3PersistenceInstrumentedTest,com.framebynavin.app.data.CreatorHardeningV181InstrumentedTest,com.framebynavin.app.data.CreatorPublicationRecoveryV183Test,com.framebynavin.app.data.CreatorBackupV183Test,com.framebynavin.app.data.V18ReliabilityAlpha18InstrumentationTest
            -Pandroid.testInstrumentationRunnerArguments.hardeningTestEnvironment=ci-emulator

      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.9-rc3.1-project-pulse-emulator-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build verification manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" | tee verification/apk.sha256
          keytool -list -v -keystore dev-signing/framebynavin-public-debug.jks -storepass framebynavin-dev -alias framebynavin-dev \
            | grep -E 'SHA256:|Owner:|Issuer:' > verification/signing.txt
          version_name=$(grep -E 'versionName = "' app/build.gradle.kts | head -n1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          version_code=$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts | head -n1 | grep -Eo '[0-9]+')
          printf 'versionName=%s\nversionCode=%s\ncommit=%s\n' "$version_name" "$version_code" "$GITHUB_SHA" > verification/manifest.txt
          printf 'projectPulseStageLoop=true\ncustomStageAware=true\nlegacyDoneDismissOnly=true\nsmartFinalTargetBounded=true\n' >> verification/manifest.txt
          printf 'reminderDeliveryPreference=true\nstickyManualReminderStyle=true\nvoiceReplay=true\nvoiceChooseTime=true\n' >> verification/manifest.txt
          printf 'publicationAuthority=deliverable-publish-studio\nprojectWorkflowAuthority=creator-workflow-engine\n' >> verification/manifest.txt
          printf 'androidApi=35\nosAutoBackup=false\ndistributionSigning=development-sideload-only\n' >> verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.9.0-content-project-rc3.1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.9.0-content-project-rc3.1-verification
          path: verification/
          if-no-files-found: error
