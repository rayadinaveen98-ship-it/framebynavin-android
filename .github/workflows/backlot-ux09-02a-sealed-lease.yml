name: Backlot UX09-02A-S2 Sealed Chain OS Lease JVM Gate

on:
  pull_request:
    branches:
      - feature/backlot-ux09-02a-sealed-chain-store-20261117
    paths:
      - 'app/src/main/java/com/framebynavin/app/cloud/ux09/**'
      - 'app/src/test/java/com/framebynavin/app/cloud/ux09/**'
      - '.github/workflows/backlot-ux09-02a-sealed-lease.yml'
      - 'docs/engineering/UX09_02A_SEALED_LEASE_GATE_20261117.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-ux09-02a-sealed-lease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-jvm:
    name: OS entity lease + sealed offline chain (NO APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check no real sync integration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const val ENABLED = false' app/src/main/java/com/framebynavin/app/cloud/ux09/Ux09SyncContract.kt
          grep -Fq 'withEntityFileLock' app/src/main/java/com/framebynavin/app/cloud/ux09/Ux09SealedChainStore.kt
          ! grep -ER 'https?://|CloudApiClient|CreatorCloudSyncWorker|WorkManager' app/src/main/java/com/framebynavin/app/cloud/ux09/
          echo 'UX09 stays disabled/disconnected; no hosted services or real app-data calls.'
      - name: Compile and verify old plus OS lease synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 3900s \
            gradle :app:testDebugUnitTest \
              --tests 'com.framebynavin.app.cloud.ux09.Ux09OfflineContractAndJournalTest' \
              --tests 'com.framebynavin.app.cloud.ux09.Ux09OfflineChainPolicyTest' \
              --tests 'com.framebynavin.app.cloud.ux09.Ux09SealedChainStoreTest' \
              -Pkotlin.compiler.execution.strategy=in-process \
              --no-daemon --no-parallel --max-workers=1 \
              '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1250m -Dfile.encoding=UTF-8' \
              --console=plain 2>&1 | tee ux09-02a-sealed-lease-tests.log
      - name: Upload JVM evidence; NO APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-UX09-02A-Sealed-Lease-JVM-NO-RELEASE
          path: |
            app/build/test-results/testDebugUnitTest/
            ux09-02a-sealed-lease-tests.log
          retention-days: 14
          if-no-files-found: warn
