name: Backlot stabilization - durable restore journal safety

on:
  push:
    branches: [stabilization/pending-restore-journal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-stabilization-restore-journal
  cancel-in-progress: true

jobs:
  journal-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject other source, cloud, signing and release changes
        run: |
          set -euo pipefail
          frozen=9450aef089db66fab59b315329b0b561672e3c13
          git fetch --depth=1 origin refs/heads/stabilization/backlot-pending-closure:refs/remotes/origin/stabilization/backlot-pending-closure
          test "$(git rev-parse origin/stabilization/backlot-pending-closure)" = "$frozen"
          git diff --name-only "$frozen" HEAD > /tmp/restore-journal-changes.txt
          while IFS= read -r path; do
            case "$path" in
              app/src/main/java/com/framebynavin/app/personal/StabilizationRestoreWriteAheadJournal.kt|app/src/main/java/com/framebynavin/app/personal/StabilizationVerifiedPhotoInstaller.kt|app/src/test/java/com/framebynavin/app/personal/StabilizationVerifiedPhotoInstallerTest.kt|app/src/test/java/com/framebynavin/app/personal/StabilizationRestoreWriteAheadJournalTest.kt|app/src/androidTest/java/com/framebynavin/app/personal/StabilizationRestoreWriteAheadJournalDeviceTest.kt|docs/release/BACKLOT_STABILIZATION_RESTORE_WRITE_JOURNAL.md|.github/workflows/backlot-stabilization-journal.yml|.github/scripts/backlot-stabilization-journal-android15.sh) ;;
              *) echo "FAIL: unreviewed change $path" >&2; exit 1;;
            esac
          done < /tmp/restore-journal-changes.txt
          echo "PASS: no live store, reminder, cloud, signer or version change"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android APK and run JVM regressions with adequate heap
        run: |
          set -euo pipefail
          (while sleep 180; do
            echo '--- Kotlin build resource heartbeat ---'
            free -m
            ps -eo pid,etime,rss,%cpu,comm --sort=-rss | head -9
          done) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          timeout 110m gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1200m -Dfile.encoding=UTF-8' --stacktrace
      - name: Require all twelve durable recovery checkpoint cases
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          matches=list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*StabilizationRestoreWriteAheadJournalTest.xml'))
          assert len(matches)==1, 'Journal unit suite missing'
          xml=ET.parse(matches[0]).getroot()
          assert int(xml.get('tests','0')) >= 12
          assert int(xml.get('failures','0')) == 0 and int(xml.get('errors','0')) == 0
          print('PASS: crash checkpoints, cold restart, tamper and no false restore completion')
          PY
      - name: Require all twelve JPEG installation no-overwrite safety tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          matches=list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*StabilizationVerifiedPhotoInstallerTest.xml'))
          assert len(matches)==1, 'Photo copy and overwrite regression suite missing'
          xml=ET.parse(matches[0]).getroot()
          assert int(xml.get('tests','0')) >= 12
          assert int(xml.get('failures','0')) == 0 and int(xml.get('errors','0')) == 0
          print('PASS: JPEG installed only by verified no-overwrite atomic publication')
          PY
      - name: Enable disposable Android emulator KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove Android private-filesystem journal persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/backlot-stabilization-journal-android15.sh
