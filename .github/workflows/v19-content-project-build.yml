name: v1.9 Content Project Stable Gate

on:
  push:
    branches:
      - "release/v1.9.0-rc2-stabilization"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v19-content-project-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify v1.9 stabilization invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'versionName = "1\.9\.0-content-project-(rc2|stable)"' app/build.gradle.kts
          version_code=$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts | head -n1 | grep -Eo '[0-9]+')
          test "$version_code" -ge 81
          test -s app/src/main/java/com/framebynavin/app/data/CreatorContentWorkspace.kt
          test -s app/src/main/java/com/framebynavin/app/data/CreatorContentStabilization.kt
          test -s app/src/main/java/com/framebynavin/app/data/CreatorScriptStudio.kt
          test -s app/src/main/java/com/framebynavin/app/data/TaskStore.kt
          test -s app/src/main/java/com/framebynavin/app/data/ScriptStudioStore.kt
          test -s app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha6Ui.kt
          test -s app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          test -s app/src/test/java/com/framebynavin/app/data/CreatorContentStabilizationTest.kt
          test -s app/src/androidTest/java/com/framebynavin/app/data/CreatorContentProjectRc1InstrumentedTest.kt
          test -s app/src/androidTest/java/com/framebynavin/app/data/CreatorContentProjectRc2InstrumentedTest.kt
          test -s dev-signing/framebynavin-public-debug.jks
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'prepareProjectEditorSave' app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          grep -q 'syncParentPublication' app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          grep -q 'publicationRecovery.recoverAll' app/src/main/java/com/framebynavin/app/ui/ContentWorkspaceActivity.kt
          grep -q 'CONTENT PROJECT 2.0 · RC2' app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha6Ui.kt
          grep -q 'CONTENT PROJECT 2.0 · RC2' app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          ! grep -q 'Text("PUBLISHED")' app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt
          ! grep -q 'A3Field("HOOK"' app/src/main/java/com/framebynavin/app/ui/V19ContentWorkspaceAlpha3Ui.kt

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Compile instrumentation APK
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run v1.9 lifecycle and hardening suite on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            gradle :app:connectedDebugAndroidTest --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=com.framebynavin.app.data.CreatorContentProjectRc1InstrumentedTest,com.framebynavin.app.data.CreatorContentProjectRc2InstrumentedTest,com.framebynavin.app.data.CreatorHardeningV181InstrumentedTest,com.framebynavin.app.data.CreatorPublicationRecoveryV183Test,com.framebynavin.app.data.CreatorBackupV183Test,com.framebynavin.app.data.V18ReliabilityAlpha18InstrumentationTest
            -Pandroid.testInstrumentationRunnerArguments.hardeningTestEnvironment=ci-emulator

      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.9-stable-gate-emulator-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build verification manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" | tee verification/apk.sha256
          keytool -list -v -keystore dev-signing/framebynavin-public-debug.jks -storepass framebynavin-dev -alias framebynavin-dev \
            | grep -E 'SHA256:|Owner:|Issuer:' > verification/signing.txt
          version_name=$(grep -E 'versionName = "' app/build.gradle.kts | head -n1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          version_code=$(grep -E 'versionCode = [0-9]+' app/build.gradle.kts | head -n1 | grep -Eo '[0-9]+')
          printf 'versionName=%s\nversionCode=%s\ncommit=%s\n' "$version_name" "$version_code" "$GITHUB_SHA" > verification/manifest.txt
          printf 'featureFreeze=true\nstabilizationGate=true\nandroidApi=35\n' >> verification/manifest.txt
          printf 'publicationAuthority=deliverable-publish-studio\nscriptAuthority=embedded-script-studio\nprojectWorkflowAuthority=creator-workflow-engine\n' >> verification/manifest.txt
          printf 'osAutoBackup=false\ndistributionSigning=development-sideload-only\n' >> verification/manifest.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.9-content-project-candidate-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: FrameByNavin-v1.9-content-project-candidate-verification
          path: verification/
          if-no-files-found: error
