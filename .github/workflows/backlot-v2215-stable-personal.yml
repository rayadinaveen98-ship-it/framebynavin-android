name: Backlot V221.5 Personal Stable Candidate

on:
  push:
    branches: [release/backlot-v2215-stable-personal-rc1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backlot-v2215-stable-rc1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify upgraded version and untouched release boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path("app/build.gradle.kts").read_text()
          app=Path("app/src/main/java/com/framebynavin/app/ui/FrameByNavinV101BApp.kt").read_text()
          home=Path("app/src/main/java/com/framebynavin/app/ui/V18TodayScreen.kt").read_text()
          hub=Path("app/src/main/java/com/framebynavin/app/ui/V144SettingsHub.kt").read_text()
          cloud=Path("app/src/main/java/com/framebynavin/app/cloud/CreatorCloudVoiceMedia.kt").read_text()
          assert 'applicationId = "com.framebynavin.app"' in gradle
          assert 'versionCode = 240' in gradle and 'versionName = "2.9.0-v2215-personal-stable"' in gradle
          assert 'create("personalStable")' in gradle
          assert 'signingConfig = signingConfigs.getByName("prototypeStable")' in gradle
          assert 'isDebuggable = false' in gradle
          assert "POverlay.SETTINGS -> V144SettingsHub(" in app
          assert "V2214HomeCompanion(" in app and "V2215CompanionControls(" in hub
          assert home.index("V148HomeTopPerformersSection") < home.index('v215-up-next-header') < home.index("V219ReminderHomeEntry") < home.index("companionContent()")
          assert 'onCreateIdeaRequested = { showNewIdeaEditor = true }' in app
          assert "resealCloudSanitizedPayload" in cloud and "backup.validate(sanitized)" in cloud
          assert not Path("app/src/main/java/com/framebynavin/app/ui/V2213PoseResourceMap.kt").exists()
          for guide in ("frame", "navi", "cute"):
              assert Path("app/src/main/res/drawable-nodpi/guide_v217_"+guide+"_concept.webp").is_file()
          assert len(list(Path("app/src/main/res/drawable-nodpi").glob("guide_funny_*.webp"))) == 5
          print("Release version and original app boundaries verified")
          PY
      - name: Full Backlot unit regressions and Android lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Build signed personalStable debug and instrumentation APKs
        run: gradle :app:assembleDebug :app:assemblePersonalStable :app:assembleDebugAndroidTest --stacktrace
      - name: Download owner-tested preview 239
        uses: actions/download-artifact@v4
        with:
          name: Backlot-V2215-Development-APKs
          run-id: 40541982514
          github-token: ${{ github.token }}
          path: previous
      - name: Verify signed in-place version upgrade compatibility
        run: |
          set -euo pipefail
          OLD="$(find previous -type f -name app-personalStable.apk -print -quit)"
          DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          STABLE="app/build/outputs/apk/personalStable/app-personalStable.apk"
          test -s "$OLD" && test -s "$DEBUG" && test -s "$STABLE"
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          mkdir -p release-evidence
          "$APKSIGNER" verify --print-certs "$OLD" > release-evidence/old-cert.txt
          "$APKSIGNER" verify --print-certs "$STABLE" > release-evidence/stable-cert.txt
          "$APKSIGNER" verify --print-certs "$DEBUG" > release-evidence/debug-cert.txt
          OLD_CERT="$(grep -m1 'certificate SHA-256 digest' release-evidence/old-cert.txt | sed 's/.*: //')"
          NEW_CERT="$(grep -m1 'certificate SHA-256 digest' release-evidence/stable-cert.txt | sed 's/.*: //')"
          DEBUG_CERT="$(grep -m1 'certificate SHA-256 digest' release-evidence/debug-cert.txt | sed 's/.*: //')"
          test -n "$NEW_CERT" && test "$OLD_CERT" = "$NEW_CERT" && test "$DEBUG_CERT" = "$NEW_CERT"
          "$AAPT" dump badging "$OLD" | grep -F "package: name='com.framebynavin.app' versionCode='239'"
          "$AAPT" dump badging "$STABLE" | grep -F "package: name='com.framebynavin.app' versionCode='240' versionName='2.9.0-v2215-personal-stable'"
          if "$AAPT" dump xmltree "$STABLE" AndroidManifest.xml | grep -q 'android:debuggable'; then echo "Stable APK unexpectedly debuggable" >&2; exit 1; fi
          cp "$STABLE" release-evidence/Backlot-V2215-2.9.0-Personal-Stable.apk
          sha256sum release-evidence/Backlot-V2215-2.9.0-Personal-Stable.apk > release-evidence/SHA256SUMS.txt
          echo "Commit $(git rev-parse HEAD); versionCode 240; versionName 2.9.0-v2215-personal-stable; certificate $NEW_CERT" > release-evidence/BUILD-INFO.txt
          echo "Personal sideload only; public prototype signer, not a production/Play signing key." >> release-evidence/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V2215-2.9.0-Personal-Stable
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Backlot-V2215-Stable-Emulator-Inputs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/personalStable/app-personalStable.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  android-upgrade:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V2215-Stable-Emulator-Inputs
          path: current
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V2215-Development-APKs
          run-id: 40541982514
          github-token: ${{ github.token }}
          path: previous
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 in-place upgrade and backup checksum acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r "$(find previous -type f -name app-debug.apk -print -quit)"
            adb install -r "$(find current -type f -name app-debug-androidTest.apk -print -quit)"
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2215PersonalStableUpgradeTest#seedPreview239WithoutChangingCreatorData -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-seed.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' upgrade-seed.log; then exit 1; fi
            grep -Fq 'OK (1 test)' upgrade-seed.log
            adb install -r "$(find current -type f -name app-personalStable.apk -print -quit)"
            adb shell am start -n com.framebynavin.app/.MainActivity
            adb shell am force-stop com.framebynavin.app
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2215PersonalStableUpgradeTest#verifyPersonalStable240RetainsFilesAndPreferences -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-verify.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' upgrade-verify.log; then exit 1; fi
            grep -Fq 'OK (1 test)' upgrade-verify.log
            adb install -r "$(find current -type f -name app-debug.apk -print -quit)"
            adb shell am instrument -w -r -e class com.framebynavin.app.cloud.V2203CloudChecksumSafetyTest -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee cloud-checksum.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' cloud-checksum.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' cloud-checksum.log
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2215CompanionAccessibilityUiTest -e backlotVisualProfile default -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee companion-settings.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' companion-settings.log; then exit 1; fi
            grep -Fq 'OK (3 tests)' companion-settings.log
      - name: Upload upgrade safety logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V2215-Stable-Upgrade-Results
          path: |
            upgrade-*.log
            cloud-checksum.log
            companion-settings.log
          retention-days: 30
          if-no-files-found: warn

  android15-gesture:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Backlot-V2215-Stable-Emulator-Inputs
          path: current
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 gesture and Save Idea button acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.gestural
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb install -r "$(find current -type f -name app-debug.apk -print -quit)"
            adb install -r "$(find current -type f -name app-debug-androidTest.apk -print -quit)"
            mkdir -p gesture-evidence
            adb shell am instrument -w -r -e class com.framebynavin.app.ui.V2204NewIdeaRootOverlayUiTest -e backlotVisualProfile gestural -e hardeningTestEnvironment ci-emulator com.framebynavin.app.test/androidx.test.runner.AndroidJUnitRunner | tee gesture-save-idea.log
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' gesture-save-idea.log; then exit 1; fi
            grep -Fq 'OK (2 tests)' gesture-save-idea.log
            for scene in nav-clear keyboard-clear; do adb exec-out run-as com.framebynavin.app cat "files/v2204-idea-evidence/v2204-gestural-$scene.png" > "gesture-evidence/v2204-gestural-$scene.png"; done
            python3 -c 'from pathlib import Path; fs=list(Path("gesture-evidence").glob("*.png")); assert len(fs)==2 and all(p.stat().st_size>10000 and p.read_bytes()[:8]==bytes.fromhex("89504e470d0a1a0a") for p in fs); print("Save Idea screenshots verified")'
      - name: Upload gesture and keyboard QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V2215-Stable-Android15-Gesture-Results
          path: |
            gesture-evidence/*.png
            gesture-save-idea.log
          retention-days: 30
          if-no-files-found: warn
