name: Backlot 1.0 recovery Stage A - isolated compile only (NO APK)

on:
  push:
    branches:
      - feature/backlot-v1-recovery-onboarding-reminder-looks-20261122
    paths:
      - ".github/workflows/backlot-v1-recovery-stage-a-compile-20261122.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backlot-v1-recovery-stage-a-compile
  cancel-in-progress: false

jobs:
  lab-source-compile:
    name: Frozen source identity then Kotlin compile (no JVM suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact recovery source and non-destructive scope proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/recovery-stage-a
          git rev-parse HEAD | tee output/recovery-stage-a/WORKFLOW-COMMIT.txt
          git diff --exit-code 8cc4666ec889632aac4dfbf27aeeb456f0afd65d HEAD -- app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties
          test "$(git merge-base 8cc4666ec889632aac4dfbf27aeeb456f0afd65d HEAD)" = "8cc4666ec889632aac4dfbf27aeeb456f0afd65d"
          git diff --check 8cc4666ec889632aac4dfbf27aeeb456f0afd65d HEAD
          grep -Fq 'versionCode = 338' app/build.gradle.kts
          grep -Fq 'versionName = "1.0"' app/build.gradle.kts
          grep -Fq 'resValue("string", "backlot_install_label", "Backlot")' app/build.gradle.kts
          test ! -d app/src/main/java/com/framebynavin/app/cloud/ux09rpc
          test ! -d supabase/lab_migrations
          echo "8cc4666ec889632aac4dfbf27aeeb456f0afd65d" | tee output/recovery-stage-a/FROZEN-APP-SHA.txt
          echo "Stage A only: no app install, no APK, no JVM suite, no Android instrumentation, no hosted changes." | tee output/recovery-stage-a/SCOPE.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile affected Lab application Kotlin only
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 74m gradle :app:compileDebugKotlin \
            -PbacklotLab=true \
            --no-daemon --no-parallel --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1450m -Dfile.encoding=UTF-8' \
            --console=plain --stacktrace 2>&1 | tee output/recovery-stage-a/KOTLIN-COMPILE.log
          echo "PASS - Lab Kotlin compiled on frozen app SHA" | tee output/recovery-stage-a/RESULT.txt
      - name: Retain compile diagnostics even when red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backlot-V1-RECOVERY-STAGE-A-COMPILE-EVIDENCE
          path: output/recovery-stage-a/
          if-no-files-found: warn
          retention-days: 30
