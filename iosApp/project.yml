name: Backlot
options:
  bundleIdPrefix: com.backlot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0

targets:
  Backlot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
    info:
      path: BacklotInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(BACKLOT_GOOGLE_REVERSED_CLIENT_ID)"
    entitlements:
      path: Backlot.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/BacklotShared.framework
        embed: false
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backlot.app.dev
        PRODUCT_NAME: Backlot
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Backlot
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_BACKLOT_SUPABASE_URL: "$(BACKLOT_SUPABASE_URL)"
        INFOPLIST_KEY_BACKLOT_SUPABASE_PUBLISHABLE_KEY: "$(BACKLOT_SUPABASE_PUBLISHABLE_KEY)"
        INFOPLIST_KEY_BACKLOT_GOOGLE_IOS_CLIENT_ID: "$(BACKLOT_GOOGLE_IOS_CLIENT_ID)"
        INFOPLIST_KEY_BACKLOT_GOOGLE_SERVER_CLIENT_ID: "$(BACKLOT_GOOGLE_SERVER_CLIENT_ID)"
        INFOPLIST_KEY_BACKLOT_GOOGLE_REVERSED_CLIENT_ID: "$(BACKLOT_GOOGLE_REVERSED_CLIENT_ID)"
        TARGETED_DEVICE_FAMILY: "1,2"
