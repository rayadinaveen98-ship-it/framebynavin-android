if(shock>=0){let r=shock*W*.95;c.save();c.globalCompositeOperation='screen';c.beginPath();c.arc(x,cy,r,0,Math.PI*2);c.lineWidth=Math.max(.7,4*(1-shock));c.strokeStyle=`rgba(255,103,132,${.85*(1-shock)})`;c.shadowBlur=22;c.shadowColor='#ff3c59';c.stroke();c.restore()}}
function animate(now){if(!playing)return;frame++;if(frame%(reduced?3:2)!==0){requestAnimationFrame(animate);return}const t=start+(now-start)*(speed/.58);bg(t);drawNodes(t);lightFx(t);requestAnimationFrame(animate)}
